# UAE FLSC 2018 - Chapter 7: Emergency Voice Evacuation (EVC) + Two-way Telephone
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 7
  chapter_title: "Emergency Voice Evacuation Systems"

# ---------- BRANCHES: Table 7.3 occupancies that require EVC + Two-way ------
# Each branch fires once - the matched branch's systems list both items.
# ----- General Requirements (Tables 7.1, 7.2 - apply universally where EVC required) -----
general:
  - id: evc_general_control_unit_location
    when: {}
    systems:
      - name: "EVC Control Unit Location"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 1"
        page_ref: "p.433"
        spec: "Next to FACP, continuously monitored location"
        detail: "EVC control unit shall be installed adjacent to FACP at a continuously monitored location attended by facility management or designated personnel at all times: reception, security guard house, central command centre, facility monitoring room, nurse station (hospitals). See FACP location, Ch 8 Table 8.1.14.1."

  - id: evc_general_arabic_english_messages
    when: {}
    systems:
      - name: "Pre-recorded Messages in Arabic and English"
        code_ref: "Ch 7, #2.2.2"
        page_ref: "p.431"
        spec: "Pre-recorded voice messages SHALL be both in Arabic and English"
        detail: "Per #2.2.2, pre-recorded voice messages shall be both in Arabic and English, in an accent which is familiar and intelligible to the people of UAE (cosmopolitan environment with 165+ nationalities). Messages shall be prepared by people familiar with fire emergency procedures and shall be simple, to the point, and customised to the specific building (not generalised). MANDATORY ('shall')."

  - id: evc_general_voice_messages
    when: {}
    systems:
      - name: "Voice Message Pattern + Pre-recorded Content"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 2"
        page_ref: "p.433"
        spec: "Pre-recorded / synthesized / live messages; speakers listed and approved by Civil Defence"
        detail: "Evacuation messages shall be PRECEDED and FOLLOWED by a minimum of TWO CYCLES of the emergency evacuation signal. Non-evacuation (relocation) messages shall use a continuous alert tone of 3-10 seconds, followed by message, sequence repeated at least 3 times. Voice messages developed for each scenario in the emergency response plan. Speakers listed and approved by Civil Defence."

  # Fix round 28.10.2026 (CH04-07 L4): #2.2.5 automatic response.
  - id: evc_general_automatic_response
    when: {}
    systems:
      - name: "Automatic Voice Messages on Confirmed Fire Alarm"
        code_ref: "Ch 7, #2.2.5"
        page_ref: "p.431"
        spec: "Voice messages automatic: the EVC responds automatically on receipt of a confirmed Fire Alarm Signal, automatic or manually triggered"
        detail: "#2.2.5 (p.431): Voice messages shall be automatic. The Emergency Voice Evacuation or Communication System response shall be an automatic response, upon the receipt of confirmed Fire Alarm Signal, be it automatic or manually triggered (fix round 28.10.2026, CH04-07 L4)."

  # Fix round 28.10.2026 (CH04-07 L4): Table 7.1 item 2.2 microphone.
  - id: evc_general_microphone_instructions
    when: {}
    systems:
      - name: "Microphone Usage Instructions with Schematics"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 2.2"
        page_ref: "p.433"
        spec: "Where microphones are provided for live emergency voice messages: usage instructions with schematics posted next to the microphone (for example the distance to hold the microphone from the mouth)"
        detail: "Table 7.1 item 2.2.i (p.433): Where microphones are provided for the live emergency voice messages to be delivered, 'usage instructions' with schematics shall be posted next to the microphone with user instructions such as distance that the microphone to be held from mouth. Table 7.1 item 7.1.iii (p.435) requires manual voice transmission capability, so the control unit has a microphone (fix round 28.10.2026, CH04-07 L4)."

  # Fix round 28.10.2026 (CH04-07 L3): Table 7.1 item 3 is a permission ('shall be
  # permitted'), printed as conditional, not required.
  - id: evc_general_positive_alarm_sequence
    when: {}
    systems:
      - name: "Positive Alarm Sequence (Delayed Alarm)"
        required: conditional
        code_ref: "Table 7.1 #3 + Ch 8 Table 8.1 #14"
        page_ref: "p.433"
        spec: "Permitted, not required: where a Positive Alarm Sequence is used, per Ch 8 Table 8.1.14.2; numeric timings live in Ch 8 (not Ch 7)"
        detail: "Ch 7 Table 7.1 #3 only states that PAS (Delayed Alarm sequence) per Ch 8 Table 8.1.14.2 shall be permitted - it is NOT mandatory. The timings are in Ch 8: acknowledged at the fire alarm control unit within 15 seconds of annunciation, and up to 180 seconds during the alarm investigation phase (Table 8.1 #14.2.i and iii, p.459); staged evacuation timings follow the building's Table 8.13 row (for super highrise and highrise buildings, items 1-2 vi-vii, p.502: 15 s / 180 s, then the entire building within 240 seconds). Backup duration is also not specified in Ch 7 - defer to Ch 8."

  # Fix round 28.10.2026 (CH04-07 L3): Table 7.1 item 4.1 is a permission.
  - id: evc_general_sleeping_risk_tone
    when: {}
    systems:
      - name: "Tone in Sleeping-Risk Occupancies"
        required: conditional
        code_ref: "Ch 7, #2.4 / Table 7.1 item 4.1"
        page_ref: "p.434"
        spec: "Permitted, not required: where sleeping risk is involved, the tone preceding a voice message may be part of the voice message"
        detail: "Per Table 7.1 #4.1, the tone preceding any voice message shall be permitted to be part of the voice message in occupancies where sleeping risk is involved (hotels, residential highrise, hospitals, dormitories). Allows a single continuous tone-plus-message stream rather than separated tone + announcement."

  - id: evc_general_private_mode_audibility
    when: {}
    systems:
      - name: "Private Mode Audibility (10 dB above ambient)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 4.2"
        page_ref: "p.434"
        spec: "Voice messages in private mode/areas: 10 dB above ambient, 60 s duration, measured 1.5 m above floor (dBA)"
        detail: "Per Table 7.1 #4.2, voice messages in private mode/areas shall be 10 dB above the ambient sound level having duration of 60 seconds, measured 1.5 m above the floor area required to be served using A-weighted scale (dBA)."

  - id: evc_general_public_mode_audibility
    when: {}
    systems:
      - name: "Public Mode Audibility (15 dB above ambient)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 4.3"
        page_ref: "p.434"
        spec: "Voice messages in public mode/areas: 15 dB above ambient, 60 s duration, measured 1.5 m above floor (dBA)"
        detail: "Per Table 7.1 #4.3, voice messages in public mode/areas shall be 15 dB above the ambient sound level having duration of 60 seconds, measured 1.5 m above the floor area required to be served using A-weighted scale (dBA)."

  - id: evc_general_stairway_zoning
    when: {}
    systems:
      - name: "Stairway Speaker Zoning (Manual Paging Only)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 5.v"
        page_ref: "p.434"
        spec: "Speakers in each enclosed stairway shall be on a SEPARATE notification zone for MANUAL PAGING ONLY"
        detail: "Per Table 7.1 #5.v, where speakers are provided in enclosed stairways, they shall be connected to a separate notification zone for manual paging only. Stairway speakers are NOT to broadcast the general auto evacuation message - the firefighter / incident commander uses them for targeted live instructions."

  - id: evc_general_message_priority
    when: {}
    systems:
      - name: "Message Priority Hierarchy"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 7.2"
        page_ref: "p.435"
        spec: "Life safety > property protection > trouble > all other"
        detail: "Voice evacuation messages override prior signals, music, communication signals to the selected notification zone. Live voice (microphone) overrides recorded; on microphone release, recorded messages do NOT auto-resume - must be re-triggered manually or per emergency response plan. Manual zone selection or all-call from control unit."

  # Fix round 28.10.2026 (CH04-07 L4): Table 7.1 item 7.1 i-iii.
  - id: evc_general_control_system
    when: {}
    systems:
      - name: "EVC Control System - Operating Instructions, Zone Status, Manual Voice"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 7.1"
        page_ref: "p.435"
        spec: "EVC operating instructions posted at the control system; visible on/off indication of each manual control's signaling zone; manual voice transmission selectively to one or more zones or on an all-call basis"
        detail: "Table 7.1 item 7.1 GENERAL (p.435): i. EVC operating instructions shall be posted at the control system. ii. Manual controls shall be arranged to provide visible indication of the on/off status for their associated signaling zone. iii. Systems shall be provided with manual voice transmission capabilities selectively to one or more zones or on an all-call basis (fix round 28.10.2026, CH04-07 L4)."

  # Fix round 28.10.2026 (CH04-07 L4): Table 7.1 item 8 ancillary functions; applies
  # where the speakers also serve music, commentary, paging and the like.
  - id: evc_general_ancillary_functions
    when: {}
    systems:
      - name: "Ancillary Functions (Music, Paging) - Safeguards + Annual Test"
        required: conditional
        code_ref: "Ch 7, #2.4 / Table 7.1 item 8 (8.i-8.iii)"
        page_ref: "p.435"
        spec: "Where ancillary (non-emergency) functions are provided: they shall not impair the EVC; shared loudspeakers and audio equipment safeguarded against tampering or misadjustment with integrity monitoring maintained; ancillary functions inspected and tested annually"
        detail: "Table 7.1 item 8 ANCILLARY FUNCTIONS (p.435): i. Ancillary functions (non-emergency functions) such as music, commentary, live shows, general communication messages etc., shall be permitted but shall not impair the required operation of the emergency voice evacuation or communications system. ii. Loudspeakers used for emergency communications system functions also providing ancillary functions shall meet the following conditions: a. the loudspeakers and associated audio equipment are installed or located with safeguards to resist tampering or misadjustment of those components essential for intended emergency notification; b. the monitoring integrity requirements continue to be met while the system is used for non-emergency purposes. iii. Ancillary functions shall be inspected and tested annually to verify they will not impair the operation of the fire alarm system or the emergency voice evacuation system (fix round 28.10.2026, CH04-07 L4)."

  - id: evc_general_circuits_wiring
    when: {}
    systems:
      - name: "Circuits + Wiring (Class A, addressable, 2-hr fire rated)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 9"
        page_ref: "p.435"
        spec: "All EVC speaker circuits: Class A, addressable, redundant pathways"
        detail: "Single-open-fault tolerance with trouble annunciation; ground-fault annunciation; ALL EVC cables and wiring shall be 2-HOUR FIRE RATED. Ancillary functions (music, paging) permitted only with safeguards against tampering/misadjustment and continued integrity monitoring."

  - id: evc_general_installation_heights
    when: {}
    systems:
      - name: "Installation Heights (910-1220 mm mounting envelope)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 10"
        page_ref: "p.436"
        spec: "Operable controls 910 mm min / 1220 mm max (horizontal reach < 25 cm); text & indicators 1020-1520 mm"
        detail: "Per Table 7.1 #10, user-accessible controls (control units, switches, microphone, latches) shall be located 910 mm minimum and 1220 mm maximum above finished floor where horizontal reach is less than 25 cm. READING OF A PRINT TYPO: Table 7.1 item 10.i (p.436) prints 'a minimum of 910 mm and a maximum of 122 mm'; a maximum below the minimum is impossible, so the tool reads the printed 122 mm as 1220 mm, the value Table 7.2 item 5.ii (p.438) prints for a public telephone appliance ('not more than 1220 mm above floor level'). Confirm with Civil Defence (fix round 28.10.2026, CH04-07 L2). For a horizontal reach of 25-61 cm, maximum elevation is limited to 1070 mm and minimum to 710 mm. Text and visual indicators (lamps, screens, displays, labels) shall be visible within 1020-1520 mm above finished floor."

  - id: evc_general_facp_interfacing
    when: {}
    systems:
      - name: "FACP Interfacing + Civil Defence 24x7 Monitoring"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 11"
        page_ref: "p.436"
        spec: "Combined FACP+EVC control unit preferred; if separate, fully interfaced + connected to Civil Defence 24x7 monitoring"
        detail: "Per Table 7.1 #11: (a) a combined FACP+EVC control unit is preferred by Civil Defence; (b) a single dedicated EVC control panel is permitted if interfaced to the FACP; (c) the interface shall indicate failure at the impaired control unit, give audible + distinctive visible 'ECV active' indication at the affected FACP, cause the FA system to deactivate audible/visible appliances that could interfere with EVC intelligibility, NOT permit the FA system to turn off appliances used for special-suppression pre-discharge notification, and (d) the system shall be CONNECTED TO CIVIL DEFENCE 24x7 MONITORING for activation and trouble indication."

  - id: evc_general_sleeping_area_audibility
    when:
      occupancy_in: [residential, labour_accommodation, staff_accommodation, hostel,
                     hotel_a, hotel_b, hotel_c, healthcare_a,
                     detention_a, detention_b, detention_c]
    systems:
      - name: "Sleeping Area Audibility (75 dB at pillow level)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 4.4"
        page_ref: "p.434"
        spec: "Voice messages in sleeping areas: 75 dB measured at the pillow level, A-weighted scale (dBA)"
        detail: "Table 7.1 #4.4 (p.434): voice messages in sleeping areas shall be 75 dB measured at the pillow level in the area required to be served using A-weighted scale (dBA). This occupancy has sleeping areas (apartments, guest rooms, dormitories, patient rooms or cells)."

  - id: evc_general_sleeping_area_audibility_other
    when:
      occupancy_not: [residential, labour_accommodation, staff_accommodation, hostel,
                      hotel_a, hotel_b, hotel_c, healthcare_a,
                      detention_a, detention_b, detention_c]
    systems:
      - name: "Sleeping Area Audibility (75 dB at pillow level)"
        required: conditional
        code_ref: "Ch 7, #2.4 / Table 7.1 item 4.4"
        page_ref: "p.434"
        spec: "Where the building has sleeping areas: voice messages 75 dB measured at the pillow level, A-weighted scale (dBA)"
        detail: "Table 7.1 #4.4 (p.434): voice messages in sleeping areas shall be 75 dB measured at the pillow level in the area required to be served using A-weighted scale (dBA). Applies to any sleeping area in this building."

  - id: evc_general_speakers
    when: {}
    systems:
      - name: "EVC Speakers - Dedicated, Listed, Approved"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 5.i-iii"
        page_ref: "p.434"
        spec: "Speakers dedicated, listed, approved and tested for the emergency voice evacuation system; FA notification speakers or building ancillary speakers permitted only where they comply with Section 2.4"
        detail: "Table 7.1 #5 (p.434): i. speakers for the voice evacuation system shall be dedicated, listed, approved and tested for the emergency voice evacuation systems; ii. speakers used as Fire Alarm notification in accordance with Ch 8 Table 8.1.16 shall be permitted to be used as voice evacuation speakers, provided they comply with Ch 7 Section 2.4; iii. where speakers are not dedicated, building ancillary function speakers shall be permitted to be part of the voice evacuation system provided they comply with voice message intelligibility, circuit integrity, wiring requirements, addressable etc. as per Section 2.4."

  - id: evc_general_speaker_strobes
    when: {}
    systems:
      - name: "Speakers with Flashers / Strobe Light (basements, plant rooms, noisy industrial areas)"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 5.iv"
        page_ref: "p.434"
        spec: "Speakers shall be with flashers or strobe light where installed at basements, plant rooms and noisy industrial areas"
        detail: "Table 7.1 #5.iv (p.434), verbatim: 'Speakers shall be with flashers or strobe light where installed at basements, plant rooms and noisy industrial areas.'"

  - id: evc_general_zones
    when: {}
    systems:
      - name: "Voice Evacuation Signalling Zones"
        code_ref: "Ch 7, #2.4 / Table 7.1 item 6"
        page_ref: "p.434"
        spec: "Undivided, non-compartmentalized fire or smoke zones not divided into multiple voice evacuation zones; all appliances of one zone activate together; fire in one zone shall not impair the appliances outside it"
        detail: "Table 7.1 #6 (p.434): i. if acceptable to the authority having jurisdiction, the system shall permit the application of an automatic evacuation signal to one or more signalling zones and at the same time permit manual voice paging to the other signalling zones selectively or in any combination; ii. undivided, non-compartmentalized fire or smoke zones of the building shall not be divided into multiple voice evacuation signalling zones; iii. if multiple notification appliance circuits are provided within a single zone, all of the notification appliances within the zone shall be arranged to activate or deactivate simultaneously; iv. fire alarm systems used for partial evacuation and relocation shall be designed and installed such that attack by fire within an evacuation signalling zone shall not impair control and operation of the notification appliances outside the evacuation signalling zone."

  # Fix round 28.10.2026 (CH04-07 L4): #5.1 / Table 7.4 acceptance and #4.4.2 inspection.
  - id: evc_general_acceptance_test
    when: {}
    systems:
      - name: "EVC Acceptance Test - Speech Intelligibility (Table 7.4)"
        code_ref: "Ch 7, #5.1 / Table 7.4"
        page_ref: "p.441"
        spec: "Acceptance test based on the clear audibility, intelligibility and understanding of the voice messages delivered in the building (subject based or instrument based testing)"
        detail: "#5.1 (p.441): Intelligibility of Emergency Voice Evacuation or Communication Systems shall comply with Table 7.4. Table 7.4 item 1 ACCEPTANCE TEST: ii. two basic categories of intelligibility testing: a. subject (human) based testing, b. instrument based test methods; iii. subject based examples include the Phonetically Balanced (PB) word scores (256 words or 1000 words) and Modified Rhyme Test (MRT); vi. acceptance test for voice evacuation systems shall be completely based on the clear audibility, intelligibility and understanding of the voice messages delivered in a particular building. #4.3.2 (p.440): the main consultant shall inspect the work during installation and acceptance and ensure that voice speakers are delivering intelligible messages in accordance with Section 5 (fix round 28.10.2026, CH04-07 L4)."

  - id: evc_general_inspection_maintenance
    when: {}
    systems:
      - name: "EVC + Two-way Telephone Inspection and Maintenance (Ch 8 schedule)"
        code_ref: "Ch 7, #4.4.1-#4.4.2"
        page_ref: "p.440"
        spec: "Inspected and maintained as per the Chapter 8 Fire Detection and Alarm System schedule and requirements"
        detail: "#4.4.1 (p.440): the building owner, his appointed representative and the facility management shall be responsible to ensure that Voice evacuation System and Two-way telephone systems are installed in compliance with this chapter. #4.4.2 (p.440): Emergency Voice Evacuation System and Two-way telephone systems shall be inspected and maintained as per Chapter 8 Fire Detection and Alarm System's schedule and requirements (fix round 28.10.2026, CH04-07 L4)."

  - id: evc_general_two_way_wiring
    when: {}
    systems:
      - name: "Two-way Telephone Circuits + Wiring (2 hour fire rated)"
        code_ref: "Ch 7, #2.5 / Table 7.2 item 4"
        page_ref: "p.438"
        spec: "All circuits and wiring necessary for the operation of two-way telephone communication systems shall be 2 hour fire rated"
        detail: "Table 7.2 #4.i (p.438), verbatim: 'All circuits and wiring necessary for the operation of two-way telephone communication systems shall be 2 hour fire rated.'"

  - id: evc_general_two_way_installation
    when: {}
    systems:
      - name: "Two-way Telephone Appliance / Jack Mounting Heights"
        code_ref: "Ch 7, #2.5 / Table 7.2 item 5"
        page_ref: "p.438"
        spec: "Wall-mounted telephone appliances or jacks 910-1680 mm above floor level with clear access at least 760 mm wide; where accessible to the general public, one telephone appliance per location not more than 1220 mm above floor level"
        detail: "Table 7.2 #5 (p.438): i. wall-mounted telephone appliances or related jacks shall be not less than 910 mm and not more than 1680 mm above floor level with clear access to the appliance that is at least 760 mm wide; ii. if accessible to the general public, one telephone appliance per location shall be not more than 1220 mm above floor level."

  # Owner ruling 13.10.2026 (card "Add all", Phase 5 G5 / CH47-05): Table 7.2 item 1,
  # "collocated" printed word for word, not interpreted.
  - id: evc_general_two_way_usage
    when: {}
    systems:
      - name: "Two-way Telephone System - Civil Defence Use, Collocated with EVC"
        code_ref: "Ch 7, #2.5 / Table 7.2 item 1"
        page_ref: "p.437"
        spec: "Provided for Civil Defence personnel use and collocated with the Emergency Voice Evacuation and Communication System"
        detail: "Owner ruling 13.10.2026. #2.5.1 (p.437): Two-way Communication System or Two-way Telephone System requirements shall comply with Table 7.2. Table 7.2 #1.i (p.437), verbatim: 'Two-way Communication Systems or Two-way Telephone Systems shall be provided for Civil Defence personnel use. And it shall be collocated with the Emergency Voice Evacuation and Communication System.'"

  - id: evc_general_two_way_phone_jacks
    when: {}
    systems:
      - name: "Two-way Telephone Jack Locations (Fireman's Phone)"
        code_ref: "Ch 7, #2.5 / Table 7.2 item 2"
        page_ref: "p.437"
        spec: "Common talk / party-line; jacks at every required location"
        detail: "Telephone station OR jack at: (a) every stair landing, every floor; (b) every fire lift lobby; (c) inside every elevator car; (d) fire / emergency command centre; (e) fire pump room; (f) every area of refuge. AT LEAST 2 HANDSETS at each control centre for emergency responders. Each station/jack permanently labelled to allow caller to identify location by voice."

  # Item 3.1 (v)-(vi) added by owner ruling 13.10.2026 (card "Add all", Phase 5 G5).
  - id: evc_general_two_way_phone_features
    when: {}
    systems:
      - name: "Two-way Telephone System Features"
        code_ref: "Ch 7, #2.5 / Table 7.2 item 3"
        page_ref: "p.437"
        spec: "Listed; integrity-monitored; simultaneous 5-station common-talk capability"
        detail: "Equipment listed and approved for two-way telephone service. Integrity monitoring of all circuits. Simultaneous operation of any 5 telephone stations in common-talk mode. Distinctive off-hook indication at control unit (visible per circuit if selective talk). Table 7.2 #3.1 (p.437; owner ruling 13.10.2026): v. a means for silencing the audible call-in signal sounding appliance shall be permitted, provided that it is key operated or located in a locked cabinet, or provided with protection to prevent use by unauthorized persons. The means shall operate a visible indicator and sound a trouble signal whenever the means is in the silence position and no telephone circuits are in an off-hook condition; vi. if a selective talk system is used, means mentioned above shall be permitted, provided that subsequent telephone circuits going off-hook operate the distinctive off-hook signal."

branches:
  - id: evc_super_highrise
    match:
      height_m_gt: 90
    section: "Ch 7, #3.1 / Table 7.3 item 1"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - control unit beside FACP at continuously monitored location, dedicated speakers, Class A circuits"
        detail: "EVC required for super-highrise buildings (height > 90 m). Provides intelligible voice instructions during evacuation, with all-call and zone-by-zone capability."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2 - jacks at every stair landing, lift lobby, fire command centre"
        detail: "Two-way telephone system required for super-highrise. Allows firefighters to communicate between floors and the command centre during operations."

  - id: evc_highrise
    match:
      height_m_gte: 23
      height_m_lte: 90
    section: "Ch 7, #3.1 / Table 7.3 item 2"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1"
        detail: "EVC required for highrise buildings (23 m <= height <= 90 m, ruling R1). Phased / staged evacuation messaging by floor."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"
        detail: "Two-way telephone jacks at stair landings, lift lobbies and fire command centre for firefighter communication."

  - id: evc_mall
    match:
      occupancy_in: [mall_covered, mall_open, mall_mixed]
    section: "Ch 7, #3.1 / Table 7.3 item 3"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - public-mode audibility 15 dB above ambient (Table 7.1 #4.3)"
        detail: "EVC required for malls (covered / open / mixed). Multi-zone messaging with all-call override; public-mode voice messages shall be 15 dB above the ambient sound level (Table 7.1 #4.3, p.434). Average ambient sound levels for information: 40 dBA mercantile, 55 dBA assembly zones (Ch 7 #2.3, p.432)."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"
        detail: "Two-way telephone jacks at every fire-command interface and major mall circulation node."

  - id: evc_assembly
    match:
      occupancy_in: [assembly_a, assembly_b, assembly_c]
    section: "Ch 7, #3.1 / Table 7.3 item 4"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - public-mode audibility 15 dB above ambient (Table 7.1 #4.3); 55 dBA is the assembly average ambient sound level for information (Ch 7 #2.3, p.432), not a design level"
        detail: "EVC required for assembly occupancies (concert halls, cinemas, theatres, auditoriums, banquet halls, mosques, restaurants, nightclubs)."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"

  # Fix round 28.10.2026 (CH04-07 H1): item 5 fires on the theme / amusement park tick as
  # well as on the amusement (mazes / mirrors / play areas) box.
  - id: evc_amusement
    match:
      any_of:
        - {has_amusement_confounding_is: true}
        - {is_theme_park_is: true}
    section: "Ch 7, #3.1 / Table 7.3 item 5"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - standalone EVC trigger irrespective of occupant load"
        detail: "Per Table 7.3 item 5 (p.439), AMUSEMENT AND THEME PARKS require EVC + Two-way Telephone irrespective of occupant load and of occupancy classification - a standalone trigger, not gated on Assembly. Fires on 'Theme / amusement park' or on 'Amusement / mazes / mirrors / play areas' (fix round 28.10.2026, CH04-07 H1). Includes mazes, mirror houses, motion simulators, dark rides, indoor play areas with confounding layouts."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"
        detail: "Two-way telephone jacks at every fire-command interface and major circulation/ride control node."

  - id: evc_education
    match:
      occupancy_in: [education_a, education_b, education_c]
    section: "Ch 7, #3.1 / Table 7.3 item 6"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - public-mode audibility 15 dB above ambient (Table 7.1 #4.3); 45 dBA is the educational average ambient sound level for information (Ch 7 #2.3, p.432), not a design level"
        detail: "EVC required for educational occupancies (universities, schools, kindergartens). Class A circuits; survivable speakers."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"

  - id: evc_hotel
    match:
      occupancy_in: [hotel_a, hotel_b, hotel_c]
    section: "Ch 7, #3.1 / Table 7.3 item 7"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - sleeping-area audibility 75 dB at the pillow level (dBA)"
        detail: "EVC required for hotel occupancies. Table 7.1 #4.4 (p.434): voice messages in sleeping areas shall be 75 dB measured at the pillow level in the area required to be served using A-weighted scale (dBA)."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"
        detail: "Two-way telephone jacks at stair landings, lift lobbies, fire command centre."

  - id: evc_detention
    match:
      occupancy_in: [detention_a, detention_b, detention_c]
    section: "Ch 7, #3.1 / Table 7.3 item 8"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - supervised relocation messaging"
        detail: "EVC required for detention / correctional occupancies. Messaging coordinated with relocation procedures."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"

  # Fix round 28.10.2026 (CH04-07 H3): the built-up area is the larger of the total GFA
  # and the ground-floor BUA (Building.storage_total_bua_m2); both blank = NOT EVALUATED.
  - id: evc_storage_industrial_large
    match:
      occupancy: storage_industrial
      storage_total_bua_m2_gt: 5000
    section: "Ch 7, #3.1 / Table 7.3 item 9"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation or Communication System (EVC)"
        spec: "Per Section 2.4 + Table 7.1 - 30 dBA storage / 80 dBA industrial / 85 dBA mechanical-room average ambient sound levels for information (Ch 7 #2.3, p.432)"
        detail: "EVC required for storage and industrial occupancies with built-up area more than 5000 m2 (the larger of the total GFA and the ground-floor BUA entered). Speaker placement to overcome high industrial ambient noise. The 30/80/85 dBA figures from Ch 7 #2.3 (p.432) are 'average ambient sound levels for information' (informational reference) - NOT design thresholds. Public-mode audibility design target is 15 dB above the measured ambient (Table 7.1 #4.3)."
      - name: "Two-way Telephone Communication System"
        spec: "Per Section 2.5 + Table 7.2"

  # ---- Explicit 'not required' branches for clarity -----------------------
  - id: evc_residential_not_required
    match:
      occupancy_in: [residential, labour_accommodation, staff_accommodation, hostel]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - residential occupancies up to highrise threshold"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for residential / labour / staff accommodation / hostel buildings below 23 m. Buildings of 23 m or more fall under the highrise branch above and require EVC + Two-way."

  - id: evc_business_not_required
    match:
      occupancy: business
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - business under highrise"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for business (office) occupancies under highrise threshold. Once height reaches 23 m (ruling R1) the highrise branch applies and EVC + Two-way are required."

  - id: evc_healthcare_not_required
    # Table 7.3 lists no healthcare category — EVC is not mandated for ANY
    # healthcare sub-type (hospital / clinic / ambulatory) under highrise.
    match:
      occupancy_in: [healthcare_a, healthcare_b, healthcare_c]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - healthcare under highrise"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for healthcare occupancies under highrise threshold per Table 7.3 (healthcare is not listed). Hospitals of 23 m or more fall under the highrise branch and require EVC. NOTE: #2.1.1 Table 7.1 control-unit location text (p.433) specifically calls out 'nurse stations at hospitals' as a continuously monitored location for EVC siting - this implies the code anticipates EVC at hospitals even though Table 7.3 does not mandate it. RECOMMENDED practice: highrise / super-highrise hospitals and any hospital with phased / staged evacuation procedures should provide EVC even when not strictly mandated."

  - id: evc_mercantile_not_required
    match:
      occupancy_in: [mercantile_a, mercantile_b, mercantile_c]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - mercantile under highrise"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for stand-alone mercantile occupancies under highrise threshold. Note: any retail forming part of a mall is captured by the mall branch above."

  - id: evc_daycare_not_required
    match:
      occupancy_in: [daycare_a, daycare_b, daycare_c]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - daycare under highrise"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for daycare occupancies."

  - id: evc_villa_not_required
    match:
      occupancy_in: [villa_private, villa_commercial]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - villas"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for private or commercial villas."

  - id: evc_parking_not_required
    match:
      occupancy_in: [parking_enclosed, parking_open]
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - standalone parking"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for stand-alone parking buildings. Parking attached to a highrise / mall inherits that occupancy's EVC requirement via the parent branch."

  - id: evc_fuel_not_required
    match:
      occupancy: motor_fuel_dispensing
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 (not listed)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - motor fuel dispensing"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for motor-fuel-dispensing facilities."

  - id: evc_storage_industrial_small
    match:
      occupancy: storage_industrial
      storage_total_bua_m2_gt: 0
      storage_total_bua_m2_lte: 5000
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 item 9 (BUA threshold)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - small storage/industrial"
        required: not_required
        detail: "EVC and two-way telephone are NOT mandatory for storage and industrial occupancies with built-up area of 5000 m2 or less (the larger of the total GFA and the ground-floor BUA entered). Once the built-up area is more than 5000 m2 Table 7.3 item 9 (p.439) requires them."

  # Fix round 28.10.2026 (CH04-07 H3): a blank never counts as a pass.
  - id: evc_storage_industrial_bua_not_evaluated
    match:
      occupancy: storage_industrial
      storage_total_bua_m2_lte: 0
      height_m_lt: 23
    section: "Ch 7, #3.1 / Table 7.3 item 9 (BUA threshold)"
    page: "p.439"
    systems:
      - name: "Emergency Voice Evacuation (EVC) - Storage / Industrial - NOT EVALUATED"
        spec: "Not evaluated: enter the total GFA or the ground-floor BUA (Table 7.3 item 9 keys on more than 5000 m2 built-up area)"
        detail: "Table 7.3 item 9 (p.439) STORAGE AND INDUSTRIAL OCCUPANCIES HAVING BUILT-UP AREA MORE THAN 5000 m2: Emergency Voice Evacuation or Communication System (EVC) per Section 2.4 and Two-way Telephone System per Section 2.5 shall be provided. Neither the total GFA nor the ground-floor BUA is entered, so the 5000 m2 test is not evaluated; a blank is never taken as 5000 m2 or less (fix round 28.10.2026, CH04-07 H3)."
