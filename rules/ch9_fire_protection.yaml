  # ---------------- LOWRISE COMMERCIAL OUTLET ATTACHED (Ch 9, #4.5.5 / Table 9.21.e) ----
  # #4.5.5 (p.711) covers lowrise villas (G+1), business (Groups A, B, C) and mosques
  # (Assembly Group C in this tool) with commercial / mercantile outlets attached or in the
  # same plot; the rows are keyed on the built-up ground floor area OF THE COMMERCIAL
  # OUTLET (`commercial_outlet_gf_bua_m2`, audit CH9B-14). The table prints "upto 900 m2"
  # and "more than 900 m2", so 900 m2 is row 1.
  # Owner ruling R-C (28.10.2026, audit F9A-01): the host building's own Table 9.21.a /
  # 9.21.b row AND Table 9.21.e both apply (no `suppresses:`); the most onerous pump and
  # tank govern (engine._merge_duties) and the other is named. Cursor PR #26 (suppress the
  # host tiers while the outlet area is blank) is therefore not ported: the host row stays
  # and the Table 9.21.e row is named NOT EVALUATED.
  # Audit F9A-13: Table 9.21.e row A is "VILLAS (G+1)", so a villa takes it only up to 2
  # floors above grade; row C is "MOSQUES" (Assembly Group C is the tool's mosque).
  - id: lowrise_commercial_outlet_area_missing
    match:
      height_m_lte: 15
      any_of:
        - {occupancy_in: [villa_private, villa_commercial], floors_above_grade_lte: 2}
        - {occupancy_in: [business, assembly_c]}
      has_attached_commercial_outlet_is: true
      commercial_outlet_gf_bua_m2_lte: 0
    section: "Ch 9, #4.5.5 / Table 9.21.e"
    page: "p.711"
    systems:
      - name: "Commercial Outlet GF BUA (Table 9.21.e) - NOT EVALUATED"
        spec: "Not evaluated: enter the built-up ground floor area of the commercial outlet"
        detail: "Table 9.21.e rows 1 (up to 900 m2) and 2 (more than 900 m2) are keyed on the built-up ground floor area of the commercial outlet, not of the host building. The outlet area was not entered, so the Table 9.21.e row is not evaluated (audit CH9B-14). The host building's own Table 9.21.a / 9.21.b row still applies (owner ruling R-C, 28.10.2026)."

