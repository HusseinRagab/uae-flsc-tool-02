      - name: "Dry Riser + Hose Reel System (throughout)"
        detail: "Dry riser and hose reel system throughout per Section 3.2 and Section 3.3 (Table 9.24.A.2 iii)."
      - name: "Dry Risers Interconnected at Highest Level"
        detail: "Table 9.24.A.2 iv."
