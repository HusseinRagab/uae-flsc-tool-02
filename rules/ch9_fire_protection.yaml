        merge_system: pump
        duty: pump
        spec: "1000 gpm @ 17 bar (combined yard + internal; irrespective of number of stairs and standpipes)"
        detail: "Where a fire pump set is combined and serves both yard hydrants and internal building systems, the first pump set at the lowest level is 1000 gpm irrespective of the number of stairs and standpipes, at 17 bar (Table 9.18.A ix)."
      - name: "Upper-level Pump Sets (every 90 m)"
        pump_spec_type: standpipe_dependent
        detail: "Where a pump set only serves internal building systems, the pump sets located vertically at every 90 m intermediate interval from the lowest level fire pump (Table 9.18.A xi). Table 9.3 item 1.xiii (p.567): the fire pump provided at higher levels, other than the lowest level, in super highrise buildings is permitted to be a set of 2 electric driven fire pumps, a main and a standby, with 1 jockey pump, complete with controllers; the power supply for the 2 electric pumps shall be from different sources (item 2.ii, p.568: the standby pump from a separate source such as building UPS, diesel generator or alternative power source)."
