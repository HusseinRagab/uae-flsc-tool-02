        page_ref: "p.755"
        detail: "Table 9.30.R: (i) a double interlocked pre-action sprinkler system per Section 3.7, OR (ii) rooms shall be 2 hour fire rated enclosures with 90 minutes fire doors, housing exclusively dry type medical and electrical equipment and no other storage."

  - id: aux_S_mri_scanning
    flag: has_mri_scanning_room
    requires_sprinkler_system: true
    systems:
      - name: "MRI / Scanning Room - Automatic Sprinkler (3.5) OR Double-Interlocked Pre-action (3.7) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.S"
        page_ref: "p.755"
        detail: "Table 9.30.S: (i) an automatic sprinkler system per Section 3.5, OR (ii) a double interlocked pre-action sprinkler system per Section 3.7, OR (iii) rooms shall be 2 hour fire rated enclosures with 90 minutes fire doors, housing exclusively dry type medical and electrical equipment and no other storage."

  - id: aux_T_records
    flag: has_records_room
    requires_sprinkler_system: true
    systems:
      - name: "Records Room - Automatic Sprinkler (3.5) OR Double-Interlocked Pre-action (3.7) OR Clean Agent (3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.T"
        page_ref: "p.755"
        detail: "Table 9.30.T: (i) an automatic sprinkler system per Section 3.5, OR (ii) a double interlocked pre-action sprinkler system per Section 3.7, OR (iii) a clean agent system per Section 3.14."

  - id: aux_U_ups
    flag: has_ups_room
    requires_sprinkler_system: true
    systems:
      - name: "UPS Room - Clean Agent (3.14) OR Double-Interlocked Pre-action (3.7) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.U"
        page_ref: "p.755"
        detail: "Table 9.30.U: (i) a clean agent system per Section 3.14, OR (ii) a double interlocked pre-action sprinkler system per Section 3.7, OR (iii) rooms shall be 2 hour fire rated enclosures with 90 minutes fire doors, housing exclusively dry type battery, dry electrical equipment and no other storage."

  - id: aux_V_cold_freezer
    flag: has_cold_freezer_room
    requires_sprinkler_system: true
    systems:
      - name: "Cold / Freezer Room - Dry Sprinklers OR Dry Pre-action System"
        code_ref: "Ch 9, #4.14 / Table 9.30.V"
        page_ref: "p.755"
        detail: "Table 9.30.V: (i) dry type sprinklers or dry preaction system shall be provided. Exemptions: (ii) rooms which are less than 20 m2 in area need not be protected; however, such rooms shall be compartmented with fully compliant penetration fire stopping systems; (iii) modular type cold rooms which are exposed to occupied rooms shall not be required to be protected, provided the room is provided with automatic sprinkler system; (iv) rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

equipment:
  - id: eq_A_kitchen_hood
    flag: has_commercial_kitchen
    systems:
      - name: "Commercial Kitchen Hood - Automatic Wet Chemical System (Section 3.12) + Grease Filters"
        code_ref: "Ch 9, #4.15 / Table 9.31.A; #3.12 / Table 9.14 items 3.ii, 6"
        page_ref: "p.756, p.675"
        spec: "Automatic wet chemical system (Section 3.12) and grease filters, for commercial kitchens having 3 or more burners"
        detail: "Table 9.31.A: an automatic wet chemical system per Section 3.12 for commercial kitchens having 3 or more burners; grease filters shall be installed for the kitchen hood. Table 9.14 item 3.ii: the wet chemical system as an entire system, with its design, installation and maintenance manual from the manufacturer, shall be listed and approved by Civil Defence. Table 9.14 item 6: on activation, all sources of fuel and electric power that produce heat to all equipment protected by the system shall be shut down; gas appliances not requiring protection but located under the same ventilation equipment shall also be shut off; shutoff devices shall require manual resetting before fuel or power is restored."

  - id: eq_B_lpg_tanks
    flag: has_lpg_tanks
    # Table 9.31.B i-ii cover tanks aboveground or on roofs or podiums only (p.756).
    when: {has_lpg_tank_underground_mounded_is: false}
    systems:
      - name: "LPG Tanks (aboveground, roof or podium) - Fixed Water Spray System"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 5; Ch 9, #4.15 / Table 9.31.B"
        page_ref: "p.906, p.756"
        detail: "Fixed water spray system on every aboveground LPG tank, fed from the fire pump and water tank of the building the LPG tank serves, designed per Chapter 9 (Table 11.5 item 5.i). Where that building has no fire pump and water tank, a dry-type water spray ring with open nozzles connected to a Civil Defence breeching inlet (Table 11.5 item 5.ii; Table 9.31.B ii gives the same dry deluge with breeching inlet for a building that is not sprinklered). Code conflict: Table 9.31.B iii (p.756) reads 'Where LPG tanks are installed aboveground, no protection shall be required, unless the proximity of such tanks is more than 6 m from any point of structure', while Table 11.5 item 5.i (p.906) requires the fixed water spray with no exemption. Ruling R5 (12.10.2026): Chapter 11 governs, so no distance exemption is applied."

  - id: eq_B_lpg_tanks_underground_and_roof
    flag: has_lpg_tanks
    # Underground / mounded tanks ticked beside roof or at-grade tanks: those tanks are
    # covered by Table 9.31.B i (p.756) and Table 11.5 item 5 / Table 11.7 #5 (Ch 11), so
    # the spray is required for them (owner ruling 12.10.2026, P3 Ch11 Q4 at-grade input).
    when:
      has_lpg_tank_underground_mounded_is: true
      any_of:
        - {has_lpg_tank_roof_mounted_is: true}
        - {has_lpg_tank_at_grade_is: true}
    systems:
      - name: "LPG Tanks (aboveground, roof or podium) - Fixed Water Spray System"
        code_ref: "Ch 11, Table 11.7 #5 / Table 11.5 item 5; Ch 9, #4.15 / Table 9.31.B"
        page_ref: "p.906, p.756"
        detail: "Roof-mounted or aboveground at-grade LPG tanks are ticked beside the underground / mounded tanks: Table 9.31.B i-ii (p.756) cover tanks aboveground or on roofs or podiums, and Chapter 11 requires their fire protection (Table 11.5 item 5, Table 11.7 #5), so the fixed water spray system is required on every such tank. The underground / mounded tanks need none (Table 11.9 #5). Ruling R5 (12.10.2026): Chapter 11 governs the Table 9.31.B iii 6 m clause."

  - id: eq_B_lpg_tanks_underground_mounded
    flag: has_lpg_tanks
    when: {has_lpg_tank_underground_mounded_is: true, has_lpg_tank_roof_mounted_is: false, has_lpg_tank_at_grade_is: false}
    systems:
      - name: "LPG Tanks (aboveground, roof or podium) - Fixed Water Spray System"
        required: not_required
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 5; Ch 9, #4.15 / Table 9.31.B"
        page_ref: "p.906, p.756"
        detail: "Only underground / mounded LPG tanks are declared (no roof or aboveground at-grade tanks ticked): Table 9.31.B i-ii (p.756) apply only where LPG tanks are installed aboveground or on roofs or podiums, and Table 11.9 #5 makes fire protection for underground / mounded tanks not mandatory, so no water spray system is required. Tick the roof or at-grade tank box if the project also has those tanks (owner ruling 12.10.2026, P3 Ch11 Q4)."

  - id: eq_C_flammable_liquid_tanks
    flag: has_flammable_liquid_tanks
    systems:
      - name: "Flammable Liquid Tanks - Automatic Foam System (Section 3.9)"
        code_ref: "Ch 9, #4.15 / Table 9.31.C; Ch 13"
        page_ref: "p.756"
        detail: "Table 9.31.C (p.756): an automatic foam system as appropriate as per Section 3.9 shall be provided. Refer to Chapter 13 Flammable Liquids."

  - id: eq_D_cable_spread
    flag: has_cable_spread_areas
    systems:
      - name: "Cable Spread Areas - Automatic Water Deluge Spray (Table 3.8) OR Water Mist (Table 3.10)"
        code_ref: "Ch 9, #4.15 / Table 9.31.D"
        page_ref: "p.756"
        detail: "Cable spread / cable tray galleries: water deluge spray per Table 3.8 or water mist per Table 3.10."

  - id: eq_E_diesel_generator
    flag: has_diesel_generator_room
    systems:
      - name: "Diesel Generator Room - Foam Sprinkler System (Section 3.9)"
        code_ref: "Ch 9, #4.15 / Table 9.31.E; #4.14 / Table 9.30.G"
        page_ref: "p.756, p.752"
        detail: "Table 9.31.E (p.756): foam sprinkler system shall be provided per Section 3.9. Exemption (ii): diesel generator rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected. Table 9.30.G (p.752) prints the same system; Table 9.31.E governs whether or not the building is sprinklered (owner ruling R-E, 28.10.2026: the #4.1.5 gate of Table 9.30 does not apply to the Table 9.31 equipment table), and the one foam sprinkler system meets both tables."

  - id: eq_F_boilers
    flag: has_boilers
    systems:
      - name: "Boilers - Automatic Sprinkler System (Section 3.5)"
        code_ref: "Ch 9, #4.15 / Table 9.31.F"
        page_ref: "p.756"
        detail: "Boiler rooms: wet-pipe sprinklers per Section 3.5."

  - id: eq_G_cooling_towers
    flag: has_cooling_towers
    systems:
      - name: "Cooling Towers - Automatic Water Deluge Spray (Table 3.8)"
        required: conditional
        code_ref: "Ch 9, #4.15 / Table 9.31.G"
        page_ref: "p.756"
        detail: "Table 9.31.G: where the cooling tower material is not tested and certified for non-combustibility, an automatic water deluge spray system shall be provided per Table 3.8."

  - id: eq_H_oil_filled_transformers
    flag: has_oil_filled_transformers
    systems:
      - name: "Oil-filled Transformers - Automatic Water Deluge Spray (Table 3.8)"
        code_ref: "Ch 9, #4.15 / Table 9.31.H"
        page_ref: "p.756"
        detail: "Oil-filled transformers: water deluge spray on the transformer enclosure per Table 3.8."

  - id: eq_I_bulk_oil_storage
    flag: has_bulk_oil_storage
    systems:
      - name: "Bulk Oil Storage - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.I; Ch 13"
        page_ref: "p.756"
        detail: "Comprehensive risk assessment required; suppression proposal prepared and stamped by a CD-approved House of Expertise. Refer Chapter 13 Flammable Liquids."

  - id: eq_J_bulk_flammable_liquid
    flag: has_bulk_flammable_liquid_storage
    systems:
      - name: "Bulk Flammable Liquid Storage - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.J; Ch 13"
        page_ref: "p.756"
        detail: "Risk assessment + House-of-Expertise proposal. Refer Chapter 13 Flammable Liquids and Chapter 9 Fire Protection."

  - id: eq_K_bulk_flammable_gas
    flag: has_bulk_flammable_gas_storage
    systems:
      - name: "Bulk Flammable Gas Storage - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.K"
        page_ref: "p.757"
        detail: "Risk assessment + House-of-Expertise proposal."

  - id: eq_L_bulk_flammable_solid
    flag: has_bulk_flammable_solid_storage
    systems:
      - name: "Bulk Flammable Solid Storage - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.L"
        page_ref: "p.757"
        detail: "Risk assessment + House-of-Expertise proposal."

  - id: eq_M_high_hazard_logistics
    flag: has_high_hazard_logistics
    systems:
      - name: "High-hazard Logistics - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.M"
        page_ref: "p.757"
        detail: "Risk assessment + House-of-Expertise proposal."

  - id: eq_N_chemical_warehouse
    flag: has_chemical_warehouse
    systems:
      - name: "Chemical Warehouse - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.N"
        page_ref: "p.757"
        detail: "Risk assessment + House-of-Expertise proposal."

  - id: eq_O_explosives
    flag: has_explosives
    systems:
      - name: "Arms / Ammunition / Explosives - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.O"
        page_ref: "p.757"
        detail: "Arms / ammunition / explosives: risk assessment + House-of-Expertise proposal."

  - id: eq_P_processing_plants
    flag: has_processing_plant
    systems:
      - name: "Processing / Generating Plant - Risk-Assessment-Based Suppression (House of Expertise)"
        code_ref: "Ch 9, #4.15 / Table 9.31.P"
        page_ref: "p.757"
        detail: "Processing / generating plants: risk assessment + House-of-Expertise proposal."

# ---------------- KIOSKS (Ch 1, Table 1.9 item 48, p.98) ----------------------------
# Mercantile Group C kiosk, permanent or temporary (Table 1.1 row 11, p.50; owner rulings
# 13.10.2026, P4 Q4-Q5). Table 1.9 item 48 sends fire protection to Ch 9; its lines are
# printed here, beside the Table 9.20.b row C / Table 9.21.b row. Line iii depends on
# kiosk_in_sprinklered_area_or_mall: blank = NOT EVALUATED by name, never a pass.
kiosk_item_48:
  - id: kiosk_48_general
    always_on: true
    when: {is_kiosk_is: true}
    systems:
      - name: "Kiosk Fire Resistance Separation (Table 1.9 item 48)"
        code_ref: "Ch 1, Table 1.9 item 48"
        page_ref: "p.98"
        spec: "0 Hour with automatic fixed fire protection system; 0 Hour without"
        detail: "Table 1.9 item 48 KIOSKS (p.98): required separation with automatic fixed fire protection system 0 Hour; without automatic fixed fire protection system 0 Hour."
      - name: "Kiosk Separation from Other Occupancies (Table 1.9 item 48 i)"
        code_ref: "Ch 1, Table 1.9 item 48 i"
        page_ref: "p.98"
        spec: "Not less than 1.5 m horizontal separation"
        detail: "Table 1.9 item 48 i (p.98): 'Minimum horizontal separation between kiosks and other occupancies, including other structures within mall circulation area or retail spaces shall not be less than 1.5 m.'"
      - name: "Separation Between Adjacent Kiosks (Table 1.9 item 48 ii)"
        code_ref: "Ch 1, Table 1.9 item 48 ii"
        page_ref: "p.98"
        spec: "Not less than 6 m between 2 adjacent kiosks"
        detail: "Table 1.9 item 48 ii (p.98): 'The minimum horizontal separation distance between 2 adjacent kiosks shall not be less than 6m.'"
      - name: "Automatic Fire Detection and Alarm System (Kiosk, Table 1.9 item 48 iv)"
        code_ref: "Ch 1, Table 1.9 item 48 iv"
        page_ref: "p.98"
        spec: "Automatic fire detection and alarm system"
        detail: "Table 1.9 item 48 iv (p.98): 'Kiosks shall be provided with automatic fire detection and alarm system.' The Ch 8 chapter of this report gives the system lines."
      - name: "Kiosk Area Limit (Table 1.9 item 48 v)"
        code_ref: "Ch 1, Table 1.9 item 48 v / #7.1.40"
        page_ref: "p.98"
        spec: "Kiosk or group of kiosks: area not more than 18 m2"
        detail: "Table 1.9 item 48 v (p.98): 'Kiosks or group of kiosks shall not have an area more than 18 m2. See section 7.1.40. for kiosk material requirements.' The tool reads the kiosk area from the ground floor built-up area input."

  - id: kiosk_48_iii_sprinklered_area
    always_on: true
    when: {is_kiosk_is: true, kiosk_in_sprinklered_area_or_mall_is: true}
    systems:
      - name: "Automatic Sprinkler System (Kiosk, Table 1.9 item 48 iii)"
        code_ref: "Ch 1, Table 1.9 item 48 iii"
        page_ref: "p.98"
        spec: "Automatic sprinkler system in the kiosk"
        detail: "Table 1.9 item 48 iii (p.98): 'Kiosks located at sprinkler protected areas and mall buildings shall be provided with automatic sprinkler system.' The kiosk is entered as located in a sprinkler protected area or a mall building."

  - id: kiosk_48_iii_not_sprinklered_area
    always_on: true
    when: {is_kiosk_is: true, kiosk_in_sprinklered_area_or_mall_is: false}
    systems:
      - name: "Automatic Sprinkler System (Kiosk, Table 1.9 item 48 iii)"
        required: not_required
        code_ref: "Ch 1, Table 1.9 item 48 iii"
        page_ref: "p.98"
        detail: "Not required by item 48 iii: Table 1.9 item 48 iii (p.98) requires an automatic sprinkler system for kiosks located at sprinkler protected areas and mall buildings, and the kiosk is entered as located elsewhere. The Ch 9 table row above still governs."

  - id: kiosk_48_iii_not_evaluated
    always_on: true
    when: {is_kiosk_is: true, kiosk_in_sprinklered_area_or_mall_is: null}
    systems:
      - name: "Kiosk Location (Table 1.9 item 48 iii) - NOT EVALUATED"
        code_ref: "Ch 1, Table 1.9 item 48 iii"
        page_ref: "p.98"
        spec: "Not evaluated: state whether the kiosk is in a sprinkler protected area or a mall building"
        detail: "Table 1.9 item 48 iii (p.98): 'Kiosks located at sprinkler protected areas and mall buildings shall be provided with automatic sprinkler system.' Where the kiosk is located was not entered, so this line is not evaluated."
