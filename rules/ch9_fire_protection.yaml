# UAE FLSC 2018 - Chapter 9: Fire Protection Systems
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 9
  chapter_title: "Fire Protection Systems"

general:
  - id: g_yard_hydrant_nonstorage_plot
    when:
      building_category_not: [storage_industrial]
      plot_area_m2_gt: 20000
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.4"
        page_ref: "p.694"
        detail: "Yard hydrant loop around plot per Section 3.11. Required because non-storage/non-industrial plot > 20,000 m2 (typically cluster of buildings). Hydrants spaced per code; breeching inlets accessible to Civil Defence."
  - id: g_yard_hydrant_storage_plot
    when:
      building_category_is: storage_industrial
      ground_floor_bua_m2_gt: 3600
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant loop per Section 3.11. Required because the storage/industrial built-up area is more than 3,600 m2 (#4.1.6, p.694). Built-up area is the total floor area of all floors including mezzanines (#4.1.11, p.695); this rule fires on the ground-floor area alone and the companion rule below fires on the total over all floors. Keyed off built-up area, not plot area."
  - id: g_yard_hydrant_storage_total_bua
    # Companion to g_yard_hydrant_storage_plot: code #4.1.6 keys off TOTAL
    # built-up area (all floors), so a multi-storey warehouse on a small
    # footprint (e.g. 2,000 m2 ground x 3 floors = 6,000 m2 total) must also
    # trigger even though its ground-floor BUA is below 3,600 m2. Emits the
    # same item, so the engine de-duplicates when both conditions are true.
    when:
      building_category_is: storage_industrial
      gross_floor_area_m2_gt: 3600
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant loop per Section 3.11. Required because total storage/industrial built-up area across all floors > 3,600 m2 (#4.1.6, p.694). This companion trigger catches multi-storey storage buildings whose ground-floor footprint alone is below 3,600 m2."
  - id: g_yard_hydrant_storage_total_bua_missing
    # Audit CH9A-17: #4.1.6 keys on the built-up area of all floors (#4.1.11). With the
    # total GFA not entered on a storage building of more than one floor, the total is
    # unknown: named, never taken as the ground floor alone.
    when:
      building_category_is: storage_industrial
      gross_floor_area_m2_lte: 0
      floors_above_grade_gt: 1
      ground_floor_bua_m2_lte: 3600
    systems:
      - name: "Yard Fire Hydrant System (#4.1.6 total built-up area) - NOT EVALUATED"
        spec: "Not evaluated: enter the total GFA (all floors, including mezzanines)"
        code_ref: "Ch 9, #4.1.6 / #4.1.11"
        page_ref: "p.694, p.695"
        detail: "#4.1.6 requires yard fire hydrants for storage and industrial occupancies with more than 3600 m2 built-up area; #4.1.11 defines built-up area as the total floor areas of all the floors, including mezzanines. The total GFA was not entered for this multi-storey building, so this trigger is not evaluated (audit CH9A-17)."
  - id: g_yard_hydrant_storage_remote
    when:
      building_category_is: storage_industrial
      gf_beyond_100m_from_hydrant_is: true
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant system per Section 3.11. Required because the storage/industrial built-up ground floor area is more than 100 m away from an existing, functional and available hydrant (#4.1.6, p.694)."
  - id: g_second_pump_set_90m
    # Table 9.6 item 13.iv (p.584): measured from the fire pump, not from
    # grade. Super highrise rows already carry their upper-level pump sets.
    # Ruling R6 (12.10.2026): malls of 23 m or more keep their Table 9.22 flows
    # and take the Table 9.6 item 13 zoning and second pump set by height; the
    # super highrise rows exclude malls, so a mall above 90 m is covered here.
    when:
      pump_head_height_m_gte: 90
      any_of:
        - {height_m_gte: 23, height_m_lte: 90}
        - {building_category_is: mall, height_m_gte: 23}
    systems:
      - name: "Second Fire Pump Set + Dedicated Water Tank"
        code_ref: "Ch 9, Table 9.6 item 13.iv"
        page_ref: "p.584"
        detail: "The most remote landing valve is 90 m or more above the lowest fire pump set (building height plus depth to the pump room). Table 9.6 item 13.iv: where the most remote landing valve is located at a height of 90 m from the fire pump location, a second set of fire pumps and dedicated water tanks shall be provided."
  - id: g_mall_riser_zoning_45m
    # Ruling R6 (12.10.2026): Table 9.22 has no zoning items; tall buildings of
    # any occupancy take Table 9.6 item 13 (#4.2.1 / #4.3.1).
    when:
      building_category_is: mall
      height_m_gte: 23
      pump_head_height_m_gte: 45
    systems:
      - name: "Wet Riser Zoning - High Zone and Low Zone, looped"
        code_ref: "Ch 9, Table 9.6 item 13.iii"
        page_ref: "p.584"
        detail: "The most remote landing valve is 45 m or more above the fire pump (building height plus depth to the pump room). Table 9.6 item 13.iii: when the most remote landing valve is located at a height of 45 m from the fire pump location, the risers shall be zoned into High Zone and Low Zone with looping (Figure 9.8.B). Item 13.i: maximum pressure anywhere in the wet riser system 24 bar with the pump set to cut off at 140% of rated pressure. Mall flows stay per Table 9.22 (ruling R6, 12.10.2026)."
  - id: g_storage_sprinkler_over_3floors
    when:
      building_category_is: storage_industrial
      floors_above_grade_gt: 3
    systems:
      - name: "Automatic Sprinkler System (full coverage)"
        code_ref: "Ch 9, #4.1.7"
        page_ref: "p.694"
        detail: "#4.1.7 (p.694): 'Storage and Industrial occupancies having more than 3 floors above the fire access Level shall be fully protected with Automatic Sprinkler System, irrespective of their built-up areas.' Reading used: the floors are counted including the ground floor, so the trigger is G+3 (4 floors above grade including the GF) and above (owner ruling Q-1, 28.10.2026; read strictly as floors above the GF at the fire access level, the trigger would be G+4). Sprinkler design per Section 3.5 and the Table 9.27 group rows; #4.1.7 prints no density."
  # Owner ruling 28.10.2026 (CH9B2-18): #4.1.8 (p.694) House of Expertise route for high
  # hazard industrial / storage / special purpose occupancies not addressed in the code.
  - id: g_storage_high_hazard_risk_analysis
    when:
      building_category_is: storage_industrial
      hazard_class_in: [HH]
    systems:
      - name: "Fire Risk Analysis Report (#4.1.8) - where the occupancy is not addressed in the code"
        required: conditional
        code_ref: "Ch 9, #4.1.8"
        page_ref: "p.694"
        detail: "#4.1.8 (p.694): 'All High Hazard Industrial, Storage and special purpose occupancies not addressed in this code, a Fire risk analysis report of the facility and the required fire suppression systems, prepared by the Civil Defence approved House of Expertise shall be furnished for Civil Defence review and approval.' Applies where this high hazard facility is not one of the Table 9.27 groups (audit CH9B2-18)."
  # Owner ruling 28.10.2026 (audit CH123-05 item 5): Table 3.16 row 4.i (p.293) prints
  # hospital sleeping-area travel / dead-end / commonpath as the S column only. A lowrise
  # Healthcare Group A building on Table 9.21.a.1 (GF BUA up to 500 m2) would otherwise
  # take hose reels only, leaving sleeping-area egress NOT EVALUATED. Sprinklers are
  # required; Ch 3 then uses the printed S values. Always-on for healthcare_a so
  # building_sprinklered() (Ch 2 access, Ch 3 columns, Table 9.29 / 9.30 gates) sees it
  # even when the occupancy table has no sprinkler line. Beside a table that already
  # requires sprinklers the extra line is the Table 3.16 reason; beside a hose-reel-only
  # or extinguishers-only row, _reconcile_not_required keeps this required line.
  - id: g_hospital_sleeping_sprinklers
    when:
      occupancy: healthcare_a
    systems:
      - name: "Automatic Sprinkler System (hospital sleeping areas)"
        spec: "Throughout, including sleeping areas, per Section 3.5"
        code_ref: "Ch 3, Table 3.16 row 4.i; Ch 9, Section 3.5"
        page_ref: "p.293, p.694"
        detail: "Table 3.16 row 4.i (p.293) prints hospital sleeping-area commonpath 30 m, dead end 9.1 m and travel 61 m in the sprinklered (S) column only, with no NS values. Owner ruling 28.10.2026 (audit CH123-05 item 5): an automatic sprinkler system is required so those printed S limits apply. A Ch 9 occupancy row that prints only hose reels or extinguishers (Table 9.21.a.1, Table 9.21.f) does not waive it. Where that row's pump and tank are sized for hose reels only, size the pump and tank for this sprinkler system by hydraulic calculation and verify with Civil Defence (#4.1.9, p.694)."
  # Audit F9A-12: #4.1.17 / #4.1.18 (p.695) for developments and large plots.
  - id: g_common_pump_master_tank
    when:
      any_of:
        - {occupancy: infrastructure}
        - {plot_area_m2_gt: 20000}
    systems:
      - name: "Common Fire Pump Set / Master Water Tank (#4.1.17 / #4.1.18)"
        required: recommended
        spec: "#4.1.18: master water tank of a minimum of 500,000 gallons common to the development encouraged; #4.1.17: a common fire pump set and fire water tank permitted for a single owner"
        code_ref: "Ch 9, #4.1.17 / #4.1.18"
        page_ref: "p.695"
        detail: "#4.1.17 (p.695): where multiple buildings at single plot or multiple plots are owned by a single owner, the fire pump set and fire water tank shall be permitted to be common, provided the arrangement satisfies the required hydraulic calculations and the involved plots and property are managed and maintained by such single owner. #4.1.18 (p.695): developers are encouraged to consider master water tanks having a size of a minimum of 500,000 gallons, common to the entire development, from which individual buildings can tap to individual pump rooms and Civil Defence can refill their fire trucks during emergencies (audit F9A-12)."

branches:
  # Table 9.23 (p.716-717). Audit F9A-08 / F9A-09 (28.10.2026): the lines keep what the
  # rows print (no added head types, tank compartments or breeching items) and print the
  # items the rows give: dry landing valves and risers not required (iii), the developer's
  # pump room and tank for commercial developments (iv), roof installation (A.1.b).
  - id: villa_private_base
    match: {occupancy: villa_private}
    section: "Ch 9, #4.7.1 / Table 9.23.A"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (domestic/residential type)"
        required: recommended
        detail: "Table 9.23.A.1 (p.716): though it is not mandatory, it is highly recommended to consider providing automatic sprinklers throughout private villas irrespective of built-up area. 1.a: domestic type and residential type sprinkler systems, with domestic water tank, are acceptable. Table 9.23.A.1.b: fire pump and/or fire water tank shall be permitted to be installed on the roof, if the structure is capable of accommodating such additional load."

  - id: villa_private_ground_1500
    match: {occupancy: villa_private, ground_floor_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.A.2"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements)"
        detail: "Table 9.23.A.2 i (p.716): sprinklers shall be provided throughout the building including basements (open as well as closed) as per Section 3.5. Triggered because the ground floor built-up area is more than 1500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Table 9.23.A.2 ii: hose reel system throughout the basement and ground floor as per Section 3.3."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.23.A.2 iii, p.716)."
      - name: "Fire Pump Room and Fire Water Tank (commercial developments)"
        required: conditional
        detail: "Table 9.23.A.2 iv (p.716): for commercial developments, the fire pump room and fire water tank are the developer's responsibility and shall be provided at the developer's facility management service block or areas."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.A.2 v (p.716): the capacity of the fire pump set shall be 250 gpm at pressure as required to satisfy 4.5 bar at the most remote hose reel outlet valve."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Table 9.23.A.2 vi (p.716): capacity of 30 minutes of operation, complete with low water level detection and instantaneous refilling arrangement."

  - id: villa_private_basement_1500
    match: {occupancy: villa_private, basement_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.A.3"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (basements)"
        detail: "Table 9.23.A.3 i (p.716): sprinklers shall be provided throughout the basements (open as well as closed) as per Section 3.5. Triggered because the basement floor built-up area is more than 1500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Table 9.23.A.3 ii: hose reel system throughout the basement and ground floor as per Section 3.3."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.23.A.3 iii, p.716)."
      - name: "Fire Pump Room and Fire Water Tank (commercial developments)"
        required: conditional
        detail: "Table 9.23.A.3 iv (p.716): for commercial developments, the fire pump room and fire water tank are the developer's responsibility and shall be provided at the developer's facility management service block or areas."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.A.3 v (p.716): the capacity of the fire pump set shall be 250 gpm at pressure as required to satisfy 4.5 bar at the most remote hose reel outlet valve."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Table 9.23.A.3 vi (p.716): capacity of 30 minutes of operation, complete with low water level detection and instantaneous refilling arrangement."

  - id: villa_commercial_base
    match: {occupancy: villa_commercial}
    section: "Ch 9, #4.7.1 / Table 9.23.B"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (domestic/residential type)"
        required: recommended
        detail: "Table 9.23.B.1 (p.717): though it is not mandatory, it is highly recommended to consider providing automatic sprinklers throughout the villas irrespective of built-up area. 1.a: domestic type and residential type sprinkler systems shall be permitted."

  - id: villa_commercial_plot_20000
    match: {occupancy: villa_commercial, plot_area_m2_gte: 20000}
    section: "Ch 9, #4.7.1 / Table 9.23.B.2"
    page: "p.717"
    systems:
      - name: "Yard Fire Hydrant System"
        detail: "Table 9.23.B.2 i (p.717): yard fire hydrants shall be provided as per Section 3.11, for all commercial villa developments having a plot area of 20,000 m2 or more."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_1000
        detail: "Table 9.23.B.2 ii (p.717). Table 9.23.B.3 vii (p.717): where infrastructure yard hydrants are provided, the required villa sprinkler system is permitted to be fed by the yard hydrant pumpset and water."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Table 9.23.B.2 iii (p.717): capacity of 60 minutes of operation, complete with low water level detection, dedicated direct breeching inlet and instantaneous refilling arrangement."

  - id: villa_commercial_plot_missing
    match: {occupancy: villa_commercial, villa_converted_use_is: false, plot_area_m2_lte: 0}
    section: "Ch 9, #4.7.1 / Table 9.23.B.2"
    page: "p.717"
    systems:
      - name: "Plot Area 20,000 m2 or more (Table 9.23.B row 2) - NOT EVALUATED"
        spec: "Not evaluated: enter the plot area"
        detail: "Table 9.23.B row 2 (p.717) adds yard fire hydrants, a 1000 gpm fire pump set at 6.9 bar and a 60 minute tank where the plot area is 20,000 m2 or more. The plot area was not entered, so row 2 is not evaluated. A blank plot area never counts as a pass (audit F9A-03, 28.10.2026)."

  - id: villa_commercial_ground_1500
    match: {occupancy: villa_commercial, ground_floor_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.B.3"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements)"
        detail: "Table 9.23.B.3 i (p.717): sprinklers shall be provided throughout the building including basements (open as well as closed) as per Section 3.5. Triggered because the commercial villa ground floor built-up area is more than 1500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Table 9.23.B.3 ii: hose reel system throughout the basement and ground floor as per Section 3.3."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.23.B.3 iii, p.717)."
      - name: "Fire Pump Room and Fire Water Tank (commercial developments)"
        required: conditional
        detail: "Table 9.23.B.3 iv (p.717): for commercial developments, the fire pump room and fire water tank are the developer's responsibility and shall be provided at the developer's facility management service block or areas."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.B.3 v (p.717): the capacity of the fire pump set shall be 250 gpm at pressure as required to satisfy 4.5 bar at the most remote hose reel outlet valve. Table 9.23.B.3 vii (p.717): where infrastructure yard hydrants are provided, the required villa sprinkler system is permitted to be fed by the yard hydrant pumpset and water."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Table 9.23.B.3 vi (p.717): capacity of 30 minutes of operation, complete with low water level detection and instantaneous refilling arrangement."

  - id: villa_commercial_basement_1500
    match: {occupancy: villa_commercial, basement_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.B.4"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (basements)"
        detail: "Table 9.23.B.4 i (p.717): sprinklers shall be provided throughout the basements (open as well as closed) as per Section 3.5. Triggered because the basement floor built-up area is more than 1500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Table 9.23.B.4 ii: hose reel system throughout the basement and ground floor as per Section 3.3."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.23.B.4 iii, p.717)."
      - name: "Fire Pump Room and Fire Water Tank (commercial developments)"
        required: conditional
        detail: "Table 9.23.B.4 iv (p.717): for commercial developments, the fire pump room and fire water tank are the developer's responsibility and shall be provided at the developer's facility management service block or areas."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.B.4 v (p.717): the capacity of the fire pump set shall be 250 gpm at pressure as required to satisfy 4.5 bar at the most remote hose reel outlet valve."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Table 9.23.B.4 vi (p.717): capacity of 30 minutes of operation, complete with low water level detection and instantaneous refilling arrangement."

  - id: mall_covered
    match: {occupancy: mall_covered}
    section: "Ch 9, #4.6.1 / Table 9.22.A"
    page: "p.713"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Full sprinkler coverage throughout the mall including basements, podiums (open + closed) and all tenant spaces per Section 3.5."
      - name: "Wet Riser System (interconnected at highest level)"
        requires_wet_riser: true
        detail: "Table 9.22.A iii-iv (p.713): a wet riser system shall be provided throughout the building as per Section 3.4; wet risers shall be interconnected at the highest level."
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrant network around mall perimeter per Section 3.11. Not required if infrastructure hydrants are available within 120 m of every exterior part."
      - name: "Tenant Isolation Valves"
        detail: "Every tenant space fitted with an isolation valve so individual tenant areas can be isolated during maintenance without interrupting the rest of the mall."
      - name: "Breeching Inlets (min 2)"
        detail: "Minimum two breeching inlets at two separate locations along the fire access road."
      - name: "ESFR Sprinklers (supermarket / hypermarket / large clothing storage)"
        detail: "Supermarket / hypermarket / large clothing storage areas within the mall protected with ESFR sprinkler system per relevant sections."
      - name: "Fire Pump"
        duty: pump
        spec: "Combined (hydrants + internal): 2000 gpm @ 6.9 bar | Internal only: 1500 gpm @ 6.9 bar"
        detail: "Table 9.22.A x and xii (p.713): 2000 gpm where the pump set is combined and serves yard hydrants and internal building systems, 1500 gpm where it serves only internal building systems, irrespective of the number of standpipes, at 6.9 bar at the most remote landing valve."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Dedicated direct breeching inlet, low water-level detection, instantaneous utility refill."

  - id: mall_open_small
    match: {occupancy: mall_open, plot_area_m2_gt: 0, plot_area_m2_lte: 900}
    section: "Ch 9, #4.6.1 / Table 9.22.B.1 (total plot area up to 900 m2)"
    page: "p.714"
    systems:
      - name: "Hose Reel System (exterior type, open circulation)"
        detail: "Exterior-type hose reel system throughout the open circulation area along the fire access road per Section 3.3 (Table 9.22.B.1 i)."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.22.B.1 ii)."
      - name: "Tenant Buildings - evaluate separately by their own occupancy"
        detail: "Table 9.22.B covers only the open circulation area, not the tenant spaces: tenant spaces comply with the other applicable sections for their occupancy type (Table 9.22.B, p.714). Run the tool again for each tenant building. A combined fire pump set and fire water tank serving both the open circulation area and the tenant building internal systems is permitted."
      - name: "Fire Pump"
        duty: pump
        spec: "50 gpm @ 4.5 bar at most remote hose reel outlet valve"
        detail: "Table 9.22.B.1 iii."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.22.B.1 iv)."

  - id: mall_open_plot_missing
    match: {occupancy: mall_open, plot_area_m2_lte: 0}
    section: "Ch 9, #4.6.1 / Table 9.22.B"
    page: "p.714"
    systems:
      - name: "Plot Area (Table 9.22.B) - NOT EVALUATED"
        spec: "Not evaluated: enter the total plot area"
        detail: "Table 9.22.B rows (p.714) are keyed on the total plot area (up to 900 m2, more than 900 m2 up to 2000 m2, more than 2000 m2). The plot area was not entered, so the row is not evaluated. A blank plot area never counts as a pass (audit F9A-03, 28.10.2026)."

  - id: mall_open_mid
    match: {occupancy: mall_open, plot_area_m2_gt: 900, plot_area_m2_lte: 2000}
    section: "Ch 9, #4.6.1 / Table 9.22.B.2 (total plot area more than 900 m2 up to 2,000 m2)"
    page: "p.714"
    systems:
      - name: "Exterior Wet Riser (open circulation, along fire access road)"
        detail: "Exterior wet riser system throughout the open circulation area along the fire access road so that all tenant buildings are within 30 m of a hose outlet, per Section 3.4 (Table 9.22.B.2 i). OR (alternative): yard fire hydrants per Table 9.22.B.3, in which case wet risers are not required (items i-ii after OR). Yard hydrants, wet risers or hose reels are not required where infrastructure yard hydrants are available within 120 m of every exterior part of the tenant buildings; tapping from the existing yard hydrant network is permitted to extend coverage (item iii after OR)."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.22.B.2 ii)."
      - name: "Breeching Inlets (min 2)"
        detail: "Minimum of 2 breeching inlets at two separate locations along the fire access road (Table 9.22.B.2 iii)."
      - name: "Tenant Buildings - evaluate separately by their own occupancy"
        detail: "Table 9.22.B covers only the open circulation area, not the tenant spaces: tenant spaces comply with the other applicable sections for their occupancy type (Table 9.22.B, p.714). Run the tool again for each tenant building. A combined fire pump set and fire water tank serving both the open circulation area and the tenant building internal systems is permitted."
      - name: "Fire Pump"
        duty: pump
        spec: "750 gpm @ 6.9 bar at most remote landing valve"
        detail: "Table 9.22.B.2 iv (exterior wet riser option)."
      - name: "Fire Pump (where yard hydrants are provided instead)"
        required: conditional
        spec: "1000 gpm @ 6.9 bar at most remote hydrant outlet"
        detail: "Table 9.22.B.2 vi: where yard hydrants are considered."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet and instantaneous refilling (Table 9.22.B.2 v and vii)."

  - id: mall_open_large
    match: {occupancy: mall_open, plot_area_m2_gt: 2000}
    section: "Ch 9, #4.6.1 / Table 9.22.B.3 (plot area more than 2,000 m2)"
    page: "p.714"
    systems:
      - name: "Yard Fire Hydrants"
