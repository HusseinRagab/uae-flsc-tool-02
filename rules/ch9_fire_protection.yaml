        duty: pump
        spec: "50 gpm @ 4.5 bar at most remote hose reel outlet valve"
        detail: "Table 9.24.D.1 iii."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.24.D.1 iv)."

  - id: parking_covered_d2
    match: {occupancy: parking_open, has_robotic_parking_is: false, is_covered_shaded_parking_is: true, floors_above_grade_lte: 1, ground_floor_bua_m2_gt: 20000}
    suppresses: [parking_open_c1, parking_open_c2, parking_open_c3, parking_open_c4]
    section: "Ch 9, #4.8.1 / Table 9.24.D.2 (covered / shaded parking more than 20,000 m2)"
    page: "p.721"
    systems:
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrants per Section 3.11 in a loop covering the entire development; where yard hydrants are provided, the hose reel system is not required (Table 9.24.D.2 i). Yard hydrants or hose reels are not required where infrastructure yard hydrants are available within 60 m of every exterior part of the structure (item ii)."
      - name: "Fire Pump"
        duty: pump
        spec: "1000 gpm"
        detail: "Table 9.24.D.2 iii prints 1000 gpm with no pressure; size the pressure for the most remote hydrant valve per Section 3.11."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet and instantaneous refilling (Table 9.24.D.2 iv)."

various_locations:
  # #4.13.1 (p.749): "The building sprinkler system shall be extended to comply with
  # requirements of Table 9.29." Ruling R8 (12.10.2026): every sprinkler row carries
  # requires_sprinkler_system; the engine prints a #4.13.1 not_required note instead
  # when the building's table row gives no automatic sprinkler system. 9.29.K (wet
  # riser extended to the roof) is a wet riser item, not a sprinkler extension, so it
  # is not gated. 9.29.M (ceilings over 10 m, Table 9.29.A) is gated in the engine.
  # NOTE: Exterior balcony sprinklers (Table 9.29.B, p.749) not encoded - user explicitly
  # skipped to avoid UI bloat. The code requires sidewall/pendent sprinklers on exterior
  # balconies of sprinklered buildings (max 12 m2 per head, 79 °C rating). Designers
  # checking balcony coverage should consult Table 9.29.B directly.
  - id: var_atrium
    flag: has_atrium
    requires_sprinkler_system: true
    systems:
      - name: "Atrium Sprinklers (ceiling + adjacent to opening)"
        required: recommended
        code_ref: "Ch 9, #4.13.1 / Table 9.29.A"
        page_ref: "p.749"
        detail: "Atriums SHOULD be provided with sprinklers at the atrium ceiling and immediately adjacent to every atrium opening (code uses 'should', not 'shall' - Table 9.29.A is the only 'should' entry). Non-combustible draft stops 450 mm deep. See Ch 10 for atrium smoke control."
  - id: var_rain_screen
    flag: has_rain_screen_glazing
    requires_sprinkler_system: true
    systems:
      - name: "Glazing / Rain-screen Sprinkler Protection"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.C"
        page_ref: "p.749"
        detail: "Window-type pendent sprinklers on ceiling or sidewall sprinklers on walls to cover interior glazing (draft-curtain effect)."
  - id: var_stairs
    flag: has_stairs
    requires_sprinkler_system: true
    systems:
      - name: "Stair Shaft Sprinklers (top + first landing above bottom)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.D"
        page_ref: "p.749"
        detail: "Sprinkler at top of shaft and at first accessible landing above the bottom of the shaft per Section 3.5."
  - id: var_elevator_shaft
    flag: has_elevator
    requires_sprinkler_system: true
    systems:
      - name: "Elevator Pit Sidewall Spray Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.E"
        page_ref: "p.749"
        detail: "Sidewall spray sprinklers at the bottom of each elevator hoistway, not more than 600 mm above the pit floor per Section 3.5."
  - id: var_bathroom_heaters
    flag: has_bathrooms_with_heaters
    requires_sprinkler_system: true
    systems:
      - name: "Bathroom Sprinklers (where electric water-heaters are installed)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.G"
        page_ref: "p.749"
        detail: "Bathrooms equipped with electric water-heaters shall be sprinklered per Section 3.5 (Table 9.29.G - BATHROOMS). Public washrooms in commercial buildings are also sprinklered; private residential/hotel/apartment guest washrooms WITHOUT heaters are exempt. (NOTE: Table 9.29.F covers the separate 'above false ceiling' provision - that requires sprinklers in concealed combustible-construction spaces and is a different trigger - flag a designer review where both conditions apply.)"
  - id: var_laundry_storage
    flag: has_laundry_storage_rooms
    requires_sprinkler_system: true
    systems:
      - name: "Laundry / Storage Room Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.H"
        page_ref: "p.749"
        detail: "Residential / apartment / hotel-apartment laundry and storage rooms protected with sprinklers per Section 3.5."
  - id: var_pantries
    flag: has_pantries
    requires_sprinkler_system: true
    systems:
      - name: "Pantry Sprinklers (business/commercial)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.I"
        page_ref: "p.749"
        detail: "Pantries in offices and commercial buildings sprinklered per Section 3.5."
  - id: var_stages
    flag: has_permanent_stages
    requires_sprinkler_system: true
    systems:
      - name: "Stage Sprinklers (under stages, dressing rooms, storerooms, workshops)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.J"
        page_ref: "p.749"
        detail: "Permanent stages in assembly occupancies protected with sprinklers under the stage, dressing rooms, storerooms and workshops per Section 3.5."
  - id: var_roof_lpg_or_restaurant
    flag: has_roof_lpg_or_restaurant
    systems:
      - name: "Wet Riser extended to roof (with hose reel)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.K"
        page_ref: "p.750"
        detail: "Building wet riser extended to roofs with LPG tanks, restaurant seating, assembly, or sheesha bars. Hose reels provided at roof level."
  - id: var_garbage_chute
    flag: has_garbage_chute
    requires_sprinkler_system: true
    systems:
      - name: "Garbage Chute Sprinklers (top + alternating floors + lowest)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29.L"
        page_ref: "p.750"
        detail: "One sprinkler at top of shaft, one at alternating floors, one at lowest level per Section 3.5."

high_ceiling:
  trigger:
    has_high_ceiling_is: true
  code_ref: "Ch 9, #4.13.1 / Table 9.29.A"
  page_ref: "p.750-751"
  note: "Extended-coverage sprinklers, 70 C (160 F), listed for high-ceiling applications. Table values are minimum guidelines - manufacturer's listed design may override."
  matrix:
    LH:
      band_10_13_5: {height_range: "10 m to 13.5 m", k_factor: "K11.2 (K160)", min_pressure: "12 psi (0.8 bar)", min_sprinklers: 6, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_13_5_18: {height_range: "13.5 m to 18 m", k_factor: "K11.2 (K160)", min_pressure: "18 psi (1.2 bar)", min_sprinklers: 4, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_18_30: {height_range: "18 m to 30 m", k_factor: "K25.2 (K360)", min_pressure: "7 psi (0.5 bar)", min_sprinklers: 12, pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}
    OH1:
      band_10_13_5: {height_range: "10 m to 13.5 m", k_factor: "K11.2 (K160)", min_pressure: "12 psi (0.8 bar)", min_sprinklers: 6, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_13_5_18: {height_range: "13.5 m to 18 m", k_factor: "K11.2 (K160)", min_pressure: "18 psi (1.2 bar)", min_sprinklers: 4, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_18_30: {height_range: "18 m to 30 m", k_factor: "K25.2 (K360)", min_pressure: "7 psi (0.5 bar)", min_sprinklers: 12, pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}
    OH2:
      band_10_13_5: {height_range: "10 m to 13.5 m", k_factor: "K11.2 (K160)", min_pressure: "12 psi (0.8 bar)", min_sprinklers: 6, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_13_5_18: {height_range: "13.5 m to 18 m", k_factor: "K11.2 (K160)", min_pressure: "18 psi (1.2 bar)", min_sprinklers: 4, density: "0.20 gpm/ft2 (8.0 mm/min)", design_area: "2500 ft2 (230 m2)", pump_without_hydrant_gpm: 750, pump_with_hydrant_gpm: 1000}
      band_18_30: {height_range: "18 m to 30 m", k_factor: "K25.2 (K360)", min_pressure: "7 psi (0.5 bar)", min_sprinklers: 12, pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}
    HH:
      band_10_13_5: {height_range: "10 m to 13.5 m", k_factor: "K11.2 (K160)", min_pressure: "12 psi (0.8 bar)", min_sprinklers: 6, density: "0.30 gpm/ft2 (12.0 mm/min)", design_area: "3600 ft2 (340 m2)", pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}
      band_13_5_18: {height_range: "13.5 m to 18 m", k_factor: "K25.2 (K360)", min_pressure: "7 psi (0.5 bar)", min_sprinklers: 12, pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}
      band_18_30: {height_range: "18 m to 30 m", k_factor: "K25.2 (K360)", min_pressure: "7 psi (0.5 bar)", min_sprinklers: 12, pump_without_hydrant_gpm: 1000, pump_with_hydrant_gpm: 1250}

# #4.1.5 (p.694): Table 9.30 systems are installed only when the main building is fully
# protected per Tables 9.18 to 9.28. Rulings R14 / R14b (12.10.2026): every row that
# requires a system carries requires_sprinkler_system; the engine prints a #4.1.5 note
# instead when the building's table row gives no automatic sprinkler system.
# 9.30.D (battery room) requires nothing, so it is not gated.
auxiliary_rooms:
  - id: aux_A_anesthetizing
    flag: has_anesthetizing_room
    requires_sprinkler_system: true
    systems:
      - name: "Anesthetizing Room - Automatic Sprinkler (Section 3.5) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.A"
        page_ref: "p.752"
        detail: "Anesthetizing room: either wet-pipe sprinkler per Section 3.5 or double-interlocked pre-action per Section 3.7."

  - id: aux_B_battery_charger
    flag: has_battery_charger_room
    requires_sprinkler_system: true
    systems:
      - name: "Battery Charger Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.B"
        page_ref: "p.752"
        detail: "Battery charger room: clean agent (FM-200 / Novec 1230 / Inergen) per Section 3.14 is preferred to avoid water damage to DC equipment; double-interlocked pre-action is also acceptable."

  - id: aux_C_bms
    flag: has_bms_room
    requires_sprinkler_system: true
    systems:
      - name: "BMS Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.C"
        page_ref: "p.752"
        detail: "BMS room: clean agent preferred to protect controls. Rooms < 10 m2 and not critical to building monitoring are exempt."

  - id: aux_D_battery
    flag: has_battery_room
    systems:
      - name: "Battery Room - No fire protection system required"
        required: not_required
        code_ref: "Ch 9, #4.14 / Table 9.30.D"
        page_ref: "p.752"
        detail: "Table 9.30.D explicitly states 'None' for battery rooms. However ventilation and hydrogen-monitoring per NFPA 1 / IFC still apply."

  - id: aux_E_computer
    flag: has_computer_room
    requires_sprinkler_system: true
    systems:
      - name: "Computer Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.E"
        page_ref: "p.752"
        detail: "Computer room: clean agent preferred to avoid water damage. Rooms < 10 m2 and non-critical are exempt."

  - id: aux_F_control
    flag: has_control_room
    requires_sprinkler_system: true
    systems:
      - name: "Control Room / Fire Command Centre - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.F"
        page_ref: "p.752"
        detail: "Control / Fire Command Centre: clean agent preferred. Rooms < 10 m2 and separated service blocks with 3 m detachment from predominant occupancy are exempt."

  - id: aux_G_diesel_generator
    flag: has_diesel_generator_room
    requires_sprinkler_system: true
    systems:
      - name: "Diesel Generator Room - Foam Sprinkler System (Section 3.9)"
        code_ref: "Ch 9, #4.14 / Table 9.30.G"
        page_ref: "p.752"
        detail: "DIESEL GENERATOR ROOMS REQUIRE FOAM SPRINKLERS - NOT water sprinklers. Foam suppresses hydrocarbon fuel fires. Diesel generator rooms in separated service blocks with 3 m detachment from predominant occupancy are exempt."

  - id: aux_H_main_electrical
    flag: has_main_electrical_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Electrical Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.H"
        page_ref: "p.753"
        detail: "Main electrical room: clean agent per Section 3.14. Exempt when room is < 10 m2 OR on a typical floor (must be 1-hour fire-rated enclosure, limited to distribution boards + junction boxes, with full penetration firestopping). Also exempt if located in separated service block with 3 m detachment."

  - id: aux_I_ahu
    flag: has_ahu_room
    requires_sprinkler_system: true
    systems:
      - name: "AHU Room - Automatic Sprinkler System (Section 3.5)"
        code_ref: "Ch 9, #4.14 / Table 9.30.I"
        page_ref: "p.753"
        detail: "AHU room sprinklered per Section 3.5."

  - id: aux_J_lv_mv
    # Table 9.30.J is printed "LV ROOMS AND MV ROOMS" (p.753): fires on either flag.
    always_on: true
    when:
      any_of: [{has_lv_mv_room_is: true}, {has_mv_room_is: true}]
    requires_sprinkler_system: true
    systems:
      - name: "LV / MV Room - Clean Agent (Section 3.14) with motorized louvers closing on discharge"
        code_ref: "Ch 9, #4.14 / Table 9.30.J"
        page_ref: "p.753"
        detail: "LV / MV room: clean agent per Section 3.14. Where louvers are provided they must be motorized and close automatically on clean-agent discharge to maintain room tightness. Rooms < 10 m2 or typical-floor rooms exempt if 1-hr fire rated with distribution boards only."

  - id: aux_K_transformer_utility
    flag: has_transformer_room_utility
    requires_sprinkler_system: true
    systems:
      - name: "Transformer Room (utility) - No protection unless specified by utility; if required: Clean Agent OR Deluge Water Spray OR Water Mist"
        required: conditional
        code_ref: "Ch 9, #4.14 / Table 9.30.K"
        page_ref: "p.753"
        detail: "Utility-owned transformer rooms (DEWA / SEWA / ADDC / FEWA / AADC) enclosed and outside substations. Default: no protection required. If the utility operator's technical spec calls for protection, then provide either Clean Agent (Section 3.14) OR Deluge Water Spray (Section 3.8) OR Water Mist (Section 3.10). Choice of system depends on utility spec and insulation medium (oil vs dry-type)."

  - id: aux_L_transformer_private
    flag: has_transformer_room_private
    requires_sprinkler_system: true
    systems:
      - name: "Transformer Room (private) - Clean Agent (3.14) OR Deluge Water Spray (3.8) OR Water Mist (3.10) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.L"
        page_ref: "p.753"
        detail: "Privately-owned enclosed transformer rooms outside substations. Four acceptable options: (1) Clean Agent per Section 3.14, (2) Deluge Water Spray per Section 3.8 (typical for oil-filled), (3) Water Mist per Section 3.10, or (4) 2-hour fire-rated enclosure with 90-min fire doors or motorized fire-rated louvers - this last option requires exclusively dry-type equipment and no other storage in the room."

  - id: aux_M_lift_machine
    flag: has_lift_machine_room
    requires_sprinkler_system: true
    systems:
      - name: "Lift Machine Room - Automatic Sprinkler System (Section 3.5)"
        code_ref: "Ch 9, #4.14 / Table 9.30.M"
        page_ref: "p.754"
        detail: "Lift machine room sprinklered per Section 3.5. Machine-room-less (MRL) elevators without control / mechanical equipment in a dedicated room are exempt."

  - id: aux_N_main_telephone
    flag: has_main_telephone_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Telephone Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.N"
        page_ref: "p.754"
        detail: "Main telephone room: clean agent per Section 3.14. < 10 m2 or typical-floor rooms exempt if limited to distribution boards with firestopping. Separated service-block rooms with 3 m detachment also exempt."

  - id: aux_O_main_server
    flag: has_main_server_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Server Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.O"
        page_ref: "p.754"
        detail: "Main server room: clean agent per Section 3.14, typically with VESDA aspirating smoke detection. < 10 m2 or typical-floor rooms exempt if compartmented with firestopping. Server cabinets exposed within occupied sprinklered rooms exempt."

  - id: aux_P_rmu_idf_mdf
    flag: has_rmu_idf_mdf_room
    requires_sprinkler_system: true
    systems:
      - name: "RMU / IDF / MDF / CDF / MMR Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.P"
        page_ref: "p.754"
        detail: "RMU / IDF / MDF / CDF / MMR rooms protected with clean agent per Section 3.14."

  - id: aux_Q_gsm
    flag: has_gsm_room
    requires_sprinkler_system: true
    systems:
      - name: "GSM Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.Q"
        page_ref: "p.754"
        detail: "GSM / telecoms equipment room: clean agent per Section 3.14."

  - id: aux_R_operation_theater
    flag: has_operation_theater
    requires_sprinkler_system: true
    systems:
      - name: "Operation Theatre - Double-Interlocked Pre-action (Section 3.7) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.R"
        page_ref: "p.755"
        detail: "Operation theatre: double-interlocked pre-action sprinkler per Section 3.7, OR 2-hour fire-rated enclosure with 90-minute fire doors housing exclusively dry-type medical + electrical equipment with no other storage."

  - id: aux_S_mri_scanning
    flag: has_mri_scanning_room
    requires_sprinkler_system: true
    systems:
      - name: "MRI / Scanning Room - Automatic Sprinkler (3.5) OR Double-Interlocked Pre-action (3.7) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.S"
        page_ref: "p.755"
        detail: "MRI / scanning room: three options - (1) wet sprinkler per Section 3.5, (2) double-interlocked pre-action per Section 3.7, or (3) 2-hr fire-rated enclosure with 90-min fire doors housing only dry-type equipment."

  - id: aux_T_records
    flag: has_records_room
    requires_sprinkler_system: true
    systems:
      - name: "Records Room - Automatic Sprinkler (3.5) OR Double-Interlocked Pre-action (3.7) OR Clean Agent (3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.T"
        page_ref: "p.755"
        detail: "Records room: three options - wet sprinkler, double-interlocked pre-action, or clean agent. Clean agent preferred where paper records are valuable."

  - id: aux_U_ups
    flag: has_ups_room
    requires_sprinkler_system: true
    systems:
      - name: "UPS Room - Clean Agent (3.14) OR Double-Interlocked Pre-action (3.7) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.U"
        page_ref: "p.755"
        detail: "UPS room: three options - clean agent (preferred to avoid water damage to batteries), pre-action, or 2-hr fire-rated enclosure housing only dry batteries + dry electrical equipment."

  - id: aux_V_cold_freezer
    flag: has_cold_freezer_room
    requires_sprinkler_system: true
    systems:
      - name: "Cold / Freezer Room - Dry Sprinklers OR Dry Pre-action System"
        code_ref: "Ch 9, #4.14 / Table 9.30.V"
        page_ref: "p.755"
        detail: "Cold / freezer room: dry sprinklers or dry pre-action (to avoid freezing of wet pipe). Rooms < 20 m2 exempt if compartmented with firestopping. Modular cold rooms in occupied sprinklered rooms exempt."

equipment:
  - id: eq_A_kitchen_hood
    flag: has_commercial_kitchen
    systems:
      - name: "Commercial Kitchen Hood - Automatic Wet Chemical System (Section 3.12) + Grease Filters"
        code_ref: "Ch 9, #4.15 / Table 9.31.A"
        page_ref: "p.756"
        detail: "UL-300 listed wet-chemical extinguishing system over cooking surfaces, hoods and ductwork with fuel/gas shut-off interlock. Grease filters in the hood. Required for commercial kitchens with 3 or more burners."

  - id: eq_B_lpg_tanks
    flag: has_lpg_tanks
    systems:
      - name: "LPG Tanks (aboveground, roof or podium) - Fixed Water Spray System"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 5; Ch 9, #4.15 / Table 9.31.B"
        page_ref: "p.906, p.756"
        detail: "Fixed water spray system on every aboveground LPG tank, fed from the fire pump and water tank of the building the LPG tank serves, designed per Chapter 9 (Table 11.5 item 5.i). Where that building has no fire pump and water tank, a dry-type water spray ring with open nozzles connected to a Civil Defence breeching inlet (Table 11.5 item 5.ii; Table 9.31.B ii gives the same dry deluge with breeching inlet for a building that is not sprinklered). Code conflict: Table 9.31.B iii (p.756) reads 'Where LPG tanks are installed aboveground, no protection shall be required, unless the proximity of such tanks is more than 6 m from any point of structure', while Table 11.5 item 5.i (p.906) requires the fixed water spray with no exemption. Ruling R5 (12.10.2026): Chapter 11 governs, so no distance exemption is applied."

  - id: eq_C_flammable_liquid_tanks
    flag: has_flammable_liquid_tanks
    systems:
      - name: "Flammable Liquid Tanks - Automatic Foam System (Section 3.9)"
        code_ref: "Ch 9, #4.15 / Table 9.31.C; Ch 13"
        page_ref: "p.756"
        detail: "Flammable-liquid tanks: automatic foam system per Section 3.9. Foam type (AFFF / AR-AFFF / protein) selected by liquid flash point and solubility - refer Chapter 13 Flammable Liquids."

  - id: eq_D_cable_spread
    flag: has_cable_spread_areas
    systems:
      - name: "Cable Spread Areas - Automatic Water Deluge Spray (Table 3.8) OR Water Mist (Table 3.10)"
        code_ref: "Ch 9, #4.15 / Table 9.31.D"
        page_ref: "p.756"
        detail: "Cable spread / cable tray galleries: water deluge spray per Table 3.8 or water mist per Table 3.10. Water mist preferred where water damage is a concern."

  - id: eq_E_diesel_generator
    flag: has_diesel_generator_room
    systems:
      - name: "Diesel Generator - Foam Sprinkler System (Section 3.9)"
        code_ref: "Ch 9, #4.15 / Table 9.31.E"
        page_ref: "p.756"
        detail: "Diesel Generator Room - Foam sprinkler system per Section 3.9 (Table 9.31.E). Foam suppresses hydrocarbon fuel fires. Diesel generator rooms in separated service blocks with 3 m detachment from the predominant occupancy are exempt. This is the same single foam sprinkler system as Table 9.30.G (Auxiliary Rooms block): both tables require it, and one system satisfies both."

