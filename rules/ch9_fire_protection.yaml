        detail: "Fire extinguishers as per Chapter 4. Table 9.21.d covers existing G+1 villas converted to commercial outlets (#4.5.4, p.710); it replaces the generic lowrise tiers of Tables 9.21.a-c for such a villa."
      - name: "Second Exit Stair (external, from first floor)"
