        spec: "120 minutes duration with direct breeching inlet"
      - name: "Foam Solution Reserve"
        spec: "15 minutes operation"

  # ---- Group T - flammable and combustible liquids in aboveground storage tanks (p.745) ----
  # Row 1 needs BOTH a stated storage area under 230 m2 and a stated tank under 190 m3;
  # anything else (including a value not entered) takes row 2.
  - id: storage_aboveground_tanks_r1
    match: {occupancy: storage_industrial, is_aboveground_tank_storage: true, ast_storage_area_m2_gt: 0, ast_storage_area_m2_lt: 230, ast_tank_capacity_m3_gt: 0, ast_tank_capacity_m3_lt: 190}
    section: "Ch 9, #4.11 / Table 9.27 Group T row 1 (Aboveground Storage Tanks)"
    page: "p.745"
    systems:
      - name: "Hose Reel System (hose stations incorporating foam application)"
        spec: "Per Section 3.3; the hose stations shall incorporate the foam application (no dry landing valves)"
        detail: "Row 1: storage area less than 230 m2 AND capacity of the flammable / combustible liquid storage tank less than 190 m3."
      - name: "Fire Pump (Aboveground Tank Storage)"
        duty: pump
        spec: "100 gpm @ 4.5 bar at the remote hose-reel valve"
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection and instantaneous refilling arrangement."
      - name: "Foam Reserve"
        spec: "15 minutes operation"

  - id: storage_aboveground_tanks_r2
    match: {occupancy: storage_industrial, is_aboveground_tank_storage: true, not: {ast_storage_area_m2_gt: 0, ast_storage_area_m2_lt: 230, ast_tank_capacity_m3_gt: 0, ast_tank_capacity_m3_lt: 190}}
    section: "Ch 9, #4.11 / Table 9.27 Group T row 2 (Aboveground Storage Tanks)"
    page: "p.745"
    systems:
      - name: "Fixed Low Expansion Foam System (Class I / Class II liquid tanks)"
        spec: "Per Section 3.9 and Tables 9.11.A, 9.11.E and 9.11.F (as applicable)"
        detail: "Row 2: storage area more than 230 m2 OR tank capacity more than 190 m3. A storage area or tank capacity that is not entered, or that sits exactly on 230 m2 / 190 m3, is taken in row 2."
      - name: "Cooling Deluge Water Spray System (tanks exposed to more than 12.2 kW/m2)"
        required: conditional
        spec: "Per Section 3.8 and Table 9.10.D"
        detail: "Tanks or sections of tanks exposed to heat radiation greater than 12.2 kW/m2 due to fire in adjacent tanks or facility shall be provided cooling with a deluge water spray system (Table 9.27 Group T row 2 ii)."
      - name: "Yard Fire Hydrants (loop covering entire facility, with foam option)"
        spec: "Per Section 3.11; hydrants incorporate the option for foam application per Section 3.9 and Tables 9.11.C, 9.11.D, 9.11.G and 9.11.H (as applicable)"
      - name: "Hose Reel System (hose stations incorporating foam application)"
        spec: "Per Section 3.3; the hose stations shall incorporate the foam application (no dry landing valves)"
      - name: "Fire Pump and Foam Reserve (Aboveground Tank Storage)"
        spec: "Suitable for the single largest hazard, plus an additional 1000 gpm for hose stream demand"
        detail: "Listed beside any building pump, not merged with it: the duty depends on the largest tank hazard (Table 9.27 Group T row 2 vii)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "120 minutes duration with direct breeching inlet"

  # ---- Group U - open yard storage of materials other than flammable and combustible (p.746) ----
