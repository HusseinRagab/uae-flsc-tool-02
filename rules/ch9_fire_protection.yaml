      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.24.A.2 vi)."

  - id: parking_enclosed_a3
    match:
      occupancy: parking_enclosed
      has_robotic_parking_is: false
      any_of:
        - {ground_floor_bua_m2_gt: 3600}
        - {height_m_gt: 15}
    section: "Ch 9, #4.8.1 / Table 9.24.A.3 (GF BUA more than 3,600 m2 or height more than 15 m)"
    page: "p.718"
    systems:
      - name: "Automatic Sprinkler System (full coverage)"
        detail: "Sprinklers throughout the parking structure per Section 3.5 (Table 9.24.A.3 i)."
      - name: "Wet Riser System (interconnected at highest level)"
        requires_wet_riser: true
        detail: "Wet riser system throughout per Section 3.4, interconnected at the highest level (Table 9.24.A.3 iii-iv)."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: standpipe_dependent
        detail: "Table 9.24.A.3 v prints 750 gpm for 2 standpipes and 1000 gpm for more than 3 standpipes; 3 standpipes is not printed. Exactly 3 standpipes takes 1000 gpm: every other table switches above 2, so the printed more than 3 is read as a typo (ruling R3, 12.10.2026)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.24.A.3 vi)."

