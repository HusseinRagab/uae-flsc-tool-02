    match: {occupancy: storage_industrial, is_open_yard_storage: true, hazard_class_in: [LH], ground_floor_bua_m2_lt: 2000}
    section: "Ch 9, #4.11 / Table 9.27 Group U row 1 (Open Yard Storage)"
    page: "p.746"
    systems:
      - name: "Portable Fire Extinguishers (only)"
        spec: "Per Chapter 4"
        detail: "Row 1: total open storage yard less than 2000 m2 storing light hazard materials (#1.1.23, Table 9.1). The yard area is taken from the ground-floor BUA input."

  - id: storage_open_yard_r2
    match: {occupancy: storage_industrial, is_open_yard_storage: true, hazard_class_in: [LH], ground_floor_bua_m2_gte: 2000, ground_floor_bua_m2_lte: 3600}
    section: "Ch 9, #4.11 / Table 9.27 Group U row 2 (Open Yard Storage)"
    page: "p.746"
    systems:
      - name: "Hose Reel System (Open Yard)"
        spec: "Per Section 3.3; equipment and cabinet approved for outdoor application (no dry landing valves)"
        detail: "Row 2: total open storage yard more than 2000 m2 storing light hazard materials (exactly 2000 m2 is taken in row 2)."
