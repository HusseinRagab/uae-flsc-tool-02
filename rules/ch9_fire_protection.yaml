    page: "p.718"
    systems:
      - name: "Dry Riser + Hose Reel System (throughout)"
        detail: "Dry riser and hose reel system throughout per Section 3.2 and Section 3.3 (Table 9.24.A.1 i)."
      - name: "Dry Risers Interconnected at Highest Level"
        detail: "Table 9.24.A.1 ii."
      - name: "Automatic Sprinkler System"
        required: not_required
        detail: "Not required by Table 9.24.A.1."
      - name: "Fire Pump"
        duty: pump
        spec: "50 gpm @ 4.5 bar at most remote hose reel outlet valve"
        detail: "Table 9.24.A.1 iii."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.24.A.1 iv)."

  - id: parking_enclosed_a2
    match: {occupancy: parking_enclosed, has_robotic_parking_is: false, ground_floor_bua_m2_gt: 900, ground_floor_bua_m2_lte: 3600, height_m_lte: 15}
