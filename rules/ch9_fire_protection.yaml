      - name: "Yard Fire Hydrants (Open Yard)"
        spec: "Per Section 3.11 - in a loop to cover the entire facility"
        detail: "Row 4: total open storage yard more than 3600 m2 storing any materials other than flammable and combustible materials."
      - name: "Trolley Type Foam Extinguishers"
        spec: "For the outdoor emergencies"
      - name: "Hose Reel System or Landing Valves"
        required: not_required
        detail: "Table 9.27 Group U row 4 iv: hose reel system or landing valves shall not be required. Equipment and cabinet approved for outdoor application."
      - name: "Fire Pump (Open Yard)"
        duty: pump
        spec: "500 gpm @ 6.9 bar at most remote hydrant valve"
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration with direct breeching inlet"

  # ============================================================================
  # Section 4.12 / Table 9.28 - TUNNEL FIRE PROTECTION SYSTEMS
  # Two occupancy types (cable vs road/rail) crossed with length tiers.
  # Triggered by has_tunnel + tunnel_kind + tunnel_length_m.
  # Tunnel pumps and tanks carry no `duty:` tag: they serve the tunnel's own
  # deluge / riser systems, so they are listed beside the building's pump
  # instead of being merged into one governing line.
  # ============================================================================
  - id: tunnel_cable_short
    match: {has_tunnel: true, tunnel_kind: cable, tunnel_length_m_gt: 0, tunnel_length_m_lt: 60}
    section: "Ch 9, #4.12 / Table 9.28 Group A (Cable Tunnel < 60 m)"
    page: "p.747"
    systems:
      - name: "Automatic Deluge Water Spray OR Water Mist System"
        spec: "Per Section 3.8 (deluge) OR Section 3.10 (water mist)"
        detail: "Choice of deluge water spray or water mist; both acceptable."
      - name: "Dry Riser at Tunnel Entry Points"
        spec: "Per Section 3.2"
        detail: "Dry riser provided at tunnel entry points only (not throughout)."
      - name: "Hose Reel System at Entry Points"
        spec: "Per Section 3.3"
      - name: "Fire Pump (Cable Tunnel < 60 m)"
        spec: "Sized to satisfy minimum 2 adjacent deluge water spray system zones at 4.5 bar at most remote hose-reel outlet valve. Where water mist provided, pump per manufacturer's specification + Civil Defence approved design."
      - name: "Fire Water Tank"
        spec: "60 minutes operation with low water-level detection and instantaneous refilling"

  - id: tunnel_cable_long
    match: {has_tunnel: true, tunnel_kind: cable, tunnel_length_m_gte: 60}
    section: "Ch 9, #4.12 / Table 9.28 Group A (Cable Tunnel >= 60 m)"
    page: "p.747"
    systems:
      - name: "Automatic Deluge Water Spray OR Water Mist System"
        spec: "Per Section 3.8 OR Section 3.10"
      - name: "Wet Riser System (throughout)"
        spec: "Per Section 3.4"
        detail: "Table 9.28 A.2 (p.747): for cable tunnels more than 60 m long, a wet riser throughout the tunnel (not a dry riser at the entry points). The table prints less than 60 m (row 1) and more than 60 m (row 2); a tunnel of 60 m exactly is printed in neither and is taken in row 2, the higher row."
      - name: "Fire Pump (Cable Tunnel >= 60 m)"
        spec: "Sized to satisfy minimum 2 adjacent deluge water spray system zones at 6.9 bar at most remote landing valve. Water mist pump per manufacturer."
      - name: "Fire Water Tank"
        spec: "60 minutes operation with dedicated direct breeching inlet, low water-level detection, instantaneous refilling"

  - id: tunnel_road_rail_medium
    match: {has_tunnel: true, tunnel_kind: road_rail, tunnel_length_m_gte: 90, tunnel_length_m_lte: 1000}
    section: "Ch 9, #4.12 / Table 9.28 Group B (Road/Rail Tunnel 90-1000 m)"
    page: "p.747"
    systems:
      - name: "Wet Riser System (throughout)"
        spec: "Per Section 3.4"
      - name: "Fire Pump (Road/Rail Tunnel 90-1000 m)"
        spec: "750 gpm @ 6.9 bar at most remote landing valve"
      - name: "Fire Water Tank"
        spec: "60 minutes operation with dedicated direct breeching inlet"

  - id: tunnel_road_rail_long
    match: {has_tunnel: true, tunnel_kind: road_rail, tunnel_length_m_gt: 1000}
    section: "Ch 9, #4.12 / Table 9.28 Group B (Road/Rail Tunnel > 1000 m)"
    page: "p.748"
    systems:
      - name: "Automatic Deluge Water Spray OR Water Mist System"
        spec: "Per Section 3.8 OR Section 3.10"
      - name: "Class III Wet Riser System (throughout)"
        spec: "Per Section 3.4 - Class III: 65 mm landing valve AND 25 mm hose reel OR 40 mm hose rack (Table 9.6 item 1.i, p.582)"
        detail: "Breeching inlets shall be provided at BOTH tunnel openings."
      - name: "Fire Pump (Road/Rail Tunnel > 1000 m)"
        spec: "Sized to satisfy minimum 2 adjacent deluge water spray system zones at 6.9 bar at most remote landing valve. Water mist pump per manufacturer (1 hour duration)."
      - name: "Fire Water Tank"
        spec: "60 minutes operation with low water-level detection and instantaneous refilling"

  - id: tunnel_road_rail_short_none
    match: {has_tunnel: true, tunnel_kind: road_rail, tunnel_length_m_gt: 0, tunnel_length_m_lt: 90}
    section: "Ch 9, #4.12 / Table 9.28 Group B (Road/Rail Tunnel < 90 m)"
    page: "p.747"
    systems:
      - name: "No Tunnel Fire Protection System Required"
        required: not_required
        detail: "Table 9.28 B.1 (p.747): if the length of the tunnel is less than 90 m, 'None'. Auxiliary rooms in the tunnel, if any, are protected per Table 9.30 (#4.12.1)."

  - id: tunnel_length_missing
    # Table 9.28 rows A and B are decided by the tunnel length (p.747). A blank
    # (0 m) length is a missing input, never the shortest row.
    match: {has_tunnel: true, tunnel_length_m_lte: 0}
    section: "Ch 9, #4.12 / Table 9.28"
    page: "p.747"
    systems:
      - name: "Tunnel Length (Table 9.28) - NOT EVALUATED"
        spec: "Not evaluated: enter the tunnel length"
        detail: "Table 9.28 rows depend on the tunnel length (cable tunnels: less than 60 m / more than 60 m; road/rail tunnels: less than 90 m / 90 m-1000 m / more than 1000 m). Enter the tunnel length to get the tunnel fire protection systems."

  - id: storage_plant_nursery
    match: {occupancy: storage_industrial, is_plant_nursery: true}
    section: "Ch 9, #4.11 / Table 9.27 Group V (Plant Nursery)"
    page: "p.746"
    systems:
      - name: "Portable Fire Extinguishers (Table 9.27 Group V)"
        spec: "Per Chapter 4"
        detail: "Table 9.27 Group V, Nurseries (plants and vegetation): i. fire extinguishers as per Chapter 4. The row prints no other system and no fire pump or tank capacity. Wording per owner ruling 13.10.2026. The hazard-class rows (Groups A-J) are evaluated beside it (owner ruling R-G, 28.10.2026)."
      - name: "Automatic Sprinkler System"
        required: not_required
      - name: "Hose Reel System"
        required: not_required
      - name: "Fire Pump"
        required: not_required

  # ---------------- PARKING (Ch 9, #4.8.1 / Table 9.24, p.718-721) ----------
  # A = enclosed (4 rows), B = mechanical / robotic (2 rows, replaces A and C),
  # C = open (4 rows), D = covered / shaded one-level (2 rows, replaces C).
  # The plot > 20,000 m2 rows add hydrants and the 1000 gpm / 60 min duty on
  # top of the area/height row. Smoke control is Ch 10, not Table 9.24.
  - id: parking_enclosed_gf_missing
    match: {occupancy: parking_enclosed, has_robotic_parking_is: false, ground_floor_bua_m2_lte: 0, height_m_lte: 15}
    section: "Ch 9, #4.8.1 / Table 9.24.A"
    page: "p.718"
    systems:
      - name: "Built-up Ground Floor Area (Table 9.24) - NOT EVALUATED"
        spec: "Not evaluated: enter the built-up ground floor area"
        detail: "Table 9.24.A rows 1-3 (p.718) are keyed on the built-up ground floor area (up to 900 m2, 901 m2 to 3600 m2, more than 3600 m2) for an enclosed parking up to 15 m. The area was not entered, so the row is not evaluated. A blank area never counts as a pass (audit F9A-03, 28.10.2026): the lowest row is not taken for a building whose ground floor area was not entered."

  - id: parking_open_gf_missing
    match: {occupancy: parking_open, has_robotic_parking_is: false, ground_floor_bua_m2_lte: 0, height_m_lt: 23}
    section: "Ch 9, #4.8.1 / Table 9.24.C / 9.24.D"
    page: "p.720-721"
    systems:
      - name: "Built-up Ground Floor Area (Table 9.24) - NOT EVALUATED"
        spec: "Not evaluated: enter the built-up ground floor area"
        detail: "Table 9.24.C rows 1-3 (p.720) are keyed on the built-up ground floor area (up to 2000 m2, more than 2000 m2) below 23 m, and Table 9.24.D (p.721) on the covered / shaded parking area (3600 m2 to less than 20,000 m2, more than 20,000 m2). The area was not entered, so the row is not evaluated. A blank area never counts as a pass (audit F9A-03, 28.10.2026): the lowest row is not taken for a building whose ground floor area was not entered."

  - id: parking_plot_missing
    match: {occupancy_in: [parking_enclosed, parking_open], plot_area_m2_lte: 0}
    section: "Ch 9, #4.8.1 / Table 9.24"
    page: "p.718-721"
    systems:
      - name: "Plot Area more than 20,000 m2 (Table 9.24 rows A.4 / B.2 / C.4) - NOT EVALUATED"
        spec: "Not evaluated: enter the plot area"
        detail: "Table 9.24 rows A.4 (p.719), B.2 and C.4 (p.720) add yard fire hydrants and the 1000 gpm / 60 minute duty where the plot area is more than 20,000 m2 (plot area per #4.1.10, p.695). The plot area was not entered, so those rows are not evaluated. A blank plot area never counts as a pass (audit F9A-03, 28.10.2026)."

