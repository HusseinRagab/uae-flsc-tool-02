  # ---------------- LOWRISE SINGLE-EXIT (Ch 9, #4.5.3 / Table 9.21.c) ----
  # Residential / Business / Mercantile / Hotel lowrise (<=15 m) with single exit stair.
  # 2 tiers: <=500 m2 = hose-reel only (50 gpm @ 4.5 bar / 30 min); >500 m2 = sprinklers + hose reel (300 gpm @ 4.5 bar / 30 min).
