# #4.1.5 (p.694): Table 9.30 systems are installed only when the main building is fully
# protected per Tables 9.18 to 9.28. Rulings R14 / R14b (12.10.2026): every row that
# requires a system carries requires_sprinkler_system; the engine prints a #4.1.5 note
# instead when the building's table row gives no automatic sprinkler system.
# 9.30.D (battery room) requires nothing, so it is not gated.
auxiliary_rooms:
  - id: aux_msds_and_unoccupied_note
    # #4.14.1 (p.752) and #4.1.16 (p.695): one note whenever any Table 9.30 room is ticked.
    always_on: true
    when:
      any_of:
        - {has_anesthetizing_room_is: true}
        - {has_battery_charger_room_is: true}
        - {has_bms_room_is: true}
        - {has_computer_room_is: true}
        - {has_control_room_is: true}
        - {has_diesel_generator_room_is: true}
        - {has_main_electrical_room_is: true}
        - {has_ahu_room_is: true}
        - {has_lv_mv_room_is: true}
        - {has_mv_room_is: true}
        - {has_transformer_room_utility_is: true}
        - {has_transformer_room_private_is: true}
        - {has_lift_machine_room_is: true}
        - {has_main_telephone_room_is: true}
        - {has_main_server_room_is: true}
        - {has_rmu_idf_mdf_room_is: true}
        - {has_gsm_room_is: true}
        - {has_operation_theater_is: true}
        - {has_mri_scanning_room_is: true}
        - {has_records_room_is: true}
        - {has_ups_room_is: true}
        - {has_cold_freezer_room_is: true}
    requires_sprinkler_system: true
    silent_when_unsprinklered: true
    systems:
      - name: "Auxiliary Room System Selection - MSDS Review and Occupied-Area Rule"
        code_ref: "Ch 9, #4.14.1; #4.1.16"
        page_ref: "p.752, p.695"
        detail: "#4.14.1: where rooms and equipment are provided with fire protection systems per Table 9.30, the designers shall first consider and consult the relevant Material Safety Data Sheet (MSDS) before designing and proposing such systems. #4.1.16: for clean agent, aerosol, CO2 and other suppression systems, LV rooms, transformer rooms, telephone rooms, generator rooms and other such equipment / machinery rooms located in occupied buildings or attached to them are not considered unoccupied areas."

  - id: aux_A_anesthetizing
    flag: has_anesthetizing_room
    requires_sprinkler_system: true
    systems:
      - name: "Anesthetizing Room - Automatic Sprinkler (Section 3.5) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.A"
        page_ref: "p.752"
        detail: "Anesthetizing room: either wet-pipe sprinkler per Section 3.5 or double-interlocked pre-action per Section 3.7."

  - id: aux_B_battery_charger
    flag: has_battery_charger_room
    requires_sprinkler_system: true
    systems:
      - name: "Battery Charger Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.B"
        page_ref: "p.752"
        detail: "Table 9.30.B: clean agent system per Section 3.14 OR a double interlocked pre-action sprinkler system per Section 3.7."

  - id: aux_C_bms
    flag: has_bms_room
    requires_sprinkler_system: true
    systems:
      - name: "BMS Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.C"
        page_ref: "p.752"
        detail: "Table 9.30.C: clean agent system per Section 3.14 OR a double interlocked pre-action sprinkler system per Section 3.7. Exemption (iii): BMS rooms which are less than 10 m2 in area AND are not with critical building monitoring and management systems shall not be required to be protected."

  - id: aux_D_battery
    flag: has_battery_room
    systems:
      - name: "Battery Room - No fire protection system required"
        required: not_required
        code_ref: "Ch 9, #4.14 / Table 9.30.D"
        page_ref: "p.752"
        detail: "Table 9.30.D: None."

  - id: aux_E_computer
    flag: has_computer_room
    requires_sprinkler_system: true
    systems:
      - name: "Computer Room - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.E"
        page_ref: "p.752"
        detail: "Table 9.30.E: clean agent system per Section 3.14 OR a double interlocked pre-action sprinkler system per Section 3.7. Exemption (iii): computer rooms which are less than 10 m2 in area AND are not with critical life or building monitoring and management systems shall not be required to be protected."

  - id: aux_F_control
    flag: has_control_room
    requires_sprinkler_system: true
    systems:
      - name: "Control Room / Fire Command Centre - Clean Agent (Section 3.14) OR Double-Interlocked Pre-action (Section 3.7)"
        code_ref: "Ch 9, #4.14 / Table 9.30.F"
        page_ref: "p.752"
        detail: "Table 9.30.F: clean agent system per Section 3.14 OR a double interlocked pre-action sprinkler system per Section 3.7. Exemptions: (iii) rooms which are less than 10 m2 in area AND are not with critical life or building monitoring and control systems; (iv) rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected. Tool reading (not printed in Table 9.30.F): a fire command centre houses critical life safety control systems, so exemption (iii) is not applied to it."

  - id: aux_G_diesel_generator
    flag: has_diesel_generator_room
    requires_sprinkler_system: true
    # Owner ruling R-E (28.10.2026): Table 9.31.E governs this room regardless of
    # sprinklers, so no #4.1.5 not-required note is printed for Table 9.30.G (the
    # Table 9.31.E line cites both tables).
    silent_when_unsprinklered: true
    systems:
      - name: "Diesel Generator Room - Foam Sprinkler System (Section 3.9)"
        code_ref: "Ch 9, #4.14 / Table 9.30.G / Table 9.31.E"
        page_ref: "p.752, p.756"
        detail: "Table 9.30.G and Table 9.31.E (same text): foam sprinkler system shall be provided per Section 3.9. Exemption (ii): diesel generator rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected. One system meets both tables."

  - id: aux_H_main_electrical
    flag: has_main_electrical_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Electrical Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.H"
        page_ref: "p.753"
        detail: "Table 9.30.H: clean agent system per Section 3.14. Exemptions: (ii) electrical rooms which are less than 10 m2 in area OR are located on typical floors; such typical floor electrical rooms shall be 1 hour fire rated enclosures limited to distribution boards and junction boxes, with fully compliant penetration fire stopping; (iii) electrical rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_I_ahu
    flag: has_ahu_room
    requires_sprinkler_system: true
    systems:
      - name: "AHU Room - Automatic Sprinkler System (Section 3.5)"
        code_ref: "Ch 9, #4.14 / Table 9.30.I"
        page_ref: "p.753"
        detail: "AHU room sprinklered per Section 3.5."

  - id: aux_J_lv_mv
    # Table 9.30.J is printed "LV ROOMS AND MV ROOMS" (p.753): fires on either flag.
    always_on: true
    when:
      any_of: [{has_lv_mv_room_is: true}, {has_mv_room_is: true}]
    requires_sprinkler_system: true
    systems:
      - name: "LV / MV Room - Clean Agent (Section 3.14) with motorized louvers closing on discharge"
        code_ref: "Ch 9, #4.14 / Table 9.30.J"
        page_ref: "p.753"
        detail: "Table 9.30.J: clean agent system per Section 3.14; where louvers are provided for LV rooms protected with clean agent, louvers shall be motorized and closed upon clean agent discharge to maintain room tightness. Exemptions: (ii) rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected; (iii) rooms which are less than 10 m2 in area OR are located on typical floors; such typical floor or podium floor rooms shall be 1 hour fire rated enclosures limited to distribution boards and junction boxes, with fully compliant penetration fire stopping."

  - id: aux_K_transformer_utility
    flag: has_transformer_room_utility
    requires_sprinkler_system: true
    systems:
      - name: "Transformer Room (utility) - No protection unless specified by utility; if required: Clean Agent OR Deluge Water Spray OR Water Mist"
        required: conditional
        code_ref: "Ch 9, #4.14 / Table 9.30.K"
        page_ref: "p.753"
        detail: "Table 9.30.K (p.753), transformer rooms owned by power utility companies, enclosed and situated in locations other than substations: i. none, unless the power utility company specifies; ii. where specified and required, a clean agent system per Section 3.14 OR iii. a deluge water spray system per Section 3.8 OR iv. a water mist system per Section 3.10."

  - id: aux_L_transformer_private
    flag: has_transformer_room_private
    requires_sprinkler_system: true
    systems:
      - name: "Transformer Room (private) - Clean Agent (3.14) OR Deluge Water Spray (3.8) OR Water Mist (3.10) OR 2-hr Fire-Rated Enclosure"
        code_ref: "Ch 9, #4.14 / Table 9.30.L"
        page_ref: "p.753"
        detail: "Privately-owned enclosed transformer rooms outside substations. Four options: (i) clean agent per Section 3.14, (ii) deluge water spray per Section 3.8, (iii) water mist per Section 3.10, or (iv) 2 hour fire rated enclosure with 90 minutes fire doors or 90 minutes fire rated motorized louvers, housing exclusively dry type electrical equipment and no other storage. Exemption (v): private enclosed transformer rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_M_lift_machine
    flag: has_lift_machine_room
    requires_sprinkler_system: true
    systems:
      - name: "Lift Machine Room - Automatic Sprinkler System (Section 3.5)"
        code_ref: "Ch 9, #4.14 / Table 9.30.M"
        page_ref: "p.754"
        detail: "Lift machine room sprinklered per Section 3.5. Machine-room-less (MRL) elevators without control / mechanical equipment in a dedicated room are exempt."

  - id: aux_N_main_telephone
    flag: has_main_telephone_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Telephone Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.N"
        page_ref: "p.754"
        detail: "Table 9.30.N: clean agent system per Section 3.14. Exemptions: (ii) telephone rooms which are less than 10 m2 in area OR are located on typical floors; such typical floor telephone rooms shall be limited to distribution boards and junction boxes with fully compliant penetration fire stopping; (iii) telephone rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_O_main_server
    flag: has_main_server_room
    requires_sprinkler_system: true
    systems:
      - name: "Main Server Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.O"
        page_ref: "p.754"
        detail: "Table 9.30.O: clean agent system per Section 3.14. Exemptions: (ii) server rooms which are less than 10 m2 in area OR are located on typical floors; such typical floor server rooms shall be compartmented with fully compliant penetration fire stopping systems; (iii) server cabinets exposed to occupied rooms, provided the room has an automatic sprinkler system; (iv) server rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_P_rmu_idf_mdf
