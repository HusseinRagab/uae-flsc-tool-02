      - name: "Yard Fire Hydrants"
        detail: "Yard hydrants per Section 3.11 in a loop covering the entire development (Table 9.24.A.4 i). Not required where infrastructure yard hydrants are available within 60 m of every exterior part of the structure; tapping from the existing yard hydrant network is permitted to extend coverage (item ii). Sprinklers, wet risers and hose reels follow Table 9.24.A.1, 2 or 3 as applicable (item iii)."
      - name: "Fire Pump"
        duty: pump
        spec: "1000 gpm @ 6.9 bar at most remote hydrant valve and hose outlet (combined yard + internal, or yard hydrants only)"
        detail: "Table 9.24.A.4 iii (combined pump set) and iv (pump set serving only the yard hydrants)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection and instantaneous refilling (combined tank, dedicated direct breeching inlet; Table 9.24.A.4 v)."

