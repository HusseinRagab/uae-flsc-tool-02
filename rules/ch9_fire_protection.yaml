      ground_floor_bua_m2_gt: 0
      ground_floor_bua_m2_lte: 500
      has_single_exit_stair_is: true
    suppresses: [lowrise_public_upto_500, lowrise_residential_upto_3600]
    section: "Ch 9, #4.5.3 / Table 9.21.c.1"
    page: "p.709"
    systems:
      - name: "Hose Reel System (throughout)"
        detail: "Hose reels throughout per Section 3.3. Lowrise single-exit-stair building with GF BUA <= 500 m2 requires hose reel only - no sprinklers, no wet risers."
      - name: "Dry Landing Valves"
        required: not_required
        detail: "Not required at this size."
      - name: "Fire Pump (Lowrise Single-Exit <=500 m2)"
        duty: pump
        spec: "50 gpm @ 4.5 bar at most remote hose-reel outlet"
        detail: "Small pump set sized for hose-reel duty only. Fire pump and/or fire water tank permitted on roof if existing structure can bear the additional load."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low-level detection, dedicated direct breeching inlet, instantaneous utility refill."

  - id: lowrise_single_exit_over_500
    match:
      height_m_lte: 15
      occupancy_in: [residential, business, mercantile_a, mercantile_b, hotel_a, hotel_b, hotel_c]
      ground_floor_bua_m2_gt: 500
      has_single_exit_stair_is: true
    # Audit F9A-04 / Cursor PR #18 residual (28.10.2026): Table 9.21.c.2 (p.709) is 'MORE
