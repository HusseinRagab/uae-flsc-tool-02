  # ============================================================================
  # ============================================================================
  # Section 4.11 / Table 9.27 - STORAGE / WAREHOUSE / INDUSTRIAL (p.724-746)
  # Tier areas follow the #4.1 definitions (p.695), as Building properties:
  #   storage_unit_area_m2               #4.1.14 unit compartment area (stated, else
  #                                      the whole ground floor as one unit)
  #   storage_gf_bua_sum_m2              #4.1.13 sum of built-up ground floor areas of
  #                                      the buildings on the plot (never less than
  #                                      this building's ground-floor BUA)
  #   storage_total_bua_m2               #4.1.11 built-up area of all floors
  #   storage_compartment_floor_area_m2  'total built-up floor area of the compartment'
  # Rows are made mutually exclusive, highest row first. Where a value falls on a
  # printed edge or in a gap between two printed rows (e.g. exactly 900 m2 in Group A),
  # the higher row is used and the detail says so.
  # Base groups A-J apply only when no specialty group (K, P-V) and no commodity
  # (L-O) is selected. #4.11.1 (p.724): designers shall first consult the MSDS.
  # ============================================================================

