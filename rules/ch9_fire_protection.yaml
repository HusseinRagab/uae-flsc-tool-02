# UAE FLSC 2018 - Chapter 9: Fire Protection Systems
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 9
  chapter_title: "Fire Protection Systems"

general:
  - id: g_yard_hydrant_nonstorage_plot
    when:
      building_category_not: [storage_industrial]
      plot_area_m2_gt: 20000
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.4"
        page_ref: "p.694"
        detail: "Yard hydrant loop around plot per Section 3.11. Required because non-storage/non-industrial plot > 20,000 m2 (typically cluster of buildings). Hydrants spaced per code; breeching inlets accessible to Civil Defence."
  - id: g_yard_hydrant_storage_plot
    when:
      building_category_is: storage_industrial
      ground_floor_bua_m2_gt: 3600
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant loop per Section 3.11. Required because the storage/industrial built-up area is more than 3,600 m2 (#4.1.6, p.694). Built-up area is the total floor area of all floors including mezzanines (#4.1.11, p.695); this rule fires on the ground-floor area alone and the companion rule below fires on the total over all floors. Keyed off built-up area, not plot area."
  - id: g_yard_hydrant_storage_total_bua
    # Companion to g_yard_hydrant_storage_plot: code #4.1.6 keys off TOTAL
    # built-up area (all floors), so a multi-storey warehouse on a small
    # footprint (e.g. 2,000 m2 ground x 3 floors = 6,000 m2 total) must also
    # trigger even though its ground-floor BUA is below 3,600 m2. Emits the
    # same item, so the engine de-duplicates when both conditions are true.
    when:
      building_category_is: storage_industrial
      gross_floor_area_m2_gt: 3600
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant loop per Section 3.11. Required because total storage/industrial built-up area across all floors > 3,600 m2 (#4.1.6, p.694). This companion trigger catches multi-storey storage buildings whose ground-floor footprint alone is below 3,600 m2."
  - id: g_yard_hydrant_storage_remote
    when:
      building_category_is: storage_industrial
      gf_beyond_100m_from_hydrant_is: true
    systems:
      - name: "Yard Fire Hydrant System"
        code_ref: "Ch 9, #4.1.6"
        page_ref: "p.694"
        detail: "Yard hydrant system per Section 3.11. Required because the storage/industrial built-up ground floor area is more than 100 m away from an existing, functional and available hydrant (#4.1.6, p.694)."
  - id: g_second_pump_set_90m
    # Table 9.6 item 13.iv (p.584): measured from the fire pump, not from
    # grade. Super highrise rows already carry their upper-level pump sets.
    # Ruling R6 (12.10.2026): malls of 23 m or more keep their Table 9.22 flows
    # and take the Table 9.6 item 13 zoning and second pump set by height; the
    # super highrise rows exclude malls, so a mall above 90 m is covered here.
    when:
      pump_head_height_m_gte: 90
      any_of:
        - {height_m_gte: 23, height_m_lte: 90}
        - {building_category_is: mall, height_m_gte: 23}
    systems:
      - name: "Second Fire Pump Set + Dedicated Water Tank"
        code_ref: "Ch 9, Table 9.6 item 13.iv"
        page_ref: "p.584"
        detail: "The most remote landing valve is 90 m or more above the lowest fire pump set (building height plus depth to the pump room). Table 9.6 item 13.iv: where the most remote landing valve is located at a height of 90 m from the fire pump location, a second set of fire pumps and dedicated water tanks shall be provided."
  - id: g_mall_riser_zoning_45m
    # Ruling R6 (12.10.2026): Table 9.22 has no zoning items; tall buildings of
    # any occupancy take Table 9.6 item 13 (#4.2.1 / #4.3.1).
    when:
      building_category_is: mall
      height_m_gte: 23
      pump_head_height_m_gte: 45
    systems:
      - name: "Wet Riser Zoning - High Zone and Low Zone, looped"
        code_ref: "Ch 9, Table 9.6 item 13.iii"
        page_ref: "p.584"
        detail: "The most remote landing valve is 45 m or more above the fire pump (building height plus depth to the pump room). Table 9.6 item 13.iii: when the most remote landing valve is located at a height of 45 m from the fire pump location, the risers shall be zoned into High Zone and Low Zone with looping (Figure 9.8.B). Item 13.i: maximum pressure anywhere in the wet riser system 24 bar with the pump set to cut off at 140% of rated pressure. Mall flows stay per Table 9.22 (ruling R6, 12.10.2026)."
  - id: g_storage_sprinkler_over_3floors
    when:
      building_category_is: storage_industrial
      floors_above_grade_gt: 3
    systems:
      - name: "Automatic Sprinkler System (full coverage)"
        code_ref: "Ch 9, #4.1.7"
        page_ref: "p.694"
        detail: "Full sprinkler coverage throughout the storage/industrial building - trigger is > 3 floors above fire access level, irrespective of BUA. Design density per commodity class per NFPA 13."

branches:
  - id: villa_private_base
    match: {occupancy: villa_private}
    section: "Ch 9, #4.7.1 / Table 9.23.A"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (domestic/residential type)"
        required: recommended
        detail: "Domestic-type sprinklers with domestic water tank are acceptable. Not mandatory but highly recommended throughout private villas irrespective of BUA."

  - id: villa_private_ground_1500
    match: {occupancy: villa_private, ground_floor_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.A.2"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Full sprinkler coverage throughout villa including open and closed basements, podiums and all habitable spaces per Section 3.5. Triggered because ground-floor BUA > 1,500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Hose reels throughout basement and ground floor per Section 3.3. 30 m coverage radius; 4.5 bar residual pressure at outlet."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Electric-driven fire pump set with jockey pump and controller. UL/FM listed."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Dedicated fire-water tank with low-level detection and instantaneous refill from utility supply. Two-compartment sectional tank preferred for maintenance continuity."

  - id: villa_private_basement_1500
    match: {occupancy: villa_private, basement_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.A.3"
    page: "p.716"
    systems:
      - name: "Automatic Sprinkler System (basements)"
        detail: "Sprinkler coverage throughout basements (open and closed) per Section 3.5. Triggered because basement BUA > 1,500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Hose reels throughout basement and ground floor per Section 3.3."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Electric-driven pump set UL/FM listed."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low water-level detection + instantaneous utility refill."

  - id: villa_commercial_base
    match: {occupancy: villa_commercial}
    section: "Ch 9, #4.7.1 / Table 9.23.B"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (domestic/residential type)"
        required: recommended
        detail: "Domestic or residential-type sprinklers are acceptable. Not mandatory but highly recommended throughout commercial villas irrespective of BUA."

  - id: villa_commercial_plot_20000
    match: {occupancy: villa_commercial, plot_area_m2_gte: 20000}
    section: "Ch 9, #4.7.1 / Table 9.23.B.2"
    page: "p.717"
    systems:
      - name: "Yard Fire Hydrant System"
        detail: "Yard hydrant loop per Section 3.11 around the commercial-villa development (plot >= 20,000 m2). Multiple breeching inlets along fire access road."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_1000
        detail: "Electric or diesel driven UL/FM listed pump set for yard hydrant network. Table 9.23.B.3 vii (p.717): where infrastructure yard hydrants are provided, the required villa sprinkler system is permitted to be fed by the yard hydrant pumpset and water."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Dedicated direct breeching inlet, low water-level detection, instantaneous utility refill."

  - id: villa_commercial_ground_1500
    match: {occupancy: villa_commercial, ground_floor_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.B.3"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements)"
        detail: "Full sprinkler coverage per Section 3.5. Triggered because commercial-villa ground-floor BUA > 1,500 m2."
      - name: "Hose Reel System (basement + ground floor)"
        detail: "Per Section 3.3 throughout basement and ground floor."
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.B.3 v. Table 9.23.B.3 vii (p.717): where infrastructure yard hydrants are provided, the required villa sprinkler system is permitted to be fed by the yard hydrant pumpset and water."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"

  - id: villa_commercial_basement_1500
    match: {occupancy: villa_commercial, basement_bua_m2_gt: 1500}
    section: "Ch 9, #4.7.1 / Table 9.23.B.4"
    page: "p.717"
    systems:
      - name: "Automatic Sprinkler System (basements)"
        detail: "Sprinklers throughout basements (open + closed) per Section 3.5. Triggered because basement BUA > 1,500 m2."
      - name: "Hose Reel System (basement + ground floor)"
      - name: "Fire Pump"
        duty: pump
        pump_spec_type: fixed_250
        detail: "Table 9.23.B.4 v."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"

  - id: mall_covered
    match: {occupancy: mall_covered}
    section: "Ch 9, #4.6.1 / Table 9.22.A"
    page: "p.713"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Full sprinkler coverage throughout the mall including basements, podiums (open + closed) and all tenant spaces per Section 3.5."
      - name: "Wet Riser System (interconnected at highest level)"
        requires_wet_riser: true
        detail: "Wet risers throughout the mall with Class III landing valves per Section 3.4; all risers interconnected at the highest level."
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrant network around mall perimeter per Section 3.11. Not required if infrastructure hydrants are available within 120 m of every exterior part."
      - name: "Tenant Isolation Valves"
        detail: "Every tenant space fitted with an isolation valve so individual tenant areas can be isolated during maintenance without interrupting the rest of the mall."
      - name: "Breeching Inlets (min 2)"
        detail: "Minimum two breeching inlets at two separate locations along the fire access road."
      - name: "ESFR Sprinklers (supermarket / hypermarket / large clothing storage)"
        detail: "Supermarket / hypermarket / large clothing storage areas within the mall protected with ESFR sprinkler system per relevant sections."
      - name: "Fire Pump"
        duty: pump
        spec: "Combined (hydrants + internal): 2000 gpm @ 6.9 bar | Internal only: 1500 gpm @ 6.9 bar"
        detail: "Electric or diesel driven UL/FM listed pump set. Fixed mall requirement - not dependent on standpipe count."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Dedicated direct breeching inlet, low water-level detection, instantaneous utility refill."

  - id: mall_open_small
    match: {occupancy: mall_open, plot_area_m2_lte: 900}
    section: "Ch 9, #4.6.1 / Table 9.22.B.1 (total plot area up to 900 m2)"
    page: "p.714"
    systems:
      - name: "Hose Reel System (exterior type, open circulation)"
        detail: "Exterior-type hose reel system throughout the open circulation area along the fire access road per Section 3.3 (Table 9.22.B.1 i)."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.22.B.1 ii)."
      - name: "Tenant Buildings - evaluate separately by their own occupancy"
        detail: "Table 9.22.B covers only the open circulation area, not the tenant spaces: tenant spaces comply with the other applicable sections for their occupancy type (Table 9.22.B, p.714). Run the tool again for each tenant building. A combined fire pump set and fire water tank serving both the open circulation area and the tenant building internal systems is permitted."
      - name: "Fire Pump"
        duty: pump
        spec: "50 gpm @ 4.5 bar at most remote hose reel outlet valve"
        detail: "Table 9.22.B.1 iii."
      - name: "Fire Water Tank"
        duty: tank
        spec: "30 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.22.B.1 iv)."

  - id: mall_open_mid
    match: {occupancy: mall_open, plot_area_m2_gt: 900, plot_area_m2_lte: 2000}
    section: "Ch 9, #4.6.1 / Table 9.22.B.2 (total plot area more than 900 m2 up to 2,000 m2)"
    page: "p.714"
    systems:
      - name: "Exterior Wet Riser (open circulation, along fire access road)"
        detail: "Exterior wet riser system throughout the open circulation area along the fire access road so that all tenant buildings are within 30 m of a hose outlet, per Section 3.4 (Table 9.22.B.2 i). OR (alternative): yard fire hydrants per Table 9.22.B.3, in which case wet risers are not required (items i-ii after OR). Yard hydrants, wet risers or hose reels are not required where infrastructure yard hydrants are available within 120 m of every exterior part of the tenant buildings; tapping from the existing yard hydrant network is permitted to extend coverage (item iii after OR)."
      - name: "Dry Landing Valves and Risers"
        required: not_required
        detail: "Not required (Table 9.22.B.2 ii)."
      - name: "Breeching Inlets (min 2)"
        detail: "Minimum of 2 breeching inlets at two separate locations along the fire access road (Table 9.22.B.2 iii)."
      - name: "Tenant Buildings - evaluate separately by their own occupancy"
        detail: "Table 9.22.B covers only the open circulation area, not the tenant spaces: tenant spaces comply with the other applicable sections for their occupancy type (Table 9.22.B, p.714). Run the tool again for each tenant building. A combined fire pump set and fire water tank serving both the open circulation area and the tenant building internal systems is permitted."
      - name: "Fire Pump"
        duty: pump
        spec: "750 gpm @ 6.9 bar at most remote landing valve"
        detail: "Table 9.22.B.2 iv (exterior wet riser option)."
      - name: "Fire Pump (where yard hydrants are provided instead)"
        required: conditional
        spec: "1000 gpm @ 6.9 bar at most remote hydrant outlet"
        detail: "Table 9.22.B.2 vi: where yard hydrants are considered."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet and instantaneous refilling (Table 9.22.B.2 v and vii)."

  - id: mall_open_large
    match: {occupancy: mall_open, plot_area_m2_gt: 2000}
    section: "Ch 9, #4.6.1 / Table 9.22.B.3 (plot area more than 2,000 m2)"
    page: "p.714"
    systems:
      - name: "Yard Fire Hydrants"
        detail: "Yard fire hydrants per Section 3.11 (Table 9.22.B.3 i). Yard hydrants or wet risers are not required where infrastructure yard hydrants are available within 120 m of every exterior part of the tenant buildings (item ii)."
      - name: "Breeching Inlets (min 2)"
        detail: "Minimum of 2 breeching inlets at two separate locations along the fire access road (Table 9.22.B.3 iii)."
      - name: "Wet Risers and Dry Landing Valves"
        required: not_required
        detail: "Not required (Table 9.22.B.3 iv)."
      - name: "Tenant Buildings - evaluate separately by their own occupancy"
        detail: "Table 9.22.B covers only the open circulation area, not the tenant spaces: tenant spaces comply with the other applicable sections for their occupancy type (Table 9.22.B, p.714). Run the tool again for each tenant building. A combined fire pump set and fire water tank serving both the open circulation area and the tenant building internal systems is permitted."
      - name: "Fire Pump"
        duty: pump
        spec: "1000 gpm @ 6.9 bar at most remote landing valve"
        detail: "Table 9.22.B.3 v."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet and instantaneous refilling (Table 9.22.B.3 vi)."

  - id: mall_mixed
    match: {occupancy: mall_mixed}
    section: "Ch 9, #4.6.1 / Table 9.22.C"
    page: "p.715"
    systems:
      - name: "Automatic Sprinkler System (full coverage - enclosed buildings)"
        detail: "Full sprinkler coverage throughout enclosed buildings, retail, restaurants and service blocks incl. basements and podiums per Section 3.5."
      - name: "Wet Riser System"
        requires_wet_riser: true
        detail: "Wet risers per Section 3.4 throughout the covered/enclosed portions, interconnected at the highest level."
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrant loop per Section 3.11. Tap-offs from existing infrastructure allowed if within 120 m of every exterior part."
      - name: "Tenant Isolation Valves"
        detail: "Isolation valve per tenant to permit maintenance without interrupting mall supply."
      - name: "Breeching Inlets"
        detail: "Multiple breeching inlets distributed along fire access road."
      - name: "ESFR Sprinklers (enclosed supermarket/hypermarket storage)"
        detail: "Enclosed large-storage hazards within the mall protected with ESFR sprinklers per relevant chapter sections."
      - name: "Fire Pump"
        duty: pump
        spec: "Combined: 2000 gpm @ 6.9 bar | Internal only: 1500 gpm @ 6.9 bar"
        detail: "UL/FM listed."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"

  - id: superhighrise_large_plot
    match: {height_m_gt: 90, plot_area_m2_gt: 20000, occupancy_not: [villa_private, villa_commercial, mall_covered, mall_open, mall_mixed]}
    section: "Ch 9, #4.2.1 / Table 9.18.A"
    page: "p.696"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Sprinklers throughout the building including basements and podiums (open as well as closed) per Section 3.5 (Table 9.18.A i). Triggered by super highrise (more than 90 m) on a plot exceeding 20,000 m2."
      - name: "Wet Riser System (zoned - High/Low per Table 9.6.13)"
        requires_wet_riser: true
        detail: "Wet risers throughout per Section 3.4, with High Zones and Low Zones according to the pressure limitations of Table 9.6 item 13 (Table 9.18.A iii-iv). Outlets: 25 mm hose reel (or 40 mm hose rack) and 65 mm landing valve (Table 9.6 items 1, 7)."
      - name: "Wet Risers Interconnected at Lowest + Highest Level of Each Zone"
        detail: "Table 9.18.A v."
      - name: "Multi-level Pump Set (every 90 m from lowest level)"
        detail: "A multi-level pump set arrangement every 90 m height from the lowest fire pump set level per Table 9.6 item 13 (Table 9.18.A vi)."
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrants per Section 3.11 (Table 9.18.A vii). Not required where infrastructure yard hydrants are available within 60 m of the towers; tapping from the existing yard hydrant network is permitted to extend coverage (Table 9.18.A viii)."
      - name: "Fire Pump (first/lowest level)"
        duty: pump
        spec: "1000 gpm @ 17 bar (combined yard + internal; irrespective of number of stairs and standpipes)"
        detail: "Where a fire pump set is combined and serves both yard hydrants and internal building systems, the first pump set at the lowest level is 1000 gpm irrespective of the number of stairs and standpipes, at 17 bar (Table 9.18.A ix)."
      - name: "Upper-level Pump Sets (every 90 m)"
        pump_spec_type: standpipe_dependent
        detail: "Where a pump set only serves internal building systems, the pump sets located vertically at every 90 m intermediate interval from the lowest level fire pump (Table 9.18.A xi)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration (lowest level, combined)"
        detail: "Combined water tank at the lowest level: 60 minutes, low water level detection, dedicated direct breeching inlet, instantaneous refilling (Table 9.18.A x)."
      - name: "Upper-level Fire Water Tanks (every 90 m)"
        spec: "30 minutes duration each"
        detail: "A fire water tank for every upper-level pump set (every 90 m interval), 30 minutes, with automatic low water level detection, instantaneous refilling, and pumping and piping to refill the tanks from lower levels (Table 9.18.A xii)."

  - id: superhighrise_small_plot
    match: {height_m_gt: 90, plot_area_m2_lte: 20000, occupancy_not: [villa_private, villa_commercial, mall_covered, mall_open, mall_mixed]}
    section: "Ch 9, #4.2.1 / Table 9.18.B (and row C)"
    page: "p.697"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Sprinklers throughout including basements and podiums (open as well as closed) per Section 3.5 (Table 9.18.B i). Row C (yard hydrants provided as part of infrastructure development, irrespective of plot area) has the same requirements."
      - name: "Wet Riser System (zoned)"
        requires_wet_riser: true
        detail: "Wet risers per Section 3.4 with High Zones and Low Zones per Table 9.6 item 13 (Table 9.18.B iii-iv). Outlets: 25 mm hose reel (or 40 mm hose rack) and 65 mm landing valve (Table 9.6 items 1, 7)."
      - name: "Wet Risers Interconnected at Lowest + Highest Level of Each Zone"
        detail: "Table 9.18.B v."
      - name: "Multi-level Pump Set (every 90 m)"
        detail: "Every 90 m height from the lowest fire pump set level per Table 9.6 item 13 (Table 9.18.B vi)."
      - name: "Fire Pump (first/lowest level)"
        duty: pump
        spec: "1000 gpm @ 17 bar (irrespective of the number of standpipes)"
        detail: "First fire pump set at the lowest level of the building (Table 9.18.B vii)."
      - name: "Upper-level Pump Sets (every 90 m)"
        pump_spec_type: standpipe_dependent
        detail: "Upper-level pump sets located at every 90 m interval from the lowest level fire pump (Table 9.18.B ix)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration (lowest level)"
        detail: "Water tank at the lowest level: 60 minutes, low water level detection, dedicated direct breeching inlet, instantaneous refilling (Table 9.18.B viii)."
      - name: "Upper-level Fire Water Tanks (every 90 m)"
        spec: "30 minutes duration each"
        detail: "A fire water tank for every upper-level pump set (every 90 m interval), 30 minutes, with automatic low water level detection, instantaneous refilling, and pumping and piping to refill the tanks from lower levels (Table 9.18.B x)."

  - id: highrise_45_90_large_plot
    match: {height_m_gte: 23, height_m_lte: 90, pump_head_height_m_gte: 45, plot_area_m2_gt: 20000, occupancy_not: [villa_private, villa_commercial, mall_covered, mall_open, mall_mixed]}
    section: "Ch 9, #4.3.1 / Table 9.19.A"
    page: "p.698"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Sprinklers throughout including basements and podiums (open as well as closed) per Section 3.5 (Table 9.19.A i). Table 9.19 rows A/B apply when the most remote landing valve is 45 m or more above the lowest fire pump set level (row heading: more than 45 m ... from lowest pump set level; Table 9.6 item 13.iii zones the risers at a height 45 m from the fire pump location). The tool takes the pump room at the lowest basement unless it is set at grade."
      - name: "Wet Riser System (looped, High/Low zones per Table 9.6.13)"
        requires_wet_riser: true
        detail: "Wet risers per Section 3.4 with looped High Zones and Low Zones according to the pressure limitations of Table 9.6 item 13 (Table 9.19.A iii-iv)."
      - name: "Wet Risers Interconnected at Lowest + Highest Level of Each Zone"
        detail: "Table 9.19.A v."
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrants per Section 3.11 (Table 9.19.A vi). Not required where infrastructure yard hydrants are available within 60 m of the towers; tapping from the existing network is permitted (Table 9.19.A vii)."
      - name: "Fire Pump"
        duty: pump
        spec: "1000 gpm @ 6.9 bar at most remote landing valve (combined yard + internal; irrespective of number of stairs)"
        detail: "Where a fire pump set is combined and serves yard hydrants and internal building systems (Table 9.19.A viii)."
      - name: "Fire Water Tank"
        duty: tank
        spec: "60 minutes duration"
        detail: "Combined water tank, low water level detection, dedicated direct breeching inlet, instantaneous refilling (Table 9.19.A ix)."

  - id: highrise_45_90_small_plot
    match: {height_m_gte: 23, height_m_lte: 90, pump_head_height_m_gte: 45, plot_area_m2_lte: 20000, occupancy_not: [villa_private, villa_commercial, mall_covered, mall_open, mall_mixed]}
    section: "Ch 9, #4.3.1 / Table 9.19.B"
    page: "p.698"
    systems:
      - name: "Automatic Sprinkler System (full coverage incl. basements & podiums)"
        detail: "Sprinklers throughout including basements and podiums (open as well as closed) per Section 3.5 (Table 9.19.B i). Table 9.19 rows A/B apply when the most remote landing valve is 45 m or more above the lowest fire pump set level (row heading: more than 45 m ... from lowest pump set level; Table 9.6 item 13.iii zones the risers at a height 45 m from the fire pump location). The tool takes the pump room at the lowest basement unless it is set at grade."
