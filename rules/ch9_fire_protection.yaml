        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection and instantaneous refilling (Table 9.24.D.1 iv)."

  - id: parking_covered_d2
    merge_family: parking   # owner ruling 12.10.2026, P3 App Q6 (engine._merge_tables)
    match: {occupancy: parking_open, has_robotic_parking_is: false, is_covered_shaded_parking_is: true, floors_above_grade_lte: 1, ground_floor_bua_m2_gt: 20000}
    suppresses: [parking_open_c1, parking_open_c2, parking_open_c3, parking_open_c4]
    section: "Ch 9, #4.8.1 / Table 9.24.D.2 (covered / shaded parking more than 20,000 m2)"
    page: "p.721"
    systems:
      - name: "Yard Fire Hydrants"
        detail: "Yard hydrants per Section 3.11 in a loop covering the entire development; where yard hydrants are provided, the hose reel system is not required (Table 9.24.D.2 i). Yard hydrants or hose reels are not required where infrastructure yard hydrants are available within 60 m of every exterior part of the structure (item ii)."
      - name: "Fire Pump"
        merge_system: pump
        duty: pump
        spec: "1000 gpm"
        detail: "Table 9.24.D.2 iii prints 1000 gpm with no pressure; size the pressure for the most remote hydrant valve per Section 3.11."
      - name: "Fire Water Tank"
        merge_system: tank
        duty: tank
        spec: "60 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet and instantaneous refilling (Table 9.24.D.2 iv)."

various_locations:
  # #4.13.1 (p.749): "The building sprinkler system shall be extended to comply with
  # requirements of Table 9.29." Ruling R8 (12.10.2026): every sprinkler row carries
  # requires_sprinkler_system; the engine prints a #4.13.1 not_required note instead
  # when the building's table row gives no automatic sprinkler system. 9.29.K (wet
  # riser extended to the roof) is a wet riser item, not a sprinkler extension, so it
  # is not gated. 9.29.M (ceilings over 10 m, Table 9.29.A) is gated in the engine.
  # Rows are cited "Table 9.29 row X": "Table 9.29.A" is the separate High Ceiling
  # table (p.750). Rules marked silent_when_unsprinklered are standing notes or
  # rows the user did not tick; they print nothing (no #4.13.1 note) in a building
  # whose table row gives no automatic sprinkler system.
  - id: var_atrium
    flag: has_atrium
    requires_sprinkler_system: true
    systems:
      - name: "Atrium Sprinklers (ceiling + adjacent to opening)"
        required: recommended
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row A"
        page_ref: "p.749"
        detail: "Table 9.29 row A i-ii: atriums should be provided with an automatic sprinkler system per Section 3.5, and sprinkler heads should be installed immediately adjacent to the atrium opening (the code says 'should'). See Ch 10 for atrium smoke control."
      - name: "Atrium Draft Stops - non-combustible, 450 mm deep"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row A"
        page_ref: "p.749"
        detail: "Table 9.29 row A ii: non-combustible material draft stops of 450 mm deep shall be provided (adjacent to the atrium opening)."
  - id: var_balconies
    flag: has_exterior_balconies
    requires_sprinkler_system: true
    systems:
      - name: "Exterior Balcony Sprinklers (sidewall or pendent)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row B"
        page_ref: "p.749"
        spec: "Coverage not more than 12 m2 per sprinkler head; temperature rating 79 deg C"
        detail: "Table 9.29 row B: exterior balconies shall be provided with an automatic sprinkler system per Section 3.5; sidewall sprinkler heads or pendent sprinklers at the exterior balconies of buildings where sprinkler protection is required; balcony coverage shall not exceed 12 m2 per sprinkler head; temperature rating 79 deg C."
  - id: var_rain_screen
    flag: has_rain_screen_glazing
    requires_sprinkler_system: true
    systems:
      - name: "Glazing / Rain-screen Sprinkler Protection"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row C"
        page_ref: "p.749"
        detail: "Window-type pendent sprinklers on ceiling or sidewall sprinklers on walls to cover interior glazing (draft-curtain effect)."
  - id: var_stairs
    flag: has_stairs
    requires_sprinkler_system: true
    systems:
      - name: "Stair Shaft Sprinklers (top + first landing above bottom)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row D"
        page_ref: "p.749"
        detail: "Sprinkler at top of shaft and at first accessible landing above the bottom of the shaft per Section 3.5."
  - id: var_elevator_shaft
    flag: has_elevator
    requires_sprinkler_system: true
    systems:
      - name: "Elevator Pit Sidewall Spray Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row E"
        page_ref: "p.749"
        detail: "Sidewall spray sprinklers at the bottom of each elevator hoistway, not more than 600 mm above the pit floor per Section 3.5."
  - id: var_bathroom_heaters
    flag: has_bathrooms_with_heaters
    requires_sprinkler_system: true
    systems:
      - name: "Above-False-Ceiling Space of Bathrooms with Heaters - Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 rows F.ii and G.i"
        page_ref: "p.749"
        detail: "Table 9.29 rows F.ii / G.i: in bathrooms, the above false ceiling spaces where heaters are installed shall be protected with sprinklers per Section 3.5. This applies to the above-false-ceiling space, not to the bathroom itself."
  - id: var_above_false_ceiling_note
    # Table 9.29 row F.i (p.749): a standing note for every sprinklered building.
    always_on: true
    requires_sprinkler_system: true
    silent_when_unsprinklered: true
    systems:
      - name: "Above False Ceiling Spaces - Sprinklers Not Required"
        required: not_required
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row F"
        page_ref: "p.749"
        detail: "Table 9.29 row F.i: sprinklers shall not be required above false ceilings; however, compartmentation and fire stopping shall be considered at regular intervals. Exception row F.ii: bathrooms where heaters are installed above the false ceiling."
  - id: var_public_washrooms
    # Table 9.29 row G.ii (p.749). Residential dwellings fall under G.iii.
    always_on: true
    when: {occupancy_not: [residential, labour_accommodation, staff_accommodation, hostel, villa_private]}
    requires_sprinkler_system: true
    silent_when_unsprinklered: true
    systems:
      - name: "Public Washrooms and Bathrooms - Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row G.ii"
        page_ref: "p.749"
        detail: "Table 9.29 row G.ii: public washrooms and bathrooms shall be provided with a sprinkler system per Section 3.5 (where the building has them)."
  - id: var_residential_washrooms_note
    always_on: true
    when: {occupancy_in: [residential, labour_accommodation, staff_accommodation, hostel, villa_private, hotel_a, hotel_b, hotel_c]}
    requires_sprinkler_system: true
    silent_when_unsprinklered: true
    systems:
      - name: "Residential / Hotel / Apartment Washrooms and Bathrooms - Sprinklers Not Required"
        required: not_required
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row G.iii"
        page_ref: "p.749"
        detail: "Table 9.29 row G.iii: residential, hotel and apartment washrooms and bathrooms shall not require sprinkler protection (row G.i above-false-ceiling spaces with heaters still apply)."
  - id: var_laundry_storage
    flag: has_laundry_storage_rooms
    requires_sprinkler_system: true
    systems:
      - name: "Laundry / Storage Room Sprinklers"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row H"
        page_ref: "p.749"
        detail: "Residential / apartment / hotel-apartment laundry and storage rooms protected with sprinklers per Section 3.5."
  - id: var_pantries
    flag: has_pantries
    requires_sprinkler_system: true
    systems:
      - name: "Pantry Sprinklers (business/commercial)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row I"
        page_ref: "p.749"
        detail: "Pantries in offices and commercial buildings sprinklered per Section 3.5."
  - id: var_stages
    flag: has_permanent_stages
    requires_sprinkler_system: true
    systems:
      - name: "Stage Sprinklers (under stages, dressing rooms, storerooms, workshops)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row J"
        page_ref: "p.749"
        detail: "Permanent stages in assembly occupancies protected with sprinklers under the stage, dressing rooms, storerooms and workshops per Section 3.5."
  - id: var_roof_lpg_or_restaurant
    flag: has_roof_lpg_or_restaurant
    systems:
      - name: "Wet Riser extended to roof (with hose reel)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row K"
        page_ref: "p.750"
        detail: "Building wet riser extended to roofs with LPG tanks, restaurant seating, assembly, or sheesha bars. Hose reels provided at roof level."
  - id: var_garbage_chute
    flag: has_garbage_chute
    requires_sprinkler_system: true
    systems:
      - name: "Garbage Chute Sprinklers (top + alternating floors + lowest)"
        code_ref: "Ch 9, #4.13.1 / Table 9.29 row L"
        page_ref: "p.750"
        detail: "One sprinkler at top of shaft, one at alternating floors, one at lowest level per Section 3.5."

