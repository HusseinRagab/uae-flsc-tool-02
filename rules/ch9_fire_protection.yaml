      - name: "Automatic Sprinkler System"
        required: not_required
        detail: "Not required by Table 9.21.d.2."
      - name: "Fire Pump"
        required: not_required
        detail: "NA (Table 9.21.d.2)."
      - name: "Fire Water Tank"
        required: not_required
        detail: "NA (Table 9.21.d.2)."

  - id: lowrise_villa_converted_single_stair
    match:
