        duty: pump
        pump_spec_type: standpipe_dependent
        detail: "Table 9.20.a.1 v."
      - name: "Fire Water Tank"
        duty: tank
        spec: "45 minutes duration"
        detail: "Low water level detection, dedicated direct breeching inlet, instantaneous refilling (Table 9.20.a.1 vi)."

