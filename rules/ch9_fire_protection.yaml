        code_ref: "Ch 9, #4.14 / Table 9.30.P"
        page_ref: "p.754"
        detail: "Table 9.30.P: clean agent system per Section 3.14. Exemptions: (ii) rooms which are less than 10 m2 in area or are located on typical floors; such typical floor rooms shall be compartmented with fully compliant fire stopping systems; (iii) rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_Q_gsm
    flag: has_gsm_room
    requires_sprinkler_system: true
    systems:
      - name: "GSM Room - Clean Agent (Section 3.14)"
        code_ref: "Ch 9, #4.14 / Table 9.30.Q"
        page_ref: "p.754"
        detail: "Table 9.30.Q: clean agent system per Section 3.14. Exemptions: (ii) rooms which are less than 10 m2 in area or are located on typical floors; such typical floor rooms shall be compartmented with fully compliant fire stopping systems; (iii) rooms which are separated as part of separated service blocks and detached from the predominant occupancy, by a separation distance of 3 m, shall not be required to be protected."

  - id: aux_R_operation_theater
    flag: has_operation_theater
