    section: "Ch 3, #5.5.2 / Table 3.25 item 6"
    page: "p.321"
    systems:
      - name: "Residential B: Smoke Compartments - Floor over 2000 m2 (Table 3.25 item 6)"
        required: conditional
        spec: "If any floor exceeds 2000 m2: subdivided into minimum of 2 smoke compartments, not exceeding 61 m travel distance from any point to reach a door in the smoke barrier (the inputs give no per-floor area)"
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 6"
        page_ref: "p.321"
        detail: "Audit CH123-06."

