# UAE FLSC 2018 - Chapter 3: Means of Egress
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 3
  chapter_title: "Means of Egress"

# ---------- GENERAL: applies to all occupancies (Tables 3.1 / 3.2 / 3.3) ----
general:
  # Owner ruling 12.10.2026, Ch3 Q7: Tables 3.1, 3.2 and 3.4 apply to villas too
  # (#5.6.1, p.323: Table 3.27 prevails on conflict). Tables 3.14 and 3.15.a stay off.
  - id: moe_g_general_specs
    systems:
      - name: "Means of Egress - General Performance"
        spec: "Head room ≥ 2285 mm clear; walking surfaces slip-resistant; abrupt elevation changes ≤ 6.3 mm; guards on open sides"
        code_ref: "Ch 3, #3.1 / Table 3.1"
        page_ref: "p.246"
        detail: "Egress paths shall be free of obstructions and continuously maintained for full instant use during fire / emergency."

  - id: moe_g_door_minimums
    systems:
      - name: "Door Assembly Minimums (Table 3.2)"
        spec: "Min width 915 mm; door forces not to exceed (Table 3.2 item 5.ii): 67 N (15 lbf) to release the latch, 133 N (30 lbf) to set any door leaf in motion, 67 N (15 lbf) to open any door leaf to the minimum required width; door swing in egress direction where occupant load >= 50, OR serving a horizontal exit, OR a high-hazard content room, OR an exit enclosure; panic / fire-exit hardware on fire-rated assemblies"
        code_ref: "Ch 3, #3.2 / Table 3.2"
        page_ref: "p.247-254"
        detail: "Side-hinged or pivoted swinging doors required. Per Table 3.2 #4 item i (p.248), swing in direction of egress applies on ANY of four triggers: (a) occupant load >= 50, (b) horizontal exit, (c) high-hazard content room, (d) exit enclosure. Panic hardware (or fire-exit hardware on fire-rated doors) bar between 865-1220 mm AFFL. Doors readily operable from egress side without keys, tools or special knowledge."

  # Lowrise / midrise: code differentiates sprinklered (1/3) vs non-sprinklered (1/2).
  # height_m_lt: 23 catches lowrise (<=15) AND midrise (15-23).
  - id: moe_g_exit_remoteness_lowrise_midrise
    when:
      occupancy_not: [villa_private, villa_commercial, parking_enclosed, parking_open]
      height_m_lt: 23
    systems:
      - name: "Exit Remoteness - Lowrise / Midrise (Table 3.15.a items i-iv)"
        spec_s: "1/3 of floor diagonal between exits (Table 3.15.a items i, iii)"
        spec_ns: "1/2 of floor diagonal between exits (Table 3.15.a items ii, iv)"
        code_ref: "Ch 3, #4.4 / Table 3.15.a"
        page_ref: "p.288"
        detail: "Measured as the shortest walking distance between exits (not straight-line). Per Table 3.15.a items i-iv (p.288): lowrise (<=15 m) and midrise (>15-23 m) buildings size remoteness by the 1/3 (sprinklered) or 1/2 (non-sprinklered) of the floor diagonal. #4.4.8 (p.291): Table 3.15.a does not apply to basements and podiums used only for parking and service rooms, provided the 61 m travel distance is met (Table 3.15.b applies)."

  # Highrise / super-highrise: code only tabulates the sprinklered case (1/3 diagonal,
  # straight-line measurement). Non-sprinklered highrise is not permitted under Ch 9.
  - id: moe_g_exit_remoteness_highrise
    when:
      occupancy_not: [villa_private, villa_commercial, parking_enclosed, parking_open]
      height_m_gte: 23
    systems:
      - name: "Exit Remoteness - Highrise / Super-highrise (Table 3.15.a items v-vi)"
        spec_s: "1/3 of floor diagonal between exits (Table 3.15.a items v-vi)"
        spec_ns: "No row: Table 3.15.a items v-vi list highrise and super highrise as sprinklered only; Ch 9 requires sprinklers at this height"
        code_ref: "Ch 3, #4.4 / Table 3.15.a"
        page_ref: "p.288"
        detail: "Measured as the straight line between centres of exit doors (not walking distance). Per Table 3.15.a items v-vi (p.288): highrise (23-90 m, ruling R1) and super-highrise (>90 m) are tabulated as sprinklered only, both at 1/3 of floor diagonal. Non-sprinklered highrise is not permitted (see Ch 9). #4.4.8 (p.291): Table 3.15.a does not apply to basements and podiums used only for parking and service rooms (Table 3.15.b applies)."

  - id: moe_g_required_exits
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Number of Means of Egress (Table 3.14)"
        spec: "≥ 2 exits per floor; OL 500-1000 → ≥ 3 exits; OL > 1000 → ≥ 4 exits; outdoor OL > 6,000 → 3, > 9,000 → 4"
        code_ref: "Ch 3, #4.3 / Table 3.14"
        page_ref: "p.288"
        detail: "Per #4.3.1 (p.288) the number of means of egress is set for each storey: OL of the storey = storey floor area / Table 3.13 factor, rounded up (#4.1.2 'not less than', p.283); where an exit serves more than one storey only the OL of each storey considered individually is used (#4.1.3). The headline occupant load card gives the building total and the Table 3.14 count for the largest storey entered; with no largest storey area the whole GFA is used (owner ruling 12.10.2026, Ch3 Q1). Balconies and mezzanines also require minimum 2 means of egress."
        note: "Outdoor occupant-load tiers (Table 3.14 clauses vi/vii: OL>6,000 -> 3 exits, OL>9,000 -> 4 exits) are listed for reference but not currently evaluable: the Building schema has no indoor/outdoor `setting` flag, so this tool cannot auto-branch on outdoor venues. Treat outdoor OL thresholds as a manual designer check."

  - id: moe_g_stair_geometry
    systems:
      - name: "Stair Geometry (Ch 3, #3.3)"
        spec: "Exit stair width not less than 1200 mm serving up to 2000 persons, not less than 1420 mm serving more than 2000 persons, and satisfying the egress capacity; width not decreasing along the direction of egress travel; measured from wall to the clear available width of the step, handrails may project at most 100 mm on each side at a height of 865 mm to 965 mm (Table 3.4 item 1). Tread depth ≥ 280 mm; riser height 100-180 mm uniform (max 10 mm variation per flight); head room on stairs ≥ 2,030 mm; max height between landings 3,660 mm"
        code_ref: "Ch 3, #3.3 / Table 3.4"
        page_ref: "p.255-258"
        detail: "Per Table 3.4 #2 (p.255): general exit-stair riser MIN 100 mm, MAX 180 mm, uniform throughout each flight. Aisle stairs in Assembly are a separate case: tread ≥ 280 mm and riser not less than 100 mm and not more than 205 mm (Table 3.17 item 8.ii-iii, p.298); where the aisle riser exceeds 178 mm the stair width is multiplied by factor A (Table 3.17 item 3.i, p.297), so 178 mm is a width-factor threshold, not a riser limit. Stair handrails on both sides; intermediate handrails where width > 1,750 mm (Table 3.4 #10)."

  # Owner ruling 12.10.2026, Ch3 Q7: the general items above apply to villas with the
  # villa tables taking precedence. Table 3.4 item 1 (p.255) widths are stated on the
  # Stair Geometry line. #3.3.2 (p.255): stair types and modifications allowed by
  # Section 5 (Table 3.27 item 2.v, Table 3.28 item 3.v) override Table 3.4.
  - id: moe_g_villa_general_items
    when:
      occupancy_in: [villa_private, villa_commercial]
    systems:
      - name: "Villa: General Ch 3 Items (Tables 3.1, 3.2, 3.4) with Villa Table Precedence"
        spec: "Tables 3.1 (general), 3.2 (doors) and 3.4 (stairs) apply to the villa as listed in this chapter's general items. Private villa: where they conflict with Table 3.27, Table 3.27 prevails (#5.6.1). Commercial villa: where they conflict with Table 3.28, Table 3.28 prevails (#5.7.1). Tables 3.14 (number of exits) and 3.15.a (remoteness) are not applied to villas."
        code_ref: "Ch 3, #5.6.1 / #5.7.1 / Tables 3.1, 3.2, 3.4, 3.27, 3.28"
        page_ref: "p.246-259, 323-324"
        detail: "Owner ruling 12.10.2026, Ch3 Q7. #5.6.1 (p.323): 'The Private Villa occupancies shall comply with Table 3.27. along with all other sections of this chapter. Where conflicts arise between this section and other sections of this Chapter or code, the requirements of this section shall prevail.' #5.6.1 covers private villas; #5.7.1 (p.324) gives Table 3.28 the same precedence for commercial villas. Table 3.4 item 1 (p.255) widths are stated on the Stair Geometry line. #3.3.2 (p.255): stair types and modifications allowed by Section 5 (Table 3.27 item 2.v, Table 3.28 item 3.v) override Table 3.4."

  # Hazardous-area door rule - fires whenever the building is classed HH.
  # Table 3.2 item 4.i (p.248): doors serving a high hazard content room swing in the
  # direction of egress. Table 3.2 sets no panic-hardware trigger for HH rooms (item 12,
  # p.250, only specifies the hardware), so panic hardware is not stated as required.
  - id: moe_g_hazardous_area_doors
    when:
      hazard_class_is: HH
    systems:
      - name: "Hazardous Area Doors - Swing in Direction of Egress (Table 3.2 item 4.i)"
        spec: "Side-hinged or pivoted-swinging doors serving a high hazard content room shall swing in the direction of egress travel."
        code_ref: "Ch 3, #3.2 / Table 3.2 item 4.i"
        page_ref: "p.248"
        detail: "Trigger: building hazard_class = HH (high-hazard content). Table 3.2 item 4.i (p.248) lists four swing triggers: occupant load of 50 or more, horizontal exit, high hazard content room, exit enclosure. Where panic or fire exit hardware is fitted, Table 3.2 item 12 (p.250) applies: only approved and listed fire exit hardware on fire protection-rated door assemblies, actuating bar 865-1220 mm from finished floor. Table 3.2 does not require panic hardware on HH room doors."

  # #4.4.8 (p.291): Table 3.15.b applies to basements and podiums used only for vehicle
  # parking and service rooms -> parking occupancies or a building with a parking area;
  # villas follow Table 3.27 / 3.28 (basement: standard enclosed exit stair).
  - id: moe_g_basement_parking_egress
    when:
      floors_below_grade_gt: 0
      occupancy_not: [villa_private, villa_commercial]
      any_of:
        - {occupancy_in: [parking_enclosed, parking_open]}
        - {has_parking_area: true}
    systems:
      - name: "Basement / Parking Podium Travel Distance (Table 3.15.b)"
        spec_s: "Enclosed basement / podium parking: max 61 m travel (item i). Open podium parking: max 122 m travel (item iii). Dead end and commonpath max 15 m."
        spec_ns: "Enclosed basement / podium parking: max 46 m travel (item ii). Open podium parking: max 91 m travel (Table 3.16 row 20.ii; item iv prints 122 m, ruling R9). Dead end and commonpath max 15 m."
        code_ref: "Ch 3, #4.4.8 / Table 3.15.b"
        page_ref: "p.291"
        detail: "Applies to basements and enclosed podiums used only for vehicle parking and service rooms (generator, server, battery, service rooms)."

  # ---------- fix round 28.10.2026 (ch123): Table 3.4 items 7-8 (CH123-09) ----------
  # Table 3.4 item 7 (p.259): low depth AND lowrise (up to 15 m) -> block-work; high depth,
  # midrise (more than 15 m), highrise, super highrise -> RCC. Both 2 hour.
  - id: moe_g_stair_separation_blockwork
    when:
      height_m_lte: 15
      is_high_depth_is: false
    systems:
      - name: "Exit Stair Separation (Table 3.4 item 7)"
        spec: "Every stair serving as an exit in Low depth and Low rise buildings (having height up to 15 m), shall be separated from rest of the building areas by a construction of at least block-work and ensure 2 hour fire resistance rating. Separation shall extend vertically from the lowest level of the stair to a point 3 m above the top most landing of the stairs or to the roofline. Elevators shall not be in a common shaft enclosure with stairway."
        code_ref: "Ch 3, #3.3 / Table 3.4 item 7.i, 7.iii, 7.iv"
        page_ref: "p.259"
        detail: "Audit CH123-09. Villas (owner ruling 12.10.2026, Ch3 Q7): Table 3.4 applies, but Table 3.27 item 2.v / Table 3.28 item 3.v (p.323-324) permit spiral stairs, winders and open stairs other than for access and exit from basements, and the villa table prevails (#5.6.1, #5.7.1; #3.3.2, p.255)."
  - id: moe_g_stair_separation_rcc
    when:
      any_of:
        - {height_m_gt: 15}
        - {is_high_depth_is: true}
    systems:
      - name: "Exit Stair Separation (Table 3.4 item 7)"
        spec: "Every stair serving as an exit in High depth, Mid rise, (having height more than 15 m), High rise buildings and superhighrise buildings shall be separated from rest of the building areas by a construction of RCC (Reinforced Concrete) and ensure 2 hour fire resistance rating. Separation shall extend vertically from the lowest level of the stair to a point 3 m above the top most landing of the stairs or to the roofline. Elevators shall not be in a common shaft enclosure with stairway."
        code_ref: "Ch 3, #3.3 / Table 3.4 item 7.ii, 7.iii, 7.iv"
        page_ref: "p.259"
        detail: "Audit CH123-09. High depth = more than two basements or more than 7 m below the level of exit discharge (#1.7.45, p.45)."
  - id: moe_g_stair_penetrations
    systems:
      - name: "Penetrations into Stair Space (Table 3.4 item 8)"
        spec: "Space within the stair shall not be used for any other purpose than occupant exit and evacuation. Space under the stair shall not be used for any other purpose unless fully isolated from the stair with 2 hour fire resistance construction, with entry / exit not through the stair enclosure. Only penetrations allowed into the stair enclosure: fire hose and sprinkler piping, fire protection piping valves, electrical conduits serving the stair enclosure and fire detection and alarm system wiring enclosed in metal conduits. Fire Hose Reel and Landing valve cabinets shall not be located in the stair enclosure. Pressurization ducting, AC units, fan coil units, ventilation ducts, water piping, heater piping, drainage piping etc. shall not be located in the stair enclosure."
        code_ref: "Ch 3, #3.3 / Table 3.4 item 8"
        page_ref: "p.259"
        detail: "Audit CH123-09."

  # ---------- fix round 28.10.2026 (ch123): component tables (CH123-25) ----------
  # Table 3.2 item 18 (p.254): doors opening into exit corridors, exit access corridors and
  # exit stairs follow Tables 3.3.a / 3.3.b unless Section 5 specifies otherwise.
  - id: moe_g_door_fire_ratings
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Fire Resistance Rating of Doors (Table 3.3.a)"
        spec: "Exit stair: 90 Minutes, smoke proof, self closing, latches only. Exit passageway: 90 Minutes, smoke proof, self closing, latches only. Exit corridor of 1 hour fire rating: 60 Minutes, smoke proof, self closing, latches only. Exit corridor of no fire rating: None (latches only). Service corridor of 1 hour fire rating: 60 Minutes, self closing (latches and locks per Table 3.2). Service corridor of no fire rating: None, smoke proof (latches and locks per Table 3.2). Elevator lobby: 60 Minutes, smoke proof, self closing (Table 3.2.10). Garbage room: 60 Minutes, smoke proof, self closing, latches only."
        code_ref: "Ch 3, #3.2 / Table 3.2 item 18 / Table 3.3.a"
        page_ref: "p.254"
        detail: "Audit CH123-25. Table 3.2 item 18.i: the fire resistance rating of doors which open into exit corridors, exit access corridors and into exit stairs complies with Tables 3.3.a and 3.3.b unless specified in individual occupancies as per Section 5; item 18.ii: door fire rating is not required where located in non-fire rated walls. Table 3.3.a prints no row 6."
  - id: moe_g_unit_doors_residential
    when: {occupancy: residential}
    systems:
      - name: "Unit Door Fire Rating (Table 3.3.b)"
        spec: "Main doors of units in an enclosed exit corridor: apartment unit main door and residential unit main door 60 Minutes (smoke proof not required, self closing not required, latches and locks per Table 3.2.7). Kitchen door in residential / apartment: None. Unit doors in open external corridor: None."
        code_ref: "Ch 3, Table 3.3.b rows 1, 2, 7, 8"
        page_ref: "p.254"
        detail: "Audit CH123-25."
  - id: moe_g_unit_doors_accommodation
    when: {occupancy_in: [labour_accommodation, staff_accommodation, hostel]}
    systems:
      - name: "Unit Door Fire Rating (Table 3.3.b)"
        spec: "Main doors of units in an enclosed exit corridor: labor accommodation unit door and staff accommodation unit door 60 Minutes (smoke proof not required, self closing not required, latches and locks per Table 3.2.7). Unit doors in open external corridor: None."
        code_ref: "Ch 3, Table 3.3.b rows 3, 4, 8"
        page_ref: "p.254"
        detail: "Audit CH123-25. Table 3.3.b prints no hostel row; hostels are Residential Group B with staff accommodation (Table 1.1 row 5, p.49) and take row 4."
  - id: moe_g_unit_doors_hotel
    when: {occupancy_in: [hotel_a, hotel_b, hotel_c]}
    systems:
      - name: "Unit Door Fire Rating (Table 3.3.b)"
        spec: "Hotel unit main door in an enclosed exit corridor: 60 Minutes, self closing (smoke proof not required; latches and locks per Table 3.2.7). Unit doors in open external corridor: None."
        code_ref: "Ch 3, Table 3.3.b rows 5, 8"
        page_ref: "p.254"
        detail: "Audit CH123-25."
  - id: moe_g_unit_doors_office
    when: {occupancy: business}
    systems:
      - name: "Unit Door Fire Rating (Table 3.3.b)"
        spec_s: "Office unit main door in an enclosed exit corridor (row 6): None if sprinklered; self closing (smoke proof not required; latches and locks per Table 3.2)."
        spec_ns: "Office unit main door in an enclosed exit corridor (row 6): 60 Minutes, if not sprinklered; self closing (smoke proof not required; latches and locks per Table 3.2)."
        code_ref: "Ch 3, Table 3.3.b row 6"
        page_ref: "p.254"
        detail: "Audit CH123-25."
  - id: moe_g_unit_doors_education
    when: {occupancy_in: [education_a, education_b, education_c]}
    systems:
      - name: "Unit Door Fire Rating (Table 3.3.b)"
        spec_s: "Education class room doors in an enclosed exit corridor (row 9): None if sprinklered; self closing (smoke proof not required; latches and locks per Table 3.2)."
        spec_ns: "Education class room doors in an enclosed exit corridor (row 9): 60 Minutes, if not sprinklered; self closing (smoke proof not required; latches and locks per Table 3.2)."
        code_ref: "Ch 3, Table 3.3.b row 9"
        page_ref: "p.254"
        detail: "Audit CH123-25."
  # Table 3.6 (p.272-273): input has_horizontal_exits (Ch 5 settings).
  - id: moe_g_horizontal_exits
    when:
      occupancy_not: [villa_private, villa_commercial]
      has_horizontal_exits: true
    systems:
      - name: "Horizontal Exits (Table 3.6)"
        spec: &t36 "Horizontal exits only where the other non-horizontal exits leading outside give not less than half (50%) of the total egress capacity and number of exits (#3.4.1). Each fire compartment counted as a horizontal exit also has at least one or 50% of the required number of exits that is not a horizontal exit (item 1.i). Fire barrier minimum 2 hour fire resistance rating, continuous from ceiling to finished floor level (item 2.i). Floor area on either side sufficient to hold the occupants of both floor areas, at least 0.28 m2 clear floor area per person (item 5.i). Ducts through the barrier have listed fire dampers; no duct penetration without dampers in non sprinklered buildings (item 6). Doors 90 minutes fire resistance rated, swinging in the direction of egress (two-way swing fire doors with vision glass permitted), self-closing or automatic closing, with approved vision panel, unlocked from the egress side when either side is occupied (items 4, 7). Bridges between buildings: 2 hour fire barrier, openings 45 minutes, width not less than 1200 mm (item 8)."
        code_ref: "Ch 3, #3.4 / Table 3.6"
        page_ref: "p.272-273"
        detail: "Audit CH123-25. Ticked: horizontal exits are provided (Ch 5 settings). Table 3.6 item 2.ii-iv (p.272): floors where the barrier is omitted separated by at least 2 hour; vertical openings 2 hour; outside walls at less than 180 degrees within 3 m: 1 hour walls with 45 minutes openings, or one wall 2 hour with 90 minutes openings. #3.4.2: occupancy sections that allow and modify horizontal exits override Table 3.6."
  - id: moe_g_horizontal_exits_check
    when:
      occupancy_not: [villa_private, villa_commercial]
      has_horizontal_exits: false
    systems:
      - name: "Horizontal Exits (Table 3.6)"
        required: conditional
        spec: *t36
        code_ref: "Ch 3, #3.4 / Table 3.6"
        page_ref: "p.272-273"
        detail: "Audit CH123-25. Conditional: applies where horizontal exits are provided (no horizontal exit is ticked in the Ch 5 settings)."
  - id: moe_g_smokeproof_enclosures
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Smokeproof Enclosures (Table 3.7)"
        required: conditional
        spec: "Where a smokeproof enclosure is provided: continuously enclosed by barriers having a 2-hour fire resistance rating from the highest point to the level of exit discharge (item 1.i); access through a vestibule or an exterior balcony unless the enclosure is pressurized (item 2.i); vestibule door to the outside area 90 minutes fire rated, vestibule door to the enclosure 30 minutes, air leak proof, self closing or automatic closing by a smoke detector within 3 m of the vestibule door opening (item 3); discharge into a public way or a yard or court with direct access to a public way (item 4.i). Natural ventilation: vestibule opening not less than 1.5 m2 facing a court, yard or public space not less than 6 m wide; vestibule not less than 1830 mm in the direction of travel (item 5). Mechanical ventilation: vestibule not less than 1200 mm wide and 1830 mm in the direction of travel, not less than one air change per minute, exhaust 150% of supply (item 6). Pressurization: not less than 12.5 N/m2 in sprinklered buildings or 25 N/m2 in non sprinklered buildings; door opening force not more than 133 N (item 7)."
        code_ref: "Ch 3, #3.5 / Table 3.7"
        page_ref: "p.274-275"
        detail: "Audit CH123-25. Conditional: no input says a smokeproof enclosure is provided. Ch 2 #2.9.6.a (p.221): the Fire Exit Stair of a fire lift building is a fully enclosed smoke proof space. #3.5.2: occupancy sections that allow and modify smokeproof enclosures override Table 3.7."
  - id: moe_g_exit_passageways_lowrise
    when:
      occupancy_not: [villa_private, villa_commercial]
      height_m_lte: 15
      is_high_depth_is: false
    systems:
      - name: "Exit Passageways (Table 3.8)"
        required: conditional
        spec: "Where an exit passageway is provided: every exit passageway in Low depth and Low rise buildings (having height up to 15 m) separated from rest of the building areas by a construction to ensure 1 hour fire resistance rating, from the finished floor level to the ceiling (items 1.i, 1.iii); width sized for the aggregate required capacity of all exits discharging through it and minimum of 1200 mm, not less than 2/3 of the stair width, not reducing along the egress path (item 2); fire rated windows only if the building is sprinklered (item 3); access not through kitchens, storerooms or other rooms or spaces subject to locking (item 4)."
        code_ref: "Ch 3, #3.6 / Table 3.8"
        page_ref: "p.276"
        detail: "Audit CH123-25. Conditional: no input says an exit passageway is provided."
  - id: moe_g_exit_passageways_high
    when:
      occupancy_not: [villa_private, villa_commercial]
      any_of:
        - {height_m_gt: 15}
        - {is_high_depth_is: true}
    systems:
      - name: "Exit Passageways (Table 3.8)"
        required: conditional
        spec: "Where an exit passageway is provided: every exit passageway in High depth, Mid rise and High rise buildings (having height more than 15 m) separated from rest of the building areas by a construction to ensure 2 hour fire resistance rating, from the finished floor level to the ceiling (items 1.ii, 1.iii); width sized for the aggregate required capacity of all exits discharging through it and minimum of 1200 mm, not less than 2/3 of the stair width, not reducing along the egress path (item 2); fire rated windows only if the building is sprinklered (item 3); access not through kitchens, storerooms or other rooms or spaces subject to locking (item 4)."
        code_ref: "Ch 3, #3.6 / Table 3.8"
        page_ref: "p.276"
        detail: "Audit CH123-25. Conditional: no input says an exit passageway is provided. Table 3.8 item 1.ii does not name super highrise buildings; read with them (more than 15 m)."
  - id: moe_g_ramps
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Ramps as Means of Egress (Table 3.9)"
        required: conditional
        spec: "Where a ramp is used as a means of egress: minimum width 1200 mm, not decreasing along the direction of egress travel; maximum slope 1 in 12, maximum cross slope 1 in 48; maximum rise of a single ramp run 760 mm; projections not more than 114 mm at or below handrail height; permanent fixed construction of non combustible or limited combustible material; landings at top, bottom and at door leaves, same width as the ramp, slope not steeper than 1 in 48, not less than 1525 mm in the direction of travel (1220 mm for a straight run not part of an accessible route), changes of direction only at landings; curbs or barriers not less than 100 mm at drop-offs; outside ramps more than 11 m above finished ground level with an opaque visual obstruction not less than 1220 mm in height."
        code_ref: "Ch 3, #3.7 / Table 3.9"
        page_ref: "p.278"
        detail: "Audit CH123-25. Conditional: no input says a ramp is part of the means of egress. Guards and handrails per Table 3.4 items 10-11, enclosure per Table 3.4 item 7 (Table 3.9 items 8-9). #3.7.1: occupancy sections that allow and modify ramps override Table 3.9."
  - id: moe_g_evacuation_elevators
    when:
      occupancy_not: [villa_private, villa_commercial]
      has_evacuation_elevator: true
    systems:
      - name: "Elevators as Means of Egress (Table 3.11)"
        spec: &t311 "Elevators are a component of the means of egress but do not compensate for the required number of exits or exit capacity (#3.9.2). Not used for evacuation unless assisted by facility management and the Civil Defence rescue team, unless alternatives are approved by Civil Defence; strategy, procedure and responsibilities preplanned and documented (item 1). Prerequisites: building fully sprinklered; elevator lobby; pressurized elevator shafts; two-way communication; voice evacuation clearly audible in the lobby; wiring for elevator equipment, car lighting and lobby pressurization 2 hour fire rated (item 2). Water resistant, listed and approved per ASME A17.1/CSA B44 (item 3). Emergency power backup; no shunt breakers (item 4). Override key feature; manual Phase I Emergency Recall from the Emergency Command Center; return to the designated discharge level on power failure; smoke detector or pre-action sprinkler activation at the elevator machine room disables elevator evacuation (item 5)."
        code_ref: "Ch 3, #3.9 / Table 3.11"
        page_ref: "p.280"
        detail: "Audit CH123-25. Ticked: elevator used for evacuation (Ch 5 settings). See also Ch 1 Table 1.9.38 and Ch 2 #2.9.4 (#3.8.3 as printed)."
  - id: moe_g_evacuation_elevators_check
    when:
      occupancy_not: [villa_private, villa_commercial]
      has_evacuation_elevator: false
    systems:
      - name: "Elevators as Means of Egress (Table 3.11)"
        required: conditional
        spec: *t311
        code_ref: "Ch 3, #3.9 / Table 3.11"
        page_ref: "p.280"
        detail: "Audit CH123-25. Conditional: applies where elevators are used for evacuation (not ticked in the Ch 5 settings)."
  - id: moe_g_exit_discharge
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Exit Discharge (Table 3.12)"
        spec_s: "Sprinkler protected building: minimum of 50 % of the required number of exits and of the required egress capacity discharge directly to the outside (item 1.i); not more than 50% through interior building areas such as lobbies and corridors, leading to a free and unobstructed way to the exterior, readily visible from the point of discharge (item 2); direct discharge towards the public way, not at the back of the building (item 3.i); distance between points of exit discharge not less than 1/3 (One-third) of the largest building diagonal (item 4.i); exit discharges not next to each other with common walls or fire walls (item 4.iii); areas with exit discharge through interior building spaces protected with sprinklers (item 5.ii)."
        spec_ns: "Non-sprinklered building: 100% of the required number of exits and of the required egress capacity discharge directly to outside the building (item 1.ii); direct discharge towards the public way, not at the back of the building (item 3.i); distance between points of exit discharge not less than 1/2 (One-half) of the largest building diagonal (item 4.ii); exit discharges not next to each other with common walls or fire walls (item 4.iii)."
        code_ref: "Ch 3, #3.10 / Table 3.12"
        page_ref: "p.281"
        detail: "Audit CH123-25. #3.10.2: exits terminate directly at a public way or at an exterior exit discharge, unless otherwise provided in Table 3.12. Item 5.i, 5.iii (p.281): an exit passageway serving as a discharge from a stair enclosure has the fire resistance rating of the stair enclosure; the level of discharge is separated from areas below by construction not less than that required for the exit enclosure."

# ---------- BRANCHES: by occupancy - Tables 3.13 (OLF) + 3.16 (T/D/C) ------
branches:
  # ------ Assembly ------
  - id: moe_assembly
    match: {occupancy_in: [assembly_a, assembly_b, assembly_c]}
    section: "Ch 3, #4 + #5.1 / Tables 3.13.1 + 3.16.1"
    page: "p.285, 293"
    systems:
      - name: "Occupant Load Factor (Assembly)"
        spec: "Concentrated 0.65 m² net (0.9 m² for prayer rooms); Less concentrated 1.4 m² net; Bench seating 455 mm linear; Fixed seating: count of seats; Kitchens 9.3 m²"
        detail: "Use the most representative factor for each space. Stair capacity 7.6 mm/person; ramp 5 mm/person."
      - name: "Travel / Dead-end / Commonpath (Assembly)"
        spec: "≤ 50 people: commonpath 23 m; > 50: commonpath 6.1 m. Dead-end 6.1 m. Travel distance: sprinklered 76 m / non-sprinklered 61 m. Smoke-protected seating: travel 122 m sprinklered."
        spec_s: "50 people or less (1.i): commonpath 23 m, dead end 6.1 m, travel 76 m. More than 50 people (1.ii): commonpath 6.1 m, dead end 6.1 m, travel 76 m. Smoke protected seating area (1.iii): commonpath 15 m, dead end 21 rows of seats, travel 122 m. Exhibition booth to exit access (1.iv): commonpath 15 m, dead end 0 m, travel 15 m."
        spec_ns: "50 people or less (1.i): commonpath 23 m, dead end 6.1 m, travel 61 m. More than 50 people (1.ii): commonpath 6.1 m, dead end 6.1 m, travel 61 m. Smoke protected seating area (1.iii): commonpath 6.1 m, dead end not printed for NS, travel 61 m. Exhibition booth to exit access (1.iv): commonpath 15 m, dead end 0 m, travel 15 m."
        detail: "Smoke-protected seating allows extended travel and 21-rows dead-end. Exhibition booth to exit access: 15 m."
      - name: "Aisle Width (Assembly Seating)"
        spec: "Both-side seating: ≥ 1200 mm; one-side seating: ≥ 915 mm; ≤ 50 people: ≥ 915 mm. Aisle dead-end max 6.1 m. Aisle stairs: tread ≥ 280 mm, riser 100-205 mm uniform."
        code_ref: "Ch 3, #5.1 / Table 3.17"
        page_ref: "p.298"

  # ------ Business ------
  - id: moe_business
    match: {occupancy: business}
    section: "Ch 3, #4 + #5.2 / Tables 3.13.2 + 3.16.2"
    page: "p.285, 293"
    systems:
      - name: "Occupant Load Factor (Business)"
        spec: "Regular office 9.3 m²; Concentrated office 4.6 m²; Air-traffic-control observation 3.7 m²"
      - name: "Travel / Dead-end / Commonpath (Business)"
        spec: "Commonpath: sprinklered 30 m / non-sprinklered 23 m. Dead-end: sprinklered 15 m / non-sprinklered 6.1 m. Travel distance: sprinklered 91 m / non-sprinklered 61 m"
        spec_s: "Regular office areas (2.i): commonpath 30 m, dead end 15 m, travel 91 m. Air traffic control observation levels (2.iii): no values printed."
        spec_ns: "Regular office areas (2.i): commonpath 23 m, dead end 6.1 m, travel 61 m. Air traffic control observation levels (2.iii): no values printed."
      - name: "Single Exit Permission (Business - Table 3.19)"
        required: conditional
        spec: "Single exit door: permitted for a room or area with a total occupant load of less than 100 persons, discharging directly to outside at the level of exit discharge with travel to outside not more than 30 m (item 1.i); with a stair, an enclosed interior stair or outside stair, total travel including the stair not more than 30 m (item 1.ii); a single outside stair may serve multiple stories only if not more than 4570 mm in height from the fire access level (item 1.iii); rooms exceeding 280 m2 in area require 2 exit doors, remotely located as per Section 4.4 (item 1.iv). Single exit stair: permitted for a Lowrise building with a total occupant load of less than 30 persons per floor, discharging directly to outside with travel to outside not more than 30 m (item 2.i); if interior, fully enclosed and shall not serve any other stories (item 2.ii); if an outside stair, it may serve all stories (item 2.iii); a single means of egress from a mezzanine where the common path of travel does not exceed (S 30 m, NS 23 m) (item 2.iv); a single open stair for a 2 storey, single tenant, fully sprinklered building with full travel to outside including the stair not more than 30 m (item 2.v)."
        detail: "Audit CH123-17: the permissions are stated with their printed limits (Table 3.19, p.304). Every condition of the item used must be met; otherwise the Table 3.14 number of exits applies."
        code_ref: "Ch 3, #5.2 / Table 3.19 #1-2"
        page_ref: "p.304"

  # ------ Educational ------
  # Schema/code mapping note (per Ch 3 #5.3 + Tables 3.20 / 3.21):
  #   education_a = Nurseries / KG / Preschool / Talent Centers (Table 3.20, p.305-306)
  #   education_b = Schools, Grade 1-12                          (Table 3.21, p.307-308)
  #   education_c = Colleges / Universities / adult education    (Table 3.21, p.307-308)
  # The shared `moe_education` branch covers OLF and Table 3.16 travel for all three.
  # Group-specific single-exit-stair rules are split into `_a` and `_bc` branches.
  - id: moe_education
    match: {occupancy_in: [education_a, education_b, education_c]}
    section: "Ch 3, #4 + #5.3 / Tables 3.13.3 + 3.16.3"
    page: "p.285, 293"
    systems:
      - name: "Occupant Load Factor (Educational)"
        spec: "Classroom 1.9 m² net; Shops / labs / vocational 4.6 m² net"
      - name: "Travel / Dead-end / Commonpath (Educational)"
        spec: "Classroom: commonpath sprinklered 30 m / non 23 m. Dead-end sprinklered 15 m / non 6.1 m. Travel sprinklered 61 m / non 46 m. Shops/labs travel sprinklered 76 m / non 46 m."
        spec_s: "Classroom (3.i): commonpath 30 m, dead end 15 m, travel 61 m. Shops, laboratories, vocational: commonpath 30 m, dead end 15 m, travel 76 m."
        spec_ns: "Classroom (3.i): commonpath 23 m, dead end 6.1 m, travel 46 m. Shops, laboratories, vocational: commonpath 23 m, dead end 6.1 m, travel 46 m."

  - id: moe_education_a
    match: {occupancy: education_a}
    section: "Ch 3, #5.3.1 / Table 3.20 (Nurseries, KG, Preschool, Talent Centers)"
    page: "p.305-306"
    systems:
      - name: "Minimum 2 Exit Stairs - Single Exit Stair Not Permitted (Table 3.20 item 4)"
        spec: "Single exit stair is not permitted. Minimum of 2 exit stairs, accessible from every part of every storey and mezzanine within the permitted commonpath distance (Table 3.20 item 4.i-ii, p.305). An existing single-stair villa converted to Group A provides the second stair as an added outside stair (Table 3.20 item 9.ii, p.306)."
        code_ref: "Ch 3, #5.3.1 / Table 3.20 item 4"
        page_ref: "p.305-306"
        detail: "Per Table 3.20 item 4 (p.305) two exit stairs are required for Educational Group A. Table 3.20 item 9 (p.306) covers existing two-storey private villas being changed to Group A: where a single exit stair already exists, the second required exit stair may be provided by adding an outside open stair (masonry or steel) discharging directly to outside at ground level. Classrooms must not be located on upper floors of such converted villas (#9 item iii); upper floors are restricted to offices / staff room / storage / health checkup."
      - name: "Classroom Location (Table 3.20 item 1)"
        spec: "Rooms normally occupied by preschool, kindergarten or first-grade students (generally below 6 years) on a level of exit discharge; rooms of second-grade students (generally 6-8 years) not more than one storey above the level of exit discharge; otherwise dedicated means of egress directly to outside, independent of the building means of egress (item 1.iii). Aisles not less than 760 mm wide."
        code_ref: "Ch 3, #5.3.1 / Table 3.20 item 1"
        page_ref: "p.305"
      - name: "Corridors (Table 3.20 item 2)"
        spec: "Corridors not less than 1830 mm wide; enclosed corridor walls are smoke partitions; corridor 1 hour fire rated if the building is not sprinklered."
        code_ref: "Ch 3, #5.3.1 / Table 3.20 item 2"
        page_ref: "p.305"
      - name: "Two Exit Access Doors - Room over 93 m2 (Table 3.20 item 5)"
        required: conditional
        spec: "Every room or space larger than 93 m2 shall have 2 separate exit access doors, remote from each other as per Section 4.4, leading to corridor, which has two exit stairs in opposite directions."
        code_ref: "Ch 3, #5.3.1 / Table 3.20 item 5"
        page_ref: "p.305"
        detail: "Audit CH123-07. Conditional: the inputs give no room areas."
      - name: "Rescue Window in Non-sprinklered Building (Table 3.20 item 6)"
        sprinkler_column: NS
        spec: "Every room or space greater than 23 m2 used for classroom or other educational purposes or normally subject to student occupancy in a non-sprinklered building shall have at least one window with a fixed breakable glass, not less than 510 mm in width and 610 mm in height, located not more than 1120 mm above the floor for emergency rescue, on the exterior wall of the room, accessible from public way to the Civil Defence rescue team."
        code_ref: "Ch 3, #5.3.1 / Table 3.20 item 6"
        page_ref: "p.305"
        detail: "Audit CH123-07. Printed because Ch 9 does not require sprinklers in this building."

  - id: moe_education_bc
    match: {occupancy_in: [education_b, education_c]}
    section: "Ch 3, #5.3.2 / Table 3.21 (Schools and Colleges)"
    page: "p.307-308"
    systems:
      - name: "Minimum 2 Exit Stairs - Single Exit Stair Not Permitted (Table 3.21 item 5)"
        spec: "Single exit stair is not permitted. Minimum of 2 exit stairs, accessible from every part of every storey and mezzanine within the permitted commonpath distance (Table 3.21 item 5.i-ii, p.307)."
        code_ref: "Ch 3, #5.3.2 / Table 3.21 item 5"
        page_ref: "p.307"
        detail: "Per Table 3.21 item 5.i (p.307), single exit stair is NOT permitted in Educational Group B (Schools Grade 1-12) or Group C (Colleges, Universities, adult education). A minimum of 2 exit stairs shall be provided, accessible from every part of every storey and mezzanine within the permitted commonpath distance. No villa-conversion grandfathering for B/C (unlike Group A under Table 3.20 #9)."
      - name: "Corridors (Table 3.21 item 2)"
        spec: "Corridors not less than 1830 mm wide where classrooms are on one side only; not less than 3000 mm wide where classrooms are on both sides; looped unless exit stairs are at both extreme ends of the exit corridor; enclosed corridor walls are smoke partitions if the building is sprinkler protected throughout, otherwise the corridor has a 1-hour fire resistance rating."
        code_ref: "Ch 3, #5.3.2 / Table 3.21 item 2"
        page_ref: "p.307"
      - name: "Two Exit Access Doors - Room over 93 m2 (Table 3.21 item 4)"
        required: conditional
        spec: "Every room or space larger than 93 m2 shall have 2 separate exit access doors, remote from each other as per Section 4.4, leading to corridor, which has two exit stairs in opposite directions."
        code_ref: "Ch 3, #5.3.2 / Table 3.21 item 4"
        page_ref: "p.307"
        detail: "Audit CH123-07. Conditional: the inputs give no room areas."
      - name: "Rescue Window in Non-sprinklered Building (Table 3.21 item 7)"
        sprinkler_column: NS
        spec: "Every room or space greater than 23 m2 used for classroom or other educational purposes or normally subject to student occupancy in a non-sprinklered building shall have at least one window with a fixed breakable glass, not less than 510 mm in width and 610 mm in height, located not more than 1120 mm above the floor for emergency rescue, on the exterior wall of the room, accessible from public way to the Civil Defence rescue team."
        code_ref: "Ch 3, #5.3.2 / Table 3.21 item 7"
        page_ref: "p.307"
        detail: "Audit CH123-07. Printed because Ch 9 does not require sprinklers in this building."

  # ------ Healthcare ------
  # Code split (per Ch 3 #5.4):
  #   healthcare_a = Hospitals / nursing homes / inpatient   (Table 3.22, p.309-314) -> Table 3.16 row 4
  #   healthcare_b = Clinics, day-surgery, outpatient        (Table 3.22, p.309-314) -> Table 3.16 row 4
  #   healthcare_c = Ambulatory healthcare                   (Table 3.23, p.315-316) -> Table 3.16 row 5
  - id: moe_healthcare_a
    match: {occupancy: healthcare_a}
    section: "Ch 3, #4 + #5.4.1 / Tables 3.13.4 + 3.16.4 + 3.22"
    page: "p.286, 293, 309-314"
    systems:
      - name: "Occupant Load Factor (Healthcare Group A - Hospitals)"
        spec: "Inpatient 22.3 m²; Sleeping 11.1 m²; Limited care 9.3 m²; Smoke-compartment crossing 2.8 m² net"
      - name: "Travel / Dead-end / Commonpath (Hospitals - Table 3.16 row 4)"
        spec: "Hospitals/Sleeping areas: commonpath S 30 m, dead-end S 9.1 m, travel S 61 m (sprinklered only - non-sprinklered hospitals not permitted). Inside suite to suite exit door 30 m. Inside suite to exit stair 61 m. Sleeping room to room main door 15 m."
        spec_s: "Hospitals, sleeping areas (4.i): commonpath 30 m, dead end 9.1 m, travel 61 m. Inside suite to suite exit door (4.iii): travel 30 m. Inside suite to exit / exit stair (4.iv): travel 61 m. Any sleeping room to its main door (4.v): travel 15 m."
        spec_ns: "Hospitals, sleeping areas (4.i): no non-sprinklered values are printed (Table 3.16 row 4.i prints the S column only), so the commonpath, dead end and travel distance of the sleeping areas are NOT EVALUATED for this non-sprinklered building (see the line below). Inside suite to suite exit door (4.iii): travel 30 m. Inside suite to exit / exit stair (4.iv): travel 61 m. Any sleeping room to its main door (4.v): travel 15 m."
        detail: "Per Table 3.16 row 4 (p.293): hospitals are tabulated as sprinklered-only. Two-exit requirement is absolute (Table 3.22 #4, p.313): single exit is NOT permitted, and every corridor must access two approved exits without passing through intervening rooms."
      # Audit CH123-05: a hospital Ch 9 does not sprinkler has no printed Table 3.16
      # row 4.i limit; named, never left blank (standing rule: a blank never passes).
      - name: "Travel / Dead-end / Commonpath (Hospital Sleeping Areas, Non-sprinklered) - NOT EVALUATED"
        sprinkler_column: NS
        spec: "Not evaluated: Table 3.16 row 4.i (p.293) prints 'Hospitals, Sleeping areas | S 30 m | S 9.1 m | S 61 m' with no non-sprinklered (NS) values, and Ch 9 does not require sprinklers in this building. No commonpath, dead end or travel limit is stated for the sleeping areas; confirm the limits with Civil Defence (or sprinkler the building, which gives the S values)."
        code_ref: "Ch 3, #4.5 / Table 3.16 row 4.i"
        page_ref: "p.293"
        detail: "Audit CH123-05. Open question for an owner ruling: apply the printed S values, or require sprinklers for hospital sleeping areas, when Ch 9 gives no sprinkler system."
      - name: "Smoke Compartments (Table 3.22 item 7)"
        spec: "Every floor having healthcare activity divided into a minimum of 2 smoke compartments, each not exceeding 2100 m2 in area; smoke barrier 1 hour fire resistance rated"
        code_ref: "Ch 3, #5.4.1 / Table 3.22 item 7"
        page_ref: "p.313"
        detail: "Table 3.22 item 7.ii-iv (p.313): an atrium separated in accordance with applicable requirements may have an unlimited smoke compartment area; windows in the smoke barrier are fixed fire rated window assemblies; vision panels in smoke compartment doors are fire rated glazing in approved frames with the bottom of the panel not more than 1090 mm from finished floor."

  - id: moe_healthcare_b
    match: {occupancy: healthcare_b}
    section: "Ch 3, #4 + #5.4.1 / Tables 3.13.4 + 3.16.4 + 3.22"
    page: "p.286, 293, 309-314"
    systems:
      - name: "Occupant Load Factor (Healthcare Group B - Clinics, Day-Surgery)"
        spec: "Consultation 9.3 m²; Clinics 9.3 m²; Limited care 9.3 m²; Smoke-compartment crossing 2.8 m² net"
      - name: "Travel / Dead-end / Commonpath (Clinics - Table 3.16 row 4.ii)"
        spec: "Clinics / Consultancy areas: commonpath S 30 m / NS 23 m  |  dead-end S 15 m / NS 6.1 m  |  travel S 91 m / NS 61 m. Inside suite to exit door S/NS 30 m. Inside suite to exit stair S/NS 61 m."
        spec_s: "Clinics, consultancy areas (4.ii): commonpath 30 m, dead end 15 m, travel 91 m. Inside suite to suite exit door (4.iii): travel 30 m. Inside suite to exit / exit stair (4.iv): travel 61 m."
        spec_ns: "Clinics, consultancy areas (4.ii): commonpath 23 m, dead end 6.1 m, travel 61 m. Inside suite to suite exit door (4.iii): travel 30 m. Inside suite to exit / exit stair (4.iv): travel 61 m."
        detail: "Per Table 3.16 row 4.ii (p.293): Healthcare Group B (clinics, day-surgery, outpatient consultancy) uses the clinics row. Two-exit requirement applies per Table 3.22 #4 (p.313)."
      - name: "Smoke Compartments (Table 3.22 item 7)"
        spec: "Every floor having healthcare activity divided into a minimum of 2 smoke compartments, each not exceeding 2100 m2 in area; smoke barrier 1 hour fire resistance rated"
        code_ref: "Ch 3, #5.4.1 / Table 3.22 item 7"
        page_ref: "p.313"
        detail: "Table 3.22 item 7.ii-iv (p.313): an atrium separated in accordance with applicable requirements may have an unlimited smoke compartment area; windows in the smoke barrier are fixed fire rated window assemblies; vision panels in smoke compartment doors are fire rated glazing in approved frames with the bottom of the panel not more than 1090 mm from finished floor."

  - id: moe_healthcare_c
    match: {occupancy: healthcare_c}
    section: "Ch 3, #4 + #5.4.2 / Tables 3.13.5 + 3.16.5 + 3.23"
    page: "p.286, 293, 315-316"
    systems:
      - name: "Occupant Load Factor (Healthcare Group C - Ambulatory)"
        spec: "Ambulatory 13 m² (per Table 3.13.5)"
      - name: "Travel / Dead-end / Commonpath (Ambulatory - Table 3.16 row 5)"
        spec: "Ambulatory Health care: commonpath S 30 m / NS 23 m  |  dead-end S 15 m / NS 6.1 m  |  travel S 61 m / NS 46 m"
        spec_s: "Ambulatory health care (5.i): commonpath 30 m, dead end 15 m, travel 61 m."
        spec_ns: "Ambulatory health care (5.i): commonpath 23 m, dead end 6.1 m, travel 46 m."
        detail: "Per Table 3.16 row 5 (p.293) + Table 3.23 (p.315-316). Single exit is NOT permitted (Table 3.23 #2, p.315). Rooms or spaces larger than 232 m² require 2 separate remote exits (#3). 1-hour fire-rated separation from other tenants with 44 mm thick doors (#5)."

  # Table 3.23 item 6.i (p.316): every floor having area more than 900 m2 per story is
  # divided into 2 smoke compartments. Same pair as the villa 400 m2 rule: required when
  # the largest storey is known to exceed 900 m2, conditional when no storey area is
  # entered and the GFA / ground floor could hide one (owner card 13.10.2026 05:45Z, G11).
  - id: moe_healthcare_c_smoke_compartments
    match: {occupancy: healthcare_c, largest_storey_area_min_m2_gt: 900}
    section: "Ch 3, #5.4.2 / Table 3.23 item 6"
    page: "p.316"
    systems:
      - name: "Smoke Compartments - Storey over 900 m2 (Table 3.23 item 6)"
        spec: "A storey exceeds 900 m2: every such floor divided into a minimum of 2 smoke compartments, each not exceeding 2000 m2 in area; smoke barrier 1 hour fire resistance rated"
        code_ref: "Ch 3, #5.4.2 / Table 3.23 item 6"
        page_ref: "p.316"
        detail: "Table 3.23 item 6.ii-iv (p.316): the area of an atrium separated in accordance with applicable requirements may be unlimited; windows in the smoke barrier are fixed fire rated window assemblies; vision panels in smoke compartment doors are fire-rated glazing in approved frames, the glazing and bottom of the panel not more than 1090 mm from the finished floor."

  - id: moe_healthcare_c_smoke_compartments_check
    match:
      occupancy: healthcare_c
      largest_storey_area_min_m2_lte: 900
      largest_storey_area_m2_lte: 0
      not: {gross_floor_area_m2_lte: 900, ground_floor_bua_m2_lte: 900}
    section: "Ch 3, #5.4.2 / Table 3.23 item 6"
    page: "p.316"
    systems:
      - name: "Smoke Compartments - Storey over 900 m2 (Table 3.23 item 6)"
        required: conditional
        spec: "If any storey exceeds 900 m2: minimum of 2 smoke compartments, each not exceeding 2000 m2 in area, 1 hour fire resistance rated smoke barrier (the inputs give no per-storey area)"
        code_ref: "Ch 3, #5.4.2 / Table 3.23 item 6"
        page_ref: "p.316"

  # ------ Residential ------
  - id: moe_residential
    match: {occupancy: residential}
    section: "Ch 3, #4 + #5.5 / Tables 3.13 row 6 + 3.16 row 6"
    page: "p.286, 293"
    systems:
      - name: "Occupant Load Factor (Residential)"
        spec: "Apartments: 18.6 m² gross"
      - name: "Travel / Dead-end / Commonpath (Residential)"
        spec: "Apartment main door to exit: commonpath sprinklered 15 m / non 10.7 m. Dead-end sprinklered 15 m / non 10.7 m. Travel sprinklered 61 m / non 30 m. Within apartment to main door: S 38 m / NS 23 m (SAME numbers apply as BOTH Commonpath AND Travel - Table 3.16 row 6.ii). Other than dwelling to exit stair: travel sprinklered 76 m / non 61 m."
        spec_s: "Apartment main door to exit (6.i): commonpath 15 m, dead end 15 m, travel 61 m. Within apartment to main door (6.ii): commonpath 38 m, dead end NA, travel 38 m. Apartment main door to outside stair (6.iii): commonpath 15 m, dead end 15 m, travel 61 m. Other than dwelling units to exit stair (6.iv): commonpath 15 m, dead end 15 m, travel 76 m."
        spec_ns: "Apartment main door to exit (6.i): commonpath 10.7 m, dead end 10.7 m, travel 30 m. Within apartment to main door (6.ii): commonpath 23 m, dead end NA, travel 23 m. Apartment main door to outside stair (6.iii): commonpath 10.7 m, dead end 10.7 m, travel 30 m. Other than dwelling units to exit stair (6.iv): commonpath 10.7 m, dead end 10.7 m, travel 61 m."
        detail: "Per Table 3.16 row 6.ii (p.293) the 'Within Apartment to Main Door' row tabulates the SAME 38 m / 23 m number under BOTH the Commonpath column AND the Travel Distance column (dead-end is NA). The tool cannot distinguish these two semantic uses with a single value; designers should apply the limit to both metrics independently when sizing internal apartment corridors."
      # ---- fix round 28.10.2026 (ch123): Table 3.24 rows (CH123-06) ----
      - name: "Residential A: Corridor (Table 3.24 item 3)"
        spec: "Corridor shall be minimum of 1200 mm in width; separated from other areas of the building by 1 hour fire resistance rated construction; grilles and louvers prohibited in walls or doors of exit access corridors."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 3"
        page_ref: "p.317"
        detail: "Audit CH123-06."
      - name: "Residential A: Dwelling Unit Separation (Table 3.24 item 4)"
        spec: "Dwelling units shall be separated from each other by walls and floors constructed as fire barriers having a minimum of 1 hour fire resistance rating."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 4"
        page_ref: "p.319"
        detail: "Audit CH123-06."
      - name: "Residential A: Hazardous Area Separation (Table 3.24 item 5)"
        required: conditional
        spec: "For each of these rooms where provided: boiler and heater rooms, bulk and central laundry, plant maintenance and paint shops, garbage rooms: fire barriers having 1 hour fire resistance rating and sprinklers shall be provided; soiled linen rooms: 1 hour fire resistance rating and sprinklered; garbage chutes: 2 hour fire resistance rating; storage rooms outside dwelling units: fire barriers having 1 hour fire resistance rating or sprinklers; on roof LPG tanks: fixed deluge water spray system."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 5"
        page_ref: "p.319"
        detail: "Audit CH123-06. Conditional: applies to each room the building has (the inputs do not list every room)."
      - name: "Residential A: Doors (Table 3.24 item 6)"
        spec: "Doors in bedrooms or internal rooms not less than 810 mm in width; main exit door of the unit or apartment not less than 915 mm clear width; bathroom doors not less than 710 mm (810 mm where serving persons with severe mobility impairments); balcony door not less than 810 mm; balcony and terrace access restricted with a door having child lock or latch; window opening restricted to 100 mm with windows safety latch; closet door latches openable by children from inside; bathroom doors openable from the outside in an emergency when locked; while the flat is occupied, no locking device that impedes or prohibits egress or cannot be easily disengaged."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 6 (DOORS)"
        page_ref: "p.319"
        detail: "Audit CH123-06. Table 3.24 prints two items numbered 6 (DOORS and REMOTENESS OF EXITS)."
      - name: "Residential A: Sole Means of Egress Through a Nonresidential Occupancy (Table 3.24 item 1)"
        required: conditional
        spec: "Where the apartment building shares the building with a nonresidential occupancy: no dwelling unit shall have its sole means of egress pass through that occupancy, unless the building is sprinklered and egress is not through hazardous content locations (item 1.i), or the egress is separated from the non-residential occupancies by a 1 hour fire resistance rated corridor and is not through hazardous content locations (item 1.ii), or the non residential occupancy is fully sprinklered as per Ch 9 (item 1.iii)."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 1"
        page_ref: "p.317"
        detail: "Audit CH123-06. Conditional: no input says the building shares a nonresidential occupancy."
      - name: "Residential A: Remoteness of Exits Not Applied (Table 3.24 item 6, REMOTENESS)"
        required: conditional
        spec: "The remoteness of exit stairs of Section 4.4 does not apply to residential apartments provided all of: exit corridor not looped; every apartment door arranged so that the commonpath and dead ends are zero; exit stairs available on opposite sides of every apartment door; travel distance from the door to the exit stair less than 30 m."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 6 (REMOTENESS OF EXITS)"
        page_ref: "p.319"
        detail: "Audit CH123-06. A permission: Table 3.15.a applies unless every condition is met."
      - name: "Residential A: Exits from Podium (Table 3.24 item 7)"
        required: conditional
        spec: "Residential occupancies having open podiums for assembly purposes shall ensure 2 exits remotely located as per Section 4.4 where the required commonpath and travel distances are non compliant: exits back into the building to the building exit stairs, enclosed exit stairs to exterior discharge from the podium, open or outside exterior stairs per Table 3.4 item 14 discharging directly to the public way, or a combination."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 7"
        page_ref: "p.319"
        detail: "Audit CH123-06. Conditional: no input says the building has an open podium used for assembly."

