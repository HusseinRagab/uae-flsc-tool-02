  # ------ Villas ------
  # Table 3.13 rows 8-9 and Table 3.16 rows 8-9 print None / NA (no OL factor, no
  # travel distances), but Table 3.27 (private villa, p.323) sets mandatory egress
  # items. #5.6.2 (p.323): Table 3.27 does not apply to commercial villas (#5.7,
  # Table 3.28, p.324).
  - id: moe_villa_private
    match: {occupancy: villa_private}
    section: "Ch 3, #5.6 / Table 3.27"
    page: "p.323"
    systems:
      - name: "Primary and Secondary Means of Escape (Table 3.27 item 2.i)"
        spec: "Every sleeping room and every living area shall have a primary means of escape (a door, stairway or ramp giving unobstructed travel to the outside) and a secondary means of escape. If the villa is sprinkler protected, the secondary means of escape is not required."
        code_ref: "Ch 3, #5.6 / Table 3.27 item 2.i, 2.iv"
        page_ref: "p.323"
        detail: "Secondary means (item 2.iv): a door, stairway or ramp remote from the primary exit leading outside; a passage through an adjacent non-lockable space or set back area; a permanent stair to the roof with an outside stair to the level of discharge; or an operable exterior window not less than 510 mm wide and 610 mm high, clear opening not less than 0.53 m2, bottom not more than 6100 mm from finished ground floor. Civil Defence highly recommends a second primary escape (item 2.ii)."
      - name: "Doors (Table 3.27 item 3)"
        spec: "Closet door latches openable by children from inside the closet; bathroom doors openable from the outside in an emergency when locked; while the villa is occupied, no locking device that impedes or prohibits egress or cannot be easily disengaged."
        code_ref: "Ch 3, #5.6 / Table 3.27 item 3"
        page_ref: "p.323"
      - name: "Hallway (Table 3.27 item 4.i)"
        spec: "Hallway minimum 915 mm wide with a clear headroom of 2030 mm, without obstructions"
        code_ref: "Ch 3, #5.6 / Table 3.27 item 4.i"
        page_ref: "p.323"
      - name: "Egress Through a Nonresidential Occupancy (Table 3.27 item 1)"
        required: conditional
        spec: "Where the private villa shares a building with a nonresidential occupancy: no private villa shall have its sole means of egress pass through that occupancy, unless the building is sprinklered and egress is not through hazardous content locations (item 1.i), or the egress is separated from the nonresidential occupancies by a 1 hour fire resistance rated corridor and is not through hazardous content locations (item 1.ii), or the non residential occupancy is fully sprinklered as per Ch 9 (item 1.iii)."
        code_ref: "Ch 3, #5.6 / Table 3.27 item 1"
        page_ref: "p.323"
        detail: "Audit CH123-18. Conditional: no input says whether the villa shares a building with a nonresidential occupancy."

  # Table 3.27 item 2.iii: "Where any floor within villa exceeds 400 m2, two primary
  # means of escape remote from each other shall be provided." The largest floor is at
  # least max(GF BUA, GFA / storeys): over 400 m2 proves the rule applies.
  - id: moe_villa_private_two_primary
    match: {occupancy: villa_private, largest_storey_area_min_m2_gt: 400}
    section: "Ch 3, #5.6 / Table 3.27 item 2.iii"
    page: "p.323"
    systems:
      - name: "Two Primary Means of Escape - Floor over 400 m2 (Table 3.27 item 2.iii)"
        spec: "A floor of the villa exceeds 400 m2: two primary means of escape remote from each other"
        code_ref: "Ch 3, #5.6 / Table 3.27 item 2.iii"
        page_ref: "p.323"

  - id: moe_villa_private_two_primary_check
    match:
      occupancy: villa_private
      largest_storey_area_min_m2_lte: 400
      largest_storey_area_m2_lte: 0
      not: {gross_floor_area_m2_lte: 400, ground_floor_bua_m2_lte: 400}
    section: "Ch 3, #5.6 / Table 3.27 item 2.iii"
    page: "p.323"
    systems:
      - name: "Two Primary Means of Escape - Floor over 400 m2 (Table 3.27 item 2.iii)"
        required: conditional
        spec: "If any floor of the villa exceeds 400 m2: two primary means of escape remote from each other (the inputs give no per-floor area)"
        code_ref: "Ch 3, #5.6 / Table 3.27 item 2.iii"
        page_ref: "p.323"

  - id: moe_villa_private_basement
    match: {occupancy: villa_private, floors_below_grade_gt: 0}
    section: "Ch 3, #5.6 / Table 3.27 item 2.v-vi"
    page: "p.323"
    systems:
      - name: "Basement Exit Stair (Table 3.27 item 2.vi)"
        spec: "Basements shall have a standard enclosed exit stair leading to the discharge level; spiral stairs, winders and open stairs are not permitted for access and exit from basements (item 2.v)."
        code_ref: "Ch 3, #5.6 / Table 3.27 item 2.v-vi"
        page_ref: "p.323"

  - id: moe_villa_commercial
    match: {occupancy: villa_commercial}
    section: "Ch 3, #5.7 / Table 3.28"
    page: "p.324"
    systems:
      - name: "Means of Egress - Commercial Villa (Table 3.28)"
        spec: "Comply with Ch 3 #5.7 and Table 3.28 along with all other sections of this chapter; where they conflict, #5.7 prevails (#5.7.1). The private-villa Table 3.27 does not apply to commercial villas and groups of villas (#5.6.2, p.323)."
        code_ref: "Ch 3, #5.7.1 / Table 3.28"
        page_ref: "p.324"
        detail: "Table 3.13 row 9 and Table 3.16 row 9 print None / NA: there is no occupant-load factor or travel distance for commercial villas. The Table 3.28 items follow as separate lines."
      - name: "Commercial Villa: Separation (Table 3.28 item 2.i)"
        spec: "Commercial villas separated from each other by a 2 hour fire resistance rated construction"
        code_ref: "Ch 3, #5.7 / Table 3.28 item 2.i"
        page_ref: "p.324"
      - name: "Commercial Villa: Primary and Secondary Means of Escape (Table 3.28 item 3.i)"
        spec: "Every sleeping room and every living area shall have a primary means of escape (a door, stairway or ramp giving unobstructed travel to the outside) and a secondary means of escape. If the villa is sprinkler protected, the secondary means of escape is not required."
        code_ref: "Ch 3, #5.7 / Table 3.28 item 3.i, 3.iv"
        page_ref: "p.324"
        detail: "Item 3.i prints 'of a private villa' inside the commercial-villa table; read as the commercial villa. Secondary means (item 3.iv): a door, stairway or ramp remote from the primary exit leading outside; a passage through an adjacent non lockable space or set back area, remote from the primary exit and leading outside; a permanent stair to the roof with an outside stair (spiral, steel or standard) from the roof to the level of discharge, remote from the primary exit; or an operable window on the exterior wall not less than 510 mm wide and 610 mm high, clear opening not less than 0.53 m2, bottom not more than 6100 mm from finished ground floor. Civil Defence highly recommends a second primary escape; egress through the roof by a fixed steel, concrete or spiral stair to the ground is acceptable as the second primary means (item 3.ii)."
      - name: "Commercial Villa: Doors (Table 3.28 item 4)"
        spec: "Closet door latches openable by children from inside the closet; bathroom doors openable from the outside in an emergency when locked; while the villa is occupied, no locking device that impedes or prohibits egress or cannot be easily disengaged."
        code_ref: "Ch 3, #5.7 / Table 3.28 item 4"
        page_ref: "p.324"
      - name: "Commercial Villa: Hallway (Table 3.28 item 5.i)"
        spec: "Hallway minimum 915 mm wide with a clear headroom of 2030 mm, without obstructions"
        code_ref: "Ch 3, #5.7 / Table 3.28 item 5.i"
        page_ref: "p.324"
      - name: "Commercial Villa: Egress Through a Nonresidential Occupancy (Table 3.28 item 1)"
        required: conditional
        spec: "Where the commercial villa shares a building with a nonresidential occupancy: its sole means of egress shall not pass through that occupancy, unless the egress is separated from it by a 1 hour fire resistance rated corridor and does not pass through hazardous content locations (item 1.ii), or the nonresidential occupancy is fully sprinklered per Ch 9 (item 1.iii)."
        code_ref: "Ch 3, #5.7 / Table 3.28 item 1"
        page_ref: "p.324"
        detail: "Conditional: no input says whether the villa shares a building with a nonresidential occupancy. Items 1.i (no exception) and 1.ii / 1.iii (exceptions) are printed as separate items; read here as the rule plus its exceptions."

  # Table 3.28 item 3.iii: same pair as the private villa 400 m2 rule above.
  - id: moe_villa_commercial_two_primary
    match: {occupancy: villa_commercial, largest_storey_area_min_m2_gt: 400}
    section: "Ch 3, #5.7 / Table 3.28 item 3.iii"
    page: "p.324"
    systems:
      - name: "Commercial Villa: Two Primary Means of Escape - Floor over 400 m2 (Table 3.28 item 3.iii)"
        spec: "A floor of the villa exceeds 400 m2: two primary means of escape remote from each other"
        code_ref: "Ch 3, #5.7 / Table 3.28 item 3.iii"
        page_ref: "p.324"

  - id: moe_villa_commercial_two_primary_check
    match:
      occupancy: villa_commercial
      largest_storey_area_min_m2_lte: 400
      largest_storey_area_m2_lte: 0
      not: {gross_floor_area_m2_lte: 400, ground_floor_bua_m2_lte: 400}
    section: "Ch 3, #5.7 / Table 3.28 item 3.iii"
    page: "p.324"
    systems:
      - name: "Commercial Villa: Two Primary Means of Escape - Floor over 400 m2 (Table 3.28 item 3.iii)"
        required: conditional
        spec: "If any floor of the villa exceeds 400 m2: two primary means of escape remote from each other (the inputs give no per-floor area)"
        code_ref: "Ch 3, #5.7 / Table 3.28 item 3.iii"
        page_ref: "p.324"

  - id: moe_villa_commercial_basement
    match: {occupancy: villa_commercial, floors_below_grade_gt: 0}
    section: "Ch 3, #5.7 / Table 3.28 item 3.v-vi"
    page: "p.324"
    systems:
      - name: "Commercial Villa: Basement Exit Stair (Table 3.28 item 3.vi)"
        spec: "Basements shall have a standard enclosed exit stair leading to the discharge level; spiral stairs, winders and open stairs are not permitted for access and exit from basements (item 3.v)."
        code_ref: "Ch 3, #5.7 / Table 3.28 item 3.v-vi"
        page_ref: "p.324"

  # ------ Occupancies with no Table 3.13 / 3.16 row ------
  # Owner ruling 12.10.2026, Ch3 Q2: MOE is not evaluated for these until the per-use
  # areas are entered; no 2-exit minimum is printed as if it were the answer.
  - id: moe_actual_use
    match:
      occupancy_in: [motor_fuel_dispensing, infrastructure, mixed_multiple, high_depth_underground, low_depth_underground]
      use_area_total_m2_lte: 0
    section: "Ch 3, #1.4.5 + #4 / Tables 3.13 + 3.16 by actual use"
    page: "p.242, 285-287, 293-295"
    systems:
      - name: "Means of Egress Not Evaluated - Enter Per-Use Areas (#1.4.5)"
        spec: "Table 3.13 has no row for this occupancy. The occupant load, the Table 3.14 number of exits and the Table 3.16 limits are not evaluated until the floor area of each actual use is entered (MOE settings: per-use areas). No exit count is stated."
        code_ref: "Ch 3, #1.4.5 / #4.1.2 / Table 3.13"
        page_ref: "p.242, 283, 285-287"
        detail: "Owner ruling 12.10.2026, Ch3 Q2. #1.4.5 (p.242) and #4.1.2 (p.283): occupant load = sum over each area of (floor area assigned to that use / Table 3.13 factor of that use), each rounded up; then Table 3.14 per storey (#4.3.1)."
      - name: "Travel / Dead-end / Commonpath by Actual Use (Table 3.16)"
        spec: "Table 3.16 has no row for this occupancy: apply the Table 3.16 row (commonpath, dead end, travel distance) of the actual use of each area."
        code_ref: "Ch 3, #4.5 / Table 3.16"
        page_ref: "p.293-295"

  - id: moe_actual_use_entered
    match:
      occupancy_in: [motor_fuel_dispensing, infrastructure, mixed_multiple, high_depth_underground, low_depth_underground]
      use_area_total_m2_gt: 0
    section: "Ch 3, #1.4.5 + #4 / Tables 3.13 + 3.16 by actual use"
    page: "p.242, 285-287, 293-295"
    systems:
      - name: "Occupant Load by Actual Use (Table 3.13, #1.4.5)"
        spec: "Occupant load from the per-use areas entered: each area / its Table 3.13 factor, rounded up, then added; Table 3.14 per storey. The result and the exit count are on the occupant load summary."
        code_ref: "Ch 3, #1.4.5 / #4.1.2 / Table 3.13"
        page_ref: "p.242, 283, 285-287"
        detail: "Owner ruling 12.10.2026, Ch3 Q2."
      - name: "Travel / Dead-end / Commonpath by Actual Use (Table 3.16)"
        spec: "Table 3.16 has no row for this occupancy: apply the Table 3.16 row (commonpath, dead end, travel distance) of the actual use of each area."
        code_ref: "Ch 3, #4.5 / Table 3.16"
        page_ref: "p.293-295"
