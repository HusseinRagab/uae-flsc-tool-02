  # ---- fix round 28.10.2026 (ch123): Table 3.24 item 2 single exit stair (CH123-06) ----
  # Input: has_single_exit_stair (Ch 9 Tables 9.20.c / 9.21.c). Ticked -> the printed
  # conditions are required; not ticked -> stated as a conditional permission.
  - id: moe_residential_single_exit
    match: {occupancy: residential, has_single_exit_stair: true}
    section: "Ch 3, #5.5.1 / Table 3.24 item 2"
    page: "p.317"
    systems:
      - name: "Residential A: Single Exit Stair Permission (Table 3.24 item 2)"
        spec: &t242 "New lowrise residential buildings only. A single exit stair OR scissor stair is permitted only if all of: (a) maximum height of 15 m (Lowrise building); (b) typical floor area does not exceed 500 m2; (c) not more than 6 dwelling units in a floor; (d) travel distance from dwelling unit door to exit stair does not exceed 10.7 m; (e) exit stair is a 2 hour fire rated enclosure, minimum width of 1200 mm, discharging directly to outside at the discharge level; (f) the exit corridor accessing the single exit stair is 1 hour fire rated (item 2.i). Or: an outside stair, enclosed or open, maximum height 15 m, not more than 2 dwelling units in a floor, travel from dwelling unit door to exit stair not more than 10.7 m (item 2.ii). Or: maximum height 15 m, the dwelling unit has direct access to an interior exit stair serving only that dwelling unit, 2 hour fire rated enclosure, minimum width of 1200 mm (item 2.iii). Otherwise two exits per Table 3.14."
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 2"
        page_ref: "p.317"
        detail: "Audit CH123-06. Ticked: the building has a single exit stair (Ch 9 settings); every condition of one of items 2.i-iii shall be met."
  - id: moe_residential_single_exit_check
    match: {occupancy: residential, has_single_exit_stair: false}
    section: "Ch 3, #5.5.1 / Table 3.24 item 2"
    page: "p.317"
    systems:
      - name: "Residential A: Single Exit Stair Permission (Table 3.24 item 2)"
        required: conditional
        spec: *t242
        code_ref: "Ch 3, #5.5.1 / Table 3.24 item 2"
        page_ref: "p.317"
        detail: "Audit CH123-06. Conditional: applies only where a single exit stair is used (not ticked in the Ch 9 settings)."

  # ---- fix round 28.10.2026 (ch123): Table 3.25 Residential Group B (CH123-06) ----
  - id: moe_residential_b_table_3_25
    match: {occupancy_in: [staff_accommodation, hostel]}
    section: "Ch 3, #5.5.2 / Table 3.25"
    page: "p.321"
    systems:
      - name: "Residential B: Corridor (Table 3.25 item 3)"
        spec: "Every sleeping room, living space and dining area shall have access to an exit corridor; corridor minimum of 1200 mm in width; separated from other areas of the building by 1 hour fire resistance rated construction; grilles and louvers prohibited in corridors."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 3"
        page_ref: "p.321"
        detail: "Audit CH123-06."
      - name: "Residential B: Separation (Table 3.25 item 4)"
        spec: "Sleeping rooms separated from each other, and from the corridor, by walls and floors constructed as fire barriers having a minimum of 1 hour fire resistance rating; cross-corridor openings in smoke barriers protected by a pair of swinging doors."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 4"
        page_ref: "p.321"
        detail: "Audit CH123-06."
      - name: "Residential B: Single Exit Not Permitted (Table 3.25 item 5)"
        spec: "Single exit shall not be permitted. 2 exits shall be available from every part of every floor."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 5"
        page_ref: "p.321"
        detail: "Audit CH123-06."
      - name: "Residential B: Hazardous Area Separation (Table 3.25 item 7)"
        required: conditional
        spec: "For each of these rooms where provided: boiler and heater rooms, bulk and central laundry, plant maintenance and paint shops, garbage rooms, storage rooms outside dwelling units: fire barriers having 1 hour fire resistance rating and sprinklers shall be provided; soiled linen rooms: 1-hour fire resistance rating and sprinklered; garbage chutes: 2 hour fire resistance rating; on roof LPG tanks: fixed deluge water spray system."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 7"
        page_ref: "p.321"
        detail: "Audit CH123-06. Conditional: applies to each room the building has. Table 3.25 item 7.vii prints 'and sprinklers' for storage rooms (Table 3.24 and 3.26 print 'or sprinklers')."
      - name: "Residential B: Multiple Occupancy (Table 3.25 item 1)"
        required: conditional
        spec: "Where the building has a nonresidential or non healthcare occupancy: no dwelling unit shall have its sole means of egress pass through it (item 1.i); no Residential Group B occupancy located above it unless the Residential Group B occupancy and its exits are separated from it by construction having a minimum 2-hour fire resistance rating (item 1.ii)."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 1"
        page_ref: "p.321"
        detail: "Audit CH123-06. Conditional: no input says the building has another occupancy."

  # Table 3.25 item 6 (p.321): floors exceeding 2000 m2, 2 smoke compartments. Same pair as
  # Table 3.23 item 6: required when the largest storey is known to exceed 2000 m2,
  # conditional when no storey area is entered and the GFA / ground floor could hide one.
