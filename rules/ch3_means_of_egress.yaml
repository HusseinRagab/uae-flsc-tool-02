  # ------ Hotel ------
  - id: moe_hotel
    match: {occupancy_in: [hotel_a, hotel_b, hotel_c]}
    section: "Ch 3, #4 + #5.9 / Tables 3.13.11 + 3.16"
    page: "p.286, 294"
    systems:
      - name: "Occupant Load Factor (Hotel)"
        spec: "Hotel apartments / guest rooms: 18.6 m² gross"
      - name: "Travel / Dead-end / Commonpath (Hotel - Table 3.16 row 11)"
        spec: "Hotel guest room MAIN DOOR to exit: commonpath S 15 m / NS 10.7 m  |  dead-end S 15 m / NS 10.7 m  |  travel S 61 m / NS 53 m. WITHIN guest room to main door: travel S 38 m / NS 23 m (commonpath/dead-end NA)."
        spec_s: "Hotel guest room main door to exit: commonpath 15 m, dead end 15 m, travel 61 m. Within guest room to main door: travel 38 m (commonpath / dead end NA)."
        spec_ns: "Hotel guest room main door to exit: commonpath 10.7 m, dead end 10.7 m, travel 53 m. Within guest room to main door: travel 23 m (commonpath / dead end NA)."
        detail: "Per Table 3.16 row 11 (p.294). Note that hotel travel distances (S 61 / NS 53) are TIGHTER than the residential 'Other than dwelling to exit stair' numbers (S 76 / NS 61) - earlier versions of this rule mistakenly used the residential figures."
      # ---- fix round 28.10.2026 (ch123): Table 3.30 rows (CH123-07) ----
      # #5.9.1 (p.327) applies Table 3.30 to Hotel Groups A, B, C; the table title prints
      # "Hotel, Group A, C".
      - name: "Hotel: Corridors (Table 3.30 item 2)"
        spec: "Minimum common exit corridor width 1200 mm; corridor of 1 hour fire resistance rated construction; every sleeping room or suite has a door leading directly to an exit access corridor, unless the intervening room is a day room, group activity room or other common space; transoms, louvers or transfer grilles prohibited in walls or doors of exit access corridors."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 2"
        page_ref: "p.327"
        detail: "Audit CH123-07."
      - name: "Hotel: Single Exit Not Permitted (Table 3.30 item 3)"
        spec: "Single exit shall not be permitted. 2 enclosed exits shall be available from every part of every floor."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 3"
        page_ref: "p.327"
        detail: "Audit CH123-07."
      - name: "Hotel: Separation (Table 3.30 item 5)"
        spec: "Each hotel guest room, including guest suites, and dormitory room separated from other guest rooms or dormitory rooms by walls and floors constructed as fire barriers having a minimum 1-hour fire resistance rating; kitchen separated from rest of the hotel area by 1 hour fire resistance rated construction."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 5"
        page_ref: "p.327"
        detail: "Audit CH123-07."
      - name: "Hotel: Doors (Table 3.30 item 7)"
        spec: "Balcony and terrace access restricted with a door having child lock or latch; window opening restricted to 100 mm with windows safety latch; doors in resident or guest sleeping rooms or internal rooms not less than 810 mm in width; main exit door of the unit not less than 915 mm clear width; bathroom doors not less than 710 mm (810 mm as printed for the mobility-impairment case); balcony door not less than 810 mm."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 7"
        page_ref: "p.328"
        detail: "Audit CH123-07. Item 7.v prints 'unless they are not serving persons with severe mobility impairments, where the required width shall not be less than 810 mm'."
      - name: "Hotel: Exit Discharge Distance (Table 3.30 item 8)"
        spec: "The distance of travel from the termination of the exit enclosure to an exterior door leading to a public way through enclosed corridor shall not exceed 30 m."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 8"
        page_ref: "p.328"
        detail: "Audit CH123-07."
      - name: "Hotel: Furnishings (Table 3.30 item 10)"
        spec: "Draperies, curtains and other similar loosely hanging furnishings and decorations meet the flame propagation performance criteria and are listed and approved by Civil Defence; upholstered furniture, mattresses and carpets listed and approved by Civil Defence (Section 7 Material Approval)."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 10"
        page_ref: "p.328"
        detail: "Audit CH123-07."
      - name: "Hotel: Two Exit Access Doors - Room over 185 m2 (Table 3.30 item 4)"
        required: conditional
        spec: "Any guest room or any guest suite or dormitory sleeping room larger than 185 m2 shall have 2 exit access doors remotely located from each other as per Section 4.4."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 4"
        page_ref: "p.327"
        detail: "Audit CH123-07. Conditional: the inputs give no room areas."
      - name: "Hotel: Hazardous Area Separation (Table 3.30 item 9)"
        required: conditional
        spec: "For each of these rooms where provided: boiler and fuel fired heater rooms, gift shops, bulk and central laundry, plant maintenance and paint shops, garbage rooms, storage rooms: fire barriers having 1 hour fire resistance rating and sprinklers; employee locker rooms: fire barriers having 1 hour fire resistance rated construction; soiled linen rooms: 1-hour fire resistance rating and sprinklered; garbage chutes: 2 hour fire resistance rating; LPG tanks: deluge water spray system."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 9"
        page_ref: "p.328"
        detail: "Audit CH123-07. Conditional: applies to each room the building has."
      - name: "Hotel: Multiple Occupancy (Table 3.30 item 1)"
        required: conditional
        spec: "Where the building has a nonresidential occupancy: no guest room, guest suite or dormitory sleeping room shall have its sole means of egress pass through it (item 1.i), unless such egress is separated from the non-residential occupancies by a 1 hour fire resistance rated corridor and is not through hazardous content locations (item 1.ii), or the non residential occupancy is fully sprinklered as per Ch 9 (item 1.iii)."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 1"
        page_ref: "p.327"
        detail: "Audit CH123-07. Conditional: no input says the building has another occupancy."
      - name: "Hotel: Exit Discharge into Court Yard or Fire Compartment (Table 3.30 item 6)"
        required: conditional
        spec: "A permission: exit discharge into a fenced or walled court yard where not more than 2 court yard walls are common to the building walls, the yard sized for all occupants at not less than 15 m from the building with a net area of 1.4 m2 per person; or into a fire compartment separated from other compartments or building by 1 hour fire resistance rated construction."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 6"
        page_ref: "p.327"
        detail: "Audit CH123-07."
      - name: "Hotel: Remoteness of Exits Not Applied (Table 3.30 item 11)"
        required: conditional
        spec: "The remoteness of exit stairs of Section 4.4 does not apply to hotels and hotel apartments provided all of: exit corridor not looped; every guest room door arranged so that the commonpath and dead ends are zero; exit stairs available on opposite sides of every guest room door; travel distance from guest room door to exit stair less than 30 m."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 11"
        page_ref: "p.329"
        detail: "Audit CH123-07. A permission: Table 3.15.a applies unless every condition is met."
      - name: "Hotel: Exits from Podium (Table 3.30 item 12)"
        required: conditional
        spec: "Hotel occupancies having open podiums for assembly purposes shall ensure 2 exits remotely located as per Section 4.4: exits back into the building to the building exit stairs, enclosed exit stairs to exterior discharge from the podium, open or outside exterior stairs per Table 3.4 item 14 discharging directly to the public way, or a combination."
        code_ref: "Ch 3, #5.9 / Table 3.30 item 12"
        page_ref: "p.329"
        detail: "Audit CH123-07. Conditional: no input says the building has an open podium used for assembly."

  # ------ Mercantile / Mall ------
  - id: moe_mercantile
    match: {occupancy_in: [mercantile_a, mercantile_b, mercantile_c], hazard_class_in: [LH, OH1, OH2]}
    section: "Ch 3, #4 + #5.11 / Tables 3.13.13 + 3.16"
    page: "p.286, 294"
    systems:
      - name: "Occupant Load Factor (Mercantile)"
        spec: "Sales below street: 2.8 m². Sales street floor: 2.8 m². Sales above street: 5.6 m². Two-or-more-street-floors: 3.7 m². Office areas only: 9.3 m². Goods areas (no public): 27.9 m²"
      - name: "Travel / Commonpath / Dead-end (Mercantile A/B/C - Table 3.16 row 13.i)"
        spec: "Travel: S 76 m, NS 46 m  |  Commonpath: S 30 m, NS 23 m  |  Dead-end: S 15 m, NS 6.1 m"
        spec_s: "Travel 76 m  |  Commonpath 30 m  |  Dead end 15 m"
        spec_ns: "Travel 46 m  |  Commonpath 23 m  |  Dead end 6.1 m"
        detail: "Standard retail mercantile (Class A, B, C - shops, showrooms, hypermarkets). For OPEN-AIR mercantile (row 13.ii) all distances are 0 m commonpath / 0 m dead-end / NA travel. For HIGH-HAZARD mercantile (fireworks, aerosol retail, etc.) see the moe_mercantile_high_hazard branch (row 13.iii)."

  # High-hazard mercantile - matches main mercantile occupancies BUT only when hazard_class = HH.
  # Per Table 3.16 row 13.iii the sprinkler discount is removed and travel is severely tightened.
  - id: moe_mercantile_high_hazard
    match: {occupancy_in: [mercantile_a, mercantile_b, mercantile_c], hazard_class_is: HH}
    section: "Ch 3, #4 + #5.11 / Table 3.16 row 13.iii"
    page: "p.294"
    systems:
      - name: "Occupant Load Factor (Mercantile)"
        spec: "Sales below street: 2.8 m². Sales street floor: 2.8 m². Sales above street: 5.6 m². Two-or-more-street-floors: 3.7 m². Office areas only: 9.3 m². Goods areas (no public): 27.9 m²"
        code_ref: "Ch 3, Table 3.13 row 13"
        page_ref: "p.286"
      - name: "Travel / Commonpath / Dead-end (High-Hazard Mercantile - Table 3.16 row 13.iii)"
        spec: "Commonpath: S 0 m, NS 0 m  |  Dead-end: S 15 m, NS 6.1 m  |  Travel: S 23 m, NS 23 m"
        spec_s: "Commonpath 0 m  |  Dead end 15 m  |  Travel 23 m"
        spec_ns: "Commonpath 0 m  |  Dead end 6.1 m  |  Travel 23 m"
        detail: "Applies to High-Hazard Mercantile (e.g. fireworks retail, aerosol-can retail, flammable-liquid retail). Per Table 3.16 row 13.iii (p.294) there is ZERO commonpath both sprinklered AND non-sprinklered (every sales position must have direct exit access) and travel is capped at 23 m WITH NO sprinkler benefit (S 23 m = NS 23 m). Compare to standard mercantile S 76 / NS 46. Doors serving a high hazard content room swing in the direction of egress (Table 3.2 item 4.i, p.248; the Hazardous Area Doors line). Table 3.2 sets no panic-hardware trigger for high hazard rooms: item 12 (p.250) only specifies the hardware where it is fitted (audit CH123-16)."
        code_ref: "Ch 3, #5.11 / Table 3.16 row 13.iii"
        page_ref: "p.294"

