  # #5.11.1 (p.331): Mercantile Groups A, B, C. Aisle widths are keyed on the Ch 1 #1.7.9
  # classes (p.41), which the inputs do not compute: all three are printed with the class
  # definitions.
  - id: moe_mercantile_table_3_32
    match: {occupancy_in: [mercantile_a, mercantile_b, mercantile_c]}
    section: "Ch 3, #5.11 / Table 3.32"
    page: "p.331-332"
    systems:
      - name: "Mercantile: Aisles (Table 3.32 item 3)"
        spec: "Class C mercantile, supermarkets (area < 280 m2, single storey): aisles not less than 915 mm clear width. Class B mercantile, supermarkets, hypermarkets (area < 2800 m2, < 3 storey): not less than 1200 mm. Class A mercantile, hypermarkets (area > 2800 m2, > 3 storey): not less than 1525 mm. Aisles leading to each exit required, their aggregate width not less than the required width of the exit."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 3; Ch 1 #1.7.9"
        page_ref: "p.331, 41"
        detail: "Audit CH123-07. Classes per Ch 1 #1.7.9 (p.41): Class A aggregate gross sales area more than 2800 m2 or more than three storeys; Class B 280 m2 to not more than 2800 m2 and not more than three storeys; Class C not more than 280 m2, ground floor only."
      - name: "Mercantile: Exits (Table 3.32 item 4)"
        spec: "Not less than 50 % of the exits reached without passing through check-out or cash counters; where wheeled carts or buggies are used, provision for their transit and parking so they do not obstruct the means of egress; not more than 50% of the exits access through store rooms, packing, loading and unloading areas, with aisles not less than 1200 mm, only if the building is fully sprinklered, the store room is not subject to locking and the path is defined, direct and unobstructed; exits through kitchen not permitted."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 4"
        page_ref: "p.331"
        detail: "Audit CH123-07."
      - name: "Mercantile: Single Exit Not Permitted (Table 3.32 item 5)"
        spec_s: "Single exit shall not be permitted; inside open stairs or open ramps do not serve as a component of the required means of egress for more than one floor; 2 enclosed exits from every part of every floor, independent of any open stair. Permitted single means of egress: Class C mercantile (area < 280 m2) where the travel distance does not exceed 30 m to the nearest exit directly to outside or to the mall (item 5.iv); a mezzanine of any mercantile occupancy where the common path does not exceed 30 m to outside or to the mall (item 5.v)."
        spec_ns: "Single exit shall not be permitted; inside open stairs or open ramps do not serve as a component of the required means of egress for more than one floor; 2 enclosed exits from every part of every floor, independent of any open stair. Permitted single means of egress: Class C mercantile (area < 280 m2) where the travel distance does not exceed 23 m to the nearest exit directly to outside or to the mall (item 5.iv); a mezzanine of any mercantile occupancy where the common path does not exceed 23 m to outside or to the mall (item 5.v)."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 5 (SINGLE EXIT PERMISSION)"
        page_ref: "p.331"
        detail: "Audit CH123-07. Items 5.iv-5.v print (S 30 m, NS 23 m)."
      - name: "Mercantile: Class A Corridor (Table 3.32 item 2)"
        required: conditional
        spec_s: "Where exit access in class A Mercantile is through a corridor, such corridor shall be 1525 mm in width."
        spec_ns: "Where exit access in class A Mercantile is through a corridor, such corridor shall be 1525 mm in width and separated from other parts of building by 1 hour fire resistance rated construction."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 2"
        page_ref: "p.331"
        detail: "Audit CH123-07; owner ruling 28.10.2026 item 6: the closing 'if building is not sprinklered' (p.331) governs the 1 hour separation only, not the 1525 mm width. Conditional: the mercantile class (#1.7.9) and corridor layout are not inputs."
      - name: "Mercantile: Separation (Table 3.32 item 5, SEPARATION)"
        required: conditional
        spec: "High hazard content areas separated from other parts of the building by 1 hour fire resistance rated construction; kitchens separated from other parts of the building by 1 hour fire resistance rated construction; parking structures separated from the mercantile occupancy with a fire barrier having a minimum 2-hour fire resistance rating (openings per items 5.ii-5.iii)."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 5 (SEPARATION)"
        page_ref: "p.332"
        detail: "Audit CH123-07. Conditional: applies to each such area the building has. Table 3.32 prints two items numbered 5 (SINGLE EXIT PERMISSION and SEPARATION) and two numbered 6."
      - name: "Mercantile: Open Spaces and Atrium Walls (Table 3.32 items 1, 6)"
        required: conditional
        spec: "Permissions: in other than bulk merchandising mercantile, atrium walls may serve as part of the separation for separated occupancies storey by storey (item 1.i); in sprinklered class A and B mercantile without high hazard contents, unprotected vertical openings between any two floors or among the street floor, the first adjacent floor below and the adjacent floor (or mezzanine) above; in sprinklered class C mercantile without high hazard contents, between the street floor and the mezzanine (item 6, OPEN SPACES)."
        code_ref: "Ch 3, #5.11 / Table 3.32 items 1, 6 (OPEN SPACES)"
        page_ref: "p.331-332"
        detail: "Audit CH123-07."
      - name: "Mercantile: Exits from Podium (Table 3.32 item 6, EXITS FROM PODIUM)"
        required: conditional
        spec: "Mercantile occupancies having open podiums for assembly purposes shall ensure 2 exits remotely located as per Section 4.4: exits back into the building to the building exit stairs, enclosed exit stairs to exterior discharge from the podium, open or outside exterior stairs per Table 3.4 item 14 discharging directly to the public way, or a combination."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 6 (EXITS FROM PODIUM)"
        page_ref: "p.332"
        detail: "Audit CH123-07. Conditional: no input says the building has an open podium used for assembly."

  # Table 3.32 item 5.i (SEPARATION, p.332): parking structures separated from the
  # mercantile occupancy by a 2-hour fire barrier; required when the building has a parking
  # area (input has_parking_area).
  - id: moe_mercantile_parking_separation
    match: {occupancy_in: [mercantile_a, mercantile_b, mercantile_c], has_parking_area: true}
    section: "Ch 3, #5.11 / Table 3.32 item 5 (SEPARATION)"
    page: "p.332"
    systems:
      - name: "Mercantile: Parking Separation (Table 3.32 item 5.i, SEPARATION)"
        spec: "Parking structures shall be separated from mercantile occupancy with fire barrier having a minimum 2-hour fire resistance rating. Openings need no protection only where the parking is enclosed, the parking and building are sprinklered, the openings do not exceed 25 percent of the area of the fire barrier, are used as a public entrance and associated sidelights, spilled fuel is prevented from entering the building, and the openings are protected as a smoke partition (item 5.ii); otherwise vehicles are physically prevented from being parked or driven within 3 m of the openings (item 5.iii)."
        code_ref: "Ch 3, #5.11 / Table 3.32 item 5.i-iii (SEPARATION)"
        page_ref: "p.332"
        detail: "Audit CH123-07. Ticked: the building has a parking area."

  - id: moe_mall
    match: {occupancy_in: [mall_covered, mall_open, mall_mixed]}
    section: "Ch 3, #4 + #5.12 / Tables 3.13.14 + 3.16"
    page: "p.287, 294"
    systems:
      - name: "Occupant Load Factor (Mall)"
        spec: "Gross leasable area < 14,000 m²: 2.8 m². ≥ 14,000 m²: 3.3 m². Add 0.1 m² per 1,290 m² increment, capped at 5.1 m²/person."
      - name: "Travel / Commonpath / Dead-end (Mall - Table 3.16 rows 14-15)"
        spec: "COVERED MALL: Travel S 120 m, NS 46 m  |  Commonpath S 30 m, NS 23 m  |  Dead-end S 15 m, NS 6.1 m. Within tenant space (when pedestrian way per Table 3.33): Travel S 76 m, NS 46 m. OPEN-AIR MALL: 0/0/NA (no internal egress limits)."
        spec_s: "Covered mall (14.i): travel 120 m, commonpath 30 m, dead end 15 m. Within tenant space with a pedestrian way per Table 3.33.2 (14.ii): travel 76 m, commonpath 30 m, dead end 15 m. Open air mall (15.i): commonpath 0 m, dead end 0 m, travel NA."
        spec_ns: "Covered mall (14.i): travel 46 m, commonpath 23 m, dead end 6.1 m. Within tenant space with a pedestrian way per Table 3.33.2 (14.ii): travel 46 m, commonpath 23 m, dead end 6.1 m. Open air mall (15.i): commonpath 0 m, dead end 0 m, travel NA."
        detail: "Per Table 3.16 row 14.i (p.294): covered-mall sprinklered travel is 120 m (not 122 m). Tenant spaces inside the mall envelope follow the standard mercantile travel distances when a designated pedestrian way is provided per Table 3.33. (The 122 m figure that appears elsewhere in this codebase is the Ch 10 SC mall-circulation smoke-curtain interval, which is a separate parameter from MOE travel distance.)"

  # ------ Daycare ------
  # Code coverage note (audit CH123-04): the daycare groups are set by USE, not by the
  # number of clients. Table 1.1 row 10 (p.50) and #1.1.13.1.k-l (p.527): Group A = child
  # day care centers and old age care centers; Group B = adult day care centers. #1.7.7
  # (p.40): daycare = four or more clients. #5.10 / Table 3.31 (p.330) cover Groups A and B.
  # `daycare_c` is not a code group (kept so saved projects load); it takes the shared
  # Table 3.13 row 12 / Table 3.16 row 12 lines and the Group A-only Table 3.31 item 7 line
  # is printed conditional for it.
  - id: moe_daycare
    match: {occupancy_in: [daycare_a, daycare_b, daycare_c]}
    section: "Ch 3, #4 + #5.10 / Tables 3.13.12 + 3.16"
    page: "p.286, 294"
    systems:
      - name: "Occupant Load Factor (Daycare)"
        spec: "3.3 m² net. Stair capacity 10 mm/person (wider than 7.6 mm standard); ramp 5 mm/person"
        detail: "10 mm/person stair-capacity factor reflects slower self-preservation of young children. Daycare groups are set by use (Table 1.1 row 10, p.50): Group A child day care centers and old age care centers, Group B adult day care centers; Table 3.13 row 12 and Table 3.16 row 12 print the same values for Groups A and B. The 'Daycare (group not printed)' option has no code group and takes these shared rows (audit CH123-04)."
      - name: "Travel / Commonpath / Dead-end (Daycare - Table 3.16 row 12)"
        spec: "Any room door to exit: Travel S 46 m, NS 30 m  |  Commonpath S 30 m, NS 23 m  |  Dead-end S 15 m, NS 6.1 m. Any point in room to exit: S 61 m, NS 46 m. Any point to room door: S 30 m, NS 15 m (NA commonpath/dead-end)"
        spec_s: "From any room door to exit door (12.i): travel 46 m, commonpath 30 m, dead end 15 m. From any point in room to exit door (12.ii): travel 61 m, commonpath 30 m, dead end 15 m. From any point in room to room door (12.iii): travel 30 m (commonpath / dead end NA)."
        spec_ns: "From any room door to exit door (12.i): travel 30 m, commonpath 23 m, dead end 6.1 m. From any point in room to exit door (12.ii): travel 46 m, commonpath 23 m, dead end 6.1 m. From any point in room to room door (12.iii): travel 15 m (commonpath / dead end NA)."
      # ---- fix round 28.10.2026 (ch123): Table 3.31 rows (CH123-07) ----
      - name: "Daycare: Corridors (Table 3.31 item 2)"
        spec_s: "Minimum common exit corridor width 1200 mm; every day care room has a door leading directly to an exit access corridor; transoms, louvers or transfer grilles prohibited in walls or doors of exit access corridors (the 1 hour corridor rating of item 2.ii applies if the building is not sprinklered)."
        spec_ns: "Minimum common exit corridor width 1200 mm; corridor of 1 hour fire resistance rated construction (building not sprinklered, item 2.ii); every day care room has a door leading directly to an exit access corridor; transoms, louvers or transfer grilles prohibited in walls or doors of exit access corridors."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 2"
        page_ref: "p.330"
        detail: "Audit CH123-07."
      - name: "Daycare: Single Exit Not Permitted (Table 3.31 item 3)"
        spec: "Single exit shall not be permitted. 2 enclosed exits shall be available from every part of every floor."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 3"
        page_ref: "p.330"
        detail: "Audit CH123-07."
      - name: "Daycare: Rescue Window in Non-sprinklered Building (Table 3.31 item 5)"
        sprinkler_column: NS
        spec: "Every day care room or space normally subject to client occupancy shall have at least one window with a fixed breakable glass, clear opening not less than 510 mm in width and 610 mm in height, and 0.5 m2 in area, located not more than 1120 mm above the floor for an emergency rescue, on the exterior wall of the room, accessible from public way to the Civil Defence rescue team."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 5"
        page_ref: "p.330"
        detail: "Audit CH123-07. Printed because Ch 9 does not require sprinklers in this building."
      - name: "Daycare: Doors (Table 3.31 item 6)"
        spec: "Balcony and terrace access restricted with a door having child lock or latch; window opening restricted to 100 mm with windows safety latch; closet door latches openable by children from inside; bathroom doors openable from the outside in an emergency when locked; while the day care occupancy is occupied, no locking device that impedes or prohibits egress or cannot be easily disengaged."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 6"
        page_ref: "p.330"
        detail: "Audit CH123-07."
      - name: "Daycare: Two Exit Access Doors - Room over 185 m2 (Table 3.31 item 4)"
        required: conditional
        spec: "Any Day care room larger than 185 m2, shall have 2 exit corridor access doors remotely located from each other as per Section 4.4."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 4"
        page_ref: "p.330"
        detail: "Audit CH123-07. Conditional: the inputs give no room areas."
      - name: "Daycare: Multiple Occupancy (Table 3.31 item 1)"
        required: conditional
        spec: "Where the day care is situated in another occupancy: if the two exit accesses from the day-care occupancy enter the same corridor as the other occupancy (such as an apartment, residential or hotel occupancy), the exit accesses are separated in the corridor by a 1 hour smoke partition located so that it has an exit on each side (item 1.i); no day care room has its sole means of egress through any nonresidential occupancy of the same building, unless the non residential occupancy is fully sprinklered as per Ch 9 (item 1.ii)."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 1"
        page_ref: "p.330"
        detail: "Audit CH123-07. Conditional: no input says the day care is inside another occupancy."

  # Table 3.31 item 7 (p.330): Group A (child day care, old age day care) located within one
  # storey above the level of exit discharge; two or more levels above -> 2 smoke
  # compartments per floor. A building of 3 or more floors above grade has floors two or more
  # levels above the ground-floor discharge.
  - id: moe_daycare_a_smoke_compartments
    match: {occupancy: daycare_a, floors_above_grade_gte: 3}
    section: "Ch 3, #5.10 / Table 3.31 item 7"
    page: "p.330"
    systems:
      - name: "Daycare Group A: Location / Smoke Compartments (Table 3.31 item 7)"
        spec: "Child day care and old age day care (Day care, Group A) occupancies shall be located within one storey above level of exit discharge. If located two or more levels above the level of exit discharge, each floor shall be subdivided into minimum of 2 smoke compartments with smoke barrier having 1 hour fire resistance rated construction."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 7"
        page_ref: "p.330"
        detail: "Audit CH123-07. Required: the building has 3 or more floors above grade, so day care floors two or more levels above a ground-level exit discharge exist."
  - id: moe_daycare_c_smoke_compartments_check
    match: {occupancy: daycare_c, floors_above_grade_gte: 3}
    section: "Ch 3, #5.10 / Table 3.31 item 7"
    page: "p.330"
    systems:
      - name: "Daycare Group A: Location / Smoke Compartments (Table 3.31 item 7)"
        required: conditional
        spec: "If the day care is Group A (child day care or old age day care, Table 1.1 row 10, p.50): located within one storey above level of exit discharge; if located two or more levels above the level of exit discharge, each floor subdivided into minimum of 2 smoke compartments with smoke barrier having 1 hour fire resistance rated construction."
        code_ref: "Ch 3, #5.10 / Table 3.31 item 7"
        page_ref: "p.330"
        detail: "Audit CH123-04 / CH123-07. Conditional: the 'Daycare (group not printed)' option names no group; choose Group A or B by the use."

  # ------ Detention ------
  - id: moe_detention
    match: {occupancy_in: [detention_a, detention_b, detention_c]}
    section: "Ch 3, #4 + #5.8 / Tables 3.13.10 + 3.16"
    page: "p.286, 294"
    systems:
      - name: "Occupant Load Factor (Detention)"
        spec: "11.1 m² gross"
      - name: "Travel / Commonpath / Dead-end (Detention - Table 3.16 row 10)"
        spec: "Types II/III/IV: Travel S 61 m, NS 46 m  |  Commonpath S 30 m, NS 15 m  |  Dead-end S 15 m, NS 6.1 m. Type V (combustible): same travel/commonpath but Dead-end S 6.1 m, NS 6.1 m. Any room access door to exit: S 46 m, NS 46 m travel."
        spec_s: "Types II, III, IV (10.i): travel 61 m, commonpath 30 m, dead end 15 m. Type V (10.ii): travel 61 m, commonpath 30 m, dead end 6.1 m. Any room exit access door to exit (10.iii): travel 46 m, commonpath 30 m, dead end 15 m."
        spec_ns: "Types II, III, IV (10.i): travel 46 m, commonpath 15 m, dead end 6.1 m. Type V (10.ii): travel 46 m, commonpath 15 m, dead end 6.1 m. Any room exit access door to exit (10.iii): travel 46 m, commonpath 15 m, dead end 6.1 m."
        detail: "Detention requires supervised evacuation. Type V (combustible construction) tightens the dead-end limit to 6.1 m even when sprinklered."

  # ------ Storage / Industrial ------
  - id: moe_storage_industrial_ordinary
    match: {occupancy: storage_industrial, hazard_class_in: [LH, OH1, OH2]}
    section: "Ch 3, #4 + #5.14-15 / Tables 3.13.16, 3.13.18 + 3.16"
    page: "p.287, 294-295"
    systems:
      - name: "Occupant Load Factor (Ordinary-hazard Storage / Industrial)"
        spec: "Storage Group B/C (low/ordinary): 27.9 m². Industrial Group B/C (general low-hazard): 9.3 m². Stair capacity 7.6 mm/person; ramp 5 mm/person"
      - name: "Travel / Commonpath / Dead-end (LH/OH Storage + Industrial - Table 3.16 rows 17, 19)"
        spec: "Storage LH/OH: Travel S 122 m, NS 61 m  |  Commonpath S 30 m, NS 15 m  |  Dead-end S 30 m, NS 15 m. Industrial Group B/C General LH: Travel S 75 m, NS 61 m. Industrial Special Purpose: Travel S 122 m, NS 91 m. Mechanical / Boiler / Furnace rooms: Travel S 75 m, NS 61 m. Aircraft Storage / Servicing GF: Travel S 30 m, NS 23 m. Aircraft Storage / Servicing Mezzanine: Travel S 23 m, NS 23 m."
        spec_s: "Low / ordinary hazard storage (17.i-ii): commonpath 30 m, dead end 30 m, travel 122 m. Aircraft storage ground floor: commonpath 30 m, dead end 15 m, travel 30 m; mezzanine floor: commonpath 30 m, dead end 15 m, travel 23 m. Industrial general, low hazard (19.i): commonpath 30 m, dead end 15 m, travel 75 m. Special purpose (19.ii): commonpath 30 m, dead end 15 m, travel 122 m. Aircraft servicing ground floor (19.iii): commonpath 30 m, dead end 15 m, travel 30 m; mezzanine floor (19.iv): commonpath 23 m, dead end 15 m, travel 23 m. Mechanical equipment room (19.v), boiler / furnace room (19.vi): commonpath 30 m, dead end 15 m, travel 75 m."
        spec_ns: "Low / ordinary hazard storage (17.i-ii): commonpath 15 m, dead end 15 m, travel 61 m. Aircraft storage ground floor: commonpath 15 m, dead end 15 m, travel 23 m; mezzanine floor: commonpath 15 m, dead end 15 m, travel 23 m. Industrial general, low hazard (19.i): commonpath 15 m, dead end 15 m, travel 61 m. Special purpose (19.ii): commonpath 15 m, dead end 15 m, travel 91 m. Aircraft servicing ground floor (19.iii): commonpath 15 m, dead end 15 m, travel 23 m; mezzanine floor (19.iv): commonpath 15 m, dead end 15 m, travel 23 m. Mechanical equipment room (19.v), boiler / furnace room (19.vi): commonpath 15 m, dead end 15 m, travel 61 m."
        detail: "Commonpath AND dead-end use the same value (30 m / 15 m) for storage - unusual. For aircraft hangers, travel distances are tightened irrespective of sprinkler protection."

  # Audit CH123-03: Table 3.13 rows 15 / 17 and Table 3.16 rows 16 / 18 are Storage /
  # Industrial GROUP A = Extra Hazard Group 2 (#1.1.13.5.a, p.530; Table 1.1 row 12 Group
  # A-1 / A-2, p.51). Extra Hazard Group 1 is Storage / Industrial GROUP B (#1.1.13.4.a,
  # p.529: aircraft hangar, furniture, lumber, ...) and takes the Group B,C rows (Table
  # 3.13 rows 16 / 18, Table 3.16 rows 17 / 19): branch moe_storage_industrial_eh1 below.
  - id: moe_storage_industrial_high_hazard
    match: {occupancy: storage_industrial, hazard_class_is: HH, is_extra_hazard_2: true}
    section: "Ch 3, #4 + #5.14-15 / Tables 3.13.15, 3.13.17 + 3.16"
    page: "p.287, 294"
    systems:
      - name: "Occupant Load Factor (High-hazard Storage / Industrial)"
        spec: "Storage Group A (high-hazard): 27.9 m². Industrial Group A (high-hazard): 9.3 m². Stair capacity 18 mm/person; ramp 10 mm/person"
        detail: "High-hazard occupancies use ENLARGED stair / ramp capacity factors (18 mm vs 7.6 mm; 10 mm vs 5 mm) to permit faster egress under accelerated fire-development conditions. Extra Hazard Group 2 = Storage / Industrial Group A (#1.1.13.5.a, p.530): Table 3.13 rows 15 / 17 (p.287)."
      - name: "Travel / Commonpath / Dead-end (HH Storage + Industrial - Table 3.16 rows 16, 18)"
        spec: "HH Storage: Commonpath 0 m  |  Dead-end 0 m  |  Travel S 30 m, NS 23 m. HH Industrial: Commonpath 0 m  |  Dead-end 0 m  |  Travel S 23 m, NS 0 m (NS = HH industrial NOT permitted without sprinklers)."
        spec_s: "High hazard storage (16.i): commonpath 0 m, dead end 0 m, travel 30 m. High hazard industrial (18.i): commonpath 0 m, dead end 0 m, travel 23 m."
        spec_ns: "High hazard storage (16.i): commonpath 0 m, dead end 0 m, travel 23 m. High hazard industrial (18.i): commonpath 0 m, dead end 0 m, travel 0 m (read as: high hazard industrial not permitted without sprinklers)."
        detail: "ZERO commonpath and ZERO dead-end for HH (no sprinkler discount) - every workstation must have direct exit access. INTERPRETATION OF 'NS = 0 m' FOR HH INDUSTRIAL: Table 3.16 row 18.i (p.294) tabulates the non-sprinklered HH-industrial travel as 0 m, which is engineering-equivalent to 'no compliant non-sprinklered HH industrial layout exists.' This tool treats it as 'HH Industrial NOT permitted without sprinklers' - i.e. sprinklers are a precondition for HH industrial occupancy, not optional. Travel distances drastically shorter than ordinary storage (23-30 m vs 61-122 m). Rows 16 / 18 are Storage / Industrial Group A = Extra Hazard Group 2 (#1.1.13.5.a, p.530)."

  - id: moe_storage_industrial_eh1
    match: {occupancy: storage_industrial, hazard_class_is: HH, is_extra_hazard_2: false}
    section: "Ch 3, #4 + #5.14-15 / Tables 3.13.16, 3.13.18 + 3.16 rows 17, 19 (Extra Hazard Group 1 = Group B)"
    page: "p.287, 294-295, 529"
    systems:
      - name: "Occupant Load Factor (Extra Hazard Group 1 Storage / Industrial = Group B)"
        spec: "Storage Group B,C (Table 3.13 row 16): 27.9 m². Industrial Group B,C, general (Table 3.13 row 18): 9.3 m². Stair capacity 7.6 mm/person; ramp 5 mm/person"
        detail: "Audit CH123-03. Extra Hazard Group 1 is 'Storage/Industrial, Group B' (#1.1.13.4.a, p.529: aircraft hangar, bags, books and paper, cardboard, furniture, lumber, motor vehicle repair garages, upholstery and mattresses, ...; Table 1.1 row 12 Group B, p.51). Table 3.13 lists Storage and Industrial Groups B,C in rows 16 / 18 (p.287); the high hazard rows 15 / 17 (18 mm / 10 mm) are Group A = Extra Hazard Group 2 (#1.1.13.5.a, p.530). Tick Extra Hazard Group 2 for Group A materials."
      - name: "Travel / Commonpath / Dead-end (Extra Hazard Group 1 Storage / Industrial = Group B - Table 3.16 rows 17, 19)"
        spec: "Storage Group B,C: Travel S 122 m, NS 61 m  |  Commonpath S 30 m, NS 15 m  |  Dead-end S 30 m, NS 15 m. Aircraft storage and servicing, industrial and plant room rows as printed in rows 17.iii and 19."
        spec_s: "Storage Group B,C (17.i-ii): commonpath 30 m, dead end 30 m, travel 122 m. Aircraft storage ground floor (17.iii): commonpath 30 m, dead end 15 m, travel 30 m; mezzanine floor: commonpath 30 m, dead end 15 m, travel 23 m. Industrial Group B,C general (19.i): commonpath 30 m, dead end 15 m, travel 75 m. Special purpose (19.ii): commonpath 30 m, dead end 15 m, travel 122 m. Aircraft servicing ground floor (19.iii): commonpath 30 m, dead end 15 m, travel 30 m; mezzanine floor (19.iv): commonpath 23 m, dead end 15 m, travel 23 m. Mechanical equipment room (19.v), boiler / furnace room (19.vi): commonpath 30 m, dead end 15 m, travel 75 m."
        spec_ns: "Storage Group B,C (17.i-ii): commonpath 15 m, dead end 15 m, travel 61 m. Aircraft storage ground floor (17.iii): commonpath 15 m, dead end 15 m, travel 23 m; mezzanine floor: commonpath 15 m, dead end 15 m, travel 23 m. Industrial Group B,C general (19.i): commonpath 15 m, dead end 15 m, travel 61 m. Special purpose (19.ii): commonpath 15 m, dead end 15 m, travel 91 m. Aircraft servicing ground floor (19.iii): commonpath 15 m, dead end 15 m, travel 23 m; mezzanine floor (19.iv): commonpath 15 m, dead end 15 m, travel 23 m. Mechanical equipment room (19.v), boiler / furnace room (19.vi): commonpath 15 m, dead end 15 m, travel 61 m."
        code_ref: "Ch 3, #4.5 / Table 3.16 rows 17, 19"
        page_ref: "p.294-295"
        detail: "Audit CH123-03. Table 3.16 row 17 prints 'STORAGE, GROUP B,C' (i. Low Hazard Storage, ii. Ordinary Hazard Storage) and row 19 'INDUSTRIAL, GROUP B,C'; Group B is where Extra Hazard Group 1 materials are listed (#1.1.13.4.a, p.529). The high hazard rows 16 / 18 (commonpath 0 m, dead end 0 m) are Storage / Industrial Group A (Extra Hazard Group 2)."

  # ------ Parking ------
  - id: moe_parking_enclosed
    match: {occupancy: parking_enclosed}
    section: "Ch 3, #4 + #5.16 / Tables 3.13 row 19 (Enclosed) + 3.15.b items i-ii"
    page: "p.287, 291"
    systems:
      - name: "Occupant Load Factor (Enclosed Parking - Table 3.13 row 19)"
        spec: "27.9 m² gross. Stair capacity 7.6 mm/person; ramp 5 mm/person"
        detail: "Driver-parked levels. Where robotic / mechanical parking is ticked, the robotic / mechanical levels take Table 3.13 row 20 (46.5 m2, its own line) and the occupant load summary uses row 20.i (verifier 28.10.2026)."
      - name: "Travel Distance (Enclosed Parking - sprinklered)"
        sprinkler_column: S
        spec: "Max 61 m travel from most remote parking lot to exit door (along natural path)"
        detail: "Per Table 3.15.b item i. Dead-end and commonpath shall not exceed 15 m. Walking distance from most remote parking lot, along natural path of travel to an exit."
      - name: "Travel Distance (Enclosed Parking - non-sprinklered)"
        sprinkler_column: NS
        spec: "Max 46 m travel from most remote parking lot to exit door"
        detail: "Per Table 3.15.b item ii. Dead-end and commonpath shall not exceed 15 m. Applies when enclosed basement/podium parking is NOT sprinklered. Buildings without sprinklers tighten the egress envelope by 15 m."
      # Audit CH123-10: the Table 3.13 row 20 (mechanical / robotic) line moved to the
      # moe_parking_robotic branch; it printed for every enclosed parking.
      - name: "Single Exit Not Permitted - Parking (Table 3.37 item 4)"
        spec: "Single exit is not permitted; 2 exits shall be provided from every storey or level or section as per Section 4.4, Table 3.15.b. In 1 level below or 1 level above discharge level of parking, vehicle ramp shall be considered as one of the means of egress, provided no shutters or doors are installed in such ramps."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 4"
        page_ref: "p.338"
        detail: "Owner card 13.10.2026 05:45Z 'Add item 4.iii': the ramp allowance (item 4.iii) is stated with its condition. #5.16.1 (p.338): parking in above ground, enclosed or underground structures complies with Table 3.37 along with all other sections of this chapter; where conflicts arise, #5.16 prevails."
      # ---- fix round 28.10.2026 (ch123): Table 3.37 items 1, 5-8 (H1 / CH123-01, CH123-08) ----
      - name: "Carbon Monoxide Detection - Enclosed Parking (Table 3.37 item 7.i)"
        spec: "Carbon monoxide detection shall be provided in all enclosed parking structures. Such CO detection system shall be electrically operated, complete with control panel and interfacing with ventilation system."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 7.i"
        page_ref: "p.338"
        detail: "Audit H1 / CH123-01. Printed for every enclosed parking, stand-alone or attached (parking sub-occupancy)."
      - name: "Parking Flooring (Table 3.37 item 6)"
        spec: &t376 "Floor surfaces shall be of noncombustible material. Floors shall be graded and equipped with drains."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 6"
        page_ref: "p.338"
        detail: "Audit CH123-08."
      - name: "Parking Exit Signs (Table 3.37 item 8)"
        spec: &t378 "Exit signs shall be distinguishable from Vehicle Exit route and emergency Exit directions for people."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 8"
        page_ref: "p.338"
        detail: "Audit CH123-08."
      - name: "Parking Multiple Occupancy (Table 3.37 item 1)"
        required: conditional
        spec: &t371 "Parking structures within 3 m of a building shall be separated by fire barrier having a minimum 2-hour fire resistance rating; not required where the parking structure is separated by 3 m or more from the adjacent building and is attached only via open vehicle bridge, open pedestrian walkway or balconies (item 1.ii). Repair activities inside the parking structure are permitted provided the occupancy does not include motor fuel-dispensing facilities (item 1.iii). Any occupancy other than parking situated in the parking area shall be separated by smoke resistant walls and partitions (item 1.iv)."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 1"
        page_ref: "p.338"
        detail: "Audit CH123-08. Conditional: no input gives the distance to another building or other uses inside the parking. Ch 1 Table 1.2 separations between occupancies also apply to parking inside a building."
      - name: "Parking Fuel Dispensing Exits (Table 3.37 item 5)"
        required: conditional
        spec: &t375 "Where fuel dispensing is located within parking areas: exits lead to the outside of the building on the same level or to stairs, with no upward travel permitted, unless direct outside exits are available from that floor; any storey below the storey at which fuel is being dispensed has exits leading directly to the outside via outside stairs or doors at the finished ground level."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 5"
        page_ref: "p.338"
        detail: "Audit CH123-08. Conditional: no input says fuel is dispensed in the parking."

  - id: moe_parking_open
    match: {occupancy: parking_open}
    section: "Ch 3, #4 + #5.16 / Tables 3.13 row 19 (Open) + 3.15.b items iii-iv + 3.16 row 20.ii"
    page: "p.287, 291, 295"
    systems:
      - name: "Occupant Load Factor (Open Parking - Table 3.13 row 19)"
        spec: "27.9 m² gross. Stair capacity 7.6 mm/person; ramp 5 mm/person"
      - name: "Travel Distance (Open Podium Parking)"
        spec: "Travel S 122 m, NS 91 m from most remote parking lot to exit door; commonpath and dead-end 15 m"
        spec_s: "Open parking (20.ii): travel 122 m from most remote parking lot to exit door; commonpath 15 m, dead end 15 m"
        spec_ns: "Open parking (20.ii): travel 91 m from most remote parking lot to exit door; commonpath 15 m, dead end 15 m"
        code_ref: "Ch 3, Table 3.16 row 20.ii + Table 3.15.b items iii-iv"
        page_ref: "p.295, 291"
        detail: "Table 3.16 row 20.ii (p.295) gives open parking S 122 m, NS 91 m travel. CODE CONFLICT: Table 3.15.b item iv (p.291) prints 122 m for a non-sprinklered open podium. The tool uses the stricter 91 m (ruling R9, 12.10.2026); confirm with Civil Defence. Dead-end and commonpath shall not exceed 15 m. Open podium parking benefits from natural ventilation - the longer travel distance acknowledges the much lower smoke / heat hazard. Note: Mechanical/Robotic parking is a SEPARATE row (Table 3.13 row 20, Table 3.16 row 21): with robotic / mechanical parking ticked those rows are printed on their own lines."
      # Audit CH123-15: the line printed "required :: None" (no spec).
      - name: "Open-parking definition (Table 3.37 item 2; Ch 1, Table 1.9.34)"
        spec: "To qualify as open parking: each parking level has permanent wall openings open to the atmosphere, for an area of not less than 0.4 m2 for each linear meter of its exterior perimeter; such openings distributed over 40 percent of the building perimeter surface or uniformly over each of at least two opposing sides; interior wall lines and column lines at least 20% open, with openings distributed to provide ventilation; any part of the carpark within 30 m of the permanent natural ventilation opening on the perimeter surface. Otherwise the parking is enclosed parking."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 2; Ch 1, Table 1.9 item 34; Table 1.1 row 15.1-15.2"
        page_ref: "p.338, 85, 53"
        detail: "Ch 1 Table 1.9 item 34 (p.85) prints 'for each linear meter of its two opposite exterior perimeter' and 'uniformly over each of at least two opposing side surfaces'; Table 1.1 row 15.2 (p.53): enclosed parking is a parking occupancy which does not qualify as open parking."
      - name: "Parking Flooring (Table 3.37 item 6)"
        spec: *t376
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 6"
        page_ref: "p.338"
        detail: "Audit CH123-08."
      - name: "Parking Exit Signs (Table 3.37 item 8)"
        spec: *t378
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 8"
        page_ref: "p.338"
        detail: "Audit CH123-08."
      - name: "Parking Multiple Occupancy (Table 3.37 item 1)"
        required: conditional
        spec: *t371
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 1"
        page_ref: "p.338"
        detail: "Audit CH123-08. Conditional: no input gives the distance to another building or other uses inside the parking."
      - name: "Parking Fuel Dispensing Exits (Table 3.37 item 5)"
        required: conditional
        spec: *t375
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 5"
        page_ref: "p.338"
        detail: "Audit CH123-08. Conditional: no input says fuel is dispensed in the parking."
      - name: "Single Exit Not Permitted - Parking (Table 3.37 item 4)"
        spec: "Single exit is not permitted; 2 exits shall be provided from every storey or level or section as per Section 4.4, Table 3.15.b. In 1 level below or 1 level above discharge level of parking, vehicle ramp shall be considered as one of the means of egress, provided no shutters or doors are installed in such ramps."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 4"
        page_ref: "p.338"
        detail: "Owner card 13.10.2026 05:45Z 'Add item 4.iii': the ramp allowance (item 4.iii) is stated with its condition. #5.16.1 (p.338): parking in above ground, enclosed or underground structures complies with Table 3.37 along with all other sections of this chapter; where conflicts arise, #5.16 prevails."

  # Audit CH123-10 / CH123-23 / CH123-08: robotic / mechanical parking (input
  # has_robotic_parking) takes Table 3.13 row 20, Table 3.16 row 21 and Table 3.37 item 3.
  - id: moe_parking_robotic
    match: {occupancy_in: [parking_enclosed, parking_open], has_robotic_parking: true}
    section: "Ch 3, #5.16 / Table 3.13 row 20 + Table 3.16 row 21 + Table 3.37 item 3"
    page: "p.287, 295, 338"
    systems:
      - name: "Occupant Load Factor (Mechanical / Robotic Parking - Table 3.13 row 20)"
        spec: "Mechanical/Robotic parkings: 46.5 m2. Stair capacity 7.6 mm/person; ramp 5 mm/person"
        code_ref: "Ch 3, Table 3.13 row 20.i"
        page_ref: "p.287"
        detail: "Governs the robotic / mechanical parking levels and the occupant load summary. Ticked: robotic / mechanical parking. Table 3.13 row 20 prints 'PARKING, GROUP C'; Table 1.1 row 15 (p.53) calls mechanical and robotic parking Group B (#1.1.13.5.b, p.530). Driver-parked levels in the same parking take row 19 (27.9 m2): enter per-use areas."
      - name: "Travel / Commonpath / Dead-end (Mechanical / Robotic Parking - Table 3.16 row 21)"
        spec: "Commonpath S 15 m, NS 15 m  |  Dead end S 15 m, NS 15 m  |  Travel S 60 m, NS 46 m"
        spec_s: "Mechanical/Robotic parking (21.i): commonpath 15 m, dead end 15 m, travel 60 m"
        spec_ns: "Mechanical/Robotic parking (21.i): commonpath 15 m, dead end 15 m, travel 46 m"
        code_ref: "Ch 3, #4.5 / Table 3.16 row 21"
        page_ref: "p.295"
        detail: "Ticked: robotic / mechanical parking. The sprinklered travel (60 m) is 1 m shorter than the Table 3.15.b enclosed parking value (61 m)."
      - name: "Robotic or Automatic Parking (Table 3.37 item 3)"
        spec: "The operator shall remain in the area and shall have full control of the automated facilities, including means of egress. At least two means of egress remote from each other shall be provided which can be Fire Personnel access. Horizontal walkways for access shall be provided at intervals of 6 m vertically and 30 m horizontally."
        code_ref: "Ch 3, #5.16.1 / Table 3.37 item 3"
        page_ref: "p.338"
        detail: "Audit CH123-08. Ticked: robotic / mechanical parking."

  # ------ Animal housing ------
  - id: moe_animal_housing
