        spec: "A floor exceeds 2000 m2: subdivided into minimum of 2 smoke compartments, not exceeding 61 m travel distance from any point to reach a door in the smoke barrier."
        code_ref: "Ch 3, #5.5.2 / Table 3.25 item 6"
        page_ref: "p.321"
        detail: "Audit CH123-06."
  - id: moe_residential_b_smoke_compartments_check
