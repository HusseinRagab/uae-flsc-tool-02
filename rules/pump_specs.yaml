# pump_specs.yaml — Fire-pump capacity & duty selection table.
#
# Externalised from engine.py so the sizing brackets can be reviewed,
# updated, and audited against the cited standards without a code change.
#
# Each entry corresponds to one value of the rule-tree's `pump_spec_type`
# field. The engine reads this file via load_rules("pump_specs.yaml") at
# evaluation time and falls back to the previous hard-coded behaviour if
# the file is missing — so existing deployments keep working.
#
# Fix round 28.10.2026 (audit CH9B2-01 / 06 / 08 / 09): the pump set composition
# (1 electric + 1 diesel + 1 jockey pump with controllers, Table 9.3 item 1.xii, p.567)
# and its Civil Defence listing are added by the engine to every governing fire pump
# line (engine._PUMP_SET_NOTE); the descriptions below carry only what is particular
# to each duty.

# ── Wet-riser dependent pumps ──────────────────────────────────────────────
# The 750 / 1000 gpm brackets are printed in the Section 4 occupancy tables
# (Tables 9.18.A xi, 9.18.B ix, 9.19.B vi, 9.19.D v, 9.20.a.1 v, 9.20.b.3 v,
# 9.20.d ix, 9.21.a.3, 9.21.b.2, 9.24.A.3 v). Table 9.6 item 3.iii (p.582):
# at least 6.9 bar at the most remote landing valve.
standpipe_dependent:
  source: "UAE FLSC 2018 Ch 9 Section 4 occupancy tables (750 gpm for 2 standpipes, 1000 gpm for more); Table 9.6 item 3.iii and item 6 (p.582)"
  count_field: wet_riser_standpipes
  count_label: standpipe
  pressure_bar: 6.9
  pressure_note: "at most remote landing valve"
  pump_description: >-
    Hydraulic calculation basis (Table 9.6 item 6.i.a, p.582): two landing
    valves on the topmost point of the hydraulically most unfavourable wet
    riser and one landing valve outlet on the topmost point of the adjacent
    wet risers, each providing 250 gpm at 7 bar. Item 6.ii: where a
    horizontal wet riser supplies 3 or more landing valve outlets on a floor,
    the calculation is based on 3 landing valves at the remotest point of the
    hydraulically most unfavourable wet riser pipe and one landing valve
    outlet at the topmost point of each adjacent wet riser pipe, each 250 gpm
    at 7 bar. 6.9 bar is the minimum at the most remote landing valve
    (item 3.iii).
  # Brackets are evaluated top-to-bottom; the first whose
  # max_count >= n applies. Use a sentinel like 999 for "or more".
  brackets:
    - max_count: 2
      gpm: 750
    - max_count: 999
      gpm: 1000

# ── Exit-stair dependent pump (open parking, Table 9.24.C.2, p.720) ────────
# "750 gpm if there are 2 stairs, 1000 gpm if there are 3 stairs and
# 1000 gpm if there are more than 3 stairs ... 6.9 bar at the most remote
# landing valve." The table starts at 2 stairs; 1 stair takes the 750 row.
stairs_dependent:
  source: "UAE FLSC 2018 Table 9.24.C.2 iii (p.720)"
  count_field: exit_stairs
  count_label: exit stair
  pressure_bar: 6.9
  pressure_note: "at most remote landing valve"
  pump_description: >-
    Table 9.24.C.2 iii (p.720): 750 gpm if there are 2 stairs, 1000 gpm if
    there are 3 stairs or more, at 6.9 bar at the most remote landing valve.
  brackets:
    - max_count: 2
      gpm: 750
    - max_count: 999
      gpm: 1000

# ── Fixed-capacity pumps (yard hydrant networks etc.) ──────────────────────
fixed_1000:
  source: "UAE FLSC 2018 Table 9.26 A.vi (p.723); Table 9.23.B.2 ii (p.717)"
  pressure_bar: 6.9
  pressure_note: "at most remote hydrant outlet valve"
  gpm: 1000
  pump_description: >-
    Yard hydrant duty: 1000 gpm at a pressure as required to satisfy 6.9 bar
    at the most remote hydrant outlet valve (Table 9.26 A.vi, p.723; Table
    9.23.B.2 ii, p.717).

# ── Villa-scale combined sprinkler + hose-reel pump (Table 9.23) ───────────
# Used by villa_private_*_1500 and villa_commercial_*_1500 branches when the
# building requires sprinklers + hose reels at 250 gpm.
fixed_250:
  source: "UAE FLSC 2018 Table 9.23, p.716-717"
  pressure_bar: 4.5
  pressure_note: "at most remote hose-reel outlet valve"
  gpm: 250
  # Each villa row states its own item v (p.716-717) in the line detail.
  pump_description: ""
