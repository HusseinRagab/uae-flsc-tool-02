# pump_specs.yaml — Fire-pump capacity & duty selection table.
#
# Externalised from engine.py so the sizing brackets can be reviewed,
# updated, and audited against the cited standards without a code change.
#
# Each entry corresponds to one value of the rule-tree's `pump_spec_type`
# field. The engine reads this file via load_rules("pump_specs.yaml") at
# evaluation time and falls back to the previous hard-coded behaviour if
# the file is missing — so existing deployments keep working.

# ── Wet-riser dependent pumps ──────────────────────────────────────────────
# The 750 / 1000 gpm brackets are printed in the Section 4 occupancy tables
# (Tables 9.18.A xi, 9.18.B ix, 9.19.B vi, 9.19.D v, 9.20.a.1 v, 9.20.b.3 v,
# 9.20.d ix, 9.21.a.3, 9.21.b.2, 9.24.A.3 v). Table 9.6 item 3.iii (p.582):
# at least 6.9 bar at the most remote landing valve.
standpipe_dependent:
  source: "UAE FLSC 2018 Ch 9 Section 4 occupancy tables (750 gpm for 2 standpipes, 1000 gpm for more); Table 9.6 item 3.iii and item 6.i (p.582-583)"
  count_field: wet_riser_standpipes
  count_label: standpipe
  pressure_bar: 6.9
  pressure_note: "at most remote landing valve"
  pump_description: >-
    UL/FM listed electric or diesel-driven pump set with jockey pump
    and controller. Hydraulic calculation basis (Table 9.6 item 6.i):
    2 landing valves at the top of the hydraulically most unfavourable
    riser plus 1 at the top of the adjacent riser, each 250 gpm at 7 bar;
    6.9 bar is the minimum at the most remote landing valve (item 3.iii).
  # Brackets are evaluated top-to-bottom; the first whose
  # max_count >= n applies. Use a sentinel like 999 for "or more".
  brackets:
    - max_count: 2
      gpm: 750
    - max_count: 999
      gpm: 1000

# ── Exit-stair dependent pump (open parking, Table 9.24.C.2, p.720) ────────
# "750 gpm if there are 2 stairs, 1000 gpm if there are 3 stairs and
# 1000 gpm if there are more than 3 stairs ... 6.9 bar at the most remote
# landing valve." The table starts at 2 stairs; 1 stair takes the 750 row.
stairs_dependent:
  source: "UAE FLSC 2018 Table 9.24.C.2 iii (p.720)"
  count_field: exit_stairs
  count_label: exit stair
  pressure_bar: 6.9
  pressure_note: "at most remote landing valve"
  pump_description: >-
    UL/FM listed electric or diesel-driven pump set with jockey pump
    and controller.
  brackets:
    - max_count: 2
      gpm: 750
    - max_count: 999
      gpm: 1000

# ── Fixed-capacity pumps (yard hydrant networks etc.) ──────────────────────
fixed_1000:
  source: "UAE FLSC 2018 Ch. 9 (yard hydrant network)"
  pressure_bar: 6.9
  pressure_note: "at most remote hydrant outlet valve"
  gpm: 1000
  pump_description: >-
    Electric or diesel driven UL/FM listed pump set for yard hydrant network.

# ── Villa-scale combined sprinkler + hose-reel pump (Table 9.23) ───────────
# Used by villa_private_*_1500 and villa_commercial_*_1500 branches when the
# building requires sprinklers + hose reels at 250 gpm.
fixed_250:
  source: "UAE FLSC 2018 Table 9.23, p.716-717"
  pressure_bar: 4.5
  pressure_note: "at most remote hose-reel outlet valve"
  gpm: 250
  pump_description: >-
    Electric-driven UL/FM listed fire pump set with jockey pump and controller.
