# UAE FLSC 2018 - Chapter 5: Exit Signs
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 5
  chapter_title: "Exit Signs"

# ---------- UNIVERSAL items (Table 5.3 items 1-5) -----------------------
# Skipped for villas and ground-floor-only fuel stations (Table 5.3 items
# 18-20, p.399), unless the villa is converted or the station is multi-storey.
# Also skipped for Table 9.27 Group U open-yard storage (no building envelope).
general:
  # ----- Universal sign specifications (Tables 5.1.1 + 5.1.2 + 5.1.3 + 5.1.7) -----
  - id: es_g_sign_dimensions_bilingual
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Exit Sign Letter Size + Bilingual EXIT (English + Arabic)"
        code_ref: "Ch 5, #2 / Table 5.1 item 1"
        page_ref: "p.388"
        spec: "Letters >= 150 mm tall; principal stroke >= 19 mm wide; letter width >= 51 mm; spacing between letters >= 9.5 mm. Running-man pictogram >= 150 mm tall, >= 9.5 mm from the EXIT letters, heading towards an open door. 'EXIT' in English AND Arabic. Letter 'EXIT' in matte White colour on Green background; running man towards an open door in Green colour on White, open door background."
        detail: "Per Table 5.1 item 1 (p.388): Exit signs shall read EXIT in English and Arabic in plainly legible letters. Letters not less than 150 mm (6 inch) in height; principal strokes >= 19 mm (3/4 inch) wide; letter width >= 51 mm proportionally. Item 1.iii: minimum spacing between letters not less than 9.5 mm (3/8 inch); item 1.iv: signs larger than item 1.ii use letter widths, strokes and spacing in proportion to their height. Item 1.2: image of running man towards the exit door not less than 150 mm (6 inch) high; spacing between the running man image and EXIT letter not less than 9.5 mm (3/8 inch); the running man heading towards an open door. Item 1.3 COLOURS: letter 'EXIT' in matte White colour on Green background; the 'RUNNING MAN TOWARDS AN OPEN DOOR' in Green colour on White, open door background."

  # Owner ruling 13.10.2026 (card "Add all", Phase 5 G1 / CH47-17): Table 5.1 item 2.
  - id: es_g_directional_sign_spec
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Directional Exit Sign - Chevron Arrow Identifiable at 12 m"
        code_ref: "Ch 5, #2 / Table 5.1 item 2"
        page_ref: "p.389"
        spec: "Directional arrow of a chevron type, outside the EXIT letters and not less than 9.5 mm from any letter, identifiable as a directional indicator at a distance of 12 m, located at the end of the sign for the direction indicated; running man posture towards the same direction as the arrow, heading towards an open door; arrow in White colour on Green background. Letters and running man as Table 5.1 item 1 (150 mm letters, 19 mm strokes, 51 mm width, 9.5 mm spacing; running man not less than 150 mm)."
        detail: "Owner ruling 13.10.2026. Table 5.1 item 2 DIRECTIONAL EXIT SIGN (p.389). 2.1 SIZE OF LETTERS: i. Exit Signs shall read 'EXIT' in English and Arabic in plainly legible letters; ii. letters shall not be less than 150 mm (6 inch) in height and principal strokes of letters not less than 19 mm (3/4 inch) wide; width of each letter shall not be less than 51 mm, proportionally; iii. minimum spacing between letters shall be not less than 9.5 mm (3/8 inch); iv. signs using larger sizes than mentioned in Table 5.1.2.1.ii shall use letter widths, strokes and spacing in proportion to their height. 2.2 SIZE OF DIRECTIONAL ARROW: i. the directional 'arrow' indicator shall be located outside of the EXIT letters, not less than 9.5 mm (3/8 inch) from any letter; ii. the directional 'arrow' indicator shall be of a chevron type; iii. the directional indicator shall be identifiable as a directional indicator at a distance of 12 m; iv. a directional arrow larger than the minimum established for compliance with as per Table 5.1. 2.2.iii shall be proportionately increased in height, width, and stroke; v. the directional indicator shall be located at the end of the sign for the direction indicated. 2.3 SIZE OF RUNNING MAN: i. the image of running man towards the exit door shall not be less than 150 mm (6 inch) in height; ii. minimum spacing between the running man image and EXIT letter shall not be less than 9.5 mm (3/8 inch); iii. the direction of running man's posture shall be towards the same direction as the directional 'arrow' mark; iv. the running man shall be heading towards an open door in the image. 2.4 COLOURS: i. letter 'EXIT' shall be in matte White colour on Green background; ii. directional 'ARROW' shall be in White colour on Green background; iii. the 'RUNNING MAN TOWARDS AN OPEN DOOR' shall be in Green colour on White, open door background."

  - id: es_g_illumination
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Sign Illumination - External vs Internal"
        code_ref: "Ch 5, #2 / Table 5.2 item 1"
        page_ref: "p.395"
        spec: "Every sign continuously illuminated (may flash on alarm). EXTERNALLY illuminated: >= 54 lux (5 ft-cd) at illuminated surface, contrast ratio >= 0.5, viewing distance approximately 15 m (visible from 100 x H meters where H = height of the sign board). INTERNALLY illuminated: approved and registered by Civil Defence, viewing distance approximately 30 m (visible from 150 x H meters)."
        detail: "Per Table 5.2 item 1 (p.395). EXTERNALLY ILLUMINATED (#1.2): not less than 54 lux (5 ft-candle) at the illuminated surface, contrast ratio not less than 0.5; visible from 100 x H meters where H is the height of the sign board, i.e. approximately 15 m maximum viewing distance. INTERNALLY ILLUMINATED (#1.3): shall be approved and registered by Civil Defence for the purpose; visible from 150 x H meters, i.e. approximately 30 m viewing distance. Table 5.2 #4 (p.395): no point in exit corridor or exit access corridor shall be in excess of the rated viewing distance or 30 m, whichever is less, from nearest Exit Sign / Directional Sign / Floor proximity Sign."

  - id: es_g_photoluminescent
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Photoluminescent Sign Specifications (UL 1994)"
        code_ref: "Ch 5, #2 / Table 5.1 item 4"
        page_ref: "p.390"
        spec: "Listed per UL 1994; face shall be CONTINUALLY illuminated by minimum 54 lux during normal AND emergency conditions; sign within 3 m of illumination source"
        detail: "Photoluminescent signs and strips shall be continually illuminated while the building is occupied. Minimum 54 lux (5 ft-candle) artificial light on photoluminescent surface during normal AND emergency conditions. Sign / strip shall be within 3 m of illumination source. Photoluminescent signs SHALL NOT be installed where continuous illumination is not available - photoluminescent material requires charging to function in emergency mode. Listing per UL 1994 (Standard for Luminous Egress Path Marking Systems)."

  - id: es_g_tactile
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Tactile Sign at Every Exit (Braille + Raised Characters)"
        code_ref: "Ch 5, #2 / Table 5.1 item 3"
        page_ref: "p.390"
        spec: "Per ICC/ANSI A117.1 - Braille + raised characters at every exit location where Exit Signs are required by Table 5.2"
        detail: "Tactile signage shall comply with ICC/ANSI A117.1 (American National Standard for Accessible and Usable Buildings and Facilities). Provided at EVERY exit location where exit signs are required by Table 5.2 - NOT optional. Mounted at side of door per ICC/ANSI A117.1 mounting heights. Required for sight + hearing-impaired wayfinding."

  - id: es_g_directional_placement
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Directional Exit Sign Placement Rules"
        code_ref: "Ch 5, #2 / Table 5.2 #2 (items iii-iv) + #4"
        page_ref: "p.395"
        spec: "Mounted at a HEIGHT BETWEEN 3000 mm AND 4000 mm from the finished floor; installed at EVERY change of direction; PERPENDICULAR to the direction of egress; no point in exit corridor or exit access corridor in excess of the rated viewing distance or 30 m, whichever is less, from nearest Exit Sign / Directional Sign / Floor proximity Sign (Table 5.2 #4)."
        detail: "Per Table 5.2 #2 (p.395). #2.iii: Directional Exit Signs shall be installed at a height BETWEEN 3000 mm and 4000 mm from the finished floor (this mandatory mounting band applies to all overhead directional signs, distinct from floor-proximity signs). #2.iv: installed at every change of direction and perpendicular to the direction of egress. #4: no point in any exit corridor or exit access corridor shall be in excess of the rated viewing distance OR 30 m, whichever is less, from the nearest Exit Sign / Directional Sign / Floor Proximity Sign."

  - id: es_g_floor_proximity_mounting
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Floor Proximity Sign Mounting (150-455 mm above floor)"
        code_ref: "Ch 5, #2 / Table 5.1 item 7 (trigger); also Table 5.2 #2.v-vi (mounting dimensions)"
        page_ref: "p.395"
        spec: "Bottom of sign 150-455 mm above finished floor; door-side signs within 100 mm from door frame"
        detail: "Trigger and sign-format compliance from Table 5.1 item 7 (p.391): floor proximity Exit Signs comply with Table 5.1.1 and floor proximity Directional Signs comply with Table 5.1.2. Mounting dimensions from Table 5.2 #2.v-vi (p.395): bottom of sign shall be NOT LESS than 150 mm AND NOT MORE than 455 mm above the finished floor; where required at exit doors, mounted adjacent to door within 100 mm from door frame. Floor proximity Signs are required in all assembly occupancies (Table 5.3 item 6.ii, p.397) and all hotel occupancies (Table 5.3 item 11.iii, p.398). Elsewhere, floor proximity Exit / Directional signs, if provided, comply with Table 5.1.7 (Table 5.3 items 1.iv, 2.iii, 3.ii)."

  - id: es_g_exit_sign_mounting_position
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Exit Sign Mounting Position Above / Beside Door"
        code_ref: "Ch 5, #2 / Table 5.2 #2.i-ii"
        page_ref: "p.395"
        spec: "Bottom of Exit Sign <= 1000 mm ABOVE top edge of the egress opening; AND <= 1000 mm HORIZONTAL from the nearest edge of the egress opening to the nearest edge of the sign."
        detail: "Per Table 5.2 #2 (p.395). #2.i (vertical): the bottom of the Exit Sign shall be located at a vertical distance of NOT MORE than 1000 mm above the top edge of the egress opening intended for designation by that marking. #2.ii (horizontal): the Exit Sign shall be located at a horizontal distance of NOT MORE than 1000 mm, measured from the edge of the egress opening to the nearest edge of the marking. These two limits ensure the sign is unambiguously associated with the door it marks (not with an adjacent opening)."

  - id: es_g_exit_door_signs
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Exit Signs at Exit Doors"
        code_ref: "Ch 5, #3 / Table 5.3 item 1"
        page_ref: "p.397"
        spec: "Externally OR internally illuminated, per Table 5.2 #1.1; sign format per Table 5.1.1"
        detail: "Exit doors at exit corridors that lead to exit discharge or to assembly points shall be provided with Exit Signs complying with Table 5.1.1 (size of letters, running-man pictogram, colours). Illumination may be EITHER external OR internal per Table 5.2 #1.1 (the code does not mandate internally illuminated); viewing distance approximately 15 m for externally illuminated and approximately 30 m for internally illuminated signs (Table 5.2 #1.2-1.3)."

  - id: es_g_horizontal_exit_signs
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
      has_horizontal_exits_is: true
    systems:
      - name: "Exit Signs at Horizontal Exit Doors"
        code_ref: "Ch 5, #3 / Table 5.3 item 1.ii"
        page_ref: "p.397"
        detail: "Doors in horizontal exits shall be provided with Exit Signs complying with Table 5.1.1."

  - id: es_g_exit_stair_signs
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Exit Signs at Exit Stairs"
        code_ref: "Ch 5, #3 / Table 5.3 item 2"
        page_ref: "p.397"
        spec: "Externally OR internally illuminated, per Table 5.2 #1.1; sign format per Table 5.1.1"
        detail: "Exit stairs that lead to exit discharge or to assembly points shall be provided with Exit Signs complying with Table 5.1.1. Illumination may be EITHER external OR internal per Table 5.2 #1.1 (code does not mandate internally illuminated)."

  - id: es_g_corridor_directional
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Directional Signs at Exit Access Corridors"
        code_ref: "Ch 5, #3 / Table 5.3 item 3"
        page_ref: "p.397"
        spec: "Per Table 5.1.2 - directional arrow + running-man pictogram"
        detail: "Directional Signs shall be provided in compliance with Table 5.1.2 along the exit access corridor. Per Table 5.2 #4 (p.395): no point in any exit corridor or exit access corridor shall exceed the rated viewing distance OR 30 m, whichever is less, from the nearest Exit / Directional / Floor Proximity Sign. The rated viewing distance of an externally illuminated sign is approximately 15 m (100 x H, Table 5.2 #1.2.ii) and of an internally illuminated sign approximately 30 m (150 x H, #1.3.ii)."

  - id: es_g_dead_end_no_exit
    when:
      has_dead_end_paths_is: true
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "NO EXIT signs at Dead Ends"
        code_ref: "Ch 5, #3 / Table 5.3 item 4"
        page_ref: "p.397"
        spec: "Per Table 5.1.5"
        detail: "NO EXIT signs at any door, passage or stair that is neither an exit nor a way of exit access and that is located or arranged so it is likely to be mistaken for an exit."

  - id: es_g_no_exit_letter_dimensions
    when:
      has_dead_end_paths_is: true
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "NO EXIT Sign Letter Dimensions"
        code_ref: "Ch 5, #2 / Table 5.1 item 5"
        page_ref: "p.391"
        spec: "Word 'NO' = 51 mm (2 in) high letters with 9.5 mm (3/8 in) stroke width; word 'EXIT' = 25 mm (1 in) high letters; word 'EXIT' positioned BELOW the word 'NO'."
        detail: "Per Table 5.1 item 5 (p.391): the NO EXIT sign shall have the word NO in letters 51 mm (2 inch) high with a stroke width of 9.5 mm (3/8 inch), AND the word EXIT in letters 25 mm (1 inch) high, with the word EXIT placed BELOW the word NO. This is the prescribed letter geometry that turns a 'dead end' marker into a code-compliant NO EXIT sign."

  - id: es_g_evacuation_elevator_sign
    when:
      has_evacuation_elevator_is: true
      not:
        occupancy: storage_industrial
        is_open_yard_storage_is: true
    systems:
      - name: "Evacuation Elevator Signs"
        code_ref: "Ch 5, #3 / Table 5.3 item 5"
        page_ref: "p.397"
        spec: "Per Table 5.1.6"
        detail: "Any elevator that qualifies as an evacuation elevator (per Ch 3 #3.9) shall carry an Evacuation Elevator Sign indicating whether occupants may use it."

  - id: es_g_evacuation_elevator_sign_dimensions
    when:
      has_evacuation_elevator_is: true
      not:
        occupancy: storage_industrial
        is_open_yard_storage_is: true
    systems:
      - name: "Evacuation Elevator Sign - Letter Height + Wording + Posting"
        code_ref: "Ch 5, #2 / Table 5.1 item 6"
        page_ref: "p.391"
        spec: "Minimum letter height >= 16 mm (5/8 in); exact wording 'In the event of Fire, this elevator will be used by Civil Defence for evacuation of people. PROTECTED ELEVATOR USABLE IN EMERGENCIES'; posted in EVERY evacuation-elevator lobby."
        detail: "Per Table 5.1 item 6 (p.391). Replaces the standard 'DO NOT USE ELEVATOR DURING FIRE' sign ONLY at elevators designed and accepted as an evacuation elevator per Chapter 3, Section 3.9 and incorporated in the building fire strategy. WORDING (verbatim): 'In the event of Fire, this elevator will be used by Civil Defence for evacuation of people. PROTECTED ELEVATOR USABLE IN EMERGENCIES'. LETTER HEIGHT: minimum 16 mm (5/8 inch). LOCATION: posted in every evacuation-elevator lobby. PURPOSE: indicates to both Civil Defence personnel and trained facility-management that this elevator may be used during emergencies."

  - id: es_g_evacuation_plan
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Evacuation Plan"
        code_ref: "Ch 5, #2 / Table 5.1 item 8; applied via Table 5.3 (occupancy items)"
        page_ref: "p.392-393"
        spec: "Bilingual (English + Arabic); 3D-format floor plan, 350 mm high x 500 mm wide, framed (not sticker); 'YOU ARE HERE' symbol in Red; heading 'EVACUATION PLAN' 20 mm letters, FLOOR NAME/NUMBER 15 mm letters, legend 10 mm letters; mounted vertical wall at eye level; >= 10.8 lux continuous illumination; one plan minimum, plus one between every 2 exits/exit stairs."
        detail: |
          Per Table 5.1 item 8 (p.392-393). CONTENT: bilingual English + Arabic; simple floor plan only (floor number, room names, emergency exits, routes, stairs, elevators, refuge area, fire extinguishers, fire hose cabinets); NO structural detail, furniture, tiles or interior fixtures; landmark features (fountains, statues, atriums) permitted; 'YOU ARE HERE' location and symbol clearly shown; primary and secondary exit routes shown; routes must not pass through lockable / store / hazardous rooms or end at dead ends; exit discharge and assembly points only if on that floor; specific to each floor.
          FORMAT: 3D format showing elevated walls, stairs and rooms in 3D perspective; symbols, letters and arrows in 2D; size 350 mm high x 500 mm wide; framed and hung on vertical walls (NOT stickers stuck on curved surfaces); coloured printouts, laminated or photo-framed with glass; not glossy background; photoluminescent evacuation plans highly recommended.
          TYPOGRAPHY: heading 'EVACUATION PLAN' = 20 mm high letters, top centre; 'FLOOR NUMBER/NAME' = 15 mm high letters below heading; legend at bottom = 10 mm high letters.
          COLOURS: heading + floor name + room names + legend = Black; walls = Grey on White background; exit corridors/routes = Green fill with Dark Green directional arrows; exit doors/stairs = Bold EXIT in Green; 'YOU ARE HERE' + extinguisher/hose-cabinet symbols = Red; assembly point = Green.
          LOCATION: unobstructed, clearly visible, on vertical walls at eye level; continuously illuminated >= 10.8 lux; main circulation areas, lift lobby, main corridor; NOT inside rooms, stairs or hidden pockets.
          NUMBERS: minimum one plan strategically in the middle of floor circulation showing 2 exits in opposite directions; for buildings with more than 2 exits/exit stairs, plans posted between every 2 exits/exit stairs.
          Hotels also require a plan inside each guest room (Table 5.3 item 11.v).

  # Owner ruling 13.10.2026 (card "Add all", Phase 5 G2 / CH47-17): #4.4 Inspection and Maintenance.
  - id: es_g_inspection_maintenance
    when:
      not:
        any_of:
          - {occupancy_in: [villa_private, villa_commercial], villa_converted_use_is: false}
          - {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
          - {occupancy: storage_industrial, is_open_yard_storage_is: true}
    systems:
      - name: "Exit / Directional Sign Inspection and Maintenance (every 30 days)"
        code_ref: "Ch 5, #4.4.1-#4.4.3"
        page_ref: "p.400"
        spec: "Every 30 days, owner appointed facility management shall verify visually for operation of illumination sources; Exit Signs, Directional Signs and Evacuation Plans kept free of damage, wear and tear and in visible location; signs connected to, or provided with, a battery-operated emergency illumination source tested and maintained in accordance with Chapter 6."
        detail: "Owner ruling 13.10.2026. #4.4 Inspection and Maintenance (p.400): #4.4.1 the building owner, his appointed representative and the facility management shall be responsible to ensure that all the Exit Signs, Directional Signs and Evacuation Plans are free of damage, wear and tear and in visible location, in compliance with this chapter. #4.4.2 every 30 days, owner appointed facility management shall verify visually for operation of illumination sources. #4.4.3 Exit signs and Directional Signs connected to, or provided with, a battery-operated emergency illumination source, shall be tested and maintained in accordance with Chapter 6 (see Table 6.8, p.423)."

# ---------- OCCUPANCY-SPECIFIC additions (Table 5.3 items 6-20) ---------
branches:
  - id: es_assembly
    match: {occupancy_in: [assembly_a, assembly_b, assembly_c]}
    section: "Ch 5, #3 / Table 5.3 item 6"
    page: "p.397"
    systems:
      - name: "Tactile Signs at Every Exit"
        spec: "Per Table 5.1.3 (ICC/ANSI A117.1)"
        detail: "Raised-character + Braille tactile signs at every exit location."
      - name: "Floor Proximity Signs"
        spec: "Per Table 5.1.7"
        detail: "All assembly occupancies shall be provided with Floor Proximity Signs (low-mounted Exit / Directional signs visible through smoke layer)."
      - name: "Washroom Directional Signs"
        spec: "Per Table 5.1.2"
        detail: "Washrooms in assembly occupancies shall be provided with Directional Signs."

  - id: es_business
    match: {occupancy: business}
    section: "Ch 5, #3 / Table 5.3 item 7"
    page: "p.398"
    systems:
      - name: "Open-Plan Tenant Exemption"
        required: not_required
        detail: "Evacuation plans are not required inside individual tenant spaces that are open-plan offices where the main exit is visible."

  - id: es_education
    match: {occupancy_in: [education_a, education_b, education_c]}
    section: "Ch 5, #3 / Table 5.3 item 8"
    page: "p.398"
    systems:
      - name: "Educational Occupancy Compliance Note"
        detail: "Universal Exit/Directional Signs and Evacuation Plan apply. Nurseries and auditoriums also require Photoluminescent Exit Marking strips per Table 5.1.4 (see add-ons)."

  # Table 5.3 item 8.ii (p.398) names Nurseries; Table 1.1 (p.48) Educational Group A
  # lists Nurseries, Kindergarten, Preschool center and Talent Grooming centers as
  # separate items, so an education_a building is not always a nursery (CH47-03).
  - id: es_education_a_nursery_check
    match: {occupancy: education_a, has_nursery_within_is: false}
    section: "Ch 5, #3 / Table 5.3 item 8.ii"
    page: "p.398"
    systems:
      - name: "Photoluminescent Exit Marking Strips (Nurseries)"
        required: conditional
        spec: "Per Table 5.1.4 - required where the building is or contains a nursery"
        detail: "Table 5.3 item 8.ii (p.398): Nurseries shall be provided with Photoluminescent Exit Marking strips as per Table 5.1.4. Educational Group A (Table 1.1, p.48) covers nurseries, kindergartens, preschool centers and talent grooming centers; tick 'Nursery (inside education)' where the building is or contains a nursery and the line becomes required. Owner ruling 12.10.2026, P3 Ch47 Q1: the line stays conditional for Educational Group A and is required when 'Nursery' is ticked."

  - id: es_healthcare
    # Table 5.3 item 9 "HEALTHCARE OCCUPANCIES" is a single undivided row covering
    # all healthcare — hospitals, clinics and ambulatory facilities alike.
    match: {occupancy_in: [healthcare_a, healthcare_b, healthcare_c]}
    section: "Ch 5, #3 / Table 5.3 item 9"
    page: "p.398"
    systems:
      - name: "Tactile Signs at Every Exit"
        spec: "Per Table 5.1.3"
        detail: "Raised-character + Braille tactile signs at every exit location."
      - name: "Patient Room Exemption"
        required: not_required
        detail: "Patient rooms are not required to be provided with Exit Signs."

  - id: es_residential
    match: {occupancy_in: [residential, labour_accommodation, staff_accommodation, hostel]}
    section: "Ch 5, #3 / Table 5.3 item 10"
    page: "p.398"
    systems:
      - name: "Residential Apartment / Dwelling Unit Exemption"
        required: not_required
        detail: "Apartments and dwelling units inside the building are not required to be provided with Exit Signs. Universal Exit Signs apply only at exit passageways and corridors."

  - id: es_hotel
    match: {occupancy_in: [hotel_a, hotel_b, hotel_c]}
    section: "Ch 5, #3 / Table 5.3 item 11"
    page: "p.398"
    systems:
      - name: "Tactile Signs at Every Exit"
        spec: "Per Table 5.1.3"
      - name: "Floor Proximity Signs"
        spec: "Per Table 5.1.7"
        detail: "All hotel occupancies shall be provided with Floor Proximity Signs."
      - name: "Guest Room Exemption"
        required: not_required
        detail: "Guest rooms are not required to be provided with Exit Signs."
      - name: "Per-Guest-Room Evacuation Plan"
        spec: "Per Table 5.1.8"
        detail: "Evacuation Plan shall be provided in each guest room (in addition to per-floor and multi-location plans)."

  - id: es_daycare
    match: {occupancy_in: [daycare_a, daycare_b, daycare_c]}
    section: "Ch 5, #3 / Table 5.3 item 12"
    page: "p.398"
    systems:
      - name: "Daycare Compliance Note"
        detail: "Universal Exit/Directional Signs and Evacuation Plan apply. No additional special signage required by Table 5.3 item 12."

  - id: es_detention
    match: {occupancy_in: [detention_a, detention_b, detention_c]}
    section: "Ch 5, #3 / Table 5.3 item 13"
    page: "p.398"
    systems:
      - name: "Dwelling Cell Area Exemption"
        required: not_required
        detail: "Exit Signs shall not be required in dwelling-cell areas."
      - name: "Tactile Signs at Every Exit (public areas)"
        spec: "Per Table 5.1.3"
        detail: "General public areas, offices and areas accessible to general public shall be provided with universal Exit/Directional Signs and Tactile Signs at every exit."

  - id: es_mercantile
    match: {occupancy_in: [mercantile_a, mercantile_b, mercantile_c]}
    section: "Ch 5, #3 / Table 5.3 item 14"
    page: "p.398"
    systems:
      - name: "Aisle / Rack Directional Signs"
        spec: "Per Table 5.1.2"
        detail: "Directional Signs shall be provided for aisles and rack areas where the exit is not directly visible."

  - id: es_open_yard
    # Table 5.3 item 15 is storage / industrial (warehouses and factories).
    # Table 9.27 Group U is open-yard storage of materials other than
    # flammable and combustible (outdoor, no building envelope). The engine
    # unions every match, so the warehouse row and the indoor Table 5.3
    # items 1-5 package (exit doors, stairs, corridors, framed plans) must
    # not also fire on a Group U profile.
    match:
      occupancy: storage_industrial
      is_open_yard_storage_is: true
    section: "Ch 5, #3 / Table 5.3 item 15"
    page: "p.399"
    systems:
      - name: "Exit Signs Not Required (Open Yard Storage)"
        required: not_required
        detail: "Table 5.3 item 15 (p.399) applies universal Exit / Directional Signs and Evacuation Plans to storage and industrial occupancies. Table 9.27 Group U is open-yard storage (no building envelope), so those warehouse rows do not apply: there are no exit stairs, exit-access corridors or interior exit doors to mark."

  - id: es_storage_industrial
    match: {occupancy: storage_industrial, is_open_yard_storage_is: false}
    section: "Ch 5, #3 / Table 5.3 item 15"
    page: "p.399"
    systems:
      - name: "Storage / Industrial Compliance Note"
        detail: "Universal Exit/Directional Signs and Evacuation Plan apply. High-hazard zones, robotic / cold storage, basements and cable-spread areas require Photoluminescent Exit Marking strips - see add-ons."

  - id: es_mall
    match: {occupancy_in: [mall_covered, mall_open, mall_mixed]}
    section: "Ch 5, #3 / Table 5.3 item 16"
    page: "p.399"
    systems:
      - name: "Tactile Signs at Every Exit"
        spec: "Per Table 5.1.3"
      - name: "Tenant-level Evacuation Plan Exemption"
        required: not_required
        detail: "Evacuation plans are not required at individual tenant spaces (mall-level plans suffice)."

  - id: es_parking
    match: {occupancy_in: [parking_enclosed, parking_open]}
    section: "Ch 5, #3 / Table 5.3 item 17"
    page: "p.399"
    systems:
      - name: "Distinguishable Vehicle-Exit Route Signs"
        detail: "The vehicle exit-route signs shall be clearly distinguishable in size, colour and format from Exit Signs and Directional Signs required by this chapter (so occupants do not confuse vehicular routes with pedestrian egress routes)."

  - id: es_villa_private
    match: {occupancy: villa_private, villa_converted_use_is: false}
    section: "Ch 5, #3 / Table 5.3 item 18"
    page: "p.399"
    systems:
      - name: "Exit Signs Not Required"
        required: not_required
        detail: "Exit Signs are not required in private villas, unless usage has changed and the building has been converted into another occupancy."

  - id: es_villa_private_converted
    match: {occupancy: villa_private, villa_converted_use_is: true}
    section: "Ch 5, #3 / Table 5.3 item 18 (override)"
    page: "p.399"
    systems:
      - name: "Exit Signs at Exit Doors / Stairs (converted villa)"
        detail: "Once a private villa is converted to another occupancy, full Exit / Directional / supplementary signage per the new occupancy applies (Section 3 universal items + the relevant Table 5.3 occupancy row)."

  - id: es_villa_commercial
    match: {occupancy: villa_commercial, villa_converted_use_is: false}
    section: "Ch 5, #3 / Table 5.3 item 19"
    page: "p.399"
    systems:
      - name: "Exit Signs Not Required"
        required: not_required
        detail: "Exit Signs are not required in commercial villas, unless usage has changed and the building has been converted into another occupancy."

  - id: es_villa_commercial_converted
    match: {occupancy: villa_commercial, villa_converted_use_is: true}
    section: "Ch 5, #3 / Table 5.3 item 19 (override)"
    page: "p.399"
    systems:
      - name: "Exit Signs at Exit Doors / Stairs (converted villa)"
        detail: "Once a commercial villa is converted to a different occupancy class, full Exit / Directional signage per the new occupancy applies."

  - id: es_motor_fuel_gf
    match: {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: false}
    section: "Ch 5, #3 / Table 5.3 item 20"
    page: "p.399"
    systems:
      - name: "Exit Signs Not Required (ground-floor-only stations)"
        required: not_required
        detail: "Exit Signs are not required for ground-floor-only fuel dispensing facilities."

  - id: es_motor_fuel_multistorey
    match: {occupancy: motor_fuel_dispensing, fuel_dispensing_multistorey_is: true}
    section: "Ch 5, #3 / Table 5.3 item 20 (override)"
    page: "p.399"
    systems:
      - name: "Exit Signs at Exit Doors / Stairs (multi-storey fuel dispensing)"
        detail: "Multi-storey fuel-dispensing buildings shall be provided with full Exit / Directional Signs per Section 3."

# ---------- ADD-ONS (flag-driven, layered on top of branches) ------------
addons:
  - id: es_amusement_confounding_directional
    flag: has_amusement_confounding
    systems:
      - name: "Concealed-Path Directional Marking (becomes apparent in emergency)"
        code_ref: "Ch 5, #3 / Table 5.3 item 6.v"
        page_ref: "p.397"
        spec: "Per Table 5.1.2 (becomes apparent in emergency)"
        detail: "Special amusement buildings using mazes, mirrors or other designs that confound the egress path shall provide Directional Exit Marking that becomes apparent only in an emergency."

  - id: es_nightclub_disco_photoluminescent
    flag: has_nightclub_disco
    systems:
      - name: "Photoluminescent Exit Marking Strips (Night Clubs / Discos)"
        code_ref: "Ch 5, #3 / Table 5.3 item 6.vii"
        page_ref: "p.397"
        spec: "Per Table 5.1.4 (UL 1994 listed)"
        detail: "Continuous low-mounted photoluminescent strips along the egress path. Face of strip shall be continually illuminated to charge the photoluminescent material per Table 5.1.4."

  - id: es_theater_cinema_photoluminescent
    flag: has_theater_cinema
    systems:
      - name: "Photoluminescent Exit Marking Strips (Theatres / Cinemas)"
        code_ref: "Ch 5, #3 / Table 5.3 item 6.viii"
        page_ref: "p.397"
        spec: "Per Table 5.1.4"
        detail: "Photoluminescent strips along the egress path in theatres and cinemas."

  - id: es_amusement_park_photoluminescent
    flag: has_amusement_confounding
    systems:
      - name: "Photoluminescent Exit Marking Strips (Amusement / Indoor Rides / Theme Parks / Play Areas)"
        code_ref: "Ch 5, #3 / Table 5.3 item 6.vi"
        page_ref: "p.397"
        spec: "Per Table 5.1.4"
        detail: "All amusement parks, indoor rides, theme parks and play areas shall be provided with Photoluminescent Exit Marking strips."

  - id: es_nursery_photoluminescent
    flag: has_nursery_within
    systems:
      - name: "Photoluminescent Exit Marking Strips (Nurseries)"
        code_ref: "Ch 5, #3 / Table 5.3 item 8.ii"
        page_ref: "p.398"
        spec: "Per Table 5.1.4"
        detail: "Table 5.3 item 8.ii (p.398): Nurseries shall be provided with Photoluminescent Exit Marking strips as per Table 5.1.4. Required because 'Nursery (inside education)' is ticked: owner ruling 12.10.2026, P3 Ch47 Q1 (conditional for Educational Group A, required when 'Nursery' is ticked)."

  - id: es_auditorium_photoluminescent
    flag: has_auditorium_within
    systems:
      - name: "Photoluminescent Exit Marking Strips (Auditoriums)"
        code_ref: "Ch 5, #3 / Table 5.3 item 8.iii"
        page_ref: "p.398"
        spec: "Per Table 5.1.4"
        detail: "Auditoriums within educational occupancies shall be provided with Photoluminescent Exit Marking strips."

  - id: es_hh_storage_photoluminescent
    flag: has_hh_storage_zones
    systems:
      - name: "Photoluminescent Exit Marking Strips (HH / Robotic / Cold / Cable Spread / Industrial Basements)"
        code_ref: "Ch 5, #3 / Table 5.3 item 15.ii"
        page_ref: "p.399"
        spec: "Per Table 5.1.4"
        detail: "High-hazard areas (Group A-1, A-2), robotic storage, cold storage, industrial basements and cable spread areas shall be provided with Photoluminescent Exit Marking strips."

  - id: es_mall_play_food_cinema_photoluminescent
    flag: has_mall_play_food_cinema
    systems:
      - name: "Photoluminescent Exit Marking Strips (Mall Play / Food Court / Cinema zones)"
        code_ref: "Ch 5, #3 / Table 5.3 item 16.iii"
        page_ref: "p.399"
        spec: "Per Table 5.1.4"
        detail: "Play areas, food courts and cinema areas within malls shall be provided with Photoluminescent Exit Marking strips."

  - id: es_robotic_parking_photoluminescent
    flag: has_robotic_parking
    systems:
      - name: "Photoluminescent Exit Marking Strips (Robotic / Mechanical Parking)"
        code_ref: "Ch 5, #3 / Table 5.3 item 17.iii"
        page_ref: "p.399"
        spec: "Per Table 5.1.4"
        detail: "Robotic / mechanical parking shall be provided with Photoluminescent Exit Marking strips on access walkways."
