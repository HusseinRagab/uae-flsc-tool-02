# UAE FLSC 2018 - Chapter 6: Emergency Lighting
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 6
  chapter_title: "Emergency Lighting"

# ---------- GENERAL: Table 6.1 lux/duration + Table 6.6 coverage locations ---
general:
  - id: el_g_general_specs
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Emergency Lighting - General Performance Specs (Table 6.1)"
        spec: "Initial >= 1.1 lux at any point + average >= 10.8 lux on egress centerline; decline to >= 0.65 lux at any point at end of 3 hours; max:min ratio <= 40:1; open spaces decline to 0.5 lux; high risk areas initial average >= 12 lux with no point below 1.8 lux; each compartment > 280 m2 two luminaires; 3 hours (180 minutes)"
        code_ref: "Ch 6, #3.1 / Table 6.1"
        page_ref: "p.408, p.410"
        detail: "Per Table 6.1 - Lux requirements (egress path on floor / 1 m width of centerline): INITIAL >= 1.1 lux at any point AND average >= 10.8 lux. After 3 hours discharge: decline permitted to NOT LESS THAN 0.65 lux at any point (NOT 0.6 - exact code value 0.65). Maximum-to-minimum illumination ratio shall NOT exceed 40:1 (prevents dark zones). Open areas not on exit route: decline to 0.5 lux at any point at end of 3 hours permitted. HIGH-RISK AREAS where operations need shut-down: initial average >= 12 lux with NO point below 1.8 lux. COMPARTMENT REDUNDANCY: every compartment > 280 m2 SHALL have minimum two luminaires (single-failure protection). Duration 3 hours (180 min) immediately after power failure. TRANSFER TIME: per Tables 6.2 / 6.3 / 6.4 (p.412 / p.415 / p.418), the luminaire shall be of Type 10 - cut-in time NOT EXCEEDING 10 seconds from loss of normal power supply."

  - id: el_g_coverage_mandatory
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Mandatory EL Coverage Locations (Table 6.6 items 1-27)"
        code_ref: "Ch 6, #4.4 / Table 6.6"
        page_ref: "p.420"
        detail: "EL luminaires shall be installed at (Table 6.6 items 1-27): fire pump room / EPS room / plant rooms; emergency command centre (inside + outside); stairways (inside + outside) - EVERY landing of each stair; outside exit stair at discharge level; lift lobby; firefighter lift lobby; exit corridors / exit access corridors / exit passageways; EVERY change in direction of exit corridor or walking path; tunnels; all enclosed basements + ramps; service corridors; outside exit discharge; reception; FACP location; smoke control panel; #15 EVERY Fire Hose Cabinet (FHC) location; #16 EVERY Fire Extinguisher location; #17 EVERY First Aid Kit location; LPG tank location; #24 indoor loading/unloading areas; LV room; transformer room; #27 washrooms; toilets; elevators; car parks; escalators."
      - name: "EL Proximity Rule (within 2m)"
        spec: "Every FHC / first-aid box / externally-illuminated exit sign shall be within 2 m of an EL luminaire"
        code_ref: "Ch 6, #3.1 / Table 6.1 item 1.v-vii (Pre-Design Considerations)"
        page_ref: "p.408"
        detail: "Pre-design rule: every Fire Hose Cabinet (FHC) in the corridor shall be within 2 m of emergency luminaire; every First Aid Box shall be within 2 m of emergency luminaire; every Exit Sign intended to be externally illuminated requires emergency luminaire within 2 m."

  # CH47-08: the fire-rated wiring item moved to the system-type lines below (Table 6.2
  # #8 central battery: 2 hour fire rated; Table 6.3 #7 monitored: not required).
  - id: el_g_acceptance_test
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "EL Acceptance Tests + Periodic Inspection"
        code_ref: "Ch 6, #6.1 / Table 6.7 (acceptance) + #7.1 / Table 6.8 (inspection and maintenance)"
        page_ref: "p.422-423"
        spec: "Acceptance per Table 6.7: transfer and 15-minute load test, lux measurement, self diagnostic test, handing over. Table 6.8: monthly functional test for 30 seconds of simulation of mains failure; annual functional test for minimum of 3 hours; self contained luminaire's batteries replaced every 4 years."
        detail: "Table 6.7 (p.422): 1 LOCATION - verify number and locations of luminaires as per approved drawings. 2 TRANSFER AND LOAD - test for conformity with this chapter, NFPA 70, NFPA 110 and NFPA 111; with batteries fully charged and a connected load bank at rated value, initiate a normal power failure; observe and record the time delay; the load test shall be continued for 15 minutes recording voltage and current to the load, voltage and current of the battery bank and, where applicable, the frequency; observe the transfer time; then connect the system to normal power for 24 hours. 3 LUX - initial lux not less than an average of 10.8 lux and at any point not less than 1.1 lux along the egress path; decline to not less than 0.65 at the end of 3 hours at any point; not less than 0.5 at open spaces. 4 BATTERY ROOM - for central battery systems, battery room ventilation and proper storage arrangement verified. 5 SELF TEST - self diagnostic test through the control unit or computer, recorded. 6 HANDING OVER - operating, inspection, maintenance and battery usage manuals with approved drawings; inspection report signed by Consultant, Contractors and Owner's representatives; Civil Defence NOC and completion certificates. Table 6.8 (p.423): 1 MONTHLY - functional test every month for 30 seconds of simulation of mains failure; for central battery and monitored type systems a self diagnostic 'walk-through' test through the control unit or computer; luminaire output, battery and charger health and circuit integrity recorded; battery, charger, electrolyte, terminals, cell voltages, indicator lamps and load value checked. 2 ANNUALLY - functional test for minimum of 3 hours; battery discharged fully for 3 hours and availability of lux verified; system put back to normal charging; lux not below 0.65 at the end of 3 hours at any point. 3 BATTERY REPLACEMENT - self contained luminaire's batteries replaced every 4 years."

  - id: el_g_luminaire_spacing
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "EL Luminaire Spacing - Minimum Guideline (Tables 6.1.a / 6.1.b)"
        code_ref: "Ch 6, #3.1 / Table 6.1 item 4, Tables 6.1.a and 6.1.b"
        page_ref: "p.410"
        spec: "Spacing from the manufacturer's authenticated spacing tables or listed software (item 4.ii); Tables 6.1.a (exit routes and corridors, 1.1 lux) and 6.1.b (open spaces, 0.5 lux) are minimum guidelines for reference only (item 4.iv-vi); drawings state H, D1, D2, D3, D4, D5 distances."
        detail: "Table 6.1 item 4 (p.410): luminaires dedicated and marked; spacing based on authenticated manufacturer spacing tables or listed software from photometric tests; consultant furnishes calculations and lux distribution printouts; guidelines for reference only, actual spacing from manufacturer's tested and authorized tables, with H, D1-D5 shown on drawings. Columns: D1 transverse to wall, D2 transverse to transverse, D3 axial to wall, D4 axial to axial, D5 transverse to axial. Table 6.1.a exit routes and corridors (1.1 lux), by mounting height H: 2.5 m = 2.7 / 7.2 / 1.5 / 4.6 / 3.65 m; 3 m = 2.5 / 7.3 / 1.6 / 4.7 / 3.6 m; 4 m = 2.1 / 7.5 / 1.7 / 4.8 / 3.45 m; 6 m = 2 / 5.3 / 1.8 / 3.7 / 3.3 m. Table 6.1.b open spaces (0.5 lux): 2.5 m = 2.5 / 8.5 / 2.3 / 7.4 / 4.95 m; 3 m = 2.5 / 9 / 1.6 / 8 / 6.25 m; 4 m = 2.6 / 9.8 / 2.3 / 8.6 / 3.6 m; 6 m = 2.4 / 10.3 / 1.6 / 9.5 / 3 m."

  - id: el_g_coverage_exempt
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "EL Exempted Locations (Table 6.6 items 28-35)"
        required: not_required
        code_ref: "Ch 6, #4.4 / Table 6.6"
        page_ref: "p.420"
        detail: "Not mandatory at: school classrooms; patient sleeping rooms; prison cells; school open corridors; offices < 60 m²; garbage rooms; typical-floor electrical rooms; typical-floor telephone rooms."

  - id: el_g_hotel_guest_room
    when:
      occupancy_in: [hotel_a, hotel_b, hotel_c]
    systems:
      - name: "EL inside Hotel Guest Rooms"
        code_ref: "Ch 6, #4.4 / Table 6.6 item 20"
        page_ref: "p.420"
        detail: "Each hotel guest room shall be provided with an emergency lighting luminaire (Table 6.6 item 20)."

  - id: el_g_assembly_seating
    when:
      occupancy_in: [assembly_a, assembly_b, assembly_c]
    systems:
      - name: "EL at Assembly Seating Areas"
        code_ref: "Ch 6, #4.4 / Table 6.6 item 21"
        page_ref: "p.420"
        detail: "Assembly seating areas (auditoria, theatres, arenas, banquet halls) shall be provided with emergency lighting."

  - id: el_g_commercial_kitchen
    when:
      has_commercial_kitchen_is: true
    systems:
      - name: "EL inside Commercial Kitchen + Delivery Areas"
        code_ref: "Ch 6, #4.4 / Table 6.6 items 22-23"
        page_ref: "p.420"
        detail: "Commercial kitchens and adjacent delivery areas shall be provided with emergency lighting."

  - id: el_g_lpg_tank
    when:
      has_lpg_tanks_is: true
    systems:
      - name: "EL at LPG Tank Location"
        code_ref: "Ch 6, #4.4 / Table 6.6 item 19"
        page_ref: "p.420"
        detail: "LPG tank locations (aboveground / roof / podium tanks) shall be provided with emergency lighting."

  - id: el_g_lv_transformer
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "EL inside LV / Transformer Rooms"
        code_ref: "Ch 6, #4.4 / Table 6.6 items 25-26"
        page_ref: "p.420"
        detail: "LV rooms and transformer rooms shall be provided with emergency lighting (per Table 6.6 items 25-26)."

  - id: el_g_tunnel
    when:
      has_tunnel_is: true
    systems:
      - name: "EL inside Tunnels"
        code_ref: "Ch 6, #4.4 / Table 6.6 item 9"
        page_ref: "p.420"
        detail: "Tunnels within the building (basement/podium/inter-building tunnels) shall be provided with emergency lighting throughout."

# ---------- BRANCHES: Table 6.5 system-type selection -----------------------
branches:
  - id: el_super_highrise
    match:
      height_m_gt: 90
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing]
    section: "Ch 6, #4.3 / Table 6.5 item 1"
    page: "p.419"
    systems:
      - name: "Central Battery (Section 3.2) OR Monitored Self-Contained (Section 3.3) Emergency Lighting"
        detail: "Table 6.5 items 1-4 (p.419): a Central Battery Emergency Lighting System per Section 3.2 OR a Monitored Type Self-Contained Emergency Lighting System per Section 3.3, complete with dedicated control and computer interfacing, shall be provided. Either system satisfies the table; the code states no preference. CENTRAL BATTERY option (Table 6.2, p.414): wiring of all the central battery system shall be 2 hour fire rated, throughout, permitted in the same raceway of Emergency Systems but totally independent of all other wiring and equipment (#8.i); luminaires fed by minimum of two circuits in each zone of coverage, each area covered in a cross zoned arrangement by luminaires from two different circuits (#9); Central Battery Room protected with Automatic Clean Agent System (#10); 5% spare capacity shall be included when selecting the central battery system rating (Table 6.2 #4.ii, p.413; owner ruling 13.10.2026); fire rated cable certified for 120 minutes, acceptable test standards #8.1.9 (p.425): EN 50200, UL 2196, BS 8434-2, BS 7629-1, BS 6387, IEC 60331-1, IEC 60331-2, IEC 60332-2-2, IEC 60332-3-10, UL 1724, UL 1685, UL 1666 (#8.1.2: latest edition of each test standard). MONITORED option (Table 6.3, p.416): wiring of all the self contained luminaires into the central monitoring unit not required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity included when selecting the system (#4.ii). Central battery option: Type per Table 6.2 - dedicated control + computer interface; 2-hour fire-rated wiring; cross-zoned circuits. Centralized EL system covering the entire facility under one facility-management. Vented or VRLA central battery (NiCd or flat-plate lead-acid) sized for 3-hour duration. Battery room protected with automatic clean-agent system. NOTE: The 90 m 'Super-Highrise' threshold is defined in UAE FLSC Chapter 1 (Definitions) - Ch 6 Table 6.5 only references the term. Monitored option: Per Table 6.3 - centralised monitoring + computer interface; UPS/battery in each luminaire."
      - &el_single_system
        name: "One Centralized Emergency Lighting System for the Entire Facility (#4.2)"
        code_ref: "Ch 6, #4.2"
        page_ref: "p.419"
        spec: "One centralized system for the entire facility under one facility management, covering all tenants, offices, shops, mercantile units, warehouses; no multiple control equipment or multiple battery storage banks serving individual tenants"
        detail: "#4.2 (p.419): where central battery or monitored type emergency lighting is required by Table 6.5, a centralized Emergency Lighting system shall be provided for the entire facility, to be under one facility management, covering all individual tenants, offices, shops, mercantile units, warehouses etc. Buildings shall not be provided with multiple control equipment, multiple battery storage banks, serving individual tenants."


  - id: el_highrise
    match:
      height_m_gte: 23
      height_m_lte: 90
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing]
    section: "Ch 6, #4.3 / Table 6.5 item 2"
    page: "p.419"
    systems:
      - name: "Central Battery (Section 3.2) OR Monitored Self-Contained (Section 3.3) Emergency Lighting"
        detail: "Table 6.5 items 1-4 (p.419): a Central Battery Emergency Lighting System per Section 3.2 OR a Monitored Type Self-Contained Emergency Lighting System per Section 3.3, complete with dedicated control and computer interfacing, shall be provided. Either system satisfies the table; the code states no preference. CENTRAL BATTERY option (Table 6.2, p.414): wiring of all the central battery system shall be 2 hour fire rated, throughout, permitted in the same raceway of Emergency Systems but totally independent of all other wiring and equipment (#8.i); luminaires fed by minimum of two circuits in each zone of coverage, each area covered in a cross zoned arrangement by luminaires from two different circuits (#9); Central Battery Room protected with Automatic Clean Agent System (#10); 5% spare capacity shall be included when selecting the central battery system rating (Table 6.2 #4.ii, p.413; owner ruling 13.10.2026); fire rated cable certified for 120 minutes, acceptable test standards #8.1.9 (p.425): EN 50200, UL 2196, BS 8434-2, BS 7629-1, BS 6387, IEC 60331-1, IEC 60331-2, IEC 60332-2-2, IEC 60332-3-10, UL 1724, UL 1685, UL 1666 (#8.1.2: latest edition of each test standard). MONITORED option (Table 6.3, p.416): wiring of all the self contained luminaires into the central monitoring unit not required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity included when selecting the system (#4.ii). Central battery option: Per Table 6.2 - 3-hour duration. Monitored option: Per Table 6.3 - centralised monitoring + computer interface."
      - *el_single_system


  - id: el_mall
    match:
      occupancy_in: [mall_covered, mall_open, mall_mixed]
    section: "Ch 6, #4.3 / Table 6.5 item 3"
    page: "p.419"
    systems:
      - name: "Central Battery (Section 3.2) OR Monitored Self-Contained (Section 3.3) Emergency Lighting"
        detail: "Table 6.5 items 1-4 (p.419): a Central Battery Emergency Lighting System per Section 3.2 OR a Monitored Type Self-Contained Emergency Lighting System per Section 3.3, complete with dedicated control and computer interfacing, shall be provided. Either system satisfies the table; the code states no preference. CENTRAL BATTERY option (Table 6.2, p.414): wiring of all the central battery system shall be 2 hour fire rated, throughout, permitted in the same raceway of Emergency Systems but totally independent of all other wiring and equipment (#8.i); luminaires fed by minimum of two circuits in each zone of coverage, each area covered in a cross zoned arrangement by luminaires from two different circuits (#9); Central Battery Room protected with Automatic Clean Agent System (#10); 5% spare capacity shall be included when selecting the central battery system rating (Table 6.2 #4.ii, p.413; owner ruling 13.10.2026); fire rated cable certified for 120 minutes, acceptable test standards #8.1.9 (p.425): EN 50200, UL 2196, BS 8434-2, BS 7629-1, BS 6387, IEC 60331-1, IEC 60331-2, IEC 60332-2-2, IEC 60332-3-10, UL 1724, UL 1685, UL 1666 (#8.1.2: latest edition of each test standard). MONITORED option (Table 6.3, p.416): wiring of all the self contained luminaires into the central monitoring unit not required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity included when selecting the system (#4.ii). Central battery option: Per Table 6.2 - facility-wide, single facility management."
      - *el_single_system


  - id: el_assembly_amusement
    match:
      occupancy_in: [assembly_a, assembly_b, assembly_c]
      has_amusement_confounding_is: true
    section: "Ch 6, #4.3 / Table 6.5 item 4"
    page: "p.419"
    systems:
      - name: "Central Battery (Section 3.2) OR Monitored Self-Contained (Section 3.3) Emergency Lighting"
        detail: "Table 6.5 items 1-4 (p.419): a Central Battery Emergency Lighting System per Section 3.2 OR a Monitored Type Self-Contained Emergency Lighting System per Section 3.3, complete with dedicated control and computer interfacing, shall be provided. Either system satisfies the table; the code states no preference. CENTRAL BATTERY option (Table 6.2, p.414): wiring of all the central battery system shall be 2 hour fire rated, throughout, permitted in the same raceway of Emergency Systems but totally independent of all other wiring and equipment (#8.i); luminaires fed by minimum of two circuits in each zone of coverage, each area covered in a cross zoned arrangement by luminaires from two different circuits (#9); Central Battery Room protected with Automatic Clean Agent System (#10); 5% spare capacity shall be included when selecting the central battery system rating (Table 6.2 #4.ii, p.413; owner ruling 13.10.2026); fire rated cable certified for 120 minutes, acceptable test standards #8.1.9 (p.425): EN 50200, UL 2196, BS 8434-2, BS 7629-1, BS 6387, IEC 60331-1, IEC 60331-2, IEC 60332-2-2, IEC 60332-3-10, UL 1724, UL 1685, UL 1666 (#8.1.2: latest edition of each test standard). MONITORED option (Table 6.3, p.416): wiring of all the self contained luminaires into the central monitoring unit not required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity included when selecting the system (#4.ii). Central battery option: Amusement buildings (mazes / mirrors / theme rides) require central battery EL or monitored self-contained EL irrespective of height."
      - *el_single_system


  - id: el_amusement_standalone
    match:
      has_amusement_confounding_is: true
      occupancy_not: [assembly_a, assembly_b, assembly_c, villa_private, villa_commercial, motor_fuel_dispensing]
    section: "Ch 6, #4.3 / Table 6.5 item 4 (AMUSEMENT BUILDINGS - standalone class)"
    page: "p.419"
    systems:
      - name: "Central Battery (Section 3.2) OR Monitored Self-Contained (Section 3.3) Emergency Lighting"
        detail: "Table 6.5 items 1-4 (p.419): a Central Battery Emergency Lighting System per Section 3.2 OR a Monitored Type Self-Contained Emergency Lighting System per Section 3.3, complete with dedicated control and computer interfacing, shall be provided. Either system satisfies the table; the code states no preference. CENTRAL BATTERY option (Table 6.2, p.414): wiring of all the central battery system shall be 2 hour fire rated, throughout, permitted in the same raceway of Emergency Systems but totally independent of all other wiring and equipment (#8.i); luminaires fed by minimum of two circuits in each zone of coverage, each area covered in a cross zoned arrangement by luminaires from two different circuits (#9); Central Battery Room protected with Automatic Clean Agent System (#10); 5% spare capacity shall be included when selecting the central battery system rating (Table 6.2 #4.ii, p.413; owner ruling 13.10.2026); fire rated cable certified for 120 minutes, acceptable test standards #8.1.9 (p.425): EN 50200, UL 2196, BS 8434-2, BS 7629-1, BS 6387, IEC 60331-1, IEC 60331-2, IEC 60332-2-2, IEC 60332-3-10, UL 1724, UL 1685, UL 1666 (#8.1.2: latest edition of each test standard). MONITORED option (Table 6.3, p.416): wiring of all the self contained luminaires into the central monitoring unit not required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity included when selecting the system (#4.ii). Central battery option: Per Table 6.5 row 4, 'AMUSEMENT BUILDINGS' is a standalone occupancy class (NOT gated on Assembly). Mazes, mirror houses, theme rides, escape rooms, etc., require central battery EL or monitored self-contained EL irrespective of height or primary occupancy classification."
      - *el_single_system


  - id: el_midrise_general
    match:
      height_m_gt: 15
      height_m_lt: 23
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing, storage_industrial, mall_covered, mall_open, mall_mixed]
      has_amusement_confounding_is: false
      # Owner rulings 12.10.2026, P3 Ch47 Q3 and 13.10.2026, P4 Q1/Q5: a Business
      # Group C or Mercantile Group C building below 23 m takes Table 6.5 item 11 / 12
      # instead (one system type).
      not:
        any_of:
          - {is_business_group_c_is: true}
          - {is_mercantile_group_c_is: true}
    section: "Ch 6, #4.3 / Table 6.5 item 5"
    page: "p.419"
    systems:
      - name: "Monitored Self-Contained EL (Section 3.3)"
        spec: "Per Table 6.3 - dedicated monitoring + computer interface"
        detail: "Each luminaire is self-contained (own battery + lamp + transfer switch) and reports status to a central monitoring unit. Table 6.3 (p.416): wiring of all the self contained luminaires into the central monitoring unit shall not be required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity shall be included when selecting the monitored type system (#4.ii)."
      - *el_single_system


  - id: el_lowrise_general
    match:
      height_m_lte: 15
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing, storage_industrial, mall_covered, mall_open, mall_mixed]
      has_amusement_confounding_is: false
      # Owner rulings 12.10.2026, P3 Ch47 Q3 and 13.10.2026, P4 Q1/Q5: a Business
      # Group C or Mercantile Group C building below 23 m takes Table 6.5 item 11 / 12
      # instead (one system type).
      not:
        any_of:
          - {is_business_group_c_is: true}
          - {is_mercantile_group_c_is: true}
    section: "Ch 6, #4.3 / Table 6.5 item 6"
    page: "p.419"
    systems:
      - name: "Monitored Self-Contained EL (Section 3.3)"
        spec: "Per Table 6.3"
        detail: "Self-contained luminaires reporting to a central monitoring unit. Table 6.3 (p.416): wiring of all the self contained luminaires into the central monitoring unit shall not be required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity shall be included when selecting the monitored type system (#4.ii)."
      - *el_single_system


  - id: el_storage_industrial
    match:
      occupancy: storage_industrial
      # Owner ruling 12.10.2026, P3 follow-up F-a2: Table 6.5 item 4 (AMUSEMENT
      # BUILDINGS) governs irrespective of primary occupancy. The engine unions
      # every match, so items 7-8 (warehouses/factories, monitored only) must
      # not also fire — they would require Monitored Self-Contained on top of
      # item 4's Central Battery OR Monitored package.
      has_amusement_confounding_is: false
    section: "Ch 6, #4.3 / Table 6.5 items 7-8"
    page: "p.419"
    systems:
      - name: "Monitored Self-Contained EL (Section 3.3)"
        spec: "Per Table 6.3"
        detail: "Warehouses and factories - self-contained luminaires with central monitoring. Table 6.3 (p.416): wiring of all the self contained luminaires into the central monitoring unit shall not be required to be fire rated (#7.i); cross zoning not required (#8.i); 5% spare capacity shall be included when selecting the monitored type system (#4.ii)."
      - *el_single_system


  # CH47-07 + owner rulings 12.10.2026, P3 Ch47 Q3 and 13.10.2026, P4 Q1 / Q5:
  # Table 6.5 items 11-12 are Business Group C and Mercantile Group C (Table 1.1 p.48 /
  # p.50). Group C below 23 m: item 11 / 12 governs, one required stand-alone line, and
  # the height row (items 5-6) is not printed. At 23 m or more the height rows (items
  # 1-2) govern. A food truck or mercantile truck (Mercantile Group C) takes item 12
  # whatever height is entered (owner ruling 13.10.2026, P4 Q5). A Business building
  # with no group chosen is NOT EVALUATED by name in engine.evaluate_el. An amusement
  # building (item 4) keeps item 4 (owner ruling 12.10.2026, P3 follow-up F-a2; engine
  # evaluate_el cites it on the item 4 line).
  - id: el_business_group_c
    match:
      is_business_group_c_is: true
      height_m_lt: 23
      has_amusement_confounding_is: false
    section: "Ch 6, #4.3 / Table 6.5 item 11 (Business Group C)"
    page: "p.419"
    systems:
      - name: "Stand-alone Self-Contained EL (Section 3.4)"
        spec: "Per Table 6.4 - Business Group C (Table 1.1), below 23 m"
        code_ref: "Ch 6, #4.3 / Table 6.5 item 11"
        page_ref: "p.419"
        detail: "Table 6.5 item 11 BUSINESS, GROUP C (p.419): Stand alone Self Contained Emergency Lighting System as per Section 3.4., shall be provided and permitted. Table 1.1 (p.48) Business Group C: barber shops, beauty shops, massage centers, typing centers, translation centers, print shops, photo studios. Business Group C is chosen and the building is below 23 m, so item 11 governs and the low rise / midrise row (items 5-6, Monitored) is not applied: owner rulings 12.10.2026, P3 Ch47 Q3 and 13.10.2026, P4 Q1. At 23 m or more the highrise rows (items 1-2) govern."

  - id: el_mercantile_group_c
    match:
      is_mercantile_group_c_is: true
      has_amusement_confounding_is: false
      any_of:
        - {height_m_lt: 23}
        - {is_mercantile_c_truck_is: true}
    section: "Ch 6, #4.3 / Table 6.5 item 12 (Mercantile Group C)"
    page: "p.419"
    systems:
      - name: "Stand-alone Self-Contained EL (Section 3.4)"
        spec: "Per Table 6.4 - Mercantile Group C (Table 1.1)"
        code_ref: "Ch 6, #4.3 / Table 6.5 item 12"
        page_ref: "p.419"
        detail: "Table 6.5 item 12 MERCANTILE, GROUP C (p.419): Stand alone Self Contained Emergency Lighting System as per Section 3.4., shall be provided and permitted. Table 1.1 (p.50) Mercantile Group C: kiosks, food trucks, mercantile trucks. Below 23 m item 12 governs and the low rise / midrise row (items 5-6, Monitored) is not applied (owner ruling 12.10.2026, P3 Ch47 Q3); a food truck or mercantile truck takes item 12 as its own Ch 6 line (owner ruling 13.10.2026, P4 Q5). A kiosk at 23 m or more takes the highrise rows (items 1-2)."

