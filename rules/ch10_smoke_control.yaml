# UAE FLSC 2018 - Chapter 10: Smoke Control & Smoke Management Systems
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 10
  chapter_title: "Smoke Control & Smoke Management"

# ---------- GENERAL: Section 2.5 / Table 10.3 (audit C10-09) -------------
# engine.evaluate_sc prints this block only when at least one smoke control / ventilation
# system line of the chapter is required.
general:
  - id: sc_general_section_2_5
    when: {}
    systems:
      - name: "Smoke Control General Requirements (Section 2.5 / Table 10.3)"
        code_ref: "Ch 10, #2.5 / Table 10.3 items 5-8; Table 10.11 item 1.v; Table 10.6 item 2.i; Annexure 1 FAQ #24"
        page_ref: "p.809, p.822, p.836, p.1281"
        spec: "All the smoke control systems shall be provided with a secondary source of power supply, calculated for the entire smoke control equipment required to activate (Table 10.3 item 5.i-ii); the fans and associated smoke control equipment wired with 2 hour fire-resistance rating and protected circuits (item 6.i); the smoke control system within a smoke zone fully operational within a time that shall not exceed 60 seconds from system activation (item 7.v); smoke exhaust / extract fans capable of operating effectively at 400°C for 2 hours (Table 10.11 item 1.v, Table 10.6 item 2.i; Annexure 1 FAQ #24)."
        detail: "Each Ch 10 system section refers back to these general requirements (e.g. #2.8.1 p.822, #2.13.1 p.836, #2.17.1 p.847, #2.18.1 p.849: 'shall comply with the relevant general requirements for smoke control systems as per Section 2.5'). Where fire resistance rated wiring is not used, wiring in 2 hour fire resistance rated shafts (item 6.ii). Metal conduits in lieu of 2 hour fire resistance rating shall not be acceptable (item 6.iii). Fan supply on a sub-main circuit exclusive thereto after the main isolator of the building (item 6.iv). Activation by sprinkler activation, smoke detectors or beam detectors in the same smoke control zone (item 7.i); remote manual activation and control switches (Smoke Control Panel) with a visual indication of the operation status at the fire command center or main fire alarm panel (item 7.iv). HVAC within the fire zone shut down automatically on smoke control activation, except the dedicated ventilation of exit stairs and passageways, smoke free and fire fighting lobbies, lift shafts, areas of refuge, basement carparks, emergency command center, flammable and hazardous material storage, emergency generator room and fire pump room (item 8.i-ii)."

# ---------- BRANCHES: Tables 10.19-10.26 application by occupancy/tier -----
branches:
  # ---------- Table 10.19 - Super-highrise (>90m) ----------
  - id: sc_super_highrise
    match: {height_m_gt: 90}
    section: "Ch 10, #3.1 / Table 10.19"
    page: "p.855-856"
    systems:
      - name: "Stair Pressurization (multi-injection, all levels including basements)"
        spec: "Per Section 2.6 - multiple injection arrangement. Stack-effect options the designer shall consider (Table 10.19 item 1.iv, at every 90 m intervals): (a) stair landing interrupted with a separation and 2-way swing smoke door; (b) transfer passageways or refuge areas; (c) stair shafts separated at regular intervals not exceeding 90 m; (d) mechanical pressurizing ducting sealed and fire stopped; (e) compensated forced airflow pressurization with an even pressure profile within the stair. Design ΔP per Table 10.3.a (12.5 / 25 / 35 / 45 Pa); max ΔP across door per Table 10.3.b (53-113 Pa); 133 N max door-opening force."
        detail: "Required throughout all stairs including basements (Table 10.19 item 1.iii). The stack effect in super highrise buildings can cause door-opening forces to exceed the acceptable limits (see Table 10.4.3); where the building height exceeds 90 m the designer shall consider options (a) to (e) of Table 10.19 item 1.iv to be integrated into the system design."
      - name: "Passenger Elevator Lobby (1-hr fire rated, smoke barrier)"
        spec: "Per Section 2.6 - lobby door 250 °C / 30 min temperature rise limit; self-closing leaves; smoke detector at door"
        detail: "Elevators opening directly to exit corridors WITHOUT lobby are NOT permitted in super-highrise."
      - name: "Enclosed Corridor Smoke Management (exhaust from roof only)"
        spec: "Per Section 2.8 - smoke exhaust open to sky; make-up air permitted from intermediate levels; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "No intermediate-level smoke exhaust permitted - must exhaust to sky from roof."
      - name: "Firefighting Lift + Firefighting Lobby (mandatory)"
        spec: "Lobby per Ch 1; pressurized firefighting stairs per Table 10.19.1"
        detail: "Mandatory for all super-highrise. Lobby is 1-hr fire-rated smoke partition. No separate smoke control needed for the lift shaft when lobby is provided."

  # ---------- Table 10.20 - Highrise (23-90 m) ----------
  # Code #3.2.1 (p.857) says "more than 23 m but less than 90 m". At the 90 m
  # edge, Ch 1 #1.7.42 + FAQ Annexure 1 treat the building as highrise (super
  # starts *more than* 90 m). Match is therefore inclusive at 90 m.
  - id: sc_highrise
    match: {height_m_gte: 23, height_m_lte: 90}
    section: "Ch 10, #3.2 / Table 10.20"
    page: "p.857"
    systems:
      - name: "Stair Pressurization"
        spec: "Per Section 2.6 - multiple injection arrangement for buildings > 30.5 m. Design ΔP per Table 10.3.a (p.806): sprinklered 12.5 Pa, non-sprinklered 25 / 35 / 45 Pa by ceiling height (3 / 4.5 / 6.5 m bands)."
        detail: "Stair pressurization extends to all levels including basements. Multiple-injection arrangement required when building exceeds 30.5 m height. Max allowable ΔP across door per Table 10.3.b (53-113 Pa range, varies with door width 0.81-1.22 m and closer force 25-60 N); door-opening force shall not exceed 133 N."
      - name: "Passenger Elevator Lobby OR Lift Hoistway Pressurization"
        spec: "Buildings with passenger elevator lobby: lobby arranged with smoke barriers (Table 10.20 item 2.1). Buildings without passenger elevator lobby: a lift hoistway pressurization shall be provided in accordance with Section 2.19 (item 2.2.i)"
        detail: "Table 10.20 item 2 (p.857) prints two cases. 1. BUILDINGS WITH PASSENGER ELEVATOR LOBBY: barriers forming the elevator lobby shall have a minimum 1-hour fire resistance rating; lobby door assemblies not exceeding 250 C above ambient at the end of 30 minutes; door leaves self-closing or automatic-closing, closing on a smoke detector directly outside the lobby (permitted to close on the building fire alarm signal); no smoke control required for a lobby complying with Table 10.20.2 (item 2.1 i-vii). 2. BUILDINGS WITHOUT PASSENGER ELEVATOR LOBBY: a lift hoistway pressurization shall be provided in accordance with Section 2.19 (item 2.2.i). The code states no preference between the two cases (audit C10-07)."
      - name: "Firefighting Lift (mandatory)"
        detail: "Every highrise shall have a fireman's lift connecting all floors including basements. Lobby optional - if provided shall be 1-hr fire-rated smoke partition; if not provided, hoistway pressurization required."
      - name: "Enclosed Corridor Smoke Management (exhaust from roof only)"
        spec: "Per Section 2.8; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "Corridor and open circulation areas shall be provided with a smoke management system in accordance with Section 2.8 (Table 10.20 item 4.i). Smoke exhaust only from roof (open to sky); no intermediate-level exhaust; make-up air permitted from intermediate levels (item 4.ii)."

  # ---------- Table 10.21 - Midrise / Lowrise default (<23 m) ----------
  # Table 10.21 item 1.i (p.858): stair pressurization not required for
  # occupancies other than Hospitals, Malls, Educational and Assembly.
  # healthcare_b / healthcare_c (clinics, outpatient) are not hospitals (CH10-14).
  - id: sc_midrise_lowrise_default
    match:
      height_m_lt: 23
      height_m_gt: 0    # C10-06: Table 10.21 is for buildings; infrastructure with no building (0 m) is out
      occupancy_not: [healthcare_a,
                      mall_covered, mall_open, mall_mixed,
                      assembly_a, assembly_b, assembly_c,
                      education_a, education_b, education_c,
                      villa_private, villa_commercial,
                      motor_fuel_dispensing,
                      parking_enclosed, parking_open,
                      storage_industrial]
    section: "Ch 10, #3.3 / Table 10.21 item 1"
    page: "p.858"
    systems:
      - name: "Stair Pressurization NOT Required (default)"
        required: not_required
        detail: "Above-grade stairs. Where the building has basements, the basement stairs follow Table 10.22 item 1 (depth more than 7 m; the pressurization extends to all levels if the basement stair is common to the floors above grade) and Annexure 1 FAQ #29.i (stairs that only serve a basement of more than 2 levels shall be pressurized). Stair pressurization is NOT required for midrise / lowrise occupancies other than hospitals, malls, educational and assembly. Where provided, design ΔP per Table 10.3.a (p.806): sprinklered 12.5 Pa, non-sprinklered 25 / 35 / 45 Pa by ceiling height band; max ΔP across door per Table 10.3.b (53-113 Pa) with 133 N max door-opening force per Section 2.6."

  - id: sc_basement_any
    # Table 10.22 items 2 and 4 (p.859) carry no depth or basement-count
    # trigger: they apply to every underground / basement area other than
    # parking. Items 1 and 3 (stairs, firefighting lift) need depth > 7 m.
    match:
      occupancy_not: [parking_enclosed, parking_open]
      any_of:
        - {floors_below_grade_gt: 0}
        - {occupancy_in: [high_depth_underground, low_depth_underground]}
    section: "Ch 10, #3.4 / Table 10.22 items 2 and 4"
    page: "p.859"
    systems:
      - name: "Passenger Elevator Lobby at Underground / Basement Levels (1-hr smoke barrier)"
        detail: "Every elevator connecting underground and basement areas shall have an elevator lobby arranged as a smoke barrier with at least 1-hour fire resistance; lobby doors limited to 250 C above ambient at the end of 30 minutes, self-closing or automatic-closing, closing on a smoke detector directly outside the lobby (or permitted on the fire alarm signal); no smoke control is then required for the lobby (Table 10.22 item 2.1 i-viii). Underground, basement and basement parking areas without an elevator lobby are not permitted (item 2.2 i)."
      - name: "Corridor and Open Circulation Smoke Management (underground / basement, non-parking)"
        spec: "Per Section 2.8; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "Corridor and open circulation areas at underground spaces and basements, other than parking, shall be provided with a smoke management system per Section 2.8 (Table 10.22 item 4.i)."
      - name: "Enclosed Rooms > 280 m2: Dedicated Smoke Exhaust (Section 2.17) OR Mechanical Smoke Purge (Section 2.13)"
        detail: "Enclosed rooms having a floor area greater than 280 m2 shall be provided with a dedicated and independent smoke exhaust system per Section 2.17, OR a mechanical smoke purging system using dedicated ducting per Section 2.13 (Table 10.22 item 4.ii). A Section 2.13 purge shall be designed to achieve 10 air changes per hour in a single smoke zone of not more than 3600 m2 (Table 10.11 item 3.i, p.836); Annexure 1 FAQ #31 (p.1282): the purge rate for basement shall be at least 9 air changes per hour. The 10 air changes per hour of Table 10.11 is the more onerous and governs a Section 2.13 system; FAQ #31 is named."

  # Table 10.22 items 1 and 3 (p.859) print only "a depth of more than 7 m from
  # the fire access level" (CH10-27). The basement-count trigger lives in
  # Annexure 1 FAQ #29.i (stairs, p.1282) and Ch 2 #2.9.4.a (Fire Lift, p.220):
  # see sc_basement_high_depth_levels below.
  - id: sc_basement_deep
    match:
      occupancy_not: [parking_enclosed, parking_open]
      depth_below_grade_m_gt: 7
    suppresses: [sc_midrise_lowrise_ff_lift]
    section: "Ch 10, #3.4 / Table 10.22 items 1 and 3 (depth more than 7 m)"
    page: "p.859"
    systems:
      - name: "Stair Pressurization (basement stairs, depth more than 7 m)"
        spec: "Per Section 2.6"
        detail: "Stairs connecting underground buildings and basements having a depth of more than 7 m from the fire access level shall be provided with stair pressurization per Section 2.6 (Table 10.22 item 1.i). It shall extend to all levels of the building if the basement stair is common to all the floors above grade (item 1.ii). Pressurization using a vestibule per Section 2.16 is permitted (item 1.iii). Annexure 1 FAQ #29.i (p.1282) states the same for stairs that only serve the basement."
      - name: "Firefighting Lift (depth more than 7 m)"
        detail: "Underground buildings and basements having a depth of more than 7 m from the fire access level shall be provided with a firefighting lift extending to all levels of the building (Table 10.22 item 3.i-ii). A firefighting lift lobby is not required; where provided it follows Chapter 1, with a 1-hour smoke-partition enclosure, and no smoke control or purge is then required for the lift shaft; lift pressurization using a vestibule per Section 2.16 is permitted (items 3.iii-vi)."

  - id: sc_basement_high_depth_levels
    match:
      occupancy_not: [parking_enclosed, parking_open]
      depth_below_grade_m_lte: 7
      any_of:
        - {floors_below_grade_gt: 2}
        - {occupancy: high_depth_underground}
    suppresses: [sc_midrise_lowrise_ff_lift]
    section: "Annexure 1 FAQ #29.i; Ch 2 #2.9.4.a (more than 2 basement levels)"
    page: "p.1282, p.220"
    systems:
      - name: "Stair Pressurization (basement stairs, more than 2 basement levels)"
        spec: "Per Section 2.6"
        code_ref: "Annexure 1 FAQ #29.i; Ch 1 #1.7.45"
        page_ref: "p.1282, p.45"
        detail: "Fire exit staircases that only serve the basement which have more than 2 levels or more than 7 m below the level of discharge (high depth underground buildings and structures) shall be pressurized; all fire exit staircases that serve the basement floors shall also be pressurized if the same staircase shafts serving the upper floors are pressurized (Annexure 1 FAQ #29.i). Table 10.22 item 1 (depth more than 7 m from the fire access level, extended to all levels where the basement stair is common to the floors above grade) is not triggered: the depth entered is 7 m or less, or not entered."
      - name: "Firefighting Lift (more than 2 basements)"
        code_ref: "Ch 2 #2.9.4.a"
        page_ref: "p.220"
        detail: "At least one Fire Lift in a dedicated shaft shall be provided in any building which is 'High Depth' with more than 2 basements (Ch 2 #2.9.4.a); it shall have access to every habitable floor (#2.9.4.c). Table 10.22 item 3 (firefighting lift for a depth of more than 7 m from the fire access level, extending to all levels) is not triggered: the depth entered is 7 m or less, or not entered."

  # A blank depth would silently skip the depth-based rows (hard rule: a
  # missing input that changes the result is named, not defaulted).
  - id: sc_basement_depth_not_entered
    match:
      depth_below_grade_m_lte: 0
      any_of:
        - {floors_below_grade_gt: 0}
        - {occupancy_in: [high_depth_underground, low_depth_underground]}
    section: "Ch 10, #3.4 / Table 10.22 items 1 and 3; Annexure 1 FAQ #29.i"
    page: "p.859, p.1282"
    systems:
      - name: "Basement Stair / Firefighting Lift by Depth - NOT EVALUATED (depth below grade not entered)"
        required: conditional
        detail: "Table 10.22 items 1 and 3 (stair pressurization and firefighting lift for underground buildings and basements more than 7 m deep from the fire access level, extended to all levels of the building) and Annexure 1 FAQ #29.i (basement stairs more than 7 m below the level of discharge) depend on the basement depth, which is not entered. Enter the depth below grade to evaluate them."

  - id: sc_parking_enclosed
    match: {occupancy: parking_enclosed}
    section: "Ch 10, #3.5 / Table 10.23.1"
    page: "p.860"
    systems:
      - name: "Mechanical Smoke Purging via Dedicated Ducting"
        spec: "Per Section 2.13: mechanical smoke purging system using a dedicated ducting (Table 10.23 item 1.i), designed to achieve 10 air changes per hour in a single smoke zone of not more than 3600 m2 (Table 10.11 item 3.i, p.836)"
        detail: "Every parking which does not comply with the open parking definition (Chapter 1 Table 1.9.34 and Table 10.23.2.1), every enclosed parking, enclosed parking structure, enclosed robotic parking structure and parking at an enclosed basement (item 1.i). Make-up air or replacement air shall not be required for single basement carparks, having an area less than 3600 m2; the drive ways (entry and exit) shall be permanently open and provide for the required make-up air (item 1.ii). A jet fan system shall not be permitted in enclosed parking (item 1.iii). Annexure 1 FAQ #31 (p.1282): the purge rate for basement shall be at least 9 air changes per hour; the 10 air changes per hour of Table 10.11 is the more onerous and governs (audit C10-04, C10-10)."
      # Cross-reference only: the main CO detection line is the Ch 3 rule (Table 3.37 item 7.i).
      - name: "Carbon Monoxide (CO) Detection Interfaced with the Ventilation System (cross-reference)"
        code_ref: "Ch 3, Table 3.37 item 7.i"
        page_ref: "p.338"
        spec: "CO detection system interfacing with the enclosed parking smoke purge / ventilation system"
        detail: "Table 3.37 item 7.i (p.338): 'Carbon monoxide detection shall be provided in all enclosed parking structures. Such CO detection system shall be electrically operated, complete with control panel and interfacing with ventilation system.' The main line is in Ch 3 (Means of Egress); this cross-reference records the interface with the Table 10.23 item 1 ventilation fans."

  - id: sc_parking_open_small
    match: {occupancy: parking_open, gross_floor_area_m2_gt: 0, gross_floor_area_m2_lte: 4000, height_m_lt: 23}
    section: "Ch 10, #3.5 / Table 10.23.2.2"
    page: "p.860"
    systems:
      - name: "Smoke Purging / Ventilation NOT Required"
        required: not_required
        detail: "Open parking complying with Table 10.23.2.1, and having a total floor area of up to 4000 m2 shall not be required to have any smoke purging or ventilation system (Table 10.23 item 2.2.i). Open parking definition (Table 10.23 item 2.1, p.860; Chapter 1 Table 1.9.34): each parking level shall have permanent wall openings open to the exterior or atmosphere, for an area of not less than 0.4 m2 for each linear meter of its exterior perimeter (ii); such openings distributed over 40 percent of the building perimeter surface or uniformly over each of at least two opposing side surfaces (iii); interior wall lines, column lines and obstructions at least 20 percent open, with openings distributed evenly (iv); any part of the parking within 30 m of the permanent natural ventilation opening on the perimeter surface (v). A parking that does not comply is enclosed parking (item 1.i). At 23 m or more see the Table 10.20 / 10.19 lines (audit C10-03)."

  # C10-02: a blank GFA never takes the 'up to 4000 m2' row (standing rule: a blank never passes).
  - id: sc_parking_open_gfa_not_entered
    match: {occupancy: parking_open, gross_floor_area_m2_lte: 0}
    section: "Ch 10, #3.5 / Table 10.23 items 2.2-2.3"
    page: "p.860"
    systems:
      - name: "Open Parking Smoke Purging (Table 10.23 item 2.2 / 2.3) - NOT EVALUATED (gross floor area not entered)"
        detail: "Table 10.23 tiers open parking by total floor area: up to 4000 m2, no smoke purging or ventilation system required (item 2.2.i); more than 4000 m2, mechanical smoke purging using ducting per Section 2.13 OR a jet fan system per Section 2.14 OR a combination thereof as a hybrid system (item 2.3.i). The gross floor area is not entered, so neither row is taken; enter it to evaluate (audit C10-02)."

  - id: sc_parking_open_large
    match: {occupancy: parking_open, gross_floor_area_m2_gt: 4000}
    section: "Ch 10, #3.5 / Table 10.23.2.3"
    page: "p.860"
    systems:
      - name: "Mechanical Smoke Purging OR Jet Fan System"
        spec: "Mechanical smoke purging system using ducting per Section 2.13 OR jet fan system per Section 2.14 OR combination thereof as a hybrid system (Table 10.23 item 2.3.i)"
        detail: "Open parking complying with Table 10.23.2.1 and having a total floor area of more than 4000 m2 (item 2.3.i). Smoke management system zoning shall be permitted to be 4000 m2 (item 2.3.iii). Section 2.13 purge: 10 air changes per hour in a single smoke zone of not more than 3600 m2 (Table 10.11 item 3.i, p.836); Section 2.14 jet fans: At least 10 air-changes per hour shall be achieved with a jet fan system, during fire condition (Table 10.12 item 3.i, p.839). Open parking definition (Table 10.23 item 2.1, p.860; Chapter 1 Table 1.9.34): each parking level shall have permanent wall openings open to the exterior or atmosphere, for an area of not less than 0.4 m2 for each linear meter of its exterior perimeter (ii); such openings distributed over 40 percent of the building perimeter surface or uniformly over each of at least two opposing side surfaces (iii); interior wall lines, column lines and obstructions at least 20 percent open, with openings distributed evenly (iv); any part of the parking within 30 m of the permanent natural ventilation opening on the perimeter surface (v). A parking that does not comply is enclosed parking (item 1.i)."

  # Table 10.23 items 1.iv, 2.2.ii, 2.3.ii (p.860): stairs at parking buildings
  # or structures having a height of more than 23 m. At exactly 23.0 m
  # Annexure 1 FAQ #27 (p.1282, 23 m or more) and ruling R1 apply (CH10-39).
  - id: sc_parking_stair_23_or_more
    match:
      occupancy_in: [parking_enclosed, parking_open]
      height_m_gte: 23
    section: "Ch 10, #3.5 / Table 10.23 items 1.iv, 2.2.ii, 2.3.ii; Annexure 1 FAQ #27"
    page: "p.860, p.1282"
    systems:
      - name: "Stair Pressurization (parking, height 23 m or more)"
        spec: "Per Section 2.6"
        detail: "Stairs at enclosed and open parking buildings or structures having a height of more than 23 m from the fire access level shall be provided with a stair pressurization system per Section 2.6 (Table 10.23 items 1.iv, 2.2.ii, 2.3.ii). At exactly 23.0 m: every escape staircase serving buildings of 23 m in height or more must be made a smoke proof enclosure, by pressurization (Annexure 1 FAQ #27; ruling R1)."

  - id: sc_parking_stair_under_23
    match:
      occupancy_in: [parking_enclosed, parking_open]
      height_m_lt: 23
    section: "Ch 10, #3.5 / Table 10.23 items 1.iv, 2.2.ii, 2.3.ii"
    page: "p.860"
    systems:
      - name: "Stair Pressurization NOT Required (parking, height less than 23 m)"
        required: not_required
        detail: "Table 10.23 requires parking stair pressurization only where the parking building or structure has a height of more than 23 m from the fire access level; this one is less than 23 m."

  # Table 10.22 (p.859) is "other than Parking usage"; the basement parking
  # stair rests on Annexure 1 FAQ #29.i (p.1282), which does not exclude
  # parking (CH10-28).
  - id: sc_basement_parking_deep
    match:
      occupancy_in: [parking_enclosed, parking_open]
      any_of:
        - {floors_below_grade_gt: 2}
        - {depth_below_grade_m_gt: 7}
    suppresses: [sc_parking_stair_under_23]
    section: "Annexure 1 FAQ #29.i"
    page: "p.1282"
    systems:
      - name: "Stair Pressurization (basement parking stairs, more than 2 levels or more than 7 m below)"
        spec: "Per Section 2.6"
        detail: "Fire exit staircases that only serve the basement which have more than 2 levels or more than 7 m below the level of discharge (high depth underground buildings and structures) shall be pressurized; all fire exit staircases that serve the basement floors shall also be pressurized if the same staircase shafts serving the upper floors are pressurized (Annexure 1 FAQ #29.i). Table 10.22 (underground and basement areas other than parking, p.859) does not apply to parking."

  - id: sc_mall
    match: {occupancy_in: [mall_covered, mall_open, mall_mixed]}
    section: "Ch 10, #3.6 / Table 10.24"
    page: "p.861"
    systems:
      - name: "Mall Circulation Smoke Control"
        spec: "Per Section 2.10"
        detail: "Automatic smoke curtains or permanent downstands installed strategically in open circulation areas as per the engineering analysis, but not more than 122 m of travel distance (Table 10.24 item 1.1.i-ii)."
      - name: "Enclosed Service Corridor Smoke Management"
        spec: "Per Section 2.8; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "Enclosed service corridors shall be provided with a corridor smoke management in accordance with Section 2.8 (Table 10.24 item 1.3.i)."
      - name: "Anchor / Hypermarket / Tenant > 1000 m² Smoke Management"
        required: conditional
        spec: "Independent and dedicated smoke management per Section 2.8, 6 ACH, zones of at most 2000 m2"
        detail: "Applies to anchor stores, hypermarkets and tenant spaces having floor area larger than 1000 m2 (Table 10.24 item 1.4, p.861); the tool has no tenant-area input, so the line is conditional: required for every such tenant space (audit C10-12). Tenant spaces having an area more than 1000 m2: 6 ACH, zone areas restricted to a maximum of 2000 m2 (by listed smoke curtains and/or permanent downstands complying with 20% of the hazard height); make-up air permitted from the mall; listed and approved smoke curtains to isolate the tenant space from the mall (Table 10.24 item 1.4.i-v)."
      - name: "Communicating Spaces - Smoke Containment Approach"
        detail: "Communicating spaces shall not be required to have dedicated smoke control systems; a smoke containment approach shall be implemented per Table 10.5.6 (Table 10.24 item 1.5.i)."

  # Table 10.27 item 4 (p.866): "such as" covered mercantile, staff and labour
  # accommodation, residential and office buildings - examples, not a closed
  # list (CH10-05; owner ruling 12.10.2026, P3 Ch10 Q3: examples, every lowrise /
  # midrise occupancy). Hospitals, schools and malls have their own corridor rows.
  - id: sc_lowrise_long_corridor
    match:
      height_m_lt: 23
      corridor_length_m_gt: 60
      occupancy_not: [healthcare_a, education_a, education_b, education_c,
                      mall_covered, mall_open, mall_mixed]
    section: "Ch 10, #3.9 / Table 10.27 item 4"
    page: "p.866"
    systems:
      - name: "Enclosed Corridor Natural Ventilation (corridor length > 60 m, lowrise/midrise)"
        spec: "Natural ventilation per Section 2.15 where the exterior façade or roof is accessible; fire rating of the corridor walls shall be ensured"
        detail: "Enclosed corridors of lowrise and midrise buildings having a circulation length in excess of 60 m (Table 10.27 item 4.i). The code names covered mercantile spaces, staff accommodations, labour accommodations, residential buildings and office buildings as examples ('such as'), so the row applies to any lowrise or midrise building with such a corridor (owner ruling 12.10.2026, P3 Ch10 Q3). Hospitals, schools and malls follow their own rows (Table 10.27 items 1 and 2, Table 10.24)."

  # Table 10.21 item 1.i (p.858) only removes malls and assembly from the
  # "not required" statement; Table 10.24 (malls) and Table 10.27 items 8-14
  # (assembly spaces) print no stair row (CH10-28). Hospitals: Table 10.27
  # item 1.vi (sc_hospital_stair). Schools: item 2.2.i (sc_school_stair).
  # Owner ruling 12.10.2026, P3 Ch10 Q1: required, labelled an inference of item 1.i.
  - id: sc_midlow_special_occupancy_stair
    match:
      height_m_lt: 23
      occupancy_in: [mall_covered, mall_open, mall_mixed, assembly_a, assembly_b, assembly_c]
    section: "Ch 10, #3.3 / Table 10.21 item 1.i"
    page: "p.858"
    systems:
      - name: "Stair Pressurization (malls / assembly: Table 10.21 item 1.i exemption does not apply)"
        spec: "Per Section 2.6"
        detail: "Table 10.21 item 1.i: stair pressurization shall not be required for occupancies other than hospitals, malls, educational and assembly, so the exemption does not cover this building. No Ch 10 row prints a stair item for malls (Table 10.24) or assembly spaces (Table 10.27 items 8-14); the tool reads the item 1.i exclusion as requiring stair pressurization. This is an inference from item 1.i, adopted by owner ruling 12.10.2026, P3 Ch10 Q1."

  # C10-02: a blank (0) ground floor BUA never takes the lowest row; it prints NOT EVALUATED.
  - id: sc_storage_industrial_gf_bua_not_entered
    match: {occupancy: storage_industrial, ground_floor_bua_m2_lte: 0}
    section: "Ch 10, #3.8 / Table 10.26 item 1"
    page: "p.864"
    systems:
      - name: "Factory / Warehouse Smoke Extract (Table 10.26 item 1) - NOT EVALUATED (ground floor built-up area not entered)"
        detail: "Table 10.26 item 1 tiers factories and warehouses by the total built-up ground floor area: less than 230 m2; 230 m2 - 900 m2; 901 m2 - 2000 m2; more than 2000 m2. The ground floor built-up area is not entered, so no tier is taken (a blank never takes the less-than-230 m2 row); enter it to evaluate (audit C10-02)."

  - id: sc_storage_industrial_under_230
    match: {occupancy: storage_industrial, ground_floor_bua_m2_gt: 0, ground_floor_bua_m2_lt: 230}
    section: "Ch 10, #3.8 / Table 10.26.1.1"
    page: "p.864"
    systems:
      - name: "Roof Ventilation System"
        spec: "Roof ventilation system in accordance with Section 2.11 (Table 10.26 item 1.1.i)"
        detail: "Total built-up ground floor area less than 230 m2. Fresh air from the unit entrances and openings shall be sufficient for the make-up or replacement air (item 1.1.ii). Table 10.26 (p.864), left column: roof smoke extraction fan systems or roof venting systems or mechanical ducted extraction systems THAT DO NOT HAVE BACK-UP POWER FOR THEIR OPERATION DURING EMERGENCIES SHALL NOT BE ACCEPTABLE."

  - id: sc_storage_industrial_230_900
    match: {occupancy: storage_industrial, ground_floor_bua_m2_gte: 230, ground_floor_bua_m2_lte: 900}
    section: "Ch 10, #3.8 / Table 10.26.1.2"
    page: "p.864"
    systems:
      - name: "Roof Ventilation System"
        spec: "Roof ventilation system in accordance with Section 2.11 (Table 10.26 item 1.2.i)"
        detail: "Total built-up ground floor area 230 m2 - 900 m2. Table 10.26 (p.864), left column: roof smoke extraction fan systems or roof venting systems or mechanical ducted extraction systems THAT DO NOT HAVE BACK-UP POWER FOR THEIR OPERATION DURING EMERGENCIES SHALL NOT BE ACCEPTABLE."
      - name: "Make-up Air Fans OR Sufficient Replacement-air Openings"
        detail: "In addition to the fresh air from the unit entrances and openings, make-up air fans shall be provided OR the sufficient replacement air opening area to the exterior of the perimeter of the facility shall be provided (Table 10.26 item 1.2.ii)."

  - id: sc_storage_industrial_901_2000
    match: {occupancy: storage_industrial, ground_floor_bua_m2_gt: 900, ground_floor_bua_m2_lte: 2000}
    section: "Ch 10, #3.8 / Table 10.26.1.3"
    page: "p.864"
    systems:
      - name: "Roof Ventilation OR Mechanical Roof Exhaust Fans"
        spec: "Roof ventilation system per Section 2.11 OR mechanical roof exhaust fans per Section 2.12 (Table 10.26 item 1.3.i-ii)"
        detail: "Total built-up ground floor area 901 m2 - 2000 m2. Table 10.26 (p.864), left column: roof smoke extraction fan systems or roof venting systems or mechanical ducted extraction systems THAT DO NOT HAVE BACK-UP POWER FOR THEIR OPERATION DURING EMERGENCIES SHALL NOT BE ACCEPTABLE."
      - name: "Make-up Air Fans OR Sufficient Replacement-air Openings"
        detail: "In addition to the fresh air from the unit entrances and openings, make-up air fans shall be provided OR the sufficient replacement air opening area to the exterior of the perimeter of the facility shall be provided (Table 10.26 item 1.3.iii)."

  - id: sc_storage_industrial_over_2000
    match: {occupancy: storage_industrial, ground_floor_bua_m2_gt: 2000}
    section: "Ch 10, #3.8 / Table 10.26.1.4"
    page: "p.864"
    systems:
      - name: "Mechanical Roof Exhaust Fans (with engineering analysis if natural)"
        spec: "Mechanical roof exhaust fans per Section 2.12 (Table 10.26 item 1.4.ii); a roof ventilation system per Section 2.11 shall be acceptable where justified by the engineering analysis of wind and temperature effects on the proposed system (item 1.4.i)"
        detail: "Total built-up ground floor area more than 2000 m2. Table 10.26 (p.864), left column: roof smoke extraction fan systems or roof venting systems or mechanical ducted extraction systems THAT DO NOT HAVE BACK-UP POWER FOR THEIR OPERATION DURING EMERGENCIES SHALL NOT BE ACCEPTABLE."
      - name: "Make-up Air Fans OR Sufficient Replacement-air Openings"
        detail: "In addition to the fresh air from the unit entrances and openings, make-up air fans shall be provided OR the sufficient replacement air opening area to the exterior of the perimeter of the facility shall be provided (Table 10.26 item 1.4.iii)."

  # Table 10.27 items 9-13 (p.866): exhibition center, assembly halls, sports
  # halls, auditorium, indoor stadium HAVING AREA MORE THAN 2000 m2. Triggered
  # by the hall area, never by the building GFA (CH10-16). Schools use item
  # 2.3 (sc_school_halls).
  - id: sc_aux_assembly_hall_by_area
    match:
      assembly_area_m2_gt: 2000
      occupancy_not: [education_a, education_b, education_c]
    section: "Ch 10, #3.9 / Table 10.27 items 9-13"
    page: "p.866"
    systems:
      - name: "Assembly Hall / Auditorium / Sports Hall / Stadium Smoke Purge (> 2000 m2)"
        spec: "Dedicated mechanical smoke purge per Section 2.13; permitted to provide 6 air changes per hour"
        detail: "Exhibition center, assembly halls, sports halls, auditorium and indoor stadium having area more than 2000 m2 (Table 10.27 items 9-13 i-ii). Where the exterior façade or roof is accessible and justified by an engineering analysis, a natural ventilation system per Section 2.11 OR Section 2.15 is permitted (item iii)."

  - id: sc_assembly_hall_area_not_entered
    match:
      occupancy_in: [assembly_a, assembly_b, assembly_c]
      assembly_area_m2_lte: 0
      any_of:
        - {gross_floor_area_m2_gt: 2000}
        - {gross_floor_area_m2_lte: 0}
    section: "Ch 10, #3.9 / Table 10.27 items 9-13"
    page: "p.866"
    systems:
      - name: "Assembly Hall Smoke Purge (> 2000 m2) - NOT EVALUATED (hall area not entered)"
        required: conditional
        detail: "Table 10.27 items 9-13 (exhibition center, assembly halls, sports halls, auditorium, indoor stadium) apply to a hall having area more than 2000 m2: dedicated mechanical smoke purge per Section 2.13, permitted at 6 air changes per hour. The building GFA does not decide it; enter the largest assembly-hall area in SC settings to evaluate it."

  # Table 10.27 item 1 (p.865) is the hospital row. healthcare_b / _c are
  # clinics and outpatient facilities, not hospitals (CH10-14).
  - id: sc_hospital_extras
    match: {occupancy: healthcare_a}
    section: "Ch 10, #3.9 / Table 10.27 item 1"
    page: "p.865"
    systems:
      - name: "Corridor & Open-spaces Smoke Management"
        spec: "Per Section 2.8; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "Hospitals shall have corridor and open spaces smoke management per Section 2.8; every hospital floor shall have a minimum of two smoke zones, separated by smoke compartments and smoke doors; activation by sprinkler activation or cross-zoned smoke detection in that zone; HVAC permitted to operate in zones other than the fire zone (Table 10.27 item 1.i-v)."

  - id: sc_hospital_stair
    match: {occupancy: healthcare_a, height_m_lt: 23}
    section: "Ch 10, #3.9 / Table 10.27 item 1.vi"
    page: "p.865"
    systems:
      - name: "Stair Pressurization (hospital)"
        spec: "Per Section 2.6"
        detail: "Stairs shall be pressurized in accordance with Section 2.6 (Table 10.27 item 1.vi). At 23 m or more, Table 10.20 / 10.19 stair pressurization applies."

  - id: sc_school_extras
    match: {occupancy_in: [education_a, education_b, education_c]}
    section: "Ch 10, #3.9 / Table 10.27 item 2"
    page: "p.865"
    systems:
      - name: "Enclosed Corridor / Circulation Smoke Management"
        spec: "Per Section 2.8; corridor smoke purge minimum of 6 air changes per hour (6 ACH) (Table 10.6 item 3.i, p.822; Annexure 1 FAQ #30, p.1282: mechanically ventilated internal corridor purging rate of at least 6 air changes per hour)"
        detail: "Enclosed corridors and enclosed circulation spaces shall be provided with a smoke management system per Section 2.8; HVAC permitted to operate in zones other than the fire zone; where the exterior façade or roof is accessible, natural ventilation per Section 2.15 is permitted (Table 10.27 item 2.1.i-iii)."

  # Table 10.27 item 2.2.i (p.865): "The stair pressurization is not mandatory
  # if building is not Highrise" (CH10-15).
  - id: sc_school_stair
    match:
      occupancy_in: [education_a, education_b, education_c]
      height_m_lt: 23
    section: "Ch 10, #3.9 / Table 10.27 item 2.2"
    page: "p.865"
    systems:
      - name: "Stair Pressurization NOT mandatory (school, not highrise)"
        required: not_required
        detail: "The stair pressurization is not mandatory if the building is not highrise. Where ventilation or pressurization for the stair is required, a pressurization using a vestibule per Section 2.16 is permitted (Table 10.27 item 2.2.i)."

  # Table 10.27 item 2.3 (p.865): enclosed sports hall and auditoriums with
  # legitimate stage OR having area more than 2000 m2 (schools only; CH10-16).
  - id: sc_school_halls
    match:
      occupancy_in: [education_a, education_b, education_c]
      any_of:
        - {has_permanent_stages_is: true}
        - {assembly_area_m2_gt: 2000}
    section: "Ch 10, #3.9 / Table 10.27 item 2.3"
    page: "p.865"
    systems:
      - name: "School Sports Hall / Auditorium Smoke Purge (legitimate stage or area more than 2000 m2)"
        spec: "Dedicated smoke purging system per Section 2.13"
        detail: "Enclosed sports hall and auditoriums with legitimate stage or having area more than 2000 m2 (Table 10.27 item 2.3.i). Where the exterior façade or roof is accessible and justified by an engineering analysis, a natural ventilation system per Section 2.11 OR Section 2.15 is permitted (item 2.3.ii)."

  - id: sc_school_hall_area_not_entered
    match:
      occupancy_in: [education_a, education_b, education_c]
      has_auditorium_within_is: true
      has_permanent_stages_is: false
      assembly_area_m2_lte: 0
    section: "Ch 10, #3.9 / Table 10.27 item 2.3"
    page: "p.865"
    systems:
      - name: "School Sports Hall / Auditorium Smoke Purge - NOT EVALUATED (hall area not entered)"
        required: conditional
        detail: "Table 10.27 item 2.3 applies to an enclosed sports hall or auditorium with a legitimate stage or having area more than 2000 m2 (dedicated smoke purging per Section 2.13). An auditorium is ticked without a stage, and its area is not entered; enter the largest hall area in SC settings to evaluate it."

  # Table 10.25 (p.862-863): road (row 1) and rail (row 2) tunnel tiers by total
  # length, service / cable tunnels (row 3) (CH10-17). Rows 2 and 3 read off the
  # p.863 page image (phase 5, 13.10.2026). The tool has one "road / rail" kind;
  # the not-entered, less-than-90 m and more-than-90 m lines state both rows
  # (owner ruling 13.10.2026 "Name both routes" for the more-than-90 m line).
  - id: sc_aux_tunnel_length_not_entered
    match: {has_tunnel: true, tunnel_kind_is: road_rail, tunnel_length_m_lte: 0}
    section: "Ch 10, #3.7 / Table 10.25"
    page: "p.862-863"
    systems:
      - name: "Tunnel Smoke Management - Road / Rail: NOT EVALUATED (tunnel length not entered)"
        required: conditional
        detail: "Table 10.25 tiers road and rail tunnels by total length: less than 90 m, natural ventilation per Section 2.11 OR Section 2.15 acceptable (a jet fan system, rail: a jet fan or mechanical ventilation system, not mandatory); more than 90 m, road: a jet fan system per Section 2.14 for the entire tunnel; rail: a jet fan system per Section 2.14 for the entire tunnel OR a mechanical smoke purging system using dedicated ducting per Section 2.13. Enter the tunnel length (FP settings) to evaluate it."

  - id: sc_aux_tunnel_road_rail_under_90
    match: {has_tunnel: true, tunnel_kind_is: road_rail, tunnel_length_m_gt: 0, tunnel_length_m_lt: 90}
    section: "Ch 10, #3.7 / Table 10.25 row 1 (road tunnel) item 2; row 2 (rail tunnel) item 1"
    page: "p.862-863"
    systems:
      - name: "Tunnel Smoke Management - Road / Rail, length less than 90 m (natural ventilation acceptable)"
        spec: "Natural ventilation per Section 2.11 OR Section 2.15 acceptable; natural ventilation utilizing the tunnel openings acceptable; road: a jet fan system shall not be mandatory; rail: a jet fan or mechanical ventilation system shall not be mandatory"
        detail: "Road tunnels having total length of less than 90 m (Table 10.25 row 1, item 2.i-iii, p.862); rail tunnels having total length of less than 90 m (row 2, item 1.i-iii, p.863). Road tunnels: smoke management systems other than jet fan systems shall be installed through a fire engineering analysis demonstrating the efficiency and fulfillment of the intent of item 1.iii (row 1, item 1.iv)."

  # Owner ruling 12.10.2026, P3 Ch10 Q2: a length of exactly 90 m (neither 'less
  # than' nor 'more than' 90 m on p.862) takes the higher band, as R11 at band edges.
  - id: sc_aux_tunnel_road_rail_over_90
    match: {has_tunnel: true, tunnel_kind_is: road_rail, tunnel_length_m_gte: 90}
    section: "Ch 10, #3.7 / Table 10.25 row 1 (road tunnel) item 3; row 2 (rail tunnel) item 2"
    page: "p.862-863"
    systems:
      - name: "Tunnel Smoke Management - Road / Rail, length more than 90 m (road: jet fan system; rail: jet fan system OR ducted smoke purging)"
        spec: "Road: jet fan system per Section 2.14 for the entire tunnel; other systems or combinations permitted where justified by an engineering analysis and CFD modeling. Rail: jet fan system per Section 2.14 for the entire tunnel OR a mechanical smoke purging system using dedicated ducting per Section 2.13; other systems or combinations of systems permitted where justified by an engineering analysis and CFD modeling"
        detail: "Road tunnels having total length of more than 90 m (Table 10.25 row 1, item 3.i-ii, p.862); rail tunnels having total length of more than 90 m (row 2, item 2.i-ii, p.863): 'A jet fan system, in accordance with Section 2.14. shall be provided for the entire tunnel. OR a mechanical smoke purging system using dedicated ducting shall be provided in accordance with Section 2.13.' and 'Other systems or combinations of systems shall be permitted, where justified by an engineering analysis and CFD modeling.' The tool has one road / rail kind, so both rows are stated (owner ruling 13.10.2026, 'Name both routes'). A length of exactly 90 m falls in neither printed band ('less than 90 m', 'more than 90 m', both rows) and takes this higher band (owner ruling 12.10.2026, P3 Ch10 Q2, as ruling R11 at band edges)."

  - id: sc_aux_tunnel_cable
    match: {has_tunnel: true, tunnel_kind_is: cable}
    section: "Ch 10, #3.7 / Table 10.25 row 3 (service tunnel) item 1"
    page: "p.863"
    systems:
      - name: "Tunnel Smoke Management - Service / Cable"
        spec: "Mechanical ventilation system per Section 2.17, any length; natural ventilation utilizing the tunnel openings acceptable where the tunnel length is less than 90 m"
        detail: "Service or cable tunnels of any length (Table 10.25 row 3, item 1.i-iii): i. a mechanical ventilation system per Section 2.17 shall be provided; ii. natural ventilation utilizing the tunnel openings shall be acceptable where the tunnel length is less than 90 m; iii. a jet fan system per Section 2.14 OR a mechanical smoke purging system using dedicated ducting per Section 2.13 OR other systems or combinations of systems permitted where justified by an engineering analysis and CFD modeling."

  - id: sc_business_open_plan
    match: {occupancy: business}
    section: "Ch 10, #3.9 / Table 10.27 item 3"
    page: "p.865"
    systems:
      - name: "Open-Plan Office: Openable Ventilation Panels"
        required: conditional

  # Table 10.27 item 3.iii (p.865) "stairs of open plan offices in highrise buildings shall be
  # pressurized": the same stair system as Table 10.20 / 10.19 item 1. engine.evaluate_sc cites it
  # on that one stair line (audit C10-08; the separate conditional line is removed).

  - id: sc_midrise_lowrise_lobby
    match:
      height_m_lt: 23
      height_m_gt: 0    # C10-06: Table 10.21 is for buildings; infrastructure with no building (0 m) is out
      occupancy_not: [villa_private, villa_commercial, parking_enclosed, parking_open, storage_industrial, motor_fuel_dispensing]
    section: "Ch 10, #3.3 / Table 10.21 item 2"
    page: "p.858"
    systems:
      - name: "Passenger Elevator Lobby - above-grade floors (no fire-resistance rating required)"
        required: conditional
        detail: "Table 10.21 covers the above-grade floors. Underground and basement levels follow Table 10.22 (lobby with 1-hour smoke barrier) where the building has basements."

  # Table 10.21 item 4 (p.858). Hospitals (Table 10.27 item 1), schools
  # (item 2.1) and malls (Table 10.24) have their own corridor rows, so the
  # "not required" line would contradict them (CH10-14, CH10-15).
  - id: sc_midrise_lowrise_corridor
    match:
      height_m_lt: 23
      height_m_gt: 0    # C10-06: Table 10.21 is for buildings; infrastructure with no building (0 m) is out
      occupancy_not: [villa_private, villa_commercial, parking_enclosed, parking_open, storage_industrial, motor_fuel_dispensing,
                      healthcare_a, education_a, education_b, education_c,
                      mall_covered, mall_open, mall_mixed]
    section: "Ch 10, #3.3 / Table 10.21 item 4"
    page: "p.858"
    systems:
      - name: "Corridor Smoke Management NOT Required - above-grade floors"
        required: not_required
        detail: "Table 10.21 covers the above-grade floors; natural ventilation for smoke clearance per Section 2.15 is permitted (item 4.ii). Underground and basement corridors follow Table 10.22 item 4 where the building has basements; corridors longer than 60 m follow Table 10.27 item 4."

  # Owner ruling 12.10.2026, Ch3 Q9: printed only where Ch 2 #2.9.4.a (p.220) does not
  # require a Fire Lift (same trigger as the FSA Fire Lift line:
  # Building.requires_fire_lift_2_9_4), so the report never says both.
  - id: sc_midrise_lowrise_ff_lift
    match:
      height_m_lt: 23
      height_m_gt: 0    # C10-06: Table 10.21 is for buildings; infrastructure with no building (0 m) is out
      occupancy_not: [villa_private, villa_commercial, parking_enclosed, parking_open, storage_industrial, motor_fuel_dispensing]
      requires_fire_lift_2_9_4_is: false
    section: "Ch 10, #3.3 / Table 10.21 item 3"
    page: "p.858"
    systems:
      - name: "Firefighting Lift (NOT mandatory)"
        required: not_required

auxiliary_rooms:
  - id: sc_aux_atrium
    flag: has_atrium
    systems:
      - name: "Atrium Smoke Management System"
        code_ref: "Ch 10, #2.7 / Table 10.27 item 15"
        page_ref: "p.866"
  - id: sc_aux_fire_pump
    flag: has_fire_pump_room
    systems:
      - name: "Fire Pump Room - Dedicated Mechanical Ventilation"
        spec: "A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; rooms shall be temperature controlled (Table 10.27 items 5-7 i-ii)"
        detail: "Table 10.27 items 5, 6 and 7 (p.866) share one cell: i. A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; item ii: Rooms shall be temperature controlled. Dedicated AHU are recommended to be provided to maintain the temperatures in these rooms as recommended by the equipment and control panel manufacturers (audit C10-05)."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 5"
        page_ref: "p.866"
  - id: sc_aux_command_centre
    flag: has_control_room
    systems:
      - name: "Emergency Command Centre - Dedicated Mechanical Ventilation"
        spec: "A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; rooms shall be temperature controlled (Table 10.27 items 5-7 i-ii)"
        detail: "Table 10.27 items 5, 6 and 7 (p.866) share one cell: i. A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; item ii: Rooms shall be temperature controlled. Dedicated AHU are recommended to be provided to maintain the temperatures in these rooms as recommended by the equipment and control panel manufacturers (audit C10-05)."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 6"
        page_ref: "p.866"
  - id: sc_aux_diesel_generator
    flag: has_diesel_generator_room
    systems:
      - name: "Diesel Generator Room - Dedicated Mechanical Ventilation"
        spec: "A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; rooms shall be temperature controlled (Table 10.27 items 5-7 i-ii)"
        detail: "Table 10.27 items 5, 6 and 7 (p.866) share one cell: i. A dedicated mechanical ventilation system in accordance with Section 2.17 shall be provided; item ii: Rooms shall be temperature controlled. Dedicated AHU are recommended to be provided to maintain the temperatures in these rooms as recommended by the equipment and control panel manufacturers (audit C10-05)."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 7"
        page_ref: "p.866"
  # Table 10.27 item 8 (cinemas: #2.13 purge, 6 ACH) and item 14 (theaters:
  # #2.9 smoke management) are different systems (CH10-16).
  - id: sc_aux_cinema
    flag: has_theater_cinema
    when: {theater_cinema_kind_in: [cinema, both]}
    systems:
      - name: "Cinema Smoke Purge"
        spec: "Dedicated mechanical smoke purge per Section 2.13; permitted to provide 6 air changes per hour"
        code_ref: "Ch 10, #3.9 / Table 10.27 item 8"
        page_ref: "p.866"
  - id: sc_aux_theatre
    flag: has_theater_cinema
    when: {theater_cinema_kind_in: [theatre, both]}
    systems:
      - name: "Theatre Smoke Management"
        spec: "Smoke management system per Section 2.9"
        code_ref: "Ch 10, #3.9 / Table 10.27 item 14"
        page_ref: "p.866"
  - id: sc_aux_cinema_theatre_kind_not_stated
    flag: has_theater_cinema
    when: {theater_cinema_kind_in: [null]}
    systems:
      - name: "Cinema / Theatre Smoke Control - NOT EVALUATED (cinema or theatre not stated)"
        required: conditional
        detail: "Cinemas: dedicated mechanical smoke purge per Section 2.13, permitted at 6 air changes per hour (Table 10.27 item 8). Theaters: smoke management system per Section 2.9 (item 14). Choose cinema, theatre or both in SC settings."
        code_ref: "Ch 10, #3.9 / Table 10.27 items 8, 14"
        page_ref: "p.866"
  # Table 10.27 item 16 (p.866). 16.i / 16.ii: independent commercial kitchens and restaurant
  # kitchens (the 'Commercial kitchen' tick). 16.iii: all kitchens in malls, hospitals and highrise
  # buildings: owner ruling R-D (28.10.2026) required for malls, hospitals (healthcare_a) and every
  # non-residential building of 23 m or more; conditional for apartment / hotel-room kitchens in
  # highrise residential buildings and hotels (audit C10-01, H11).
  - id: sc_aux_kitchen
    flag: has_commercial_kitchen
    systems:
      - name: "Kitchen Cooking Operation Ventilation"
        spec: "Ventilation systems for cooking operations in accordance with Section 2.18"
        detail: "Table 10.27 item 16.i: All independent commercial kitchens shall be provided with ventilation systems for cooking operations in accordance with Section 2.18. Item 16.ii: All restaurant kitchens shall be provided with ventilation systems for cooking operations in accordance with Section 2.18."
        code_ref: "Ch 10, #3.9 / Table 10.27 items 16.i-16.ii"
        page_ref: "p.866"
  - id: sc_aux_kitchen_16iii
    always_on: true
    when:
      any_of:
        - {occupancy_in: [mall_covered, mall_open, mall_mixed, healthcare_a]}
        # Hotels are not a residential group (Table 1.1): their own kitchens are required;
        # only the guest-room kitchens are conditional (next rule).
        - {height_m_gte: 23, occupancy_not: [residential, labour_accommodation, staff_accommodation, hostel, villa_private, villa_commercial, parking_enclosed, parking_open]}
    systems:
      - name: "Kitchen Cooking Operation Ventilation (malls, hospitals, highrise - all kitchens)"
        spec: "All kitchens in the building: ventilation systems for cooking operations in accordance with Section 2.18"
        detail: "Table 10.27 item 16.iii: All Kitchens located in Malls, Hospitals and Highrise buildings shall be provided with ventilation systems for cooking operations in accordance with Section 2.18. Required for malls, hospitals and every non-residential building of 23 m or more, with or without the commercial kitchen tick; in a hotel this covers the hotel's own kitchens, guest-room kitchens are the conditional line (owner ruling R-D, 28.10.2026; audit C10-01)."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 16.iii"
        page_ref: "p.866"
  - id: sc_aux_kitchen_16iii_residential_highrise
    always_on: true
    when:
      height_m_gte: 23
      occupancy_in: [residential, labour_accommodation, staff_accommodation, hostel, hotel_a, hotel_b, hotel_c, villa_private, villa_commercial]
    systems:
      - name: "Kitchen Cooking Operation Ventilation - apartment / hotel-room kitchens (highrise residential / hotel)"
        required: conditional
        spec: "Ventilation systems for cooking operations in accordance with Section 2.18 for apartment and hotel-room kitchens"
        detail: "Table 10.27 item 16.iii: All Kitchens located in Malls, Hospitals and Highrise buildings shall be provided with ventilation systems for cooking operations in accordance with Section 2.18. Whether apartment kitchens of a highrise residential building and hotel-room kitchens are meant is not stated; conditional line (owner ruling R-D, 28.10.2026; audit C10-01). Commercial and restaurant kitchens in this building follow items 16.i / 16.ii (tick 'Commercial kitchen')."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 16.iii"
        page_ref: "p.866"
  # A parking use has no kitchen of its own: conditional for any kitchen in a parking building of
  # 23 m or more (needs ruling: R-D names every non-residential building of 23 m or more).
  - id: sc_aux_kitchen_16iii_parking_highrise
    always_on: true
    when:
      height_m_gte: 23
      occupancy_in: [parking_enclosed, parking_open]
    systems:
      - name: "Kitchen Cooking Operation Ventilation (highrise parking building - any kitchen)"
        required: conditional
        spec: "Any kitchen in the parking building: ventilation systems for cooking operations in accordance with Section 2.18"
        detail: "Table 10.27 item 16.iii: All Kitchens located in Malls, Hospitals and Highrise buildings shall be provided with ventilation systems for cooking operations in accordance with Section 2.18. A parking use has no kitchen of its own, so the line applies to any kitchen in this parking building of 23 m or more (owner ruling R-D, 28.10.2026, read for parking; open question listed for the owner; audit C10-01)."
        code_ref: "Ch 10, #3.9 / Table 10.27 item 16.iii"
        page_ref: "p.866"
  # Table 10.26 item 2 (p.864): ROOMS STORING HAZARDOUS AND FLAMMABLE CHEMICALS,
  # ventilation per Section 2.20 (#2.20.1 / Table 10.18, p.853-854). The row does
  # not name LPG; LPG tanks are outdoor installations (Ch 11), so the line fires on
  # the stored-chemical inputs instead (owner ruling 13.10.2026, "Move to chemicals").
  # p.854 numbers two rows "4." after "6. CONTROLS": cited by name (STAND BY FAN,
  # STAND BY POWER), not number.
  - id: sc_aux_hazardous_chemical_room
    always_on: true
    when:
      any_of:
        - {has_chemical_warehouse_is: true}
        - {has_bulk_flammable_liquid_storage_is: true}
        - {has_bulk_flammable_gas_storage_is: true}
        - {has_bulk_flammable_solid_storage_is: true}
    systems:
      - name: "Hazardous + Flammable Chemical Room Ventilation"
        spec: "Dedicated ventilation system per Section 2.20 / Table 10.18: exhaust and supply part at a rate of 20 air-changes per hour; flammable concentration below 25% of the low flammable limit (LFL) or the low explosive limit (LEL); make-up air 85 % of the required exhaust of 20 air changes per hour; ventilation system fan provided with an emergency power"
        detail: "Table 10.26 item 2 (p.864): rooms storing hazardous and flammable chemicals, a ventilation system shall be provided in accordance with Section 2.20. #2.20.1 (p.853): rooms containing hazardous and flammable materials, ventilation system as per Table 10.18 and the relevant general requirements for smoke control systems as per Section 2.5. Table 10.18 (p.853-854): the same system shall also serve as smoke exhaust system during fire emergencies (item 1.ii); exhaust plenum within 300 mm from the floor, fresh air on the opposite side within 300 mm from the floor (3.i); provided for the complete floor area including pits (3.iii); extract plenum terminates minimum 15 m from the ignition source, property limit or nearby building (4.i); exhaust direct to the external, not less than 5 m from any air intake openings (4.ii); exhaust ducts shall not pass through fire walls (4.v); fire dampers not installed where the material exhausted is toxic and a risk evaluation shows the toxic hazard greater than the fire hazard (5.2.i); fire detection and alarm system not interlocked to shut down air-moving devices, except where needed for an automatic extinguishing system (6.i-ii); ventilation failure annunciation (6.iii); gas or vapour detectors set at 25% of LFL/LEL to annunciate and switch off all automatic operations within the area (if any), and 50% of LFL/LEL to start the ventilation system (6.iv); STAND BY FAN row: back-up (stand-by) fans shall not be required; STAND BY POWER row: the ventilation system fan shall be provided with an emergency power. Inputs: chemical warehouse, bulk flammable liquid, gas or solid storage (owner ruling 13.10.2026, 'Move to chemicals'; LPG tanks alone no longer trigger this line)."
        code_ref: "Ch 10, #3.8 / Table 10.26 item 2; #2.20 / Table 10.18"
        page_ref: "p.864, p.853-854"
