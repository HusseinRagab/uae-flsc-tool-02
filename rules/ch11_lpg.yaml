# UAE FLSC 2018 - Chapter 11: Liquefied Petroleum Gas (LPG) Code of Practice
# Phase 3 (audit 12.10.2026, CH10-06..36): every value below was read off the
# rendered page named in its page_ref (shots p.884-930).
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 11
  chapter_title: "Liquefied Petroleum Gas (LPG)"

# ---------- GENERAL: printed only when a gas system is present (engine) ------
general:
  - id: lpg_general_civil_defence_listing
    when: {}
    systems:
      - name: "Civil Defence Listing + Approved Contractor (Universal)"
        code_ref: "Ch 11, #2.2.1-#2.2.3"
        page_ref: "p.883"
        spec: "The materials, equipment including LPG cylinders, tanks, piping, fittings, gauges, valves etc. shall be approved and listed by Civil Defence (#2.2.1)."
        detail: "All LPG designers, installers, commissioners and maintenance personnel shall be qualified, approved and licensed by Civil Defence (#2.2.2). NFPA 54 and NFPA 58 and the manufacturer's design, installation and maintenance guidelines shall be referred to for requirements not covered under this Chapter (#2.2.3). Material test standards: Ch 11 Section 6 (p.932 onward). (Audit C11-05: the contractor-exclusion, ASME and cathodic protection sentences previously printed here are not in #2.2; the cathodic protection item is Table 11.9 #2.iii, printed with the underground tank add-on.)"

  - id: lpg_general_gas_detection_universal
    # Not for a flame-effect-only building: Table 11.12 items 1-2 (p.923) carry no detection item (CH10-36).
    when:
      any_of:
        - {has_lpg_tanks_is: true}
        - {has_gas_infra_connection_is: true}
        - {has_gas_cylinders_villa_is: true}
        - {has_lpg_cylinders_food_truck_is: true}
    systems:
      - name: "Gas-Leak Detection + Interfaced ESV (Universal)"
        code_ref: "Ch 11, Table 11.1 #6; Table 11.2 #5; Table 11.3 #3.vii; Table 11.4 #7; Table 11.11 #5"
        page_ref: "p.895, p.898, p.899, p.903, p.922"
        spec: "Approved gas-leak detection at every LPG installation, with a local alarm connected to the main fire alarm panel, placed as the table for the installation type requires (see the base and add-on items below)."
        detail: "Outdoor cylinders: detection in the area or compartment where the internal LPG pipes and fittings are installed; remote emergency shut-off valve at least 3 m from the edge of the installation (Table 11.1 #6.i-ii, p.895). Indoor cylinders: detector not more than 30 cm above finished floor level, within 5 m of the LPG source, inside the cylinder compartment; remote emergency shut-off valve at least 1.5 m from the compartment, at the kitchen exit door, never inside the compartment (Table 11.2 #5.i-iii, p.898). Food trucks: leak detectors at the enclosure and inside the truck near the cooking platform (Table 11.3 #3.vii, p.899). Central tank installations: Stage 1 central building detection plus Stage 2 kitchen detection (Table 11.4 #7, p.903); PRDP tapping: Stage 2 kitchen detection (Table 11.11 #5, p.922)."

  - id: lpg_general_ignition_clearance
    when:
      any_of:
        - {has_lpg_tanks_is: true}
        - {has_gas_infra_connection_is: true}
        - {has_gas_cylinders_villa_is: true}
    systems:
      - name: "Ignition-Source Clearance + Electrical Hazard Class"
        code_ref: "Ch 11, Table 11.1 #7; Table 11.2 #6; Table 11.4 #4.i and #6.i; #2.2.8-#2.2.9"
        page_ref: "p.884, p.895, p.898, p.901, p.902"
        spec: "Outdoor cylinders: no ignition source within 3 m of the cylinder installation (Table 11.1 #7.ii). Indoor cylinders: no ignition source within 1.5 m of the cylinder installation (Table 11.2 #6.ii). Tank filling connections: electrically classified areas without any ignition source within 7.6 m (Table 11.4 #4.i)."
        detail: "Outdoor cylinders: all fixed electrical equipment within 1.5 m of the LPG/CNG installation shall be spark-proof and intrinsically safe per NFPA 70 (Table 11.1 #7.iii, p.895). Indoor cylinders: electrical connections and appliances per NFPA 70 and 72 (Table 11.2 #6.iii, p.898). Central tanks: electrical equipment and wiring approved for the purpose and per NFPA 70 (Table 11.4 #6.i, p.902). LPG cooking appliances shall not be used with CNG fuel unless certified and approved to do so (Table 11.1 #7.i, Table 11.2 #6.i). Electrical circuits shall not use gas piping or components as conductors (#2.2.8, p.884); electrical connections to control devices in a piping system per NFPA 70 (#2.2.9)."

  # C11-08: #2.2.7 (p.884) areas for LPG cylinders and pipe installation or distribution, and
  # #2.3.9.11 (p.889) pipe colours and marking.
  - id: lpg_general_pipe_routing_marking
    when:
      any_of:
        - {has_lpg_tanks_is: true}
        - {has_gas_infra_connection_is: true}
        - {has_gas_cylinders_villa_is: true}
    systems:
      - name: "LPG Piping Prohibited Areas + Pipe Marking (#2.2.7, #2.3.9.11)"
        code_ref: "Ch 11, #2.2.7; #2.3.9.11"
        page_ref: "p.884, p.889"
        spec: "LPG cylinders and pipe installation or distribution shall not be permitted (#2.2.7): a. in the ground under concrete flooring within building; b. under building foundations; c. within lift shafts and cavity walls; d. in compartments or ducts dedicated for electrical switchgears, transformers or generators, garbage rooms, garbage chutes, refrigeration chambers, cold rooms, air handling rooms and ventilation or air-conditioning ducts; f. adjacent to pipes and vessels containing flammable, oxidizing, corrosive and other hazardous liquids and materials; g. in fire-fighting lobby, fire command centers, smoke stop lobbies, fire pump rooms, fire-fighting water tank rooms, sprinkler control valve rooms, fire fighting riser ducts, areas of refuge, protected corridors, protected staircases, bedrooms and other occupied area etc."
        detail: "#2.3.9.11: The liquid LPG pipelines shall be painted in \"Orange\" and the vapor LPG pipelines in \"Yellow\" with the marking of the word \"LP-Gas\" at intervals of not more than 3 m. Central tank installations also follow the Table 11.4 #1.iv list (piping line below). (Audit C11-08.)"

  - id: lpg_general_warning_sign
    # Table 11.1 #7.vi, Table 11.2 #6.vi, Table 11.4 #11.i and #2.2.11 print the sign (CH10-11).
    when:
      any_of:
        - {has_lpg_tanks_is: true}
        - {has_gas_infra_connection_is: true}
        - {has_gas_cylinders_villa_is: true}
    systems:
      - name: "LPG Warning Sign (minimum 800 mm x 600 mm)"
        code_ref: "Ch 11, #2.2.11; Table 11.1 #7.vi; Table 11.2 #6.vi; Table 11.4 #11.i"
        page_ref: "p.884, p.895, p.898, p.904"
        spec: "Warning sign or notice of minimum size 800 mm x 600 mm, permanently and legibly displayed at the front of the installation, in Arabic and English, conveying \"LPG / HIGHLY FLAMMABLE / NO SMOKING / NO NAKED LIGHTS\"."
        detail: "#2.2.11 (p.884): the sign shall also carry the emergency contact number of the LPG contractor and the concerned facility personnel. Standard layout: Figure 11.6 (p.904)."

  - id: lpg_general_inspection_maintenance
    when: {}
    systems:
      - name: "Inspection + Maintenance Checklist (Table 11.14)"
        code_ref: "Ch 11, #5.1 / Table 11.14"
        page_ref: "p.930"
        spec: "All LPG installations inspected and maintained quarterly (once every 3 months) by Civil Defence approved installation and maintenance companies (#5.1.1), per the Table 11.14 checklist (#5.1.7). Pressure relief valves replaced every 10 years or if any signs of damage are evident (Table 11.14 #2.ii)."
        detail: "Personnel hold a valid Civil Defence licence (#5.1.2). A written inspection and maintenance manual is handed to the owner and kept at the facility (#5.1.3-#5.1.4); periodic reports available for Civil Defence random inspections (#5.1.5). Tanks (Table 11.14 #1): models and construction as approved; data plate visible; no combustibles, vegetation, dry grass or storage around the tanks; visual check of surfaces and welds; valve thickness checked with an ultrasonic thickness meter every 10 years (#1.vi); tank supports inspected. Pressure relief valves (#2): as per design specifications, open to atmosphere without obstruction, vent caps in working condition."

# ---------- BRANCHES: by gas-system type --------------------------------
branches:
  # ----- Aboveground LPG Tank at grade (Table 11.5); roof / underground variants have their own tables.
  # Owner ruling 12.10.2026, P3 Ch11 Q4: the at-grade items print when "Aboveground at-grade
  # LPG tanks" is ticked, or when neither roof nor underground is ticked (the plain "LPG tanks"
  # choice stays at grade, unchanged).
  - id: lpg_aboveground_tank
    match:
      has_lpg_tanks_is: true
      any_of:
        - {has_lpg_tank_at_grade_is: true}
        - {has_lpg_tank_roof_mounted_is: false, has_lpg_tank_underground_mounded_is: false}
    section: "Ch 11, #2.5.3 / Table 11.5 + Tables 11.6.a-d"
    page: "p.905-907"
    systems:
      - name: "Aboveground LPG Tank Installation"
        spec: "Per Table 11.5 - on ground, outdoor, open to sky at grade. Not within 3 m of flammable-liquid dike walls. Roof / podium tanks treated as Roof-Mounted Tanks per Section 2.5.4."
        detail: "Concrete / masonry foundations capable of withstanding loaded weight, wind and seismic loads. Saddle supports allow expansion. Bottom of tank at most 300 mm above foundation. Tank secured to building structure. Coated/protected to minimize corrosion. Stacking NOT permitted. #2.5.1.2 (p.900): central tank LPG is preferred underground or above ground rather than on roof tops."
      - name: "Maximum Quantity (72,000 Gal per location)"
        code_ref: "Ch 11, Table 11.5 #3"
        page_ref: "p.906"
        spec: "Maximum 72,000 Gal in one location, in one tank or as the aggregate of several tanks (Table 11.5 #3.i)."
        detail: "More than 72,000 Gal shall be subdivided into groups of tanks not exceeding 72,000 Gal each, the groups 15 m apart (Table 11.5 #3.ii)."
      - name: "Tank Separation Distances"
        code_ref: "Ch 11, Table 11.5 #4 / Tables 11.6.a-d"
        page_ref: "p.906-908"
        spec: "Table 11.6.a (aggregate capacity: separation / between tanks): up to 500 Gal 3 m / 1 m; 501-2000 Gal 7.6 m / 1 m; 2001-30,000 Gal 15 m / 1.5 m; 30,001-70,000 Gal 23 m; 70,001-90,000 Gal 30 m; 90,001-120,000 Gal 38 m; 120,001-200,000 Gal 61 m; 200,001-1,000,000 Gal 91 m; more than 1,000,000 Gal 122 m (above 30,000 Gal, between tanks 1/4 of the sum of the diameters of adjacent containers)."
        detail: "Measured from the tank surface to any point of structure, building, compound wall, public road, other equipment, exit roads, fire truck accessway, assembly points, parking lot, drains, shaft openings, pits, openings to basements and ramp openings (Table 11.5 #4.v). Industrial tanks: Table 11.6.b; 1-hr fire-rated fire walls at least 2 m high may reduce the distance (#4.ii). Table 11.6.b (p.907, industrial aboveground tanks; aggregate capacity: separation / with 1 hour fire wall / between tanks): up to 500 Gal 3 m / 0.3 m / 1 m; 501-1000 Gal 3 m / 1.5 m / 1 m; 1001-2,000 Gal 7.6 m / 4 m / 1 m; 2,001-30,000 Gal 15 m / 7.6 m / 1.5 m; 30,001-70,000 Gal 23 m / 11 m; 70,001-90,000 Gal 30 m / 15 m; 90,001-120,000 Gal 38 m / 23 m; 120,001-200,000 Gal 61 m, 200,001-1,000,000 Gal 91 m and more than 1,000,000 Gal 122 m with no reduction (above 30,000 Gal, between tanks 1/4 of the sum of the diameters of 2 adjacent tanks). Table 11.6.c (p.908, flammable liquids tanks; LPG tanks up to 30,000 Gal / more than 30,000 Gal): flash point less than 32°C 6 m to bund wall / 15 m to bund wall; 32°C - 65°C, tanks less than 3000 liter (793 Gal) 3 m to bund wall / 6 m to bund wall; 32°C - 65°C, tanks more than 3000 liter (793 Gal) 3 m to bund wall / 15 m to bund wall and 6 m to tank. Table 11.6.d (p.908, liquid oxygen tanks of less than / more than 125,000 liter (33,000 Gal)): LPG up to 500 Gal 6 m / 30 m; 501-1000 Gal 7.6 m / 45 m; 1001-2,000 Gal 7.6 m / Risk Assessment is required; 2,001-30,000 Gal 15 m / Risk Assessment is required; 30,001-70,000 Gal 23 m / Risk Assessment is required; more than 70,000 Gal Risk Assessment is required for both (audit C11-10). Fire walls, where accepted by Civil Defence, on one side only and never on more than two sides; natural ventilation not significantly impaired (#4.x)."
      - name: "AC / Air-Intake Clearance"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 4.vi"
        page_ref: "p.906"
        spec: "6 m from the tank surface to any air intake units, window type and split type AC units, air vents and balanced type flue outlets."
      - name: "Fire Hydrant / FFE / FCC Clearance"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 4.vii"
        page_ref: "p.906"
        spec: "10 m from the tanks to fire hydrants, fire fighting equipment, fire fighting valves and fire command centers."
      - name: "Overhead Power Line Clearance"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 4.viii"
        page_ref: "p.906"
        spec: "The tank and any of its parts shall not be located within 1.8 m of a vertical plane beneath overhead electric power lines that are over 600 volts."
      - name: "Vegetation-Free Zone"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 4.ix"
        page_ref: "p.906"
        spec: "No vegetation, dry grass or combustible material within 3 m around the surface of the tank."
        detail: "Vegetation control is a continuing maintenance obligation - inspected during the quarterly Table 11.14 walk-through."
      - name: "Tank Fire Protection - Fixed Water Spray System"
        code_ref: "Ch 11, #2.5.3 / Table 11.5 item 5"
        page_ref: "p.906"
        detail: "Fixed water spray system on every aboveground LPG tank, fed from the fire pump and water tank of the building it serves (item 5.i); where none is available, a dry-type water spray ring with open nozzles connected to a Civil Defence breeching inlet (item 5.ii). Design per Chapter 9. Ch 9 Table 9.31.B iii (p.756) prints a 6 m proximity clause that conflicts; ruling R5 (12.10.2026): Chapter 11 governs and no exemption is applied."

  # ----- Roof or underground variant ticked, no tank at grade: the at-grade Table 11.5 items do
  # not print (CH10-18/19; owner ruling 12.10.2026, P3 Ch11 Q4 replaced the conditional line).
  - id: lpg_aboveground_tank_with_variant
    match:
      has_lpg_tanks_is: true
      has_lpg_tank_at_grade_is: false
      any_of:
        - {has_lpg_tank_roof_mounted_is: true}
        - {has_lpg_tank_underground_mounded_is: true}
    section: "Ch 11, #2.5.3 / Table 11.5"
    page: "p.906"
    systems:
      - name: "Aboveground (at-grade) LPG Tanks (Table 11.5) - None Declared"
        required: not_required
        code_ref: "Ch 11, #2.5.3 / Table 11.5"
        page_ref: "p.906"
        spec: "No tank above ground at grade is declared: the Table 11.5 items (72,000 Gal per location, Table 11.6.a separations, fixed water spray) are not printed. Roof / podium tanks follow Tables 11.7-11.8 and underground / mounded tanks Tables 11.9-11.10 (add-ons below)."
        detail: "Tick 'Aboveground at-grade LPG tanks' when the project also has tanks above ground at grade; the Table 11.5 items then print as required (owner ruling 12.10.2026, P3 Ch11 Q4)."

  # ----- Table 11.4 piping distribution: any LPG tank installation (#2.5.2.1) or infrastructure connection
  - id: lpg_central_distribution
    match:
      any_of:
        - {has_gas_infra_connection_is: true}
        - {has_lpg_tanks_is: true}
    section: "Ch 11, #2.5.2 / Table 11.4"
    page: "p.900-903"
    systems:
      - name: "LPG Piping Distribution"
        code_ref: "Ch 11, #2.5.2.1 / Table 11.4 #1"
        page_ref: "p.900"
        spec: "Per Table 11.4 - no liquid phase LPG piped into the building; in infrastructure distribution the liquid phase is permitted up to the compound walls"
        detail: "#2.5.2.1: piping distribution for any LPG tank installation per Table 11.4. LPG distribution shall not pass through (Table 11.4 #1.iv): exit routes, exit stairs, exit corridors, exit lobbies; public or assembly areas; public seating areas; fire fighting lobbies, fire command center, fire pump room, control rooms; lift shafts, fire fighting riser shafts, sprinkler valve rooms, garbage chutes, cavity walls, HVAC ducts; under building and equipment foundations; compartments or ducts for electrical switchgear, transformers, generators, garbage rooms, refrigeration chambers, cold rooms; pipes and vessels containing flammable, oxidizing, corrosive and other hazardous liquids and materials. Piping can be routed through the ceiling of basements with a pipe-in-pipe arrangement (#1.v)."
      - name: "Two-Stage Pressure Regulation"
        code_ref: "Ch 11, Table 11.4 #1.iii"
        page_ref: "p.900"
        spec: "First stage 5 psi (0.350 bar) for large commercial customers or 75 mbar for residential customers; second stage 0.5 psi (0.035 bar)"
        detail: "Two stage pressure regulators are essential for all LPG installations (Table 11.4 #1.iii). In large infrastructure LPG networks the pressure reduction follows the network length and drop calculations."
      - name: "Pipe-in-Pipe Containment Arrangement"
        code_ref: "Ch 11, Table 11.4 #3"
        page_ref: "p.901"
        spec: "Pipe-in-pipe (containment) piping where LPG piping passes through basements, studio apartments and show kitchens where the kitchen is open to living or public spaces (Table 11.4 #3.i)."
        detail: "Approved CPVC or steel piping complete with LPG leak detectors monitored by the central LPG control panel (#3.ii). Drops from the ceiling in the open space of a room (school and research laboratories): steel support columns and steel pipe-in-pipe with leak detectors monitored by the central LPG control panel (#3.iii)."
      - name: "Two-Stage Gas Detection (Stage 1 central + Stage 2 kitchen)"
        code_ref: "Ch 11, Table 11.4 #7"
        page_ref: "p.903"
        spec: "Two stages of gas detection shall be provided: Stage 1 central building gas detection system and Stage 2 apartment / retail unit kitchen gas detection system (Table 11.4 #7.i)."
        detail: "Stage 1: approved and listed detectors; interfaced with a local alarm connected to the main fire alarm panel; low alarm at 15% LEL and high alarm at 30% LEL; main LPG supply shuts off automatically at 30% LEL; zone-wise LEL indication; remote emergency shut-off switch at least 3 m from the LPG tank and near the exit stair; sounder with flasher with a tone distinguishable from the fire alarm (Stage 1 iii-x). Stage 2: Civil Defence approved standalone kitchen-type detectors, not more than 30 cm above finished floor level and 1.5 m from the cooking and other LPG consuming appliances; remote emergency shut-off switch at least 1.5 m from the appliances at the kitchen exit door(s); emergency shut-off solenoid valve in the local PRDP, directly controlled by the gas detector (Stage 2 i-v)."
      - name: "Emergency Shut-off Valves (ESV)"
        code_ref: "Ch 11, Table 11.4 #7"
        page_ref: "p.903"
        spec: "Main LPG supply shut-off automatically at 30% LEL (Stage 1 vi); remote emergency shut-off switch at least 3 m from the LPG tank near the exit stair (Stage 1 viii); kitchen remote shut-off switch at least 1.5 m from the appliances at the kitchen exit door(s) and a solenoid valve in the local PRDP (Stage 2 iv-v)."
        detail: "Each remote switch clearly marked and placed at a suitable height for easy access during emergencies."
      - name: "Exterior Emergency Shut-off Valve per Building (#2.3.14.6)"
        code_ref: "Ch 11, #2.3.14.5-#2.3.14.6"
        page_ref: "p.890"
        spec: "An exterior shut-off valve to permit turning off the gas supply to each building in an emergency shall be provided and plainly marked (#2.3.14.6)."
        detail: "Each pipe branch or pipe section should be equipped by isolation shut-off valves for isolation capability (#2.3.14.6). Main gas shut-off valves controlling several gas piping systems shall be prominent and readily accessible for operation, protected from physical damage, and marked with a metal tag or other permanent means attached by the installing agency (#2.3.14.5). An accessible gas shutoff valve upstream of each gas pressure regulator (#2.3.14.4). (Audit C11-06: this valve was cited as Section 2.5.)"
      - name: "LPG Leak Detection Wiring"
        code_ref: "Ch 11, Table 11.4 #6.ii"
        page_ref: "p.902"
        spec: "Wiring for LPG leak detection, supervision and remote operations: MICC or 2 hour fire rated 3(4)x1.5 mm cable."

  # ----- Table 11.4 #2 shafts: 1-hr non-highrise / 2-hr highrise (highrise = 23 m or more, ruling R1)
  - id: lpg_shafts_non_highrise
    match:
      any_of:
        - {has_gas_infra_connection_is: true}
        - {has_lpg_tanks_is: true}
      height_class_in: [lowrise, midrise]
    section: "Ch 11, Table 11.4 #2"
    page: "p.901"
    systems:
      - name: "Dedicated Fire-Rated LPG Shafts"
        spec: "1 hour fire resistance rated dedicated shafts (non-highrise building, Table 11.4 #2.ii)"
        detail: "LPG distribution inside any building through dedicated shafts (#2.i), of masonry, steel, concrete or tested and approved fire rated particle board (#2.iv); pipe penetrations fire stopped (#2.v); any duct dedicated for gas naturally ventilated to open air (#2.vi)."

  - id: lpg_shafts_highrise
    match:
      any_of:
        - {has_gas_infra_connection_is: true}
        - {has_lpg_tanks_is: true}
      height_class_in: [highrise, super_highrise]
    section: "Ch 11, Table 11.4 #2"
    page: "p.901"
    systems:
      - name: "Dedicated Fire-Rated LPG Shafts"
        spec: "2 hour fire resistance rated dedicated shafts (highrise building, Table 11.4 #2.iii)"
        detail: "LPG distribution inside any building through dedicated shafts (#2.i), of masonry, steel, concrete or tested and approved fire rated particle board (#2.iv); pipe penetrations fire stopped (#2.v); any duct dedicated for gas naturally ventilated to open air (#2.vi)."

  # ----- Table 11.4 items for the tank installation itself (fill point, fence, access, light) (CH10-07)
  - id: lpg_central_tank_site
    match: {has_lpg_tanks_is: true}
    section: "Ch 11, Table 11.4 #4, #5, #8-#10"
    page: "p.901-904"
    systems:
      - name: "Fill Line and Filling Point"
        code_ref: "Ch 11, Table 11.4 #4"
        page_ref: "p.901"
        spec: "Filling connections in electrically classified areas with no ignition source within 7.6 m (#4.i); filling connection 1 m from finished ground level (#4.ii); fill line fully exposed outside the building (#4.iv)."
        detail: "Connections unobstructed (#4.iii); as close to the tank as possible (#4.v); within the tank fenced area, otherwise in a lockable ventilated box (#4.vi); safe access platform with standard steps, handrail and guards for top filling (#4.vii); vapour equalizing line, labelled LIQUID or VAPOUR (#4.viii); butane / LPG / propane connections labelled and colour coded (#4.ix); protected from vehicle impact by crash barriers and from unauthorized access (#4.x)."
      - name: "Tank Valves (internal valves)"
        code_ref: "Ch 11, Table 11.4 #5"
        page_ref: "p.902"
        spec: "Liquid and vapor withdrawal openings of 3.2 cm or larger equipped with internal valves, closed except during operation, with remote closure and automatic shutoff through thermal activation (#5.ii-iv)."
        detail: "Valves and controls accessible for maintenance (#5.i); positive manual shutoff valve close to each internal valve (#5.v); backflow check valves on liquid and vapor inlet openings (#5.vi); container insulation able to limit the container to not over 427 degrees Celsius for at least 50 minutes (#5.vii)."
      - name: "Tank Fencing and Barricades"
        code_ref: "Ch 11, Table 11.4 #10"
        page_ref: "p.904"
        spec: "Industrial type chain-link fencing 1.8 m high around the LPG tank installation, with at least 2 exit gates of 1.2 m width where tanks are filled within the fenced enclosure (#10.i)."
        detail: "Tanks near parking lots, vehicle ramps and roads: steel barricades along with the fences (#10.ii). Tanks near towers or facing highrise balconies: mesh covers on top along with the fences, against flying debris, falling ignition sources and flaming debris (#10.iii)."
      - name: "Fire Access and Illumination at the Tank"
        code_ref: "Ch 11, Table 11.4 #8-#9"
        page_ref: "p.904"
        spec: "Clear and safe access, free from vegetation, to and around the LPG tanks for fire fighting (#9.i); adequate lighting for the tank and filling connections for night time maintenance and refilling (#8.i), per NFPA 70 (#8.ii)."
      # Audit C11-01: #4.8 (p.929) and #4.4 / Table 11.13 (p.926) apply to every bulk tank installation.
      - name: "LPG Bulk Tanker Parking Area (#4.8)"
        code_ref: "Ch 11, #4.8"
        page_ref: "p.929"
        spec: "A clear, dedicated, safe LPG Propane tanker parking area for each bulk installation, close to the delivery point (#4.8.1). Cumulative tank capacity up to 15000 liters (3,300 Gal.): minimum 14 meters in length, 4 meters clear wide (#4.8.4); above 15000 liters (3,300 Gal.): minimum 20 meters in length, 4 meters clear wide (#4.8.5); each with the required approach maneuverability and turning radius for the tanker."
        detail: "No LPG installation without dedicated, safe clear parking for the delivery tankers shall be permitted (#4.8.7). The tool has no tank capacity input: both sizes are printed; the 14 m row applies up to 3,300 Gal cumulative tank capacity and the 20 m row above it. Identified at the facility planning stage, with a detailed drawing approved by Civil Defence (#4.8.2-#4.8.3); organized so the tankers can be moved out swiftly in an emergency (#4.8.6); no bulk installation with a general public parking facility unless completely cordoned with valid Municipality and Police approvals (#4.8.8); no installation where product delivery must be done from public roads or crowded public areas (#4.8.9); not close to open flames or ignition sources such as open restaurants and sheesha stalls (#4.8.10); no combustible materials, other fuel storage or fuel handling operations within 5 m from the dedicated tanker parking area and the delivery point (#4.8.11); future developments of adjacent facilities considered (#4.8.12)."
      - name: "Point of Transfer Separation Distances (Table 11.13)"
        code_ref: "Ch 11, #4.2-#4.4 / Table 11.13"
        page_ref: "p.925-926"
        spec: "Minimum horizontal separation from the point of transfer of liquid LP (Table 11.13): 1. buildings, modular homes, recreational vehicles with 1 hour fire resistance rated walls 3 m; 2. without 1 hour fire resistance rated walls 7.6 m (items 1-2: if the point of transfer is not inbuilt in the LPG system); 3. adjoining property or land 7.6 m; 4. building wall openings, pits and drains at or below the point of transfer 7.6 m (if the point of transfer is not inbuilt in the LPG system); 5. public assembly places, school yards, playgrounds and athletic fields 15 m; 6. publicways, streets and highways from LPG / fuel dispensing stations 3 m; 7. publicways, streets and highways 7.6 m; 8. driveways 1.5 m; 9. railroads track centerlines 7.6 m; 10. other containers, tanks and cylinders 3 m; 11. flammable and class II combustible liquid dispensers and fill connections 3 m; 12. flammable and class II combustible liquid containers, aboveground containers and underground containers 6 m."
        detail: "If LPG is vented to atmosphere, the Table 11.13 distances shall be doubled (#4.4.2); if the transfer complies with the low emission requirements of Table 11.10.b.4, they shall be reduced to one-half (#4.4.3). Liquid transferred only outdoors or in structures specially designed for the purpose; not within a building (a weather shelter or canopy is permitted); the transfer hose shall not be routed in or through any building (#4.2.2-#4.2.4). LPG supply tankers approved and Civil Defence listed (#4.2.1); transfer by qualified, Civil Defence licensed personnel, one in attendance throughout (#4.3.1-#4.3.2)."

  # ----- Cylinder installations (has_gas_cylinders_villa flag) -----
  - id: lpg_cylinders_villa
    match: {has_gas_cylinders_villa_is: true}
    section: "Ch 11, #2.4.1 / Table 11.1 (outdoor) + Table 11.2 (indoor)"
    page: "p.893-895"
    systems:
      - name: "Cylinder Installations Not Allowed in New / Modified Buildings (#2.2.4)"
        code_ref: "Ch 11, #2.2.4-#2.2.6"
        page_ref: "p.884"
        spec: "Cylinder type LPG installations in all new and modified buildings are not allowed (#2.2.4); permission to install LPG cylinders is strictly subject to Civil Defence approval based on site and building inspection (#2.2.5)."
        detail: "It is the strong intention of Civil Defence to install centralized LPG systems in all new and modified buildings and developments (#2.2.4). LPG cylinders shall not be installed indoors (#2.2.6); the only exception is #2.4.2.1 (p.896): residential / apartments / flats and villas with no other location option, where permitted by Civil Defence."
      - name: "Outdoor LPG Cylinder Installation Location"
        spec: "Per Table 11.1 item 1 - above ground, outdoors, well-ventilated, on firm/clean/dry/level base"
        detail: "Cylinders NOT permitted on roof, terrace or basements. Sited at ground level. Not close to passageways or exits. Not against glass walls or glazing."
      - name: "Outdoor Cylinder Separation Distances"
        spec: "Per Table 11.1 item 2 (p.893)"
        detail: "3 m clearance to: any fire exit route, exit doors, exit stairs, windows, public roads, AC intake/return units, balanced flue outlets, parking, drains/shaft openings/pits, basement openings, fire accessways, assembly points, fire-truck parking slot (Table 11.1 #2.iv), and ramp openings. 10 m clearance to fire hydrants."
      - name: "Cylinder Quantity Limits"
        spec: "Per Table 11.1 item 3"
        detail: "Domestic residential: max 2 cylinders x 24 kg per group (1 main + 1 reserve, common manifold with isolation valves). Commercial: max 4 cylinders x 44 kg per group (2 main + 2 reserve). Larger quantities require special CD approval."
      - name: "Louvered Steel Enclosure"
        spec: "Per Table 11.1 item 4 + item 5"
        detail: "Locked against tampering / accidental damage. Steel barricades where near parking / vehicle ramps / roads. Total free-area of louvers at least 50% of front-side area for ventilation."
      - name: "Gas-Leak Detection where the Internal Pipes and Fittings Are Installed"
        code_ref: "Ch 11, Table 11.1 #6"
        page_ref: "p.895"
        spec: "Approved gas-leak detection in the area or compartment where the internal LPG/CNG pipes and fittings are installed (the kitchen), with a local alarm connected to a main fire alarm panel (Table 11.1 #6.i)."
        detail: "Remote emergency shut-off valve at least 3 m from the edge of the installation, clearly marked and at a suitable height (#6.ii). Commercial kitchens with fixed fire suppression: activation shuts off the LPG/CNG supply to the kitchen automatically (#6.iii). Pipe penetrations fire stopped (#6.iv)."
      - name: "Outdoor Cylinder Safety Precautions"
        code_ref: "Ch 11, Table 11.1 #7"
        page_ref: "p.895"
        spec: "No ignition source within 3 m of the cylinder installation (#7.ii); fixed electrical equipment within 1.5 m spark-proof and intrinsically safe per NFPA 70 (#7.iii)."
        detail: "Vaporizers not inside the steel cabinet or the cylinder housing; wall-mounted vaporizers at least 1.2 m above ground and 600 mm from any cylinder (#7.iv). Enclosure used only for LPG cylinders, no other usage or storage (#7.v)."
      - name: "Portable Fire Extinguisher (B:C, minimum 9 kg)"
        code_ref: "Ch 11, Table 11.1 #7.vii; Table 11.2 #6.vii"
        page_ref: "p.895, p.898"
        spec: "At least one approved portable B:C rating dry chemical fire extinguisher, minimum capacity 9 kg, at the LPG installation."
      - name: "Two-Stage Pressure Regulation"
        code_ref: "Ch 11, Table 11.4 #1.iii; #2.3.12.3"
        page_ref: "p.900, p.889"
        spec: "Two stage pressure regulators are essential for all LPG installations: first regulator to reduce system pressure to 5 psi (0.350 bar) for large commercial customers or to 75 mbar for residential customers; second stage regulator to 0.5 psi (0.035 bar) (Table 11.4 #1.iii)."
        detail: "#2.3.12.3: The hose shall be securely connected to the appliance. The use of rubber slip ends without hose clips shall not be permitted for domestic cylinders. An accessible gas shutoff valve upstream of each gas pressure regulator (#2.3.14.4, p.890). (Audit C11-07.)"

  # ----- NO GAS SYSTEM (none of the flags ticked) -----
  - id: lpg_no_gas_system
    match:
      has_lpg_tanks_is: false
      has_gas_infra_connection_is: false
      has_gas_cylinders_villa_is: false
      has_lpg_cylinders_food_truck_is: false
      has_lpg_flame_effect_is: false
    section: "Ch 11"
    page: "p.877-939"
    systems:
      - name: "No Gas System Present"
        required: not_required
        detail: "Building has no LPG tanks, no gas-infrastructure connection, no LPG cylinders, no food-truck LPG and no flame-effect LPG. Chapter 11 LPG Code of Practice does NOT apply to this building. If a gas system is added later, Ch 11 design and installation requirements must be implemented and re-submitted to Civil Defence."

# ---------- ADD-ON VARIANTS: layer additional requirements per tank/cylinder type
addons:
  # C11-09: above 90 m the roof tank is not allowed (#2.5.1.3); its install rows are not printed.
  - id: lpg_addon_roof_mounted_tank
    flag: has_lpg_tank_roof_mounted
    when: {height_m_lte: 90}
    systems:
      - name: "Roof-Mounted LPG Tank Installation (Table 11.7)"
        code_ref: "Ch 11, #2.5.1.2-#2.5.1.3, #2.5.4 / Table 11.7 #1"
        page_ref: "p.900, p.909"
        spec: "Roof, podium and elevated-platform tanks comply with Table 11.7 (#2.5.4.1). Permitted on roofs of buildings up to 90 m only (#2.5.1.3); underground or above ground locations are preferred to roof tops (#2.5.1.2)."
        detail: "Location (Table 11.7 #1): access to all valves and controls with room for maintenance (iv); free air movement (vii); an aesthetic cover shall be fully ventilated or perforated and keep the Table 11.7 separations (viii); not within 3 m of a dike wall of other flammable and combustible liquids (ix)."
      - name: "Roof Tank Location Prohibitions (Table 11.7 #1.iii, #1.v, #1.vi)"
        code_ref: "Ch 11, Table 11.7 #1.iii, #1.v, #1.vi"
        page_ref: "p.909"
        spec: "Not allowed on a building roof with a helipad on the same roof (#1.iii). At least one building standard fire exit stair shall reach the tank level; cat ladders, alternate stairs and temporary stairs are not allowed for access (#1.v). Not on a stair core roof, lift machine room roof or upper roof levels without building standard stair access (#1.vi)."
      - name: "Roof Tank Building Construction and Structure (Table 11.7 #2)"
        code_ref: "Ch 11, Table 11.7 #2"
        page_ref: "p.909"
        spec: "Building of Type I (443 or 332) or Type II (222) construction per Chapter 1 (#2.i); tank support designed to the same seismic criteria as the building (#2.ii); the roof able to support the weight of the container filled with water (#2.iii)."
        detail: "Tank on a level surface (#2.iv) and secured to the building structure (#2.v)."
      - name: "Roof-Mounted LPG Tank Maximum Quantity"
        code_ref: "Ch 11, #2.5.4 / Table 11.7 #3.i-ii"
        page_ref: "p.909"
        spec: "Maximum 2000 Gal aggregate for buildings complying with Table 11.7 #2.i; 1000 Gal aggregate for other types of construction."
        detail: "Table 11.7 #3.ii cross-refers to 'Table 11.6, 2, i' for the construction test; the construction item is Table 11.7 #2.i (Type I 443 / 332 or Type II 222)."
      - name: "Roof-Mounted LPG Tank Separation Distances (Table 11.8)"
        code_ref: "Ch 11, Table 11.7 #4 / Table 11.8"
        page_ref: "p.910"
        spec: "Table 11.8 (aggregate capacity: separation / between tanks): up to 500 Gal 3 m / 1 m; 501-1000 Gal 4.5 m / 1 m; 1001-2000 Gal 7.6 m / 1 m; more than 2000 Gal 7.6 m / 15 m."
        detail: "Measured from the tank surface to any point of structure, building, parapet wall, compound wall, other equipment, exit stairs, fire truck accessway, assembly points, parking lot, drains, shaft openings, pits, openings to basements and ramp openings (#4.iii); tanks of several capacities in a group take the distance of the largest tank (#4.ii). 6 m to air intake units, AC units, air vents and balanced flue outlets (#4.iv); 10 m to fire hydrants, fire fighting equipment and valves, fire command centers (#4.v); not within 1.8 m of a vertical plane beneath power lines over 600 volts (#4.vi); no vegetation, dry grass or combustible material within 3 m (#4.vii)."
      - name: "Roof Tank Fire Protection - Fixed Water Spray System (Table 11.7 #5)"
        code_ref: "Ch 11, Table 11.7 #5"
        page_ref: "p.910"
        spec: "Fixed water spray system on the roof top LPG tank, fed from the fire pump and water tank of the building the tank serves, designed per Chapter 9 (#5.i)."
        detail: "Where the building has no fire pump and fire water tank: dry type water spray ring with open nozzles connected to a Civil Defence breeching inlet, per Chapter 9 (#5.ii)."

  - id: lpg_addon_roof_mall_4000
    flag: has_lpg_tank_roof_mounted
    when:
      height_m_lte: 90
      any_of:
        - {occupancy_in: [mall_covered, mall_open, mall_mixed]}
        - {gross_floor_area_m2_gt: 20000}
        - {plot_area_m2_gt: 20000}
    systems:
      - name: "Mall 4,000 Gal Allowance"
        required: conditional
        code_ref: "Ch 11, #2.5.4 / Table 11.7 #3.iii"
        page_ref: "p.909"
        spec: "Malls and developments larger than 20,000 m2 with central LPG tanks: up to 4000 Gal on roof, as two 2000 Gal LPG tanks installed 15 m apart."
        detail: "Such approvals are based on the Civil Defence assessment of the project and evaluation of the proposal (Table 11.7 #3.iii). Does not allow a single tank above 2000 Gal. 'Developments larger than 20,000 m2' is read as a GFA or a plot area above 20,000 m2, or any mall (owner ruling 12.10.2026, P3 Ch11 Q5)."

  - id: lpg_addon_roof_super_highrise
    flag: has_lpg_tank_roof_mounted
    when: {height_m_gt: 90}
    systems:
      - name: "Roof LPG Tank Not Allowed - Building Higher than 90 m (#2.5.1.3)"
        code_ref: "Ch 11, #2.5.1.3"
        page_ref: "p.900"
        spec: "LPG tanks on the roof of a super-highrise building (more than 90 m) are not allowed: relocate the tanks underground, mounded or above ground at grade."
        detail: "#2.5.1.3 (p.900): LPG tanks on Superhighrise buildings (having height more than 90 m) is not allowed. The roof tank installation rows of Tables 11.7 and 11.8 (and the Table 11.7 #3.iii mall allowance) are therefore not printed for this building (audit C11-09)."

  - id: lpg_addon_underground_mounded
    flag: has_lpg_tank_underground_mounded
    systems:
      - name: "Underground / Mounded LPG Tank Installation (Table 11.9)"
        code_ref: "Ch 11, #2.5.5 / Table 11.9"
        page_ref: "p.915-917"
        spec: "Underground or mounded LPG tanks shall be installed below ground, outdoor with relief valves open to sky at grade level (Table 11.9 #1.i). Buildings, sheds and canopies shall not be constructed over any underground or mounded LPG tanks (#1.ii). Installed at least 15 cm below grade in areas with no vehicle traffic (#1.vi); at least 46 cm below grade, or barricades around the entire tank and connections, with vehicle traffic within 3 m (#1.vii); interchangeable aboveground / underground assemblies not with the tank shell more than 3 m below grade (#1.viii)."
        detail: "Installation per Sections 2.5.1, 2.5.2, 2.5.5 and Section 6 (#2.5.5.1, p.915). Partially buried or unmounded tanks are aboveground installations per Section 2.5.3 (#1.iii). Not prone to water flooding from rain or water main leakages (#1.iv); free air movement (#1.v); an aesthetic cover fully ventilated or perforated and keeping the separation distances (#1.ix); not within 3 m of a dike wall of other flammable and combustible liquids (#1.x). (Audit C11-03: earlier text not printed in Table 11.9 removed.)"
      - name: "Maximum Quantity (Underground/Mounded)"
        code_ref: "Ch 11, #2.5.5 / Table 11.9 item 3"
        page_ref: "p.917"
        spec: "Maximum 180,000 Gal for underground or mounded LPG tanks in one location, in one tank or as the aggregate of several tanks (Table 11.9 #3.i)."
        detail: "More than 180,000 Gal shall be subdivided into groups of tanks not exceeding 180,000 Gal each, the groups 15 m apart (#3.ii)."
      - name: "Underground / Mounded LPG Tank Separation Distances (Table 11.10.a)"
        code_ref: "Ch 11, Table 11.9 #4 / Table 11.10.a"
        page_ref: "p.917, p.919"
        spec: "Table 11.10.a (aggregate capacity: separation / between tanks): up to 500 Gal 3 m / 0 m; 501-2000 Gal 3 m / 1 m; 2001-30,000 Gal 15 m / 1.5 m; more than 30,000 Gal 15 m / 1/4 of the sum of the diameters of adjacent tanks."
        detail: "Measured from the tank pressure relief valve and filling connections to any point of structure, building, compound wall, public road, other equipment, exit roads, fire truck accessway, assembly points, parking lot, drains, shaft openings, pits, openings to basements and ramp openings (Table 11.9 #4.ii). From the pressure relief valve: 6 m to air intake units, AC units, air vents and balanced flue outlets (#4.iii); 10 m to fire hydrants, fire fighting equipment and valves, fire command centers (#4.iv); the valve not within 1.8 m of a vertical plane beneath power lines over 600 volts (#4.v). No dry grass or combustible material within 3 m; landscaping acceptable with coating and irrigation kept off the tank (#4.vi)."
      - name: "ASME Container Reduction Allowance (Table 11.10.b)"
        required: conditional
        code_ref: "Ch 11, Table 11.10.a #3.b / Table 11.10.b"
        page_ref: "p.919"
        spec: "ASME tanks up to 30,000 Gal installed in full compliance with Table 11.10.b: 3 m separation (in place of 15 m for 2001-30,000 Gal), 1.5 m between tanks."
        detail: "An optional reduction (audit C11-04): Table 11.10.a #3.b prints '3 m, if all requirements of Table 11.10.b are complied with'; the 15 m of row 3.a applies otherwise. Table 11.10.b: distance measured from the tank surface, not the relief valve (#1.i); ASME containers manufactured, tested and certified (#2.i); liquid and vapour withdrawal openings of 1.25 inch (3.2 cm) or larger with internal valves (#2.ii), closed except during operation (#2.iii); internal valves with remote closure and automatic shutoff through thermal (fire) actuation (#3.i); positive manual shutoff valve close to each internal valve (#3.ii); backflow check valves on liquid and vapour inlet openings (#3.iii); automatic shutdown of transfer equipment power and primary valves through thermal actuation and on hose pull-away (#3.iv); a remote shutdown station within 4.6 m of the point of transfer and another from 7.6 m to 30 m from the transfer point (#3.v)."
      - name: "Underground / Mounded Tank Fire Protection (Table 11.9 #5)"
        required: not_required
        code_ref: "Ch 11, Table 11.9 #5"
        page_ref: "p.917"
        spec: "None. Fire protection for underground or mounded LPG tanks is not mandatory (Table 11.9 #5.i)."
        detail: "If hazards exist next to the underground or mounded tanks and a risk assessment demands it, cooling options can be considered (#5.i)."
      - name: "Underground / Mounded Tank Installation and Mounding (Table 11.9 #2)"
        code_ref: "Ch 11, Table 11.9 #2"
        page_ref: "p.915-916"
        spec: "Tanks approved and listed for underground or mound installation (#2.i), installed by a Civil Defence approved contractor (#2.ii). Cathodic protection shall be provided for the underground and mounded LPG tanks to prevent corrosion (#2.iii); tanks coated fully without any pinhole (#2.iv). Concrete bed shall be provided as foundation in all cases, designed to overcome buoyant forces, with the tanks fixed / strapped to it (#2.v-vi). Mounded tanks covered with filling materials of thickness of at least 30 cm (#2.xii); bottom valves and appurtenances accessible through an opening or tunnel of width 1.2 m in diameter, or extended beyond the mound per ASME (#2.xiv-xv)."
        detail: "The pit shall be backfilled (#2.vii); backfill free of rocks and abrasives so that coating is not compromised (#2.viii); regulator vent discharge above the highest probable water level (#2.ix); damage inspected and repaired before backfilling (#2.x); containers set level and surrounded by earth or sand firmly tamped (#2.xi). Mounded tanks installed above grade and covered with earth, sand, vermiculite or perlite with a wall or other method to hold the filling (#2.xi, p.916); a protective cover on top of the mounding materials against corrosion (#2.xiii). (Audit C11-03: replaces a cathodic protection line whose monitoring text is not printed.)"
      - name: "Explosion-Proof Gas Detector at Every Underground / Mounded Tank"
        code_ref: "Ch 11, Table 11.9 #2.xvi"
        page_ref: "p.916"
        spec: "Gas detector explosion proof type shall be installed in close proximity to every underground or mounded tank (Table 11.9 #2.xvi)."

  # Indoor cylinders: allowed only for residential / apartments / flats and villas (#2.4.2.1, p.896)
  - id: lpg_addon_cylinders_indoor
    flag: has_lpg_cylinders_indoor
    when:
      occupancy_in: [residential, villa_private, villa_commercial]
    systems:
      - name: "Indoor LPG Cylinder Installation (Table 11.2)"
        code_ref: "Ch 11, #2.2.6, #2.4.2.1 / Table 11.2 #1"
        page_ref: "p.884, p.896"
        spec: "Indoor cylinders are not allowed generally (#2.2.6); where there is no other location option, allowed only for residential / apartments / flats and villas where permitted by Civil Defence (#2.4.2.1). Cylinders in a ventilated above-ground compartment with at least one external wall, at the building perimeter (Table 11.2 #1.i), of masonry construction ventilated on the front side (#1.ii)."
        detail: "Smooth concrete compartment floor with no opening or drain where vapour may accumulate (#1.iii). Not on roof, terrace, balconies or basements unless dedicated stair access and a ventilated location are available and Civil Defence approves; then all piping copper tube or welded steel, no hose connections (#1.iv). Compartment not close to passageways or exits (#1.v). Louvered steel enclosure, locked against children, tampering and accidental damage (#4.i); steel barricades near parking lots, vehicle ramps and roads (#4.ii)."
      - name: "Indoor Cylinder Quantity Limits"
        code_ref: "Ch 11, Table 11.2 #3.i"
        page_ref: "p.898"
        spec: "Domestic residential usage: maximum 1 cylinder of 24 kg indoors; another 24 kg spare is allowed but not recommended to be stored indoors."
      - name: "Indoor Cylinder Separation Distances (Table 11.2 #2)"
        code_ref: "Ch 11, Table 11.2 #2"
        page_ref: "p.896"
        spec: "1.5 m from the cylinder compartment to any fire exit route, exit doors, exit stairs, windows and openings (#2.i); 3 m to air intake units, window and split AC units, air vents and balanced flue outlets (#2.iii); 3 m to any parking lot, parking ramp or road (#2.iv); 3 m to fire accessways, assembly points and the fire truck parking slot (#2.v); 3 m to drains, shaft openings, pits, openings to basements and ramp openings (#2.vi); 10 m to fire hydrants (#2.vii)."
      - name: "Indoor Cylinder - No Ignition Source within 1.5 m (Table 11.2 #6.ii)"
        code_ref: "Ch 11, Table 11.2 #6"
        page_ref: "p.898"
        spec: "There shall be no ignition source within 1.5 m from the cylinder installation (#6.ii)."
        detail: "Vaporizers not inside the compartment; wall-mounted vaporizers at least 1.8 m above the ground and 600 mm from any LPG/CNG cylinder (#6.iv). Compartment used only for LPG cylinders (#6.v). Electrical work per NFPA 70 and 72 (#6.iii)."
      - name: "Indoor Cylinder Compartment - 3 m to Ignition Sources / Cooking Appliances (Table 11.2 #2.ii)"
        required: recommended
        code_ref: "Ch 11, Table 11.2 #2.ii"
        page_ref: "p.896"
        spec: "3 m should be maintained between the edge of the compartment and any ignition sources / cooking appliances (printed as 'should')."
      - name: "Indoor Cylinder Gas Detection and Remote ESV (Table 11.2 #5)"
        code_ref: "Ch 11, Table 11.2 #5"
        page_ref: "p.898"
        spec: "Approved gas-leak detector not more than 30 cm above finished floor level, within 5 m of the LPG source and inside the cylinder compartment (#5.i), interfaced with a local alarm connected to the main fire alarm panel (#5.ii)."
        detail: "Remote emergency shut-off valve not inside the compartment: at least 1.5 m from the compartment, at the kitchen exit door, clearly marked and at a suitable height (#5.iii). Pipe penetrations fire stopped (#5.iv)."
      - name: "Portable Fire Extinguisher (B:C, minimum 9 kg)"
        code_ref: "Ch 11, Table 11.1 #7.vii; Table 11.2 #6.vii"
        page_ref: "p.895, p.898"
        spec: "At least one approved portable B:C rating dry chemical fire extinguisher, minimum capacity 9 kg, at the LPG installation."

  - id: lpg_addon_cylinders_indoor_not_permitted
    flag: has_lpg_cylinders_indoor
    when:
      not: {occupancy_in: [residential, villa_private, villa_commercial]}
    systems:
      - name: "Indoor LPG Cylinders Not Allowed for this Occupancy (#2.2.6, #2.4.2.1)"
        code_ref: "Ch 11, #2.2.6, #2.4.2.1"
        page_ref: "p.884, p.896"
        spec: "LPG cylinders shall not be installed indoors (#2.2.6). The only exception is residential / apartments / flats and villas with no other location option, where permitted by Civil Defence (#2.4.2.1): move the cylinders outdoors (Table 11.1) or use a central tank or gas infrastructure connection."

  - id: lpg_addon_food_truck
    flag: has_lpg_cylinders_food_truck
    systems:
      - name: "Food Truck LPG Cylinder Installation (Table 11.3)"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #1-#2"
        page_ref: "p.899"
        spec: "Cylinders in a permanent, fixed manifold at the back of the food truck, in a metal ventilated cabinet fully isolated from the truck interiors, single cabinet or two separate cabinets (Table 11.3 #1); maximum 2 cylinders of 12 kg in one group in the enclosure (#2.i)."
        detail: "Compartment of steel construction with ventilation on the front side (#1.i); not on the sides or on the truck top (#1.ii). 1 cylinder main and 1 reserve in a common manifold with isolation valves; additional / spare LPG cylinders are not allowed to be stored in the truck (#2.i). Owner produces a manufacturer certificate of the truck load carrying capacity (#3.i)."
      - name: "Composite Cylinders ONLY"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.iii"
        page_ref: "p.899"
        spec: "Cylinders shall be composite type only (Table 11.3 #3.iii)."
      - name: "Twin Tires for Truck Rear"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.ii"
        page_ref: "p.899"
        spec: "There shall be twin tires for the truck rear (Table 11.3 #3.ii)."
      - name: "Battery-Operated Heat Detector over Cooking Platform"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.viii"
        page_ref: "p.899"
        spec: "Battery operated heat detectors for the truck interior covering the cooking platform (Table 11.3 #3.viii)."
      - name: "Electrical Wiring in Metallic Containment Pipe"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.ix"
        page_ref: "p.899"
        spec: "All electrical wiring, lighting wiring and equipment wiring concealed in a metallic containment pipe (Table 11.3 #3.ix)."
      - name: "Steel Guard at Exterior of Cylinder Enclosure"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.vi"
        page_ref: "p.899"
        spec: "Steel guard at the exterior of the cylinder enclosure (Table 11.3 #3.vi)."
      - name: "Welded Steel Piping with Flexible Hose as Short as Possible"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.iv"
        page_ref: "p.899"
        spec: "Welded steel piping, up to as close as possible to the cylinders, with flexible hose connections as minimum as possible (Table 11.3 #3.iv)."
      - name: "ESV Switch at BOTH Doors of Truck Interior"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 #3.v"
        page_ref: "p.899"
        spec: "Emergency shut-off switch at both doors of the truck interior (Table 11.3 #3.v)."
      - name: "Food Truck Safety Provisions (Table 11.3.3)"
        code_ref: "Ch 11, #2.4.3 / Table 11.3 item 3"
        page_ref: "p.899"
        spec: "LPG leak detectors at the enclosure and inside the truck near the cooking platform (#3.vii); kitchen hood suppression system for the hood (#3.x)."
        detail: "Civil Defence NOC shall be obtained only after inspection of the food truck (Table 11.3 #3.xi). The code prints no inspection frequency for food trucks; the quarterly #5.1.1 inspection applies to all LPG installations."

  - id: lpg_addon_prdp_tapping
    flag: has_gas_infra_connection
    systems:
      - name: "PRDP (Pressure Reducing Distribution Panel) Tapping (Table 11.11)"
        code_ref: "Ch 11, #2.5.6 / Table 11.11 #2-#4"
        page_ref: "p.922"
        spec: "Dedicated LPG shafts, 1 hour fire resistance rated for non-highrise and 2 hour for highrise buildings, naturally ventilated to open air (Table 11.11 #2); pipe-in-pipe through basements, studio apartments, show kitchens open to living or public spaces and confined spaces, naturally ventilated to open air from at least one side (#3.i); leak detection wiring MICC or 2 hour fire rated 3(4)x1.5 mm cable (#4.ii)."
        detail: "Shafts of masonry, steel, concrete or tested and approved fire rated particle board, penetrations fire stopped (#2.iv-v). Pipe-in-pipe of approved CPVC or steel with leak detectors monitored by the central LPG control panel (#3.ii); ceiling drops in open rooms (school and research laboratories) on steel support columns with steel pipe-in-pipe (#3.iii). Electrical equipment approved and per NFPA 70 (#4.i)."
      - name: "PRDP Stage 2 Kitchen Gas Detection (Table 11.11 #5)"
        code_ref: "Ch 11, Table 11.11 #5"
        page_ref: "p.922"
        spec: "Civil Defence approved standalone kitchen-type LPG detectors for kitchens and LPG consuming appliances, not more than 30 cm above finished floor level and 1.5 m from the cooking and other LPG consuming appliances (#5.i-iii)."
        detail: "Remote emergency shut-off switch at least 1.5 m from the appliances and at the kitchen exit door(s) (#5.iv); emergency shut-off solenoid valve in the local PRDP, directly controlled by the gas detector (#5.v); Figure 11.4."
      - name: "Portable Fire Extinguisher (B:C, minimum 9 kg)"
        code_ref: "Ch 11, Table 11.11 #6.ii"
        page_ref: "p.922"
        spec: "At least one approved portable B:C rating dry chemical fire extinguisher, minimum capacity 9 kg, at the LPG installation."
        detail: "Pipe penetrations on walls fire stopped to keep the wall fire resistance (Table 11.11 #6.i)."

  # Table 11.13 (point of transfer, p.926) and #4.8 (tanker parking, p.929) print with the tank
  # site items (branch lpg_central_tank_site), audit C11-01.
  - id: lpg_addon_flame_effect
    flag: has_lpg_flame_effect
    systems:
      - name: "Flame Effect LPG Installation (Table 11.12)"
        code_ref: "Ch 11, #3 / Table 11.12 #1"
        page_ref: "p.923"
        spec: "Cylinders or containers located 6 m away from the audience and stage (Table 11.12 #1.i); no piping or valves within 3 m of the audience (#1.ii)."
        detail: "Flame shows comply with Section 2.5, Table 11.12 and Section 6 (#3.2.1). Indoor shows only in rooms that comply with the Chapter 3 occupant load, exit width and minimum two exit requirements (#3.2.3). The flame effect control system shall be an approved product, with approvals and certifications produced to Civil Defence for event approval (#3.2.4). Electrical equipment and wiring approved for the purpose per NFPA 70 (Table 11.12 #5.i); wiring for LPG leak detection, supervision and remote operations MICC or 2 hour fire rated 2X1.5 mm cable (#5.ii). Permanent LPG installations for flame effects: fixed fire protection systems as per risk assessment and Civil Defence evaluation (#6.i). LPG management and safety precautions: lines below (#4, #7; audit C11-02)."
      - name: "Flame Effect LPG Quantity (Table 11.12 #2)"
        code_ref: "Ch 11, #3 / Table 11.12 #2"
        page_ref: "p.923"
        spec: "Indoor show: maximum 24 kg LPG; where more than one cylinder is needed indoors in the same room, the additional cylinders 6 m from each other (#2.i). Outdoor show (central installation or cylinders): not more than the quantity required for a single day (#2.ii)."
        detail: "Additional LPG may be stored separately in a holding or storage area with a risk assessment and emergency response procedures approved by Civil Defence (#2.iii)."
      - name: "Flame Effect LPG Separation Distances (Table 11.12 #3)"
        code_ref: "Ch 11, #3 / Table 11.12 #3"
        page_ref: "p.924"
        spec: "i. 6 m distance shall be maintained between cylinder compartment to any fire exit route, Exit Doors, Exit Stairs, Windows and openings; iii. 6 m distance shall be maintained from LPG container to any Air intake units, Window type and Split Type AC units, Air vents, Balanced type flue outlets; iv. 6 m distance shall be maintained from LPG container to any parking lot, parking ramp or road; v. 6 m distance shall be maintained between LPG container to Fire Accessways, Assembly points and Fire Truck parking slot; vi. 3 m distance shall be maintained from cylinders to drains, shaft openings, pits, opening to basements, ramp openings; vii. 10 m distance shall be maintained from LPG container compartment to Fire Hydrant."
        detail: "ii. 3 m should be maintained between LPG container and any ignition sources / appliances (printed as 'should'). (Audit C11-02.)"
      - name: "Flame Effect LPG Management (Table 11.12 #4, #7)"
        code_ref: "Ch 11, #3 / Table 11.12 #4, #7"
        page_ref: "p.924"
        spec: "LPG supply shall only be available for the flame effect during operation (#4.i); a manual shut-off valve in an accessible location, when closed shall shut-off all LPG supply to the flame effect control system (#4.ii); where low pressure in LPG could cause the flame effect control system to malfunction, low pressure supervision devices shall be installed (#4.iii; #4.iv prints the same 'low pressure supervision devices' for the high pressure case); flame effect valve, 'hold-open' type, which on loss of the hold-open signal shall shut-off LPG supply to the burner (#4.v)."
        detail: "LPG accumulators manufactured, tested, approved and certified as unfired pressure vessels; LPG in an accumulator never more than required for the effect, any more evaluated by risk assessment and approved by Civil Defence (#4.vi); flame effect piping pressure tested (#4.vii). LPG cylinders or containers shall not be connected or disconnected during the show (#7.i); flame effects not triggered until the area is declared hazard free by the operation supervisor (#7.ii); all flame effect shows shall be supervised and monitored by fire safety personnel knowledgeable and working experience with fire safety and fire fighting (#7.iii)."
      - name: "Indoor Flame Effect Shows - Fully Sprinklered + Fire Alarm Building Only (#3.2.2)"
        code_ref: "Ch 11, #3.2.2 / Table 11.12 #1.iii"
        page_ref: "p.923"
        spec: "No indoor flame effect show is allowed if the building is not fully sprinkler protected and provided with an automatic fire detection and alarm system."
      - name: "Flame Effect Portable Extinguishers (Table 11.12 #6.ii)"
        code_ref: "Ch 11, #3 / Table 11.12 #6.ii"
        page_ref: "p.924"
        spec: "At least two B:C dry-chemical extinguishers (minimum 9 kg each) AND pressurized water extinguishers, placed on opposite sides of the flame show area."
        detail: "Per Table 11.12 #6.ii (p.924): the flame-show area shall be protected by at least two approved portable B:C dry-chemical extinguishers having a minimum capacity of 9 kg each, AND pressurized water extinguishers. Both extinguisher types are required (not a choice). They shall be placed on opposite sides of the flame show area so that one set is always accessible regardless of the location of an incident."
