# UAE FLSC 2018 - Chapter 8: Fire Detection and Alarm System
meta:
  code: "UAE FLSC 2018 (CDGH-OP-25, September 2018)"
  chapter: 8
  chapter_title: "Fire Detection and Alarm Systems"

# ---------- BRANCHES: Table 8.13 - by occupancy / height tier --------------
# ----- General requirements (apply to all FA designs - Section 4 of Ch 8) -----
general:
  - id: fa_general_visible_notification
    when: {}
    systems:
      - name: "Visible (Strobe) Notification Device Spacing - Table 8.1.a"
        code_ref: "Ch 8, #4 / Table 8.1.a; Table 8.1 item 17 (vii)-(viii)"
        page_ref: "p.463-464"
        spec: "Per Table 8.1.a - light output (cd) per maximum room size; corridors: not more than 4.57 m from the end of the corridor, separation not greater than 30.5 m; lens 2 m to 2.44 m above finished floor"
        detail: "Wall-mounted strobe placed at half-wall distance. Per Table 8.1.a (3 m ceiling: 6.1x6.1=15 cd, 9.1x9.1=30 cd, 12.2x12.2=60 cd, 13.4x13.4=75 cd, 15.2x15.2=95 cd; 6.1 m ceiling: 9.1x9.1=45 cd, 13.4x13.4=75 cd, 15.2x15.2=95 cd, 16.2x16.2=110 cd, 18x18=135 cd, 20.7x20.7=177 cd; 9.1 m ceiling: 6.1x6.1=55 cd). Consult Table 8.1.a for full matrix. Table 8.1 item 17 (vii), p.463: visible notification devices shall be located not more than 4.57 m from the end of the corridor with a separation not greater than 30.5 m between visible notification devices. Item 17 (viii): wall-mounted devices shall be mounted such that the entire lens is not less than 2 m and not greater than 2.44 m above the finished floor."
  - id: fa_general_audible
    when: {}
    systems:
      - name: "Audible Notification - listed sounders / bells per UL 464 / UL 1480 / FM 3150 / EN 54-3"
        code_ref: "Ch 8, Table 8.1 item 16 (ii), (vi)-(ix); #7.1.14 (standards)"
        page_ref: "p.463; p.521"
        spec: "Ambient sound level greater than 105 dBA: visible notification devices required; total sound pressure level not more than 110 dBA at the minimum hearing distance; sleeping areas 75 dBA; wall-mounted tops not less than 2.29 m above floor"
        detail: "Table 8.1 item 16, p.463: (ii) all notification devices shall be approved and listed by Civil Defence; (vi) an average ambient sound level greater than 105 dBA shall require the use of visible notification devices; (vii) the total sound pressure level produced by combining the ambient sound pressure level with all audible notification appliances operating shall not exceed 110 dBA at the minimum hearing distance; (viii) where audible appliances are installed to provide signals for sleeping areas, they shall have a sound level of 75 dBA; (ix) if ceiling heights allow, wall-mounted notification devices shall have their tops above the finished floors at heights of not less than 2.29 m and below the finished ceilings at distances of not less than 150 mm. Listing standards, Ch 8 #7.1.14 (p.521): UL 464, UL 1480, FM 3150, EN 54-3."
  - id: fa_general_wiring
    when:
      occupancy_not: [villa_private, villa_commercial]
    systems:
      - name: "Fire Alarm Wiring - 2 hour fire rated, Class A, loop isolators"
        code_ref: "Ch 8, Table 8.1 item 13 (i), (v), (vi)"
        page_ref: "p.458"
        spec: "2 hour fire rated and Civil Defence listed; Class A; loop isolators"
        detail: "Table 8.1 item 13, p.458: (i) all Fire Detection and Alarm wiring shall be 2 hour fire rated and Civil Defence listed; (v) all fire detection alarm wiring shall be Class A type where circuit redundancy is ensured and operational capability continues even when single open condition, single ground fault and single fault in the circuitry exists, and such faults are annunciated in the control panel; (vi) loop isolators shall be installed to monitor and maintain wiring integrity and safeguard from short circuits, as per manufacturer's guidelines."
  # Audit 28.10.2026, CH8-14: Table 8.13 items 14, 25 and 26 (i) (p.503, p.507-508) permit
  # a wireless / low powered radio frequency based system per Section 4.11 in villas; the
  # wiring items then apply to the wired parts only.
  - id: fa_general_wiring_villa
    when:
      occupancy_in: [villa_private, villa_commercial]
    systems:
      - name: "Fire Alarm Wiring - 2 hour fire rated, Class A, loop isolators"
        required: conditional
        code_ref: "Ch 8, Table 8.1 item 13 (i), (v), (vi); Table 8.13 items 14, 25, 26 (i)"
        page_ref: "p.458; p.503, p.507-508"
        spec: "2 hour fire rated and Civil Defence listed; Class A; loop isolators - for a wired system"
        detail: "Applies to a wired system and to the wired parts of a wireless system. Table 8.13 item 26 (i) PRIVATE VILLA (p.508), item 25 (i) COMMERCIAL VILLA (p.507) and item 14 (i) converted villa (p.503) permit, as the alternative to the smoke detection system, a 'Wireless /Low powered radio frequency based Fire Detection and Alarm System ... as per Section 4.11' (Table 8.11, p.499-500). Table 8.1 item 13, p.458: (i) all Fire Detection and Alarm wiring shall be 2 hour fire rated and Civil Defence listed; (v) Class A wiring; (vi) loop isolators as per manufacturer's guidelines."
  # Owner ruling 13.10.2026 (card "Add all", Phase 5 G6): Table 8.1 item 15 (i)-(x).
  - id: fa_general_power_sources
    when: {}
    systems:
      - name: "FA Power Supplies - Primary and Secondary Sources"
        code_ref: "Ch 8, Table 8.1 item 15 (i)-(x)"
        page_ref: "p.461"
        spec: "At least two power supply sources (one primary, one secondary) fully supervised by FACP; primary directly from the Electric Utility Supply on a branch serving the Fire Alarm System only; disconnecting means secured and marked 'FIRE ALARM/DO NOT DISCONNECT'; wiring from the utility branch to FACP 2 hour fire rated and protected from mechanical damages; overcurrent protective device per NFPA 70; secondary either approved UPS per NFPA 111 or batteries dedicated to the FACP"
        detail: "Owner ruling 13.10.2026. Table 8.1 item 15 POWER SUPPLIES, p.461: (i) at least two power supply sources shall be provided for any Fire Detection and Alarm System, one primary and one secondary, fully supervised by FACP for failure, loss of power, trouble, short circuit conditions; (ii) each power supply shall be of adequate capacity for the full functionality of the System; (iii) Primary Supply shall be directly from the Electric Utility Supply; (iv) the supply from Electric Utility branch shall be direct to Fire Alarm System only and shall not serve any other loads; (v) the system circuit disconnecting means shall be permanently identified as to its purpose, shall be secured and shall be accessible only to authorized personnel; (vi) such disconnecting switch shall be clearly marked 'FIRE ALARM/DO NOT DISCONNECT'; (vii) all wiring from Electric Utility branch to Fire Alarm Control Panel shall be 2 hour fire rated and protected from mechanical damages; (viii) an overcurrent protective device shall be provided in accordance with NFPA 70; (ix) the secondary means of Power Supply shall be permitted to be either approved UPS in accordance with NFPA 111 or Batteries dedicated to the FACP; (x) operation on secondary power shall not affect the required performance of a system or supervising station facility, including alarm, supervisory, and trouble signals and indications."
  # Item 15 (xiii)-(xv) added by owner ruling 13.10.2026 (card "Add all", Phase 5 G6).
  - id: fa_general_power_supply
    when: {}
    systems:
      - name: "FA Secondary Power Supply and Battery Calculations"
        code_ref: "Ch 8, Table 8.1 item 15 (xi)-(xv)"
        page_ref: "p.462"
        spec: "Secondary supply: minimum 24 hours, then 30 minutes in fire or emergency condition at maximum connected load; battery calculations with a minimum 20 percent safety margin; batteries marked with the month and year of manufacture; storage batteries per Article 480 of NFPA 70; recharge within 48 hours after a single discharge cycle"
        detail: "Table 8.1 item 15, p.462: (xi) the secondary power supply capacity for supervising station facilities and equipment shall be capable of supporting operations for a minimum of 24 hours and then shall be capable of operating the system during a fire or other emergency condition for a period of 30 minutes at maximum connected load; (xii) battery calculations shall include a minimum 20 percent safety margin above the calculated amp-hour capacity required; (xiii) batteries shall be marked with the month and year of manufacture using the month/year format; (xiv) storage batteries shall comply with the requirements of Article 480 of NFPA 70; (xv) battery charging equipment shall be provided to recharge batteries within 48 hours after fully charged batteries have been subject to a single discharge cycle. Item 15 (i)-(x), p.461: see 'FA Power Supplies - Primary and Secondary Sources'."
  - id: fa_general_facp_addressable
    when: {}
    systems:
      - name: "Addressable Fire Detection & Alarm Control Panel (FACP)"
        code_ref: "Ch 8, #4.1.1 / Table 8.1 item 1 (i)-(ii); #6.2.1"
        page_ref: "p.455; p.514"
        spec: "Only listed and approved ADDRESSABLE Fire Detection & Alarm System permitted in new constructions. Conventional type NOT acceptable except for existing buildings."
        detail: "Table 8.1 item 1, p.455: (i) only listed and approved addressable Fire Detection and Alarm System shall be provided in all new constructions; conventional type Fire detection Systems are not acceptable, unless it is existing; (ii) all Fire Detection and Alarm System equipment, material, accessories, wiring shall be Civil Defence approved and listed as per Section 7. #6.2.1, p.514: installation of Fire Detection and Alarm Systems shall be carried out only by Civil Defence approved and licensed contractors. General contractors, MEP Contractors, Electrical contractors, BMS Contractors, Home automation Contractors shall not be allowed to install Fire Detection and Alarm Systems."
  - id: fa_general_civil_defence_interface
    when: {}
    systems:
      - name: "FACP Signals to Civil Defence (Smart Monitoring System)"
        code_ref: "Ch 16, Table 16.1 item 1"
        page_ref: "p.1126"
        spec: "'Fire Alarm' and 'Fault' signals from the FACP annunciated to Civil Defence"
        detail: "Ch 16 Table 16.1 item 1 SIGNALS FROM BUILDING, p.1126: as a minimum, the 'Fire Alarm' signal from the Fire Detection and Alarm Control Panel (FACP) (1. Alarms, i.a) and the 'Fault' signal from the FACP (2. Faults, i.a) shall be annunciated to Civil Defence through the Smart Monitoring System. Table 16.1 lists Alarm and Fault signals; it does not list supervisory signals."
  - id: fa_general_mcp_spacing
    when: {}
    systems:
      - name: "Manual Call Point (MCP) Spacing & Mounting"
        code_ref: "Ch 8, Table 8.1 item 4 (v)-(x); #4.10 / Table 8.10 (ix)-(xi)"
        page_ref: "p.456 (Table 8.1 item 4); p.498 (Section 4.10 / Table 8.10)"
        spec: "Travel distance to nearest MCP not more than 61 m, reduced to 25 m and 16 m in limited mobility areas and where processes of the area result in a likelihood of rapid fire development; MCP within 1.5 m from exit door opening; both sides of grouped openings over 12.2 m wide; mounting height 1.2 m AFFL"
        detail: "Table 8.1 item 4, p.456: (v) MCPs shall be installed on all escape routes and in particular beside stairwell entrances and all exits to open air; (vi) conspicuous, unobstructed and accessible; (vii) travel distance should not be more than 61 m to reach the nearest manual call point; (viii) these figures to be reduced to 25 m and 16 m in limited mobility areas, and where processes of the area result in a likelihood of rapid fire development (the code does not say which of 25 m or 16 m applies to which case); (ix) within 1.5 m from exit door opening; (x) generally at a height of 1.2 m above floor level. Table 8.10, p.498: (ix) within 1.5 m of each exit doorway on each floor; (x) maximum travel distance to the nearest fire alarm box 61 m, measured horizontally on the same floor; (xi) manual fire alarm boxes shall be mounted on both sides of grouped openings over 12.2 m in width, and within 1.5 m of each side of the grouped opening. All MCPs within an occupancy shall be of similar design (item 4 (i))."
  - id: fa_general_mcp_reduced_travel
    # Table 8.1 item 4 (viii): the 61 m figure is reduced in limited mobility
    # areas and where processes give rapid fire development. Shown as its own
    # line for the occupancies where such areas are expected.
    when:
      any_of:
        - occupancy_in: [healthcare_a, healthcare_b, healthcare_c,
                         detention_a, detention_b, detention_c]
        - hazard_class_in: [HH]
    systems:
      - name: "MCP Travel Distance Reduced to 25 m and 16 m (limited mobility / rapid fire development)"
        required: conditional
        code_ref: "Ch 8, Table 8.1 item 4 (vii)-(viii)"
        page_ref: "p.456"
        spec: "25 m and 16 m in place of 61 m"
        detail: "Table 8.1 item 4 (viii), p.456: 'These figures to be reduced to 25m and 16m in limited mobility areas, and where processes of the area result in a likelihood of rapid fire development.' Applies to the areas of this building that are limited mobility areas or have processes with a likelihood of rapid fire development. The code does not say which of 25 m or 16 m applies to which case; confirm with Civil Defence."
  - id: fa_general_gateway_interface
    when: {}
    systems:
      - name: "Listed Barrier Gateway between FACP and Other Systems"
        code_ref: "Ch 8, Table 8.1 item 14.3 (v), (ix)"
        page_ref: "p.459"
        spec: "Listed barrier gateway required at each FACP / group of control units"
        detail: "Table 8.1 item 14.3 (v), p.459: a listed barrier gateway, integral with or attached to each control unit or group of control units, as appropriate, shall be provided to prevent the other systems from interfering with or controlling the fire alarm system. Item 14.3 (ix): all non-fire alarm components shall be listed for fire alarm use or for fire conditions."

  # Audit 28.10.2026, CH8-19: Table 8.1 items not encoded before, as general lines with
  # the values as printed (p.456-466).
  - id: fa_general_mcp_actuation
    when: {}
    systems:
      - name: "Manual Call Point to Alarm Signal - not more than 10 s"
        code_ref: "Ch 8, Table 8.1 item 4 (ii)"
        page_ref: "p.456"
        spec: "Time from the operation of call point to the actuation of alarm signal not more than 10 seconds"
        detail: "Table 8.1 item 4 (ii), p.456: 'Time from the operation of call point to the actuation of alarm signal shall not exceed (10) seconds.'"
  - id: fa_general_stairs_voice
    when: {}
    systems:
      - name: "Stairs - Voice Speakers; Sounders Not Required"
        code_ref: "Ch 8, Table 8.1 item 6 (iii)-(iv)"
        page_ref: "p.456"
        spec: "Voice speakers with clear speech audibility in stairs; sounders not required in stairs"
        detail: "Table 8.1 item 6 STAIRS, p.456: (iii) 'Stairs shall be provided with Voice speakers with clear speech audibility.' (iv) 'Sounders shall not be required in stairs.'"
  - id: fa_general_hvac_diffusers
    when: {}
    systems:
      - name: "Detectors Not Less Than 1 m from Supply / Return Diffusers"
        code_ref: "Ch 8, Table 8.1 item 9 (i)"
        page_ref: "p.457"
        spec: "In spaces served by air-handling systems, detectors not less than 1 m from supply or return diffusers"
        detail: "Table 8.1 item 9 HVAC, p.457: (i) in spaces served by air-handling systems, detectors shall not be located lesser than 1m from supply or return diffusers, where airflow prevents operation of the detectors."
  - id: fa_general_facp_capacity_location
    when: {}
    systems:
      - name: "FACP Spare Capacity 20% and Attended Location"
        code_ref: "Ch 8, Table 8.1 item 14.1 (v)-(viii)"
        page_ref: "p.458"
        spec: "Spare capacity to add 20% more detectors; FACP at a location attended at all times, visible and accessible; not in an unattended room, service room or mechanical room"
        detail: "Table 8.1 item 14.1, p.458: (v) generally FACP should have spare capacity to add 20% more detectors with additional wiring and interface modules without adding additional circuit boards (modules); (vi) FACP shall be installed in a location which is attended by facility management or designated personnel at all times, such as reception areas, security guard houses, Emergency command centres, Facility monitoring rooms, nurse stations at hospitals etc.; (vii) FACP shall be located in a visible and accessible location; (viii) FACP shall not be installed in an unattended room, service rooms, mechanical rooms."
  - id: fa_general_actuation_time
    when: {}
    systems:
      - name: "Actuation within 10 s; Trouble Signal within 200 s"
        code_ref: "Ch 8, Table 8.1 item 14.3 (i)-(iv)"
        page_ref: "p.459"
        spec: "Notification / fire safety functions within 10 s of an initiating device; open or ground trouble signal within 200 s; critical communications within 10 s, failure indicated within 200 s"
        detail: "Table 8.1 item 14.3 ACTUATION TIME, p.459: (i) actuation of alarm notification devices or emergency voice communications, fire safety functions, and annunciation at the protected premises shall occur within 10 seconds after the activation of an initiating device; (ii) an open or ground condition of any fire alarm circuits shall result in the annunciation of a trouble signal at the protected premise within 200 seconds; (iii) system bandwidth is monitored to confirm that all communications between equipment that is critical to the operation of the fire alarm system or fire safety functions take place within 10 seconds; failure shall be indicated within 200 seconds; (iv) failure of any equipment that is critical to the operation of the fire alarm system or fire safety functions is indicated at the master fire alarm control unit within 200 seconds."
  - id: fa_general_notification_each_floor
    when: {}
    systems:
      - name: "Notification on Each Floor / Notification Zones"
        code_ref: "Ch 8, Table 8.1 item 14.12 (i); item 18 (i)"
        page_ref: "p.461; p.466"
        spec: "One or more notification zones on each floor of the building"
        detail: "Table 8.1 item 14.12 (i), p.461: fire alarm and mass notification systems provided for evacuation or relocation of occupants shall have one or more notification on each floor of the building. Item 18 NOTIFICATION ZONES (i), p.466: the same systems shall have one or more notification zones on each floor of the building."
  - id: fa_general_visible_performance
    when: {}
    systems:
      - name: "Visible Notification Devices - Flash Rate, Pulse, Intensity, Low-Ceiling Mounting"
        code_ref: "Ch 8, Table 8.1 item 17 (ii)-(v), (ix)"
        page_ref: "p.463"
        spec: "Flash rate not more than 2 flashes per second (2 Hz) nor less than one flash every second (1 Hz); maximum pulse duration 0.2 s with a maximum duty cycle of 40%; evacuation signalling lights clear or nominal white, not more than 1000 cd (effective intensity); where low ceilings do not permit 2 m, wall-mounted within 150 mm of the ceiling"
        detail: "Table 8.1 item 17 VISUAL NOTIFICATION DEVICES, p.463: (ii) the flash rate shall not exceed two flashes per second (2 Hz) nor be less than one flash every second (1 Hz) throughout the listed voltage range of the appliance; (iii) a maximum pulse duration shall be 0.2 second with a maximum duty cycle of 40%; (iv) the pulse duration shall be defined as the time interval between initial and final points of 10% of maximum signal; (v) lights used for fire alarm signalling only or to signal the intent for complete evacuation shall be clear or nominal white and shall not exceed 1000 cd (effective intensity); (ix) where low ceiling heights do not permit wall mounting at a minimum of 2 m, wall mounted visible appliances shall be mounted within 150 mm of the ceiling."

  # Ruling R7 (12.10.2026): the height-driven items of Table 8.13 items 1-2 apply
  # to every building of 23 m or more, whatever its occupancy row; the alarm
  # protocol comes from one row only (the occupancy row where Table 8.13 has one).
  - id: fa_general_highrise_height_items
    when: {height_m_gte: 23}
    systems:
      - name: "Sub-FACPs / Annunciators every 45 m"
        code_ref: "Ch 8, #5.1 / Table 8.13 items 1-2 (iv)"
        page_ref: "p.502"
        spec: "At every 45 m height of the building, networked to main FACP"
        detail: "Additional Sub FACPs or annunciators complete with all functional features at the elevator lobby of the floor or the mechanical floor at every 45 m height of the building, connected to the main FACP in a network. Applied to every occupancy of 23 m or more (ruling R7, 12.10.2026)."
      - name: "Highrise Main FACP - Redundancy and Hot-Swap"
        code_ref: "Ch 8, #3 / Table 8.1 item 14.1 (ii)"
        page_ref: "p.458"
        spec: "High performance and stability, tested for redundancy (CPU, I/O cards, display); hot-swap"
        detail: "The Fire Alarm Main Control Panel in every highrise building shall have high performance and stability, tested for redundancy (CPU, I/O cards, display etc. with redundancy features to keep operating if any of these fails), and hot-swap features to repair and replace these components without turning off the main power supply and without compromising the panel's performance."
  - id: fa_general_highrise_protocol_note
    when:
      height_m_gte: 23
      occupancy_in: [hotel_a, hotel_b, hotel_c,
                     healthcare_a, healthcare_b, healthcare_c,
                     detention_a, detention_b, detention_c,
                     education_a, education_b, education_c,
                     mall_covered, mall_mixed]
    systems:
      - name: "Highrise 5-Floor Phased Evacuation and PAS 15/180/240 s - not applied"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13 items 1-2 (v)-(vii)"
        page_ref: "p.502"
        detail: "Not applied: this occupancy has its own Table 8.13 row and its evacuation protocol governs, so the building has one alarm protocol (ruling R7, 12.10.2026). The highrise height items (Sub-FACP every 45 m, FACP redundancy) still apply."
  # Audit 28.10.2026, CH8-08: warehouses and parkings of 23 m or more also leave the
  # highrise rows (fa_highrise / fa_super_highrise exclude them); the R7 note names
  # their own protocol.
  - id: fa_general_highrise_protocol_note_storage
    when:
      height_m_gte: 23
      occupancy: storage_industrial
      has_robotic_parking_is: false
    systems:
      - name: "Highrise 5-Floor Phased Evacuation and PAS 15/180/240 s - not applied"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13 items 1-2 (v)-(vii); items 19-20 (vii)"
        page_ref: "p.502; p.506"
        detail: "Not applied: Table 8.13 items 19-20 STORAGE AND WAREHOUSE / INDUSTRIAL BUILDINGS (p.506) is this building's row and its protocol governs: (vii) 'General Fire Alarm shall be the evacuation alarm.' (item 21 COLD STORAGE prints no protocol and carries items 19-20 (vii), owner ruling 12.10.2026, Ch8 Q2). The building has one alarm protocol (ruling R7, 12.10.2026, applied to storage by audit CH8-08, 28.10.2026). The highrise height items (Sub-FACP every 45 m, FACP redundancy) still apply."
  - id: fa_general_highrise_protocol_note_robotic_storage
    when:
      height_m_gte: 23
      occupancy: storage_industrial
      has_robotic_parking_is: true
    systems:
      - name: "Evacuation Alarm Protocol - Table 8.13 item 23 prints none (open question)"
        required: conditional
        code_ref: "Ch 8, #5.1 / Table 8.13 items 1-2 (v)-(vii); item 23"
        page_ref: "p.502; p.506"
        detail: "Open question, needs an owner ruling: Table 8.13 item 23 ROBOTIC OR MECHANICAL PARKING OR ROBOTIC LOGISTICS (p.506) prints detection items (i)-(ii) only and no evacuation protocol, and the highrise rows (items 1-2 (v)-(vii), p.502: 5-floor phased evacuation, PAS 15 s / 180 s / 240 s) are not applied to this building (ruling R7, 12.10.2026). Confirm the protocol with Civil Defence. The highrise height items (Sub-FACP every 45 m, FACP redundancy) still apply."
  - id: fa_general_highrise_protocol_note_parking
    when:
      height_m_gte: 23
      occupancy_in: [parking_enclosed, parking_open]
    systems:
      - name: "Highrise 5-Floor Phased Evacuation and PAS 15/180/240 s - not applied"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13 items 1-2 (v)-(vii); item 22 (vii)-(viii)"
        page_ref: "p.502; p.506"
        detail: "Not applied: Table 8.13 item 22 ENCLOSED PARKING (p.506; open parking by analogy, ruling R10) is this building's row and its protocol governs: item 22 (vii)-(viii), the general fire alarm does not trigger the evacuation alarm (owner ruling 12.10.2026, Ch8 Q6) and the 120 s PAS then evacuation throughout. The building has one alarm protocol (ruling R7, 12.10.2026, applied to parking by audit CH8-08, 28.10.2026). The highrise height items (Sub-FACP every 45 m, FACP redundancy) still apply."

branches:
  - id: fa_super_highrise
    # Super-highrise (> 90 m) per Ch 3 Definitions. Specific-occupancy branches
    # excluded (mall, education, healthcare, detention, parking, villa,
    # storage_industrial, motor_fuel_dispensing, hotel). Ruling R7 (12.10.2026):
    # those rows keep their own evacuation protocol; the height items (Sub-FACP
    # every 45 m, FACP redundancy) come from fa_general_highrise_height_items.
    match:
      height_m_gt: 90
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing,
                      mall_covered, mall_mixed,
                      parking_enclosed, parking_open,
                      storage_industrial,
                      detention_a, detention_b, detention_c,
                      healthcare_a, healthcare_b, healthcare_c,
                      education_a, education_b, education_c,
                      hotel_a, hotel_b, hotel_c, infrastructure]
    section: "Ch 8, #5.1 / Table 8.13 item 1"
    page: "p.502"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
        detail: "Throughout super-highrise (>90 m). All addressable detectors monitored by main FACP."
      - name: "5-Floor Phased Evacuation Alarm"
        spec: "Fire floor + 3 floors above + 1 floor below"
        detail: "Activation triggers evacuation alarm only on fire floor + 3 above + 1 below. General alarm shall NOT trigger entire-building evacuation. Voice / PA system used for occupant communication."
      - name: "Positive Alarm Sequence (PAS)"
        spec: "15 s / 180 s: fire floor + all floors above + 1 floor below; 240 s: entire building"
        detail: "Per Table 8.1.14.2 (Table 8.13 items 1-2 (vi)-(vii), p.502). If the alarm is not silenced by authorized personnel or the FACP is not reset within 15 s, or multiple alarms are triggered from other initiating devices within 180 s: evacuation alarm on the entire fire floor, entire floors above the fire floor and 1 floor below the fire floor. If the alarm is not silenced or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 240 s: evacuation alarm in the entire building. Security or facility management personnel or an authorized person intimate the occupants on the Voice Alarm / Public Address System."
      - name: "Main FACP at Continuously Attended Location"
        detail: "Emergency Command Centre / Reception / Security guard house per building fire strategy."
      - name: "System Interfaces"
        detail: "Table 8.13 items 1-2 (ii), p.502: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_highrise
    # Highrise = 23 m or more up to 90 m (Ch 1 #1.7.41, p.45 "between 23 Meters to 90
    # meters"; ruling R1: exactly 23.0 m is highrise; FAQ Q3, p.1273).
    # Table 8.13 items 1-2 use the defined terms and print no height numbers.
    # Specific-occupancy branches (mall, education, healthcare, detention, parking,
    # villa, storage_industrial, motor_fuel_dispensing, hotel) are excluded so they
    # pick their dedicated Table 8.13 row and its evacuation protocol (ruling R7,
    # 12.10.2026); the height items come from fa_general_highrise_height_items.
    match:
      height_m_gte: 23
      height_m_lte: 90
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing,
                      mall_covered, mall_mixed,
                      parking_enclosed, parking_open,
                      storage_industrial,
                      detention_a, detention_b, detention_c,
                      healthcare_a, healthcare_b, healthcare_c,
                      education_a, education_b, education_c,
                      hotel_a, hotel_b, hotel_c, infrastructure]
    section: "Ch 8, #5.1 / Table 8.13 item 2"
    page: "p.502"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
        detail: "Highrise = 23 m or more up to 90 m (Ch 1 #1.7.41, p.45: 'between 23 Meters to 90 meters'; ruling R1, 12.10.2026: exactly 23.0 m is highrise; FAQ Q3, p.1273). Table 8.13 item 2 applies the highrise row to these buildings."
      - name: "5-Floor Phased Evacuation Alarm"
        spec: "Fire floor + 3 above + 1 below"
      - name: "Positive Alarm Sequence (PAS) - 15/180/240 s"
        spec: "Per Table 8.1.14.2 - 15 s / 180 s: fire floor + all floors above + 1 floor below; 240 s: entire building"
        detail: "Table 8.13 items 1-2 (vi)-(vii), p.502. If the alarm is not silenced by authorized personnel or the FACP is not reset within 15 s, or multiple alarms are triggered from other initiating devices within 180 s: evacuation alarm on the entire fire floor, entire floors above the fire floor and 1 floor below the fire floor. If the alarm is not silenced or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 240 s: evacuation alarm in the entire building."
      - name: "Main FACP at Continuously Attended Location"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 items 1-2 (ii), p.502: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_midrise_lowrise
    # Midrise / Lowrise = up to 23 m (Ch 1 #1.7.39-#1.7.40, p.44). Table 8.13
    # items 3-4 use the defined terms; above 23 m the building takes fa_highrise.
    # Audit 28.10.2026, CH8-16: items 9-13 (p.503) are ASSEMBLY, BUSINESS, RESIDENTIAL,
    # DAY CARE, MERCANTILE only (open mall = item 13, ruling R10); every other occupancy
    # without its own row takes fa_midrise_lowrise_height_only (items 3-4).
    match:
      height_m_lt: 23
      occupancy_in: [assembly_a, assembly_b, assembly_c, business,
                     residential, labour_accommodation, staff_accommodation, hostel,
                     daycare_a, daycare_b, daycare_c,
                     mercantile_a, mercantile_b, mercantile_c, mall_open]
    section: "Ch 8, #5.1 / Table 8.13 items 3-4 + 9-13"
    page: "p.503"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
        detail: "Throughout midrise / lowrise (midrise / lowrise = below 23 m, ruling R1; Ch 1 #1.7.39-#1.7.40, p.44). Detectors at all rooms, halls, storage areas, basements (unless sprinklered), attics, lofts, enclosed usable spaces."
      - name: "Single Main FACP"
        detail: "At Emergency Command Centre / Reception / Security guard house per fire strategy."
      - name: "Positive Alarm Sequence (PAS) - 180 s"
        detail: "Per Table 8.1.14.2 (Table 8.13 items 3-4 (iv) and items 9-13 (iv), p.503): if the fire alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 180 s, evacuation alarm is triggered throughout the entire building."
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 items 3-4 (ii) and items 9-13 (ii), p.503: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_midrise_lowrise_height_only
    # Audit 28.10.2026, CH8-16: occupancies with no Table 8.13 occupancy row (animal
    # housing, mixed and multiple, high / low depth underground) take the height rows
    # items 3-4 (MIDRISE / LOWRISE BUILDINGS, p.503) only.
    match:
      height_m_lt: 23
      occupancy_not: [villa_private, villa_commercial, motor_fuel_dispensing,
                      mall_covered, mall_mixed,
                      parking_enclosed, parking_open,
                      storage_industrial,
                      detention_a, detention_b, detention_c,
                      healthcare_a, healthcare_b, healthcare_c,
                      education_a, education_b, education_c,
                      hotel_a, hotel_b, hotel_c, infrastructure,
                      assembly_a, assembly_b, assembly_c, business,
                      residential, labour_accommodation, staff_accommodation, hostel,
                      daycare_a, daycare_b, daycare_c,
                      mercantile_a, mercantile_b, mercantile_c, mall_open]
    section: "Ch 8, #5.1 / Table 8.13 items 3-4"
    page: "p.503"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
        detail: "Table 8.13 items 3-4 (i), p.503: Smoke Detection and Alarm System shall be provided throughout the building as per Section 4.3 (midrise / lowrise = below 23 m, ruling R1; Ch 1 #1.7.39-#1.7.40, p.44). Table 8.13 prints no occupancy row for this occupancy; items 9-13 are assembly, business, residential, day care and mercantile only."
      - name: "Single Main FACP"
        detail: "Table 8.13 items 3-4 (iii), p.503: Main FACP shall be located at the continuously attended location such as Emergency Command Centre or Reception or Security guard house, as per the building fire strategy."
      - name: "Positive Alarm Sequence (PAS) - 180 s"
        detail: "Per Table 8.1.14.2 (Table 8.13 items 3-4 (iv), p.503): if the Fire Detection Alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 180 s, the entire building shall have evacuation alarm."
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 items 3-4 (ii), p.503: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_infrastructure
    # Audit 28.10.2026, CH8-03: infrastructure is a yard-hydrant network, not a
    # building; Table 8.13 prints no row for it. No building fire alarm is printed
    # (the engine also skips the Table 8.1 / 8.14 / 8.15 lines for it).
    match: {occupancy: infrastructure}
    section: "Ch 8, #5.1 / Table 8.13 (no infrastructure row)"
    page: "p.502-508"
    systems:
      - name: "Fire Detection and Alarm - any building on the site takes its own Table 8.13 occupancy row"
        required: conditional
        code_ref: "Ch 8, #5.1 / Table 8.13"
        page_ref: "p.502-508"
        detail: "Table 8.13 (p.502-508) prints no row for a yard hydrant network / infrastructure (Ch 9 #4.10.1, p.723, Table 9.26), so no building fire detection and alarm system is printed for it. Any building on the site (pump house, control building) is a building in its own right and takes its own Table 8.13 occupancy row, with its Table 8.14 rooms and Table 8.15 equipment, evaluated as that building."

  - id: fa_temporary_tent_site_office
    # Audit 28.10.2026, CH8-07: #4.5.6 (p.712) gives tents, marquees, site offices and
    # site dwellings their own Table 9.21.f rows. Table 8.14 prints item 32 TEMPORARY
    # TENTS (battery operated smoke detectors) and item 33 TEMPORARY MODULAR HOUSES /
    # OFFICES (smoke detector, Section 4.3), p.511. For a temporary tent (row A) and a site
    # office (rows D / E) those items govern and the Table 8.13 addressable building
    # system is not printed (the engine also skips the Table 8.1 lines). Permanent tents,
    # desert camps (rows B / C) and row F buildings keep their occupancy row.
    match:
      tent_marquee_kind_in: [temporary, site_office_short, site_office_long]
    suppresses: [fa_super_highrise, fa_highrise, fa_midrise_lowrise, fa_midrise_lowrise_height_only,
                 fa_mall, fa_education, fa_healthcare, fa_detention, fa_hotel,
                 fa_nursery_plants, fa_cold_storage, fa_robotic_parking,
                 fa_storage_industrial, fa_storage_yard_tank,
                 fa_storage_single_tenant_facp, fa_storage_multi_tenant_facp,
                 fa_parking_enclosed, fa_parking_enclosed_robotic,
                 fa_mall_open, fa_parking_open, fa_parking_open_robotic,
                 fa_villa_converted, fa_villa_private, fa_villa_commercial, fa_motor_fuel,
                 fa_infrastructure]
    section: "Ch 8, #5.2 / Table 8.14 items 32-33 (temporary tent / site office)"
    page: "p.511"
    systems:
      - name: "Table 8.13 Building Fire Detection and Alarm System - not applied (temporary tent / site office)"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13; #5.2 / Table 8.14 items 32-33"
        page_ref: "p.502-508; p.511"
        detail: "The building is a temporary tent (Table 9.21.f row A) or a site office (rows D / E), p.712 (#4.5.6: tents, marquees, site offices, site dwellings take Table 9.21.f). Table 8.14 prints item 32 TEMPORARY TENTS: 'Battery Operated Smoke Detectors, listed and approved by Civil Defence shall be provided' and item 33 TEMPORARY MODULAR HOUSES/OFFICES: 'Smoke Detector shall be provided as per Section 4.3' (p.511); a site office is read as a temporary modular office. Those items govern, so the Table 8.13 addressable building system and the Table 8.1 system lines are not printed (Table 8.1 item 5 (i), p.456, asks for an automatic addressable system in every building and enclosed structure; the specific Table 8.14 row is applied, audit CH8-07, 28.10.2026)."

  - id: fa_mall
    # Item 24 is headed "COVERED MALL" (p.507). An open mall has no Table 8.13 row
    # and takes item 13 MERCANTILE through the height rows (ruling R10, 12.10.2026).
    match: {occupancy_in: [mall_covered, mall_mixed]}
    section: "Ch 8, #5.1 / Table 8.13 item 24"
    page: "p.507"
    systems:
      - name: "Smoke Detection and Alarm System (entire mall)"
        spec: "Addressable, per Section 4.3"
      - name: "Networked Sub-FACPs (per fire-evacuation zone)"
        detail: "Sub-FACPs distributed strategically throughout the mall to coincide with fire-evacuation zoning per mall fire strategy. Individual tenant spaces NOT required to have own FACPs."
      - name: "Annunciator Panels at Mall Information Desks"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 24 (ii), p.507: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "Main FACP at Continuously Attended Location"
        detail: "Table 8.13 item 24 (v), p.507: Emergency Command Centre or Mall management office or Security guard house, as per the building fire strategy."
      - name: "Positive Alarm Sequence (PAS) - 180 s per tenant"
        detail: "Per Table 8.1.14.2 (Table 8.13 item 24 (viii)-(x), p.507): a general fire alarm from a single tenant space triggers the evacuation alarm only in that tenant space, not the mall evacuation alarm nor the fire zone evacuation alarm. If the single tenant evacuation alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 180 s, the particular fire zone evacuation alarm is triggered."
      - name: "Visual Display Notification with Messages + Voice Speakers + PA (permitted)"
        required: conditional
        detail: "Permitted, not required: Table 8.13 item 24 (xi), p.507: 'Visual Display Notification with messages shall be permitted along with Voice Speakers and Public address Systems.'"

  - id: fa_education
    match: {occupancy_in: [education_a, education_b, education_c]}
    section: "Ch 8, #5.1 / Table 8.13 item 15"
    page: "p.504"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
      - name: "Heat Detection - Auditoriums / Gymnasiums / Cafeteria / Laboratories / Indoor Pools"
        spec: "Per Section 4.6"
        detail: "These spaces have ambient conditions (steam, dust, humidity) that defeat smoke detection - heat detection used instead."
      - name: "Annunciator at Principal's Office"
      - name: "Total Evacuation Alarm Initiating Switch (Principal's office)"
        detail: "In addition to emergency-evacuation PA system."
      - name: "Distinct Student Recall Signal"
        detail: "Distinct from fire alarm or any other signal."
      - name: "Manual Call Points Enclosed with Listed Cover Box (permitted)"
        required: conditional
        detail: "Permitted, not required: Table 8.13 item 15 (ix), p.504: 'Manual Call points shall be permitted to be enclosed with listed cover box.'"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 15 (iii), p.504: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "Positive Alarm Sequence (PAS)"
      - name: "Main FACP at Continuously Attended Location"

  - id: fa_healthcare
    # Table 8.13 item 16 "HEALTHCARE BUILDINGS" is a single undivided row — code
    # provides no lighter FA tier for clinics / ambulatory, so all healthcare
    # sub-types get the full hospital-style detection + nurse-station protocol.
    match: {occupancy_in: [healthcare_a, healthcare_b, healthcare_c]}
    section: "Ch 8, #5.1 / Table 8.13 item 16"
    page: "p.504"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
      - name: "Annunciators at Nurse Stations (strategic locations)"
      - name: "Nurse-Station Evacuation Push Buttons"
        spec: "Within 61 m of every nurse station"
        detail: "Activation triggers evacuation alarm + interconnected systems (elevator recall, HVAC shutdown, door release) per fire strategy."
      - name: "Visual Notification Devices in Critical Care in lieu of audible (permitted)"
        required: conditional
        detail: "Permitted, not required: Table 8.13 item 16 (x), p.504: 'In critical care areas, such as operation theatres, ICU's, in lieu of audible notification devices, visual notification devices shall be permitted.'"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 16 (ii), p.504: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "General Fire Alarm Does NOT Trigger Evacuation"
        detail: "Default healthcare protocol: alarm investigated by staff first; evacuation only on staff push-button or PAS expiry."
      - name: "Fire Alarm Zoning Coincides with Smoke Compartments"
      - name: "Positive Alarm Sequence (PAS)"
      - name: "Main FACP at Continuously Attended Location"

  - id: fa_detention
    match: {occupancy_in: [detention_a, detention_b, detention_c]}
    section: "Ch 8, #5.1 / Table 8.13 item 17"
    page: "p.505"
    systems:
      - name: "Aspiration Type Air Sampling (Inmate Cells / Sleeping Areas)"
        spec: "Per Section 4.5"
        detail: "Aspiration system in cells / sleeping areas - vandal-resistant. Detectors permitted in exhaust ducts and behind grills of cells."
      - name: "Smoke Detection throughout (all areas other than prison cells and inmates areas)"
        spec: "Per Section 4.3"
        detail: "Table 8.13 item 17 (ii), p.505: Smoke Detection and Alarm System shall be provided throughout, Office, maintenance, Day rooms, and Activity rooms monitored by continuously by staff and areas other than prison cells and inmates areas of the building as per Section 4.3."
      - name: "Heat Detection - Auditoriums / Gymnasiums / Cafeteria / Indoor Pools"
        spec: "Per Section 4.6"
      - name: "Lockable Manual Call Points (permitted)"
        required: conditional
        detail: "Permitted, not required: Table 8.13 item 17 (iv), p.505: manual fire alarm boxes shall be permitted to be locked, provided that staff is present within the area when it is occupied and staff has keys readily available to unlock the boxes."
      - name: "System Interfaces (pump, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 17 (vi), p.505: Fire Pump, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "General Fire Alarm Does NOT Trigger Evacuation"
        detail: "Table 8.13 item 17 (ix), p.505: General Fire Alarm shall not trigger evacuation alarm and interconnected systems such as elevator recall, HVAC Shutdown, door release operations etc. in the facility."
      - name: "Supervisor / Staff Evacuation Push Buttons"
        detail: "Table 8.13 item 17 (x) and (xii), p.505: supervisor / staff areas shall be provided with an evacuation alarm initiating push button or switch for evacuation alarm and Civil Defence notification; activation of the evacuation push button shall trigger the evacuation alarm and interconnected systems such as elevator recall, HVAC Shutdown, door release operations etc. as per building fire strategy."
      - name: "Positive Alarm Sequence (PAS)"
      - name: "Main FACP at Continuously Attended Location (Supervisor / Security)"
        detail: "Table 8.13 item 17 (viii), p.505: Emergency Command Centre or Supervisor or Security guard house, as per the building fire strategy."

  - id: fa_hotel
    match: {occupancy_in: [hotel_a, hotel_b, hotel_c]}
    section: "Ch 8, #5.1 / Table 8.13 item 18"
    page: "p.505"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
      - name: "Annunciator at Reception Desk"
      - name: "Total Evacuation Alarm Initiating Switch (Reception Desk)"
      - name: "General Fire Alarm Does NOT Trigger Evacuation"
        detail: "Default hotel protocol: investigate first."
      - name: "Positive Alarm Sequence (PAS) - 120 s"
        detail: "Per Table 8.1.14.2 (Table 8.13 item 18 (viii)-(ix), p.505): if the alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 120 s, evacuation alarm is triggered throughout."
      - name: "Main FACP at Continuously Attended Location"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 18 (ii), p.505: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_nursery_plants
    # Plant / vegetation nursery exemption (Table 8.13 item 28, p.508).
    # fa_storage_industrial excludes this case (all matching branches are unioned).
    match: {occupancy: storage_industrial, is_plant_nursery_is: true}
    section: "Ch 8, #5.1 / Table 8.13 item 28"
    page: "p.508"
    systems:
      - name: "Fire Detection and Alarm System NOT REQUIRED (Plant / Vegetation Nursery)"
        required: not_required
        detail: "Per Table 8.13 item 28 (p.508): 'Fire Detection and Alarm System shall not be required' for plant and vegetation nurseries. With no FA system required, the report prints no Table 8.1 system lines (owner ruling 12.10.2026, follow-up F1) and, since row 28 lists no Table 8.14 / 8.15 item, no auxiliary room or equipment lines, even for rooms ticked in the inputs (Ch8 Q4)."

  - id: fa_cold_storage
    # Cold-storage warehouse (Table 8.13 item 21, p.506).
    # fa_storage_industrial excludes this case (all matching branches are unioned).
    match: {occupancy: storage_industrial, is_cold_storage_is: true}
    section: "Ch 8, #5.1 / Table 8.13 item 21"
    page: "p.506"
    systems:
      - name: "Aspiration Air Sampling (Freezer / Cold Room)"
        spec: "Per Section 4.5"
        detail: "Aspiration Type Air Sampling Smoke Detection System shall be provided inside freezer and cold room areas - conventional smoke detectors do not reliably operate at sub-zero temperatures."
      - name: "Smoke Detection (Office / Maintenance / Store Rooms)"
        spec: "Addressable, per Section 4.3"
        detail: "Smoke Detection and Alarm System throughout office, maintenance and store room areas of the cold-storage building."
      - name: "External Audio-Visual Notification Devices"
        spec: "Visible from common entrance"
        code_ref: "Ch 8, #5.1 / Table 8.13 items 19-20 (vi)"
        page_ref: "p.506"
        detail: "Not printed in Table 8.13 item 21 COLD STORAGE (p.506); carried from items 19-20 STORAGE AND WAREHOUSE (vi): each warehouse shall be provided with audio visual notification devices outside such that notification devices are visible from the common entrance. Carried from items 19-20 by owner ruling 12.10.2026, Ch8 Q2 (cold storage lines)."
      - name: "General Fire Alarm = Evacuation Alarm"
        code_ref: "Ch 8, #5.1 / Table 8.13 items 19-20 (vii)"
        page_ref: "p.506"
        detail: "Not printed in Table 8.13 item 21 COLD STORAGE (p.506); carried from items 19-20 (vii): 'General Fire Alarm shall be the evacuation alarm.' Carried from items 19-20 by owner ruling 12.10.2026, Ch8 Q2 (cold storage lines)."

  - id: fa_robotic_parking
    # Robotic / Mechanical Parking or Robotic Logistics (Table 8.13 item 23, p.506).
    # fa_storage_industrial excludes this case (all matching branches are unioned).
    match: {has_robotic_parking_is: true}
    section: "Ch 8, #5.1 / Table 8.13 item 23"
    page: "p.506"
    systems:
      - name: "Aspiration Air Sampling (Vehicle Stacking / Storing Areas)"
        spec: "Per Section 4.5"
        detail: "Aspiration Type Air Sampling Smoke Detection System throughout vehicle stacking and storing areas of robotic / mechanical parking or robotic logistics facility."
      - name: "Smoke Detection (Office / Maintenance / Reception / Store Rooms)"
        spec: "Addressable, per Section 4.3"
        detail: "Table 8.13 item 23 (ii), p.506: Smoke Detection and Alarm System shall be provided throughout, Office, maintenance, reception, store rooms areas of the building as per Section 4.3."
      # Table 8.13 item 23 prints only (i)-(ii) (p.506); the FACP location comes from
      # Table 8.1 item 14.1 (vi) (audit 28.10.2026, Cursor PR #14 side note).
      - name: "Main FACP at Continuously Attended Location"
        code_ref: "Ch 8, Table 8.1 item 14.1 (vi)"
        page_ref: "p.458"
        detail: "Table 8.13 item 23 (p.506) prints items (i)-(ii) only and names no FACP location. Table 8.1 item 14.1 (vi), p.458: FACP shall be installed in a location which is attended by facility management or designated personnel at all times, such as reception areas, security guard houses, Emergency command centres, Facility monitoring rooms."

  - id: fa_storage_industrial
    # Items 21 (cold storage), 23 (robotic) and 28 (plant nursery) are the
    # specific rows for those buildings; the engine unions matching branches,
    # so this general storage row must exclude them.
    match: {occupancy: storage_industrial, is_plant_nursery_is: false, is_cold_storage_is: false, has_robotic_parking_is: false,
           is_open_yard_storage_is: false, is_aboveground_tank_storage_is: false}
    section: "Ch 8, #5.1 / Table 8.13 items 19-20"
    page: "p.506"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        spec: "Addressable, per Section 4.3"
      - name: "External Audio-Visual Notification Devices"
        spec: "Visible from common entrance"
        detail: "Each warehouse provided with audio-visual notification devices outside, visible from common entrance."
      - name: "General Fire Alarm = Evacuation Alarm"
        detail: "Table 8.13 items 19-20 (vii), p.506: 'General Fire Alarm shall be the evacuation alarm.'"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 items 19-20 (ii), p.506: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."

  - id: fa_storage_yard_tank
    # Owner ruling R-B (28.10.2026), audit CH8-02: Group U open yard storage and Group T
    # aboveground tank storage keep the items 19-20 package as conditional: it applies to
    # any enclosed building on the site. Table 8.13 prints no open-yard / tank-farm row.
    match:
      occupancy: storage_industrial
      is_plant_nursery_is: false
      is_cold_storage_is: false
      has_robotic_parking_is: false
      any_of:
        - {is_open_yard_storage_is: true}
        - {is_aboveground_tank_storage_is: true}
    section: "Ch 8, #5.1 / Table 8.13 items 19-20 (conditional, owner ruling R-B)"
    page: "p.506"
    systems:
      - name: "Smoke Detection and Alarm System (entire building)"
        required: conditional
        spec: "Addressable, per Section 4.3 - in any enclosed building on the site"
        detail: "Applies to any enclosed building on the site (warehouse, pump house, office). Ch 8 prints no row for open yards / aboveground tank farms (owner ruling R-B, 28.10.2026). Table 8.13 items 19-20 (i), p.506: Smoke Detection and Alarm System shall be provided throughout as per Section 4.3."
      - name: "External Audio-Visual Notification Devices"
        required: conditional
        spec: "Visible from common entrance"
        detail: "Applies to any enclosed building on the site (warehouse, pump house, office). Ch 8 prints no row for open yards / aboveground tank farms (owner ruling R-B, 28.10.2026). Table 8.13 items 19-20 (vi), p.506: each warehouse shall be provided with audio visual notification devices outside such that notification devices are visible from the common entrance."
      - name: "General Fire Alarm = Evacuation Alarm"
        required: conditional
        detail: "Applies to any enclosed building on the site (warehouse, pump house, office). Ch 8 prints no row for open yards / aboveground tank farms (owner ruling R-B, 28.10.2026). Table 8.13 items 19-20 (vii), p.506: 'General Fire Alarm shall be the evacuation alarm.'"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        required: conditional
        detail: "Applies to any enclosed building on the site (warehouse, pump house, office). Ch 8 prints no row for open yards / aboveground tank farms (owner ruling R-B, 28.10.2026). Table 8.13 items 19-20 (ii), p.506: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "Main FACP at Continuously Attended Location (single tenant) / single FACP permitted (multi-tenant)"
        required: conditional
        detail: "Applies to any enclosed building on the site (warehouse, pump house, office). Ch 8 prints no row for open yards / aboveground tank farms (owner ruling R-B, 28.10.2026). Table 8.13 items 19-20 (iv)-(v), p.506: in a single tenant warehouse, the main FACP shall be located at the continuously attended location such as Emergency Command Centre or Supervisor or Security guard house; in a multi-tenant warehouse, a single main FACP shall be permitted to monitor all the warehouses in the group, located at the security guard house or the facility management office."

  - id: fa_storage_single_tenant_facp
    # Table 8.13 items 19-20 (iv): single-tenant warehouse main FACP location.
    match: {occupancy: storage_industrial, is_plant_nursery_is: false, is_cold_storage_is: false, has_robotic_parking_is: false,
           is_open_yard_storage_is: false, is_aboveground_tank_storage_is: false, is_single_tenant_storage_is: true}
    section: "Ch 8, #5.1 / Table 8.13 items 19-20 (iv)"
    page: "p.506"
    systems:
      - name: "Main FACP at Continuously Attended Location (single-tenant warehouse)"
        detail: "Table 8.13 items 19-20 (iv), p.506: in a single tenant warehouse, the main FACP shall be located at the continuously attended location such as Emergency Command Centre or Supervisor or Security guard house, as per the building fire strategy."

  - id: fa_storage_multi_tenant_facp
    # Table 8.13 items 19-20 (v): one main FACP for a multi-tenant group is permitted.
    match: {occupancy: storage_industrial, is_plant_nursery_is: false, is_cold_storage_is: false, has_robotic_parking_is: false,
           is_open_yard_storage_is: false, is_aboveground_tank_storage_is: false, is_single_tenant_storage_is: false}
    section: "Ch 8, #5.1 / Table 8.13 items 19-20 (v)"
    page: "p.506"
    systems:
      - name: "Single FACP for Multi-Tenant Warehouse (permitted)"
        required: conditional
        detail: "Permitted, not required: Table 8.13 items 19-20 (v), p.506: in a multi-tenant warehouse, a single main FACP shall be permitted to monitor all the warehouses in the group, and FACPs for individual warehouses shall not be required. Such main FACP shall be located at the security guard house or the facility management office."

  - id: fa_parking_enclosed
    # Owner ruling R-I (28.10.2026): robotic / mechanical parking takes item 23 for
    # detection, so the sprinkler-dependent item 22 (i)-(iii) line is for non-robotic
    # parking only; fa_parking_enclosed_robotic keeps the other item 22 lines.
    # Audit CH8-18: the engine names which of (i)-(ii) / (iii) applies from the
    # building's Ch 9 sprinkler result.
    match: {occupancy: parking_enclosed, has_robotic_parking_is: false}
    section: "Ch 8, #5.1 / Table 8.13 item 22"
    page: "p.506"
    systems:
      - name: "Conditional FA System (per sprinkler presence)"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (i)-(iii)"
        page_ref: "p.506"
        detail: "If enclosed parking is fully sprinklered: Manual Fire Detection and Alarm System only (per Section 4.10) - no automatic detectors required. If NOT sprinklered: Heat Detection and Alarm System (per Section 4.7) throughout."
      - name: "Audio-Visual Notification (throughout parking areas)"
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 22 (v), p.506: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "General Fire Alarm Does NOT Trigger Evacuation"
        detail: "Table 8.13 item 22 (vii), p.506, printed 'General Fire Alarm shall not trigger be the evacuation alarm.' Read as 'shall not trigger the evacuation alarm' (owner ruling 12.10.2026, Ch8 Q6): the general fire alarm does not evacuate; the 120 s PAS of item (viii) governs evacuation."
      - name: "Positive Alarm Sequence (PAS) - 120 s"
        detail: "Table 8.13 item 22 (viii), p.506: if the general fire alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 120 s, evacuation alarm is triggered throughout."

  - id: fa_parking_enclosed_robotic
    # Owner ruling R-I (28.10.2026, Cursor PR #14): fa_robotic_parking (item 23) governs
    # detection; item 22 notification, interfaces and delayed evacuation are kept.
    match: {occupancy: parking_enclosed, has_robotic_parking_is: true}
    section: "Ch 8, #5.1 / Table 8.13 item 22 (with item 23, ruling R-I)"
    page: "p.506"
    systems:
      - name: "Item 22 Sprinkler-Dependent Detection - not applied (item 23 governs, ruling R-I)"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (i)-(iii); item 23"
        page_ref: "p.506"
        detail: "Not applied: Table 8.13 item 22 (i)-(iii) (no detectors and a Manual Fire Detection and Alarm System per Section 4.10 where sprinklered; a Heat Detection and Alarm System per Section 4.7 where not) is replaced, for robotic or mechanical parking, by item 23 (i)-(ii): aspiration type air sampling smoke detection throughout the vehicle stacking and storing areas per Section 4.5 and smoke detection in office, maintenance, reception and store room areas per Section 4.3 (owner ruling R-I, 28.10.2026)."
      - name: "Audio-Visual Notification (throughout parking areas)"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (iv)"
        detail: "Table 8.13 item 22 (iv), p.506: Audio Visual notification devices shall be provided throughout the parking areas. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (v)"
        detail: "Table 8.13 item 22 (v), p.506: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "General Fire Alarm Does NOT Trigger Evacuation"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (vii)"
        detail: "Table 8.13 item 22 (vii), p.506, printed 'General Fire Alarm shall not trigger be the evacuation alarm.' Read as 'shall not trigger the evacuation alarm' (owner ruling 12.10.2026, Ch8 Q6): the general fire alarm does not evacuate; the 120 s PAS of item (viii) governs evacuation. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "Positive Alarm Sequence (PAS) - 120 s"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (viii)"
        detail: "Table 8.13 item 22 (viii), p.506: if the general fire alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 120 s, evacuation alarm is triggered throughout. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."

  - id: fa_mall_open
    # Ruling R10 (12.10.2026): label only; the requirements come from the height
    # row (items 3-4 + 9-13 below 23 m, items 1-2 at 23 m or more).
    match: {occupancy: mall_open}
    section: "Ch 8, #5.1 / Table 8.13 item 13 (open mall, ruling R10)"
    page: "p.503"
    systems:
      - name: "Open Mall - Table 8.13 item 13 MERCANTILE applies"
        required: conditional
        detail: "Table 8.13 has no open-mall row; item 24 is headed COVERED MALL (p.507). The open mall is treated as item 13 MERCANTILE (p.503): smoke detection throughout, system interfaces, Table 8.14 / 8.15 rooms and equipment, PAS 180 s then evacuation throughout (ruling R10, 12.10.2026). At 23 m or more the highrise row governs as for any mercantile building."

  - id: fa_parking_open
    # Ruling R10 (12.10.2026): Table 8.13 has no open-parking row. Item 22 ENCLOSED
    # PARKING is applied by analogy and every line says so.
    # Owner ruling R-I (28.10.2026): robotic / mechanical parking -> fa_parking_open_robotic.
    match: {occupancy: parking_open, has_robotic_parking_is: false}
    section: "Ch 8, #5.1 / not in Table 8.13 - item 22 applied by analogy (ruling R10)"
    page: "p.506"
    systems:
      - name: "Open Parking - not in Table 8.13; item 22 (Enclosed Parking) applied by analogy"
        required: conditional
        detail: "Table 8.13 (p.502-508) has no open-parking row. Item 22 ENCLOSED PARKING is applied by analogy (ruling R10, 12.10.2026); confirm with Civil Defence. Table 8.1 item 5 (i) (p.456) asks for automatic addressable detection in every building and enclosed structure."
      - name: "Conditional FA System (per sprinkler presence) - by analogy with item 22"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (i)-(iii), by analogy (ruling R10)"
        page_ref: "p.506"
        detail: "By analogy with Table 8.13 item 22 (i)-(iii): if the parking is fully sprinklered, Manual Fire Detection and Alarm System (Section 4.10), no automatic detectors; if NOT sprinklered, Heat Detection and Alarm System (Section 4.7) throughout."
      - name: "Audio-Visual Notification (throughout parking areas) - by analogy with item 22"
        detail: "Table 8.13 item 22 (iv), applied by analogy."
      - name: "System Interfaces - by analogy with item 22"
        detail: "Table 8.13 item 22 (v), applied by analogy: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "General Fire Alarm Does NOT Trigger Evacuation - by analogy with item 22"
        detail: "Table 8.13 item 22 (vii), p.506, applied by analogy, read as 'shall not trigger the evacuation alarm' (owner ruling 12.10.2026, Ch8 Q6): the general fire alarm does not evacuate; the 120 s PAS governs evacuation."
      - name: "Positive Alarm Sequence (PAS) - 120 s - by analogy with item 22"
        detail: "Table 8.13 item 22 (viii), applied by analogy: if the general fire alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 120 s, evacuation alarm is triggered throughout the parking."

  - id: fa_parking_open_robotic
    # Owner ruling R-I (28.10.2026) with ruling R10: open robotic / mechanical parking.
    match: {occupancy: parking_open, has_robotic_parking_is: true}
    section: "Ch 8, #5.1 / not in Table 8.13 - item 22 by analogy (ruling R10) with item 23 (ruling R-I)"
    page: "p.506"
    systems:
      - name: "Open Parking - not in Table 8.13; item 22 (Enclosed Parking) applied by analogy"
        required: conditional
        detail: "Table 8.13 (p.502-508) has no open-parking row. Item 22 ENCLOSED PARKING is applied by analogy (ruling R10, 12.10.2026); confirm with Civil Defence. Robotic or mechanical parking: item 23 governs detection (owner ruling R-I, 28.10.2026)."
      - name: "Item 22 Sprinkler-Dependent Detection - not applied (item 23 governs, ruling R-I)"
        required: not_required
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (i)-(iii) by analogy; item 23"
        page_ref: "p.506"
        detail: "Not applied: Table 8.13 item 22 (i)-(iii), applied by analogy (ruling R10), is replaced, for robotic or mechanical parking, by item 23 (i)-(ii): aspiration type air sampling smoke detection throughout the vehicle stacking and storing areas per Section 4.5 and smoke detection in office, maintenance, reception and store room areas per Section 4.3 (owner ruling R-I, 28.10.2026)."
      - name: "Audio-Visual Notification (throughout parking areas) - by analogy with item 22"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (iv), by analogy"
        detail: "Table 8.13 item 22 (iv), applied by analogy (ruling R10). Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "System Interfaces - by analogy with item 22"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (v), by analogy"
        detail: "Table 8.13 item 22 (v), applied by analogy: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems like door release, Elevator recall, Smoke Control etc. shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "General Fire Alarm Does NOT Trigger Evacuation - by analogy with item 22"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (vii), by analogy"
        detail: "Table 8.13 item 22 (vii), p.506, applied by analogy, read as 'shall not trigger the evacuation alarm' (owner ruling 12.10.2026, Ch8 Q6): the general fire alarm does not evacuate; the 120 s PAS governs evacuation. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."
      - name: "Positive Alarm Sequence (PAS) - 120 s - by analogy with item 22"
        code_ref: "Ch 8, #5.1 / Table 8.13 item 22 (viii), by analogy"
        detail: "Table 8.13 item 22 (viii), applied by analogy: if the general fire alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 120 s, evacuation alarm is triggered throughout the parking. Kept for robotic / mechanical parking with Table 8.13 item 23 (owner ruling R-I, 28.10.2026: item 23 governs detection; item 22 notification, interfaces and delayed evacuation stay)."

  - id: fa_villa_converted
    # Table 8.13 item 14: existing private villas (G+1) converted to nurseries,
    # day care centres, restaurants, show rooms, boutiques. Replaces item 26.
    match: {occupancy: villa_private, villa_converted_use_is: true, floors_above_grade_lte: 2}
    suppresses: [fa_villa_private]
    section: "Ch 8, #5.1 / Table 8.13 item 14"
    page: "p.503"
    systems:
      - name: "Smoke Detection and Alarm System (converted villa)"
        spec: "Addressable, per Section 4.3"
        detail: "Table 8.13 item 14 (i), p.503, existing private villas (G+1) converted to nurseries, day care centers, restaurants, show rooms, boutiques: smoke detection throughout the building per Section 4.3, OR a wireless / low powered radio frequency based Fire Detection and Alarm System in each villa per Section 4.11."
      - name: "External Audio-Visual Notification Devices"
        spec: "Visible from common approach road"
        detail: "Table 8.13 item 14 (iv), p.503."
      - name: "Main FACP / Cluster Radio HUB at Continuously Attended Location"
        detail: "Table 8.13 item 14 (iii), p.503: main FACP OR the cluster radio HUB shall be located at the continuously attended location such as reception or Security guard house."

  - id: fa_villa_private
    match: {occupancy: villa_private}
    section: "Ch 8, #5.1 / Table 8.13 item 26"
    page: "p.508"
    systems:
      - name: "Smoke Detection and Alarm System (each villa)"
        spec: "Addressable, per Section 4.3"
        detail: "OR Wireless / Low-powered radio-frequency based Fire Detection and Alarm System per Section 4.11."
      - name: "External Audio-Visual Notification Devices"
        spec: "Visible from common approach road"
      - name: "FACP or Monitoring Panel at Continuously Attended Location"
        detail: "Table 8.13 item 26 (iii), p.508: FACP OR the monitoring panel shall be located at the continuously attended location. (The 'cluster radio HUB' wording is item 25 (iii) COMMERCIAL VILLA and item 14 (iii) converted villa, not item 26.)"

  - id: fa_villa_commercial
    match: {occupancy: villa_commercial}
    section: "Ch 8, #5.1 / Table 8.13 item 25"
    page: "p.507"
    systems:
      - name: "Smoke Detection and Alarm System (each villa)"
        spec: "Addressable, per Section 4.3"
        detail: "OR Wireless / Low-powered radio-frequency based Fire Detection and Alarm System per Section 4.11 (Table 8.13 item 25 (i), p.507)."
      - name: "External Audio-Visual Notification Devices"
        spec: "Visible from common approach road"
      - name: "FACP / Cluster Radio HUB at Continuously Attended Location"
        detail: "Table 8.13 item 25 (iii), p.507: Emergency Command Centre or facility management office or Security guard house (or even at developer's office in case of wireless / radio system), as per the building fire strategy."

  - id: fa_motor_fuel
    match: {occupancy: motor_fuel_dispensing}
    section: "Ch 8, #5.1 / Table 8.13 item 27"
    page: "p.508"
    systems:
      - name: "Smoke Detection and Alarm System (Mini Mart / Restaurant / Service Station)"
        spec: "Addressable, per Section 4.3"
      - name: "External Audio-Visual Notification Devices (per tenant)"
      - name: "Single Main FACP for Complex"
        detail: "Covers entire petrol/gas station complex - individual tenant FACPs not required (Table 8.13 item 27 (iv), p.508)."
      - name: "Main FACP at Continuously Attended Location"
        detail: "Table 8.13 item 27 (v), p.508: management office or Security guard house or Mini Mart cash counter, as per the building fire strategy."
      - name: "System Interfaces (pump, suppression, gas, door release, elevator recall, smoke control)"
        detail: "Table 8.13 item 27 (ii), p.508: Fire Pump, all building fire suppression systems, Fire Water Level, LP Gas detection, CO Monitoring and other interconnected systems, if any, shall be interfaced with the Fire Detection and Alarm System, based on building fire strategy, as per Section 4.1."
      - name: "Positive Alarm Sequence (PAS) - 180 s"
        detail: "Table 8.13 item 27 (vi)-(vii), p.508: a general fire alarm from a single tenant space triggers the evacuation alarm only in that tenant space. If the alarm is not silenced by authorized personnel or the FACP is not reset, or multiple alarms are triggered from other initiating devices, within 180 s, the complex evacuation alarm is triggered."

# ---------- AUXILIARY ROOMS: Table 8.14 -------------------------------------
auxiliary_rooms:
  - id: fa_aux_atrium
    flag: has_atrium
    systems:
      - name: "Beam Smoke Detection (Atrium)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 1"
        page_ref: "p.509"
        spec: "Per Section 4.4 - OR Aspiration Air Sampling per Section 4.5"
        detail: "Projected-beam smoke detection across atrium void; aspirating system acceptable alternative for high-volume spaces."

  - id: fa_aux_anesthetizing
    flag: has_anesthetizing_room
    systems:
      - name: "Smoke Detection (Anesthetizing Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 2"
        page_ref: "p.509"
        spec: "Per Section 4.4 OR Aspiration per Section 4.5"
        detail: "Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_operation_theater
    flag: has_operation_theater
    systems:
      - name: "Aspiration Air Sampling (Operation Theatre)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 3"
        page_ref: "p.509"
        spec: "Per Section 4.5"
        detail: "Aspiration mandatory in OT - very early warning required given critical nature of procedures."

  - id: fa_aux_battery_charger
    flag: has_battery_charger_room
    systems:
      - name: "Heat Detection (Battery Charger Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 4"
        page_ref: "p.509"
        spec: "Per Section 4.7"

  - id: fa_aux_battery
    flag: has_battery_room
    systems:
      - name: "Heat + Flame + Hydrogen Detection (Battery Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 5"
        page_ref: "p.509"
        spec: "Heat (Section 4.7) AND Flame (Section 4.9) AND listed Hydrogen detector"
        detail: "Battery room - vented batteries can release hydrogen; combined detection covers thermal runaway, electrolyte fire and hydrogen accumulation."

  - id: fa_aux_bms
    flag: has_bms_room
    systems:
      - name: "Smoke Detection (BMS Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 6"
        page_ref: "p.509"
        spec: "Per Section 4.4"
        detail: "Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_computer
    flag: has_computer_room
    systems:
      - name: "Smoke Detection (Computer Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 7"
        page_ref: "p.509"
        spec: "Per Section 4.4 OR Aspiration per Section 4.5"
        detail: "Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_diesel_gen
    flag: has_diesel_generator_room
    systems:
      - name: "Heat Detection (Diesel Generator Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 8; #5.3 / Table 8.15 item 5"
        page_ref: "p.509; p.512"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 8 DIESEL GENERATOR ROOM, p.509, and Table 8.15 item 5 DIESEL GENERATORS AREA, p.512, both print: 'Heat Detection and Alarm System shall be provided as per Section 4.7.' One line for the one room (audit CH8-12, 28.10.2026). Heat detection (NOT smoke) - diesel exhaust would defeat smoke detection."

  - id: fa_aux_main_electrical
    flag: has_main_electrical_room
    systems:
      - name: "Smoke Detection (Electrical Rooms)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 9"
        page_ref: "p.509"
        spec: "Per Section 4.4"
        detail: "Table 8.14 item 9 is printed ELECTRICAL ROOM: it covers every electrical room, not only the main electrical room. Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_ahu
    flag: has_ahu_room
    systems:
      - name: "Multi-sensor Detection (AHU Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 10"
        page_ref: "p.509"
        spec: "Per Table 8.12.1 - combined smoke + heat in one unit"

  - id: fa_aux_lv_mv
    flag: has_lv_mv_room
    systems:
      - name: "Smoke Detection (LV Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 11"
        page_ref: "p.509"
        spec: "Per Section 4.4 OR Aspiration per Section 4.5"
        detail: "Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_mv
    flag: has_mv_room
    systems:
      - name: "Smoke Detection (MV Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 11 (LV room row applied to MV, ruling R12)"
        page_ref: "p.509"
        spec: "Per Section 4.4 OR Aspiration per Section 4.5"
        detail: "Engineering decision, not a code row: Table 8.14 has no MV room row (item 9 ELECTRICAL ROOM and item 11 LV ROOM both call for smoke detection); the item 11 LV row is applied to the MV room (ruling R12, 12.10.2026)."

  - id: fa_aux_lift_machine
    flag: has_lift_machine_room
    systems:
      - name: "Multi-sensor Detection (Lift Machine Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 12"
        page_ref: "p.509"
        spec: "Per Table 8.12.1"

  - id: fa_aux_server
    flag: has_main_server_room
    systems:
      - name: "Smoke Detection / Aspiration (Server Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 13"
        page_ref: "p.510"
        spec: "Per Section 4.4 OR Aspiration per Section 4.5"
        detail: "Aspiration preferred for very-early warning in critical IT spaces. Code text cites 'Section 4.4' which is Beam-Type (Projected Beam) Smoke; the intended reference is Section 4.3 (Spot-Type Smoke). YAML follows code wording for traceability."

  - id: fa_aux_high_ceiling_beam
    flag: has_high_ceiling
    when: {ceiling_height_m_gt: 10, ceiling_height_m_lt: 20}
    systems:
      - name: "Beam Smoke Detection (High-Ceiling Spaces 10-20 m)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 18"
        page_ref: "p.510"
        spec: "Per Section 4.4"
        detail: "Enclosed spaces with height > 10 m and < 20 m from finished floor level shall use projected-beam smoke detection."

  - id: fa_aux_high_ceiling_aspiration
    flag: has_high_ceiling
    when: {ceiling_height_m_gt: 20}
    systems:
      - name: "Aspiration Air Sampling (High-Ceiling Spaces more than 20 m)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 19"
        page_ref: "p.510"
        spec: "Per Section 4.5"
        detail: "Enclosed spaces having height more than 20 m from finished floor level shall be provided with an Aspiration Type Air Sampling Detection System per Section 4.5 (Table 8.14 item 19, p.510)."

  # Exactly 20 m and exactly 10 m sit in neither Table 8.14 row (item 18 "more than
  # 10 m to less than 20 m", item 19 "more than 20 m"). Owner ruling 12.10.2026
  # (Ch8 Q3, same rule as R11): the edge takes the higher row, required, gap named.
  - id: fa_aux_high_ceiling_edge_20
    flag: has_high_ceiling
    when: {ceiling_height_m_is: 20.0}
    systems:
      - name: "Aspiration Air Sampling (High-Ceiling Space exactly 20 m - higher row)"
        code_ref: "Ch 8, #5.2 / Table 8.14 items 18-19"
        page_ref: "p.510"
        spec: "Per Section 4.5 (item 19 applied at the code gap)"
        detail: "Code gap at exactly 20 m: Table 8.14 item 18 is 'height more than 10 m to less than 20 m' (projected beam, Section 4.4) and item 19 is 'height more than 20 m' (aspiration, Section 4.5), p.510; exactly 20 m is in neither row. Item 19, the higher row, applies (owner ruling 12.10.2026, Ch8 Q3)."
  - id: fa_aux_high_ceiling_edge_10
    flag: has_high_ceiling
    when: {ceiling_height_m_is: 10.0}
    systems:
      - name: "Beam Smoke Detection (High-Ceiling Space exactly 10 m - higher row)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 18"
        page_ref: "p.510"
        spec: "Per Section 4.4 (item 18 applied at the code gap)"
        detail: "Code gap at exactly 10 m: Table 8.14 item 18 starts at 'height more than 10 m' (p.510); a space of exactly 10 m is in no Table 8.14 height row. Item 18 projected beam detection, the higher row, applies (owner ruling 12.10.2026, Ch8 Q3)."

  - id: fa_aux_garbage_chute
    flag: has_garbage_chute
    systems:
      - name: "Heat Detection (Garbage Chute / Garbage Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 25"
        page_ref: "p.511"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 25 GARBAGE ROOM, p.511: 'Heat Detector shall be provided as per Section 4.7.' The row prints no chute condition: every garbage room, with or without a chute (the chute is the Ch 9 Table 9.29 row L sprinkler condition; audit CH8-10, 28.10.2026)."

  - id: fa_aux_pantries
    flag: has_pantries
    systems:
      - name: "Heat Detection (Pantry)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 23"
        page_ref: "p.510"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 23 PANTRY, p.510: 'Heat Detection and Alarm System shall be provided as per Section 4.7.' The row prints no occupancy condition: every pantry (the 'business / commercial' condition is Ch 9 Table 9.29 row I sprinklers only; audit CH8-10, 28.10.2026)."

  - id: fa_aux_laundry_storage
    flag: has_laundry_storage_rooms
    systems:
      - name: "Smoke Detection (Laundry / Storage Rooms)"
        code_ref: "Ch 8, #5.2 / Table 8.14 items 21-22"
        page_ref: "p.510"
        spec: "Per Section 4.3"
        detail: "Table 8.14 item 21 LAUNDRY and item 22 STORAGE ROOM, p.510: 'Smoke Detectors shall be provided in the void as per Section 4.3.' The rows print no occupancy condition: every laundry and storage room (the 'residential' condition is Ch 9 Table 9.29 row H sprinklers only; audit CH8-10, 28.10.2026)."

  - id: fa_aux_pump_room
    flag: has_fire_pump_room
    systems:
      - name: "Heat Detection (Fire Pump Room)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 24"
        page_ref: "p.511"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 24 PUMP ROOM, p.511: 'Heat Detector shall be provided as per Section 4.7.' The row is printed PUMP ROOM with no pump type: every pump room, not only the fire pump room (audit CH8-10, 28.10.2026)."

  - id: fa_aux_roof_restaurant
    flag: has_roof_restaurant_assembly
    systems:
      - name: "Manual FA System (Roof Restaurant / Sheesha / Assembly)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 36"
        page_ref: "p.511"
        spec: "Per Section 4.10"
        detail: "Table 8.14 item 36, p.511: building roofs used for restaurant seating, assembly and as Sheesha bars shall be provided with Manual Fire Detection and Alarm System, as per Section 4.10."

  # The older combined input "Roof LPG / restaurant / assembly / sheesha" (kept for
  # Ch 9) also covers a roof with LPG only, which Table 8.14 item 36 does not cover.
  - id: fa_aux_roof_restaurant_combined_flag
    flag: has_roof_lpg_or_restaurant
    when: {has_roof_restaurant_assembly_is: false}
    systems:
      - name: "Manual FA System (Roof Restaurant / Sheesha / Assembly)"
        required: conditional
        code_ref: "Ch 8, #5.2 / Table 8.14 item 36"
        page_ref: "p.511"
        spec: "Per Section 4.10 - only where the roof is used for restaurant seating, assembly or as Sheesha bars"
        detail: "Table 8.14 item 36, p.511, applies to building roofs used for restaurant seating, assembly and as Sheesha bars; a roof with LPG only is not in item 36. Tick 'Roof restaurant / assembly / sheesha (FA Table 8.14 item 36)' to make this line required."

  # ----- Table 8.14 items 14-37 (added) ------------------------------------
  # Item 14: Stair shaft. Smoke detector at top + (highrise) every 23 m intermediate landings.
  - id: fa_aux_stair
    flag: has_stairs
    systems:
      - name: "Smoke Detection at Top of Stair Shaft (+ every 23 m for Highrise)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 14"
        page_ref: "p.510"
        spec: "Per Section 4.3"
        detail: "At least one smoke detector at the top of the stair shaft (non-highrise). In Highrise and Super-Highrise buildings, additional smoke detectors at intermediate landings every 23 m of vertical shaft height."

  # Audit 28.10.2026, CH8-09: villas of G+1 and above. The app clears has_stairs for
  # villas (Ch 9 stair sprinklers); Table 8.13 items 25-26 (ii) (p.507-508) apply
  # Table 8.14 to villas, so item 14 (i) is printed from the storey count.
  - id: fa_aux_stair_villa
    always_on: true
    when:
      occupancy_in: [villa_private, villa_commercial]
      floors_above_grade_gte: 2
      has_stairs_is: false
    systems:
      - name: "Smoke Detection at Top of Stair Shaft (+ every 23 m for Highrise)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 14"
        page_ref: "p.510"
        spec: "Per Section 4.3"
        detail: "Table 8.14 item 14 STAIR (i), p.510: at least one smoke detector shall be installed at the top of the stair of a non-highrise building as per Section 4.3 (also Table 8.1 item 6 (i), p.456). The villa has 2 or more floors above grade (G+1 and above), so it has a stair; Table 8.13 item 26 (ii) PRIVATE VILLA / item 25 (ii) COMMERCIAL VILLA (p.507-508) apply Table 8.14."

  # Item 15: Elevator shaft. Smoke detector at top + (highrise) every 23 m intermediate levels.
  - id: fa_aux_elevator_shaft
    flag: has_elevator
    systems:
      - name: "Smoke Detection at Top of Elevator Shaft (+ every 23 m for Highrise)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 15"
        page_ref: "p.510"
        spec: "Per Section 4.3"
        detail: "At least one smoke detector at the top of the elevator shaft (non-highrise). In Highrise and Super-Highrise buildings, additional smoke detectors at intermediate levels every 23 m vertically in the shaft."

  # Item 16: Above false ceiling - conditional on void > 80 cm. No dedicated schema flag;
  # emitted as an always-on conditional reminder so designers verify the void height.
  - id: fa_aux_above_false_ceiling
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Smoke Detection in Above-False-Ceiling Voids > 80 cm (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 16"
        page_ref: "p.510"
        spec: "Per Section 4.3 (with remote response indicators)"
        required: conditional
        detail: "CONDITIONAL: Where above-false-ceiling voids exceed 80 cm height, smoke detectors shall be provided in the void (Section 4.3). Remote response indicators shall be provided to identify alarm status of concealed detectors. Exception: detectors are not required where voids are inaccessible. Designer to confirm void heights in coordination drawings."

  # Item 17: Below raised floor - conditional on void > 30 cm OR cable/duct runs. Same treatment.
  - id: fa_aux_below_raised_floor
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Smoke Detection in Below-Raised-Floor Voids > 30 cm or with Cable/Duct Runs (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 17"
        page_ref: "p.510"
        spec: "Per Section 4.3 (with remote response indicators)"
        required: conditional
        detail: "CONDITIONAL: Where below-raised-floor voids exceed 30 cm height OR where cable runs and ducting are installed, smoke detectors shall be provided in the void (Section 4.3). Remote response indicators required to identify alarm status of concealed detectors. Designer to confirm void heights / cable routing."

  # Item 20: Public bathroom > 5 m². Conditional reminder; no dedicated schema flag.
  - id: fa_aux_public_bathroom_large
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Heat Detection in Public Bathrooms > 5 m² (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 20"
        page_ref: "p.510"
        spec: "Per Section 4.7"
        required: conditional
        detail: "CONDITIONAL: Public bathrooms having area more than 5 m² shall be provided with Heat Detection and Alarm System (Section 4.7). Designer to verify bathroom areas on architectural layout."

  # Item 26: Bedroom (sounder-based smoke detector) - conditional general reminder.
  - id: fa_aux_bedroom
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Sounder-based Smoke Detector in Bedrooms (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 26"
        page_ref: "p.511"
        spec: "Per Section 4.3"
        required: conditional
        detail: "CONDITIONAL: Where bedrooms are part of the occupancy (residential, hotel guest rooms, hostels, labour accommodation, staff accommodation, healthcare patient rooms, etc.), a sounder-based smoke detector shall be provided in each bedroom (Section 4.3)."

  # Item 27: Living room - conditional general reminder.
  - id: fa_aux_living_room
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Smoke Detector in Living Rooms (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 27"
        page_ref: "p.511"
        spec: "Per Section 4.3"
        required: conditional
        detail: "CONDITIONAL: Where the occupancy includes living rooms (residential dwellings, villas, apartments, hotel suites, staff accommodation, etc.), a smoke detector shall be provided in each living room (Section 4.3)."

  # Items 28-29: open and closed kitchens. Not limited to commercial kitchens;
  # a conditional reminder for every building (a dwelling kitchen is the normal case).
  - id: fa_aux_kitchen_open
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Listed Kitchen Detector OR Heat-in-Kitchen + Smoke-in-Living (Open Kitchen)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 28"
        page_ref: "p.511"
        spec: "Per Section 4.7 / 4.3 / Table 8.12.1 - one of three options"
        required: conditional
        detail: "CONDITIONAL: where the building has open kitchens (dwellings, hotel suites, commercial). OPEN KITCHEN options (Table 8.14 item 28, p.511): (a) detectors specifically listed for kitchen use installed per their listing; OR (b) heat detector in the kitchen (Section 4.7) AND a smoke detector 3 m away from the kitchen counter, in the living room (Section 4.3); OR (c) multisensors specifically listed for kitchen per Table 8.12.1."

  # Item 29: Closed kitchen - same treatment.
  - id: fa_aux_kitchen_closed
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Listed Kitchen Detector OR Heat Detector (Closed Kitchen)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 29"
        page_ref: "p.511"
        spec: "Per Section 4.7 - or detectors specifically listed for kitchen"
        required: conditional
        detail: "CONDITIONAL: where the building has closed kitchens (dwellings, hotel suites, commercial). CLOSED KITCHEN options (Table 8.14 item 29, p.511): (a) detectors specifically listed for kitchen use installed per their listing; OR (b) heat detector in the kitchen (Section 4.7)."

  # Item 30: Corridor - conditional general reminder.
  - id: fa_aux_corridor
    always_on: true
    when: {not: {occupancy: storage_industrial, is_plant_nursery_is: true}}
    systems:
      - name: "Smoke Detector in Corridors (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 30"
        page_ref: "p.511"
        spec: "Per Section 4.3"
        required: conditional
        detail: "CONDITIONAL: Where corridors are part of the egress arrangement (most occupancies), a smoke detector shall be provided per Section 4.3. Already typically covered by the branch-level smoke-detection-throughout requirement; listed here for traceability with Table 8.14 row 30."

  # Items 31-33: Temporary structures - conditional general reminder.
  - id: fa_aux_temporary_structures
    always_on: true
    when:
      not: {occupancy: storage_industrial, is_plant_nursery_is: true}
      tent_marquee_kind_in: [none, permanent, commercial_desert, small_detached]
    systems:
      - name: "Smoke Detection in Temporary Kiosks / Tents / Modular Houses-Offices (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 items 31-33"
        page_ref: "p.511"
        spec: "Battery-operated listed smoke detectors (kiosks / tents) OR Section 4.3 (modular)"
        required: conditional
        detail: "CONDITIONAL: Temporary kiosks (item 31) and temporary tents (item 32) shall be provided with battery-operated smoke detectors listed and approved by Civil Defence. Temporary modular houses / offices (item 33) shall be provided with smoke detectors per Section 4.3. Applies only when the project includes any of these temporary structures."

  # Audit 28.10.2026, CH8-07: the building is a temporary tent (Table 9.21.f row A,
  # p.712): Table 8.14 item 32 required.
  - id: fa_aux_temporary_tent
    always_on: true
    when: {tent_marquee_kind_is: temporary}
    systems:
      - name: "Battery Operated Smoke Detectors (Temporary Tent)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 32"
        page_ref: "p.511"
        spec: "Battery Operated Smoke Detectors, listed and approved by Civil Defence"
        detail: "Table 8.14 item 32 TEMPORARY TENTS, p.511: 'Battery Operated Smoke Detectors, listed and approved by Civil Defence shall be provided.' The building is a temporary tent / marquee (Table 9.21.f row A, p.712)."

  # Audit 28.10.2026, CH8-07: the building is a site office (Table 9.21.f rows D / E,
  # p.712), read as a temporary modular office: Table 8.14 item 33 required.
  - id: fa_aux_temporary_modular_office
    always_on: true
    when: {tent_marquee_kind_in: [site_office_short, site_office_long]}
    systems:
      - name: "Smoke Detector (Temporary Modular House / Office)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 33"
        page_ref: "p.511"
        spec: "Smoke Detector per Section 4.3"
        detail: "Table 8.14 item 33 TEMPORARY MODULAR HOUSES/OFFICES, p.511: 'Smoke Detector shall be provided as per Section 4.3.' The building is a site office (Table 9.21.f row D, required for less than 6 months, or row E, more than 6 months, p.712), read as a temporary modular office."

  # Item 31: the building is a temporary kiosk (Mercantile Group C, owner ruling
  # 13.10.2026, P4 Q5).
  - id: fa_aux_temporary_kiosk
    always_on: true
    when: {mercantile_c_type_is: kiosk_temporary}
    systems:
      - name: "Battery Operated Smoke Detectors (Temporary Kiosk)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 31"
        page_ref: "p.511"
        spec: "Battery Operated Smoke Detectors, listed and approved by Civil Defence"
        detail: "Table 8.14 item 31 TEMPORARY KIOSKS, p.511: Battery Operated Smoke Detectors, listed and approved by Civil Defence shall be provided. The building is a temporary kiosk (Mercantile Group C, owner ruling 13.10.2026, P4 Q5)."

  # Item 34: Food trucks, any fuel (has_food_trucks), the Ch 11 LPG food-truck input, or
  # the building is a food truck (Mercantile Group C, owner ruling 13.10.2026, P4 Q5).
  - id: fa_aux_food_truck
    always_on: true
    when:
      any_of:
        - {has_food_trucks_is: true}
        - {has_lpg_cylinders_food_truck_is: true}
        - {mercantile_c_type_is: food_truck}
    systems:
      - name: "Heat Detector (Food Truck)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 34"
        page_ref: "p.511"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 34 FOOD TRUCKS, p.511: heat detector shall be provided as per Section 4.7. Item 34 applies to every food truck, whatever its fuel."

  # Item 35: the building is a mercantile truck (Mercantile Group C, owner ruling
  # 13.10.2026, P4 Q5): required. Otherwise a conditional reminder (no clean flag).
  - id: fa_aux_mercantile_truck_required
    always_on: true
    when: {mercantile_c_type_is: mercantile_truck}
    systems:
      - name: "Heat Detector (Mercantile Truck)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 35"
        page_ref: "p.511"
        spec: "Per Section 4.7"
        detail: "Table 8.14 item 35 MERCANTILE TRUCKS, p.511: Heat Detector shall be provided as per Section 4.7. The building is a mercantile truck (Mercantile Group C, owner ruling 13.10.2026, P4 Q5)."

  - id: fa_aux_mercantile_truck
    always_on: true
    when:
      not: {occupancy: storage_industrial, is_plant_nursery_is: true}
      mercantile_c_type_in: [null, kiosk_permanent, kiosk_temporary, food_truck]
    systems:
      - name: "Heat Detector (Mercantile Truck) (Conditional)"
        code_ref: "Ch 8, #5.2 / Table 8.14 item 35"
        page_ref: "p.511"
        spec: "Per Section 4.7"
        required: conditional
        detail: "CONDITIONAL: Where mercantile trucks (mobile retail vehicles) are part of the project, a heat detector shall be provided inside each truck per Section 4.7."

  # Item 37: Open storage shed - keyed off open-yard-storage flag.
  - id: fa_aux_open_storage_shed
    flag: is_open_yard_storage
    systems:
      - name: "Manual FA System (Open Storage Shed) - where a shed / structure exists"
        required: conditional
        code_ref: "Ch 8, #5.2 / Table 8.14 item 37"
        page_ref: "p.511"
        spec: "Per Section 4.10 - where a shed / structure exists in the open yard"
        detail: "Table 8.14 item 37 OPEN STORAGE SHEDS, p.511: 'Manual Fire Detection and Alarm System, as per Section 4.10.' Applies where a shed / structure exists in the open yard; an open yard with no shed or structure has no Table 8.14 row (owner ruling R-B, 28.10.2026). Any enclosed building on the site takes the items 19-20 package, shown as conditional."

# ---------- EQUIPMENT: Table 8.15 -------------------------------------------
equipment:
  - id: fa_eq_kitchen_hood
    flag: has_commercial_kitchen
    systems:
      - name: "Fusible-Link Heat Detection (Kitchen Hood)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 1"
        page_ref: "p.512"
        spec: "Per Section 4.6 - pre-engineered systems acceptable"
        detail: "Table 8.15 item 1 KITCHEN HOOD, p.512: 'Fusible Link Heat Detection and Alarm System shall be provided as per Section 4.6. (Pre-engineered Systems shall be acceptable)'. The row prints no burner count: every kitchen hood (the '3 or more burners' condition is Ch 9 Table 9.31.A, p.756, only; audit CH8-06, 28.10.2026)."

  - id: fa_eq_lpg_tanks
    flag: has_lpg_tanks
    systems:
      - name: "LP Gas Detection + Alarm System"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 2; Ch 11"
        page_ref: "p.512"
        detail: "LP Gas Detection (per Ch 11) interfaced with FACP. Deluge water spray for LP Gas tank triggered by: (a) gas detection at tank, (b) fire detection from roof + floor below, (c) cross-zoned fire detection elsewhere, (d) manual actuation from gas-detection panel."

  # Audit 28.10.2026, CH8-01: also for a Group T building (Table 9.27 T, p.745: storage of
  # flammable and combustible liquids in aboveground storage tanks).
  - id: fa_eq_flammable_liquid_tanks
    always_on: true
    when:
      any_of:
        - {has_flammable_liquid_tanks_is: true}
        - {is_aboveground_tank_storage_is: true}
    systems:
      - name: "Intrinsically Safe Flame + Linear Heat (Flammable Liquid Tanks)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 3"
        page_ref: "p.512; p.513"
        spec: "IS Flame (Section 4.9) + IS Linear Heat (Section 4.8) on tank roof"
        detail: "Table 8.15 item 3 FLAMMABLE LIQUID TANKS, p.512: Intrinsically Safe Flame (Radiant Energy) Detection and Alarm System as per Section 4.9 AND Intrinsically Safe Linear Type Heat Detection System on the tank roof as per Section 4.8, both as per Risk assessment proposed and stamped by the Civil Defence approved House of Expertise. Items 10-11 BULK FLAMMABLE LIQUID STORAGE (p.513) print the same two systems. Applies to the flammable liquid tanks and to a Group T building (Table 9.27 T, p.745: flammable and combustible liquids in aboveground storage tanks); Table 8.15 prints no separate combustible-liquid tank row (audit CH8-01, 28.10.2026)."

  - id: fa_eq_cable_spread
    flag: has_cable_spread_areas
    systems:
      - name: "Aspiration Smoke + Linear Heat (Cable Spread Area)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 4"
        page_ref: "p.512"
        spec: "Aspiration (Section 4.5) at room ceiling AND Linear Heat (Section 4.8) on cable trays"

  # Table 8.15 item 5 DIESEL GENERATORS AREA (p.512) prints the same requirement as
  # Table 8.14 item 8 (p.509); fa_aux_diesel_gen cites both (audit CH8-12, 28.10.2026).

  - id: fa_eq_boilers
    flag: has_boilers
    systems:
      - name: "Heat Detection (Boilers Area)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 6"
        page_ref: "p.512"
        spec: "Per Section 4.7"

  # Table 8.15 items 7 and 8 are printed "on the cable trays as per Section 4.8"
  # (p.512); the text is shown as printed.
  - id: fa_eq_cooling_towers
    flag: has_cooling_towers
    systems:
      - name: "Linear Heat Detection (Cooling Towers)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 7"
        page_ref: "p.512"
        spec: "On the cable trays, per Section 4.8"
        detail: "Table 8.15 item 7 COOLING TOWERS, p.512: 'Linear Type Heat Detection System shall be provided on the cable trays as per Section 4.8.' The row prints no material condition: every cooling tower (the 'not tested and certified for non-combustibility' condition is Ch 9 Table 9.31.G, p.756, only; audit CH8-05, 28.10.2026)."

  # Item 8 TRANSFORMERS: any transformer type (oil-filled input or a transformer room).
  - id: fa_eq_oil_filled_transformers
    always_on: true
    when:
      any_of:
        - {has_oil_filled_transformers_is: true}
        - {has_transformer_room_utility_is: true}
        - {has_transformer_room_private_is: true}
    systems:
      - name: "Linear Heat Detection (Transformers)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 8"
        page_ref: "p.512"
        spec: "On the cable trays, per Section 4.8"
        detail: "Table 8.15 item 8 TRANSFORMERS, p.512: 'Linear Type Heat Detection System shall be provided on the cable trays as per Section 4.8.' The item does not restrict the transformer type."

  - id: fa_eq_bulk_oil_storage
    flag: has_bulk_oil_storage
    systems:
      - name: "IS Flame + IS Linear Heat (Bulk Oil Storage)"
        code_ref: "Ch 8, #5.3 / Table 8.15 item 9"
        page_ref: "p.512"
        spec: "Intrinsically Safe Flame (Section 4.9) AND Intrinsically Safe Linear Heat (Section 4.8) on the tank roof"
        detail: "Table 8.15 item 9, p.512: both systems as per Risk assessment proposed and stamped by the Civil Defence approved House of Expertise."

  - id: fa_eq_bulk_flammable_liquid
    flag: has_bulk_flammable_liquid_storage
    systems:
      - name: "IS Flame + IS Linear Heat (Bulk Flammable Liquid Storage)"
        code_ref: "Ch 8, #5.3 / Table 8.15 items 10-11"
        page_ref: "p.513"
        spec: "Intrinsically Safe Flame (Section 4.9) AND Intrinsically Safe Linear Heat (Section 4.8) on tank roof"
        detail: "Table 8.15 items 10-11, p.513: both systems as per Risk assessment proposed and stamped by the Civil Defence approved House of Expertise."

  - id: fa_eq_bulk_flammable_gas
    flag: has_bulk_flammable_gas_storage
    systems:
      - name: "IS Flame + Gas Detection (Bulk Flammable Gas Storage)"
